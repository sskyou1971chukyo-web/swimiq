name: 世界記録・日本記録の自動更新
on:
  schedule:
    - cron: '17 21 * * 0'   # 毎週 月曜 06:17（日本時間）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 記録を取りこむ
        run: python3 tools/update_records.py records.json
      - name: 変わっていればコミット
        run: |
          if git diff --quiet records.json; then echo "変更なし"; exit 0; fi
          git config user.name "swimiq-records-bot"
          git config user.email "actions@users.noreply.github.com"
          git add records.json
          git commit -m "records.json を自動更新（世界記録・日本記録）"
          git push
