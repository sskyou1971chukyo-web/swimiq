# 日本水泳連盟の 標準記録を 毎日 読み直して standards.json を 作り直します
name: 標準記録を更新

on:
  schedule:
    - cron: '50 20 * * *'   # 毎日 日本時間の 5時50分ごろ（GitHubの 混み具合で 少し おくれます）
  workflow_dispatch:         # Actions の 画面から 手で 動かすことも できます

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 標準記録を読む
        run: |
          SCRIPT=$(find . -path ./node_modules -prune -o -name update_standards.py -print | head -n 1)
          echo "script: $SCRIPT"
          python3 "$SCRIPT"
      - name: 変わっていれば保存する
        run: |
          git config user.name "swimiq-bot"
          git config user.email "swimiq-bot@users.noreply.github.com"
          git add -A -- '*standards.json'
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "標準記録を更新（日本水泳連盟のページより）"
            git push
          fi
