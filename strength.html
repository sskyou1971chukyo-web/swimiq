<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWIMIQ-STRENGTH</title>
<link rel="apple-touch-icon" href="strength-icon-180.png">
<link rel="icon" type="image/png" href="strength-icon-192.png">
<link rel="manifest" href="strength.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="STRENGTH">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--ink:#111;--sub:#4a4a4a;--bg:#fff;--soft:#f3f3f3;--line:#c9c9c9;--dark:#1c1c1e;--blue:#0a4fb3;--green:#12662f;--greenbg:#e6f4ea;--red:#a31515;--redbg:#fdeaea;--amber:#7a4b00;--amberbg:#fff3d6;--focus:#ff9500}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
#app{max-width:760px;margin:0 auto;padding:env(safe-area-inset-top) 20px 120px}
#top{position:sticky;top:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:88px 1fr 88px;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
#title{font-size:1.15rem;margin:0;text-align:center;font-weight:700;line-height:1.4}
#title:focus{outline:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
#back{min-height:48px;border:2px solid var(--ink);background:var(--bg);border-radius:999px;font-weight:700}
h2{font-size:1.35rem;margin:36px 0 12px;line-height:1.4}
h3{font-size:1.1rem;margin:26px 0 10px}
p{margin:8px 0}
.sub{color:var(--sub);font-size:.9rem;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
a,.link{color:var(--blue);text-decoration:underline;background:none;border:0;padding:6px 0;min-height:44px;text-align:left;font-weight:700}
.link.strong{color:var(--ink)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:60px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:#fff;font-weight:700;font-size:1.05rem;padding:10px 20px}
.ghost{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:999px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);font-weight:700;padding:8px 18px;text-decoration:none}
.ghost.small{min-height:46px;font-size:.9rem;padding:4px 12px;width:auto;flex:1}
.stackbtns{display:grid;gap:12px}
@media(min-width:620px){.stackbtns{grid-template-columns:1fr 1fr}}
.note{background:var(--soft);border-left:6px solid var(--ink);border-radius:8px;padding:12px 14px;margin:10px 0}
.note.good{background:var(--greenbg);border-color:var(--green)}
.note.bad{background:var(--redbg);border-color:var(--red)}
.note.warn{background:var(--amberbg);border-color:var(--amber)}
.tag{display:inline-block;font-size:.78rem;font-weight:700;border:1.5px solid var(--ink);border-radius:999px;padding:0 9px;margin:4px 6px 0 0;background:#fff;color:var(--ink)}
.tag.ok{border-color:var(--green);color:var(--green)}
.tag.warn{border-color:var(--amber);color:var(--amber);background:var(--amberbg)}
/* ホーム */
.hero{background:var(--dark);color:#fff;border-radius:16px;padding:22px;margin-top:18px}
.hero .kicker{margin:0;font-weight:700}
.big{font-size:3rem;font-weight:800;line-height:1.1;margin:4px 0}
.big span{font-size:1.1rem;margin-left:6px}
/* サムネイル */
.th{display:block;background:#fff;overflow:hidden;flex:none}
.th img{width:100%;height:100%;object-fit:contain;display:block;image-rendering:auto}
.th.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;text-align:center;padding:6px;font-size:.8rem;line-height:1.3}
.th.sm{width:96px;height:96px;border-radius:10px;border:1px solid var(--line)}
.th.lg{width:100%;aspect-ratio:16/10;border-radius:14px}
.th.lg.ph{font-size:1.4rem}
/* 一覧 */
ul.rows,ul.prows,ul.cats,ul.mine,ul.tiles,ul.bars,ul.hist{list-style:none;margin:0;padding:0}
.row{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--bg);border:0;border-bottom:1px solid var(--line);padding:14px 0;min-height:96px}
.rowtxt{display:block;min-width:0}
.rowtxt strong{display:block;font-size:1.05rem;line-height:1.4}
.listhead{display:grid;gap:10px;margin:16px 0 4px}
.search{display:block;margin-top:18px;font-weight:700}
.search input,.field select,.logform input,.lr input,#player input[type=url]{display:block;width:100%;min-height:54px;border:2px solid var(--ink);border-radius:12px;padding:8px 14px;background:#fff;color:#111;margin-top:6px}
.field{display:block;font-weight:700;margin-top:18px}
/* カテゴリー */
.cats{display:grid;gap:12px}
@media(min-width:620px){.cats{grid-template-columns:1fr 1fr}}
.catcard{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;width:100%;height:170px;border:0;border-radius:12px;color:#fff;text-align:left;padding:16px 18px;overflow:hidden}
.catcard img{position:absolute;right:0;top:0;height:100%;width:55%;object-fit:cover;opacity:.9;-webkit-mask-image:linear-gradient(90deg,transparent,#000 60%);mask-image:linear-gradient(90deg,transparent,#000 60%)}
.catname{position:relative;font-size:1.3rem;font-weight:800;line-height:1.35;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.catn{position:relative;font-weight:700}
.mine{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.minecard{width:100%;min-height:110px;border:0;border-radius:12px;background:var(--soft);text-align:left;padding:16px}
.minecard strong{display:block;font-size:1.05rem;line-height:1.4}
/* 詳細 */
.dhero{background:var(--dark);color:#fff;margin:0 -20px;padding:20px}
.playbtn{position:relative;display:block;width:100%;padding:0;border:0;background:none;border-radius:14px}
.playicon{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;background:rgba(0,0,0,.72);color:#fff;display:flex;align-items:center;justify-content:center;font-size:3rem;border:3px solid #fff}
.playlabel{position:absolute;left:12px;bottom:12px;background:#000;color:#fff;font-weight:700;border-radius:999px;padding:4px 16px}
.dcat{font-weight:700;margin:14px 0 0}
.meta{margin:8px 0;display:grid;gap:6px}
.meta div{display:grid;grid-template-columns:8.5em 1fr;gap:8px}
.meta dt{color:#d0d0d0}.meta dd{margin:0;font-weight:700}
.dwhy{color:#f0f0f0}
.actions{display:grid;gap:12px;margin:18px 0}
@media(min-width:620px){.actions{grid-template-columns:1.4fr 1fr 1fr}}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
thead th{background:var(--dark);color:#fff}
.refs{padding-left:0;list-style:none;margin:0}
.refs li{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;overflow-wrap:anywhere}
.refs .sub{display:inline}
.refnote{margin:8px 0;background:var(--soft);border-radius:8px;padding:8px 10px}
.refnote.warnline{background:var(--amberbg)}
.refs a{display:inline-block}
.logform{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.logform label,.lr label{font-weight:700}
.wide{grid-column:1/-1}
.hist li{border-bottom:1px solid var(--line);padding:10px 0}
details.plain summary,#pReg summary{cursor:pointer;font-weight:700;color:var(--blue);min-height:44px;padding:8px 0}
/* 絞り込み */
#sheet,#player{position:fixed;inset:0;z-index:20;overflow:hidden;display:flex;flex-direction:column}
#sheet[hidden],#player[hidden]{display:none}
#sheet{background:var(--bg)}
.sheethead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);text-align:center}
.sheethead h2{margin:0;font-size:1.2rem}.sheethead p{margin:0;color:var(--sub)}
.sheetbody{overflow:auto;padding:0 20px 60px;max-width:760px;width:100%;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:54px;min-width:96px;padding:6px 20px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:700}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* 動画 */
#player{background:#000;color:#fff;overflow:auto}
.phead{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:12px 20px}
.phead h2{margin:0;font-size:1.15rem}
.pclose{min-height:48px;padding:4px 18px;border-radius:999px;border:2px solid #fff;background:#000;color:#fff;font-weight:700}
.pmedia{width:100%;max-width:1000px;margin:0 auto;background:#111}
.pmedia video,.pmedia iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}
.novideo{padding:20px;text-align:center}.novideo .th{max-width:420px;margin:0 auto}
.pbody{max-width:760px;width:100%;margin:0 auto;padding:6px 20px 60px}
.pcue{font-size:1.2rem;font-weight:700}
.pnote{text-align:center}
#player a,#player summary{color:#8cc4ff}
#player .cta{background:#fff;color:#000;border-color:#fff;margin:18px 0}
#player .ghost{background:#000;color:#fff;border-color:#fff}
#player label{display:block;font-weight:700;margin:14px 0}
#player input[type=file]{display:block;margin-top:8px;color:#fff;font-size:1rem}
/* 記録 */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.tiles li{background:var(--soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:190px;align-items:end;border-bottom:2px solid var(--ink);padding-top:28px}
.bars li{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bar{display:block;width:70%;background:var(--ink);border-radius:6px 6px 0 0;min-height:2px}
.barv{font-weight:700}
.barl{position:absolute;bottom:-30px;font-size:.8rem}
.bars+h2{margin-top:60px}
.filebtn{position:relative;cursor:pointer}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.filebtn:focus-within{outline:4px solid var(--focus);outline-offset:2px}
/* プログラム */
.prows li{border-bottom:1px solid var(--line);padding-bottom:12px}
.prows .row{border-bottom:0}
.prbtns{display:flex;gap:8px;flex-wrap:wrap}
.isdone .rowtxt strong{text-decoration:line-through}
.lr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.test{border-bottom:1px solid var(--line);padding-bottom:18px}

.advice{border:3px solid var(--ink);border-radius:16px;padding:18px;margin:18px 0}
.advice h2{margin:4px 0 8px;font-size:1.25rem}.advice h2:focus{outline:none}
.advice .kicker{margin:0;font-weight:700;color:var(--blue)}
.flag{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
.flag h3{margin:0 0 8px}
tbody th[scope=row]{min-width:6.5em;background:var(--soft)}
.intake{display:grid;gap:22px;margin-top:10px}
.intake fieldset{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0}
.intake legend,.intake>label{font-weight:700}
.intake input[type=number]{display:block;width:100%;max-width:220px;min-height:54px;border:2px solid var(--ink);border-radius:12px;padding:8px 14px;margin-top:6px;background:#fff;color:#111}
.rad{display:flex;align-items:center;gap:12px;min-height:54px;padding:6px 10px;border-radius:10px;font-weight:400;cursor:pointer}
.rad input{width:26px;height:26px;flex:none;accent-color:#111}
.rad:has(input:checked){background:var(--soft);font-weight:700}
.err{color:var(--red);font-weight:700}
.logform input[type=date]{display:block;width:100%;min-height:54px;border:2px solid var(--ink);border-radius:12px;padding:8px 14px;margin-top:6px;background:#fff;color:#111}

.judge{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.judge li{border-top:1px solid #555;padding-top:8px}
.judge span{display:block;color:#d0d0d0;font-size:.9rem}
.judge strong{font-size:1.1rem;line-height:1.5}
.intake select{display:block;width:100%;max-width:320px;min-height:54px;border:2px solid var(--ink);border-radius:12px;padding:8px 14px;margin-top:6px;background:#fff;color:#111}
#brand{font-family:Impact,Haettenschweiler,'Arial Narrow Bold','Hiragino Sans',sans-serif;font-style:italic;font-weight:400;font-size:2rem;line-height:1;padding:14px 0 2px;display:flex;align-items:baseline;gap:.28em;letter-spacing:.01em}
#brand .b1{color:var(--ink)}
#brand .b2{color:var(--blue)}
#brand .b3{color:var(--ink);font-size:.62em;border-bottom:4px solid var(--blue);padding-bottom:1px}
@media print{#brand{display:none}}
.stars{letter-spacing:1px}
.intake textarea.txt{display:block;width:100%;border:2px solid var(--ink);border-radius:12px;padding:8px 14px;margin-top:6px;background:#fff;color:#111;font:inherit;line-height:1.6}
.selchips,.pickres{list-style:none;margin:8px 0;padding:0}
.selchips{display:flex;flex-wrap:wrap;gap:8px}
.selchips .chip{min-height:46px;padding:4px 14px;font-size:.9rem}
.pickres{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.flag.stop{border:3px solid var(--red);background:var(--redbg)}
.intake input.txt{display:block;width:100%;min-height:54px;border:2px solid var(--ink);border-radius:12px;padding:8px 14px;margin-top:6px;background:#fff;color:#111}
.gymcard{height:120px}
[hidden]{display:none !important}
.intake h3.part{margin:10px 0 0;padding:8px 12px;background:var(--dark);color:#fff;border-radius:8px}
/* 下のタブ */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(4px,calc(50% - 380px)) calc(6px + env(safe-area-inset-bottom))}
#tabs button{min-width:0;padding:0 2px;white-space:nowrap;letter-spacing:-.02em;min-height:62px;border:0;background:none;color:var(--sub);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.74rem;border-radius:10px}
#tabs button svg{width:28px;height:28px}
#tabs button.on{color:var(--ink);box-shadow:inset 0 4px 0 var(--ink)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;font-weight:700;border-radius:999px;padding:10px 22px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;border:2px solid #fff}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
@media print{#tabs,#top,#toast,.prbtns,.stackbtns,.field,details{display:none !important}#app{padding:0}.th.sm{width:60px;height:60px}}

/* ===== SwimIQ の色分け（swimiq_lite_B.html と同じ）=====
   黒い地に白い文字。黄色は「いちばん押すもの」と「いま選んでいるもの」だけ。
   緑は 良い・できた、赤は 止める・注意 だけに使う。 */
:root{--ink:#ffffff;--sub:#c9c9c9;--bg:#000000;--soft:#17181a;--pane2:#202124;--line:#4a4a4a;--dark:#17181a;--blue:#ffc400;--green:#35e06a;--greenbg:#0e2415;--red:#ff8e78;--redline:#ff4b2b;--redbg:#2a110c;--amber:#ffc400;--amberbg:#2b2204;--focus:#ffc400;--am:#ffc400}
body{font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--am);outline-offset:2px}
.cta,#player .cta{background:var(--am);border-color:var(--am);color:#000;border-radius:6px}
.ghost,#player .ghost{background:var(--soft);border-color:var(--line);color:#fff;border-radius:6px}
#back,.pclose{background:var(--soft);border-color:var(--line);color:#fff;border-radius:6px}
.chip{background:var(--soft);border-color:var(--line);color:#fff;border-radius:6px}
.chip.on{background:var(--am);border-color:var(--am);color:#000}
#tabs{background:#000;border-top:1px solid #3a3b3d}
#tabs button{color:var(--sub)}
#tabs button.on{color:var(--am);box-shadow:inset 0 4px 0 var(--am)}
.hero,.dhero{background:var(--soft);border:1px solid #3a3b3d}
.dhero{border-width:0 0 1px}
.minecard,.tiles li{background:var(--soft);border:1px solid #3a3b3d;color:#fff}
.note{background:var(--soft);border-left-color:var(--line)}
.note.good{background:var(--greenbg);border-left-color:var(--green)}
.note.bad{background:var(--redbg);border-left-color:var(--redline)}
.note.warn{background:var(--amberbg);border-left-color:var(--am)}
.tag{background:var(--pane2);border-color:var(--line);color:#fff}
.tag.ok{border-color:var(--green);color:var(--green);background:var(--greenbg)}
.tag.warn{border-color:var(--am);color:var(--am);background:var(--amberbg)}
thead th{background:var(--pane2);color:#fff}
tbody th[scope=row]{background:var(--soft);color:#fff}
th,td{border-color:var(--line)}
.search input,.field select,.logform input,.lr input,#player input[type=url],.intake input[type=number],.intake select,.intake input.txt,.intake textarea.txt,.logform input[type=date]{background:var(--soft);color:#fff;border-color:var(--line);border-radius:6px;color-scheme:dark}
::placeholder{color:#9aa0ab}
.rad input{accent-color:#ffc400}
.rad:has(input:checked){background:var(--pane2);box-shadow:inset 4px 0 0 var(--am)}
.intake fieldset,.flag,.refs li,.pickres{border-color:var(--line)}
.intake h3.part{background:var(--am);color:#000;border-radius:6px}
.advice{border:2px solid var(--line);background:var(--soft)}
.flag{background:#0b0b0c}
.flag.stop{border:2px solid var(--redline);background:var(--redbg)}
.refnote{background:var(--pane2)}
.refnote.warnline{background:var(--amberbg)}
.bars{border-bottom-color:var(--line)}
.bar{background:var(--am)}
.judge li{border-top-color:var(--line)}
.judge span,.meta dt{color:var(--sub)}
#toast{background:var(--am);color:#000;border-color:#000}
#player a,#player summary{color:var(--am)}
#sheet{background:#000}
.sheethead,#top{border-bottom-color:#3a3b3d}
.row,.hist li,.prows li,.test{border-bottom-color:#3a3b3d}
.th.sm{border-color:#3a3b3d}
.err{color:var(--red)}
.playicon{background:rgba(0,0,0,.72);border-color:var(--am);color:var(--am)}
.playlabel{background:var(--am);color:#000;border-radius:6px}
.isdone .rowtxt strong{color:var(--sub)}
#brand{font-size:2.1rem;gap:.3em;align-items:center}
#brand .b1{color:#fff}
#brand .b2{color:var(--am);margin-left:-.3em}
#brand .b3{background:var(--am);color:#000;border:0;font-size:.5em;padding:.18em .5em .12em;border-radius:3px;letter-spacing:.05em}
@media print{
  :root{--ink:#111;--sub:#4a4a4a;--bg:#fff;--soft:#f3f3f3;--pane2:#eee;--line:#c9c9c9;--dark:#fff;--blue:#111}
  body{background:#fff;color:#111}
  .tag,.ghost,.minecard,.tiles li,.hero{background:#fff;color:#111}
}
</style>
</head>
<body>
<div id="app">
  <div id="brand" role="img" aria-label="スイムアイキュー ストレングス"><span class="b1">SWIM</span><span class="b2">IQ</span><span class="b3">STRENGTH</span></div>
  <header id="top"><button type="button" id="back" hidden>戻る</button><h1 id="title" tabindex="-1" style="grid-column:2"></h1></header>
  <main id="view"></main>
</div>
<nav id="tabs" aria-label="メインメニュー">
  <button type="button" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/></svg>ホーム</button>
  <button type="button" data-tab="browse"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z" fill="currentColor"/></svg>種目</button>

const REF_NOTE = {"heneghan2019": "7研究168名（アスリートは20名のみ）の系統的レビュー。腕を上げる動作にともなって胸椎が伸展することが報告されている。エクササイズの効果を調べた研究ではない。", "welbeck2019": "大学競泳選手34名の横断研究。胸椎回旋の可動域は、肩甲骨の動きの異常の有無で差がなく、肩の痛みとも相関しなかった。胸椎回旋エクササイズを直接支持する結果ではない。", "johnson2012": "健常成人46名（競泳選手ではない）。胸椎回旋の可動域を測る5つの方法はいずれも信頼性が良好だった。測定法の研究であり、エクササイズの効果を調べたものではない。", "barrett2016": "10研究の系統的レビュー（競泳選手に限らない）。背すじを伸ばした姿勢のほうが丸めた姿勢より肩の可動域が大きいという強い根拠がある一方、単回の実験にもとづくため長期的な意義は不明としている。", "lee2020": "競泳選手ではなく、肩の機能障害がある患者32名の無作為化試験。フォームローラーと四つばいでの胸椎セルフモビライゼーションを週3回4週間行った群は、対照群より痛み、機能、肩の屈曲・外転・外旋の可動域が有意に改善した。", "laudner2013": "症状のない大学競泳選手19名の横断研究。広背筋が硬い選手ほど、腕を上げるときの肩甲骨の動きが変わっていた。ストレッチの効果を調べた研究ではない。", "herrington2014": "エリート競泳選手15名、カヌー選手、ラグビー選手、一般の対照を比べた研究。上腕を外旋した位置での肩屈曲の可動域は競技によって有意に異なり、広背筋の長さは競技の要求に応じて異なると結論している。", "tavares2022": "競泳選手を対象とした11論文の系統的レビュー。ストレッチで肩の可動域が改善した研究が1件、筋力とストレッチの併用で肩の姿勢が改善した研究が2件あったが、全体として研究の質は低いと述べている。", "laudner2015": "症状のない大学女子競泳選手39名。小胸筋への筋エネルギーテクニック（軽い等尺性収縮とストレッチの組み合わせ）を週2回6週間行った群は、小胸筋が長くなり、肩甲骨の前方位が減った。施術者が行う手技であり、セルフストレッチではない。", "borstad2006": "競泳選手が対象ではない。小胸筋の3種類のストレッチを比べ、片側のセルフストレッチが最も大きな筋の長さの変化を生んだ。大胸筋ではなく小胸筋の研究。", "muraki2009": "献体9体の研究（生きた人ではない）。小胸筋は肩の屈曲と肩甲骨面での挙上で大きく伸ばされた。", "umehara2021": "競泳選手が対象ではない。小胸筋の硬さは30秒1回のストレッチ直後に下がり、回数を増やすとさらに下がった。長いストレッチのほうが効果を保ちやすいと結論している。", "wolfram2023": "健常男性20名（競泳選手ではない）。肩を外転・外旋させたときの大胸筋の硬さの変化は、部位によって異なった。ストレッチの効果を調べた研究ではない。", "muraki2007": "献体9肩の研究（生きた人ではない）。肩甲下筋の下部の線維は、挙上、外転、屈曲、水平外転と、挙上30度から90度での外旋で大きく伸ばされた。上部と中部を大きく伸ばす姿勢は見つからなかった。", "lake2014": "スラスターではなくプッシュプレスの研究。筋力トレーニング経験のある男性で、ピークパワーは1RMの約75パーセントで最大となり、力学的な要求はジャンプスクワットと同程度だった。", "soriano2019": "プッシュプレスなど頭上へ押し上げる種目の研究13件の総説。パワーと最大筋力の向上に役立つ可能性があるとする一方、長期的なトレーニング効果はまだよく分かっていないと述べている。", "mcallister2014": "ウエイトトレーニング経験のある男性12名。4種目を1RMの85パーセントで比べ、ハムストリングスの筋活動はルーマニアンデッドリフトとグルートハムレイズで最も高かった。", "delgado2019": "トレーニング経験1年以上の男性8名。1RMでの大臀筋の活動は、ルーマニアンデッドリフトとヒップスラストの間に有意な差がなかった。", "lee2018": "男性21名。ルーマニアンデッドリフト1RMの70パーセントの重量で比べると、大腿直筋と大臀筋の筋活動、膝関節のトルクは、通常のデッドリフトのほうが有意に大きかった。ルーマニアンデッドリフトの優位を示す結果ではない。", "mo2023": "トレーニング経験2年以上の若い男性12名。片脚ルーマニアンデッドリフトは大臀筋上部と大腿二頭筋を非常に強く活動させた。支える脚と反対側の手で負荷を持つと、中臀筋と大臀筋の活動が高まった。", "sorensen2021": "女子エリートハンドボール選手23名。ルーマニアンデッドリフトは片脚でも両脚でもハムストリングスを強く活動させ、大腿二頭筋より半腱様筋の活動が高かった。", "speirs2016": "アカデミーのラグビー選手18名。後ろ足を台に乗せるスプリットスクワットだけの群とバックスクワットだけの群を5週間、週2回鍛えたところ、両群とも1RM、40メートル走、方向転換が有意に向上し、群の間に差はなかった。", "riemann2013": "若い成人32名。サイドランジはフォワードランジより足首と膝を伸ばす筋への負荷が大きく、股関節を伸ばす筋への負荷はフォワードランジのほうが大きかった。大臀筋や内転筋の筋活動を測った研究ではなく、このアプリの「大臀筋・内転筋」という表示を直接支える内容ではない。", "signorile2002": "トレーニング経験1年以上の男性10名。4種類の握り方のうち、広い手幅で体の前に引く方法が、広背筋の筋活動が最も大きかった。", "lusk2010": "健康な男性12名。1RMの70パーセントで、手幅にかかわらず順手のほうが逆手より広背筋の筋活動が大きかった。", "andersen2014": "筋力トレーニング経験のある男性15名。手幅を変えても広背筋などの筋活動はおおむね同程度で、広い手幅では扱える重量が小さかった。", "lehman2004": "トレーニング経験のある男性12名。ワイドグリップのプルダウンとシーテッドロウは、上腕二頭筋に対する広背筋の活動の比が最も高かったが、種目による違いは小さいと結論している。", "handa2005": "ウエイトトレーニング経験のある男性8名。1RMの70パーセントで5種目を比べ、ベントオーバーロウは僧帽筋の活動が高く、広背筋の活動はシーテッドロウとラットプルダウンが最も高かった。", "fenwick2009": "健康な男子大学生7名。立って行うベントオーバーロウは背中全体を左右対称に大きく活動させた一方、比べた3種目の中で腰椎への負荷が最も大きかった。", "muyor2022": "運動習慣のある健康な成人20名（競泳選手ではない）。広背筋と上腕三頭筋の筋活動はストレートアームプルダウンで最も高かった。", "rodriguezridao2020": "トレーニング経験1年以上の若い成人30名。大胸筋上部の活動は傾斜30度で最大となり、45度を超えると三角筋前部の活動が増えて大胸筋の活動が下がった。", "trebs2010": "健康な男性15名。大胸筋の鎖骨部の活動は44度と56度で水平より大きく、胸肋部は水平で最も大きかった。", "lauver2016": "トレーニング経験のある男性14名。挙上全体では大胸筋上部に角度による差はなかったが、挙上の途中の区間では30度と45度が水平より高かった。", "calatayud2015": "大学生30名（男性22名、女性8名）。筋活動が同じ程度になるようにそろえたベンチプレスと、ゴムバンドで負荷をかけた腕立て伏せを5週間行うと、筋力の伸びは同じ程度だった。", "suprak2011": "28名。通常の腕立て伏せで手にかかる荷重は体重の約69パーセント（上の位置）から約75パーセント（下の位置）、膝つきでは約54パーセントから約62パーセントだった。", "ludewig2004": "健康な人と軽い肩の機能障害がある人の計30名。押し切ったところで肩甲骨をさらに前に出すプッシュアップ・プラスは、前鋸筋の活動が最も高かった。", "clemons2010": "大学生年代の男女43名。座って胸からメディシンボールを押し出して投げる距離は、ベンチプレスのパワーと高く相関した。立って壁に投げるチェストパスそのものの研究ではなく、測定法の研究。", "szymanski2007": "高校野球選手49名の無作為化試験（競泳選手ではない）。筋力トレーニングに回旋系のメディシンボール種目を12週間加えた群は、加えない群より体幹の回旋筋力、メディシンボール投げ、バット速度の向上が大きかった。", "ikeda2007": "男子16名、女子10名のアスリート。横向きのメディシンボール投げの記録は、男子でのみ体幹回旋の力やスクワット1RMと有意に相関した。", "tsartsapakis2023": "健康な女性44名の超音波測定。サイドプランクやデッドバグを含む5種目のうち、デッドバグが腹横筋の厚さを最も大きく増やした。", "ekstrom2007": "健康な成人30名。9種目の筋電図を比べ、サイドブリッジ（サイドプランク）は中臀筋と外腹斜筋の強化に使える可能性があるとした。", "mcgill2009": "健康な男性8名。サイドブリッジなどの各種のやり方で筋活動と脊柱の姿勢を測り、段階的に難しくする進め方を示した。", "mcgill2015": "男性14名。脚を伸ばしたハンギングレッグレイズは腹直筋と外腹斜筋の活動が非常に高く、脊柱を圧縮する力は平均約3000ニュートンだった。", "axler1997": "9名が12種類の腹筋運動を行った研究。腹筋の活動を脊柱の圧縮力で割った値は部分的なカールアップでおおむね最も高く、脊柱への負荷を最小にしながらすべての腹筋を鍛えられる単一の種目はなかった。", "marshall2010": "ブタの頸椎の標本を使った実験（人の運動を調べたものではない）。ひねる力だけでは椎間板ヘルニアは始まらなかったが、くり返しの曲げ伸ばしと組み合わせると、67.5パーセントの標本で線維輪に亀裂が生じた。ひねりと曲げを同時にくり返す種目に注意が必要とする根拠。", "karpinski2020": "ポーランドの全国レベルの男子競泳選手16名の無作為化試験。ロシアンツイストを含む4種目の体幹トレーニングを週3回6週間加えた群は、50メートル自由形が1.2パーセント短縮した。4種目をまとめた効果であり、ロシアンツイスト単独の効果は分からない。", "thng2019": "競泳選手を対象とした16研究の系統的レビュー。スタートの成績は垂直跳びの高さと非常に強く相関した。この種目そのものを調べた研究ではない。", "weston2015": "全国レベルのジュニア競泳選手20名。水中練習に週3回12週間の体幹トレーニングを加えた群は、50メートル自由形が2.0パーセント短縮した。体幹トレーニング全体の効果であり、この種目が含まれていたかは確認できていない。", "morouco2011": "全国レベルの男子競泳選手10名。ラットプルダウンのパワーは、牽引泳で測った力と中程度から強い関連を示した。"};

function evLevel(e){
  if(!hasPaper(e)) return e.refs.some(k=>refKind(k)==='書籍') ? 'related' : 'none';

  return v.some(x=>x.d==='direct') ? 'direct' : 'related';
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function nums(s){ return (String(s).match(/\d+(\.\d+)?/g)||[]).map(Number); }
function rxFor(ex, goal){
  if(ex.gym && ex.twin) return rxFor(EXMAP[ex.twin], goal);
  if(ex.gym) return {sets:'未登録',reps:'未登録',load:'未登録',rest:'未登録'};
  if(ex.rx && ex.rx[goal]) return ex.rx[goal];
  if(ex.type==='loaded' && GOALS[goal]){
    const g = GOALS[goal];
    return {sets:g.sets, reps:g.reps.includes('以上')?g.reps:g.reps+'回', load:g.load, rest:g.rest};
  }
  const t = TYPE_RX[ex.type];
  if(t){ return t[goal] || t.any || t[Object.keys(t)[0]]; }
  return {sets:'3',reps:'5回',load:'',rest:'2分'};
}
function defaultBlock(ex){
  return {mobility:'W-UP', activation:'W-UP', plyo:'パワー', olympic:'パワー', mb:'パワー', loaded:'メイン', core:'体幹'}[ex.type] || 'メイン';
}

function refItem(k, link){

let stack = [{name:'home'}];
let filt = {};
let listBase = {};
function resetFilt(o){ listBase = o||{}; filt = Object.assign({cat:'',stroke:'',asp:false,paper:false,saved:false,inProg:false,done:false,sort:'default',text:''}, o||{}); }
resetFilt();
const ROOTS = ['home','browse','activity','program'];
function go(name, p){
  if(ROOTS.includes(name)) stack = [{name}]; else stack.push(Object.assign({name}, p||{}));
  render(true);
}
function back(){ if(stack.length>1){ stack.pop(); render(true); } }
function render(focus){
  const cur = stack[stack.length-1];
  const v = VIEWS[cur.name](cur);
  $('#title').textContent = v.title;
  document.title = v.title+' ｜ SWIMIQ-STRENGTH';
  $('#view').innerHTML = v.html;
  $('#view').className = 'v-'+cur.name;
  $('#back').hidden = stack.length<2;
  $('#view').oninput = null; $('#view').onclick = null;
  const root = stack[0].name;
  document.querySelectorAll('#tabs button').forEach(b=>{ const on = b.dataset.tab===root; b.classList.toggle('on',on); if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  if(v.after) v.after();
  if(focus){ window.scrollTo(0,0); $('#title').focus(); }
}

/* ---- 種目の一覧とフィルター ---- */
function filtered(){
  const doneIds = new Set(db.logs.filter(l=>l.kind==='done').map(l=>l.id));
  const progIds = new Set(db.prog.map(r=>r.id));
  let list = EX.filter(e=>((filt.cat||filt.saved||filt.inProg||filt.done||filt.text||filt.gym) ? true : !e.gym) && (!filt.gym||e.gym) && (!filt.pri||e.pri) && (!filt.cat||e.cat===filt.cat) && (!filt.stroke||e.strokes.includes(filt.stroke)) && (!filt.asp||e.asp||e.refs.includes('asp')) &&
    (!filt.paper||evLevel(e)===filt.paper) && (!filt.saved||db.saved.includes(e.id)) && (!filt.inProg||progIds.has(e.id)) && (!filt.done||doneIds.has(e.id)) &&
    (!filt.text||e.name.includes(filt.text)||e.muscles.includes(filt.text)));
  if(filt.sort==='name') list = [...list].sort((a,b)=>a.name.localeCompare(b.name,'ja'));
  if(filt.sort==='done'){ const c = id=>db.logs.filter(l=>l.id===id&&l.kind==='done').length; list = [...list].sort((a,b)=>c(b.id)-c(a.id)); }
  return list;
}
function filtCount(){ return ['cat','stroke','asp','paper','saved','inProg','done','text'].filter(k=>filt[k]).length; }
VIEWS.list = cur=>{
  const list = filtered(); const n = filtCount();
  return {title: cur.label || '種目の一覧', html:
    '<div class="listhead"><p id="listCount" role="status">'+list.length+'種目を表示しています。</p>'+
    '<button type="button" class="ghost" id="openFilter">絞り込みと並べ替え'+(n?'（'+n+'件の条件）':'')+'</button></div>'+
    (list.length ? '<ul class="rows">'+list.map(exRow).join('')+'</ul>' : '<div class="note">条件に合う種目がありません。絞り込みの条件をゆるめてください。</div>'),
    after(){ $('#openFilter').addEventListener('click',openSheet); }
  };
};
function chip(group, val, label){
  const on = String(filt[group])===String(val);
  return '<button type="button" class="chip'+(on?' on':'')+'" aria-pressed="'+on+'" data-f="'+group+'" data-v="'+val+'">'+esc(label)+'</button>';
}

    '<h3>あなたの記録</h3><div class="chips">'+chip('saved','true','保存済み')+chip('inProg','true','プログラムに入れた')+chip('done','true','実施したことがある')+'</div>'+

function openSheet(){
  const s = $('#sheet'); s.innerHTML = sheetHTML(); s.hidden = false; document.body.classList.add('lock'); $('#sheetTitle').focus();
}
function closeSheet(){ $('#sheet').hidden = true; document.body.classList.remove('lock'); render(false); const b = $('#openFilter'); if(b) b.focus(); }
$('#sheet').addEventListener('click',e=>{
  const c = e.target.closest('[data-f]');
  if(c){
    const g = c.dataset.f, v = c.dataset.v;
    if(g==='sort') filt.sort = v;
    else if(v==='true') filt[g] = !filt[g];
    else filt[g] = (filt[g]===v) ? '' : v;
    const y = $('.sheetbody').scrollTop;
    $('#sheet').innerHTML = sheetHTML(); $('.sheetbody').scrollTop = y;
    const again = $('#sheet').querySelector('[data-f="'+g+'"][data-v="'+v+'"]'); if(again) again.focus();
    return;
  }
  if(e.target.id==='fReset'){ resetFilt(listBase); $('#sheet').innerHTML = sheetHTML(); $('#sheetTitle').focus(); }
  if(e.target.id==='fDone') closeSheet();
});

function evNote(e){
  if(e.gym && !e.linked) return '<div class="note warn">体操の移行データから取り込んだ種目です。根拠の文献は、まだ登録されていません。処方の目安も未登録です。行う場合は、指導者の補助のもとで、年齢、競技歴、痛みの履歴に合わせて段階を決めてください。運動中に痛み、めまい、しびれが出たら中止し、専門家に相談してください。</div>';

function logLine(l){

VIEWS.activity = ()=>{

  const max = Math.max(1,...days.map(d=>d.n));
  const per = {}; done.forEach(l=>{ per[l.id] = (per[l.id]||0)+1; });

    '<ul class="tiles"><li><span class="big">'+done.length+'</span><span>これまでの実施</span></li><li><span class="big">'+weekCount()+'</span><span>直近7日の実施</span></li><li><span class="big">'+watch.length+'</span><span>動画を見た回数</span></li><li><span class="big">'+new Set(done.map(l=>dayOf(l.t))).size+'</span><span>実施した日数</span></li></ul>'+
    '<h2>直近7日の実施数</h2><ul class="bars">'+days.map(d=>'<li><span class="barv">'+d.n+'</span><span class="bar" style="height:'+Math.round(d.n/max*100)+'%"></span><span class="barl">'+d.label+'</span><span class="sr">'+d.label+'は'+d.n+'種目</span></li>').join('')+'</ul>'+
    '<h2>よく行っている種目</h2>'+(top.length?'<ol class="top">'+top.map(t=>'<li><button type="button" class="link" data-go="detail" data-id="'+t[0]+'">'+esc(EXMAP[t[0]]?EXMAP[t[0]].name:t[0])+'</button> '+t[1]+'回</li>').join('')+'</ol>':'<p class="sub">まだ記録がありません。種目の画面で「実施を記録する」を押すと、ここにたまっていきます。</p>')+
    '<h2>履歴（新しい順）</h2>'+(db.logs.length?'<ul class="hist">'+[...db.logs].reverse().slice(0,50).map(logLine).join('')+'</ul>':'<p class="sub">履歴はまだありません。</p>')+
    '<h2>データの保存と持ち出し</h2><div class="note">記録はこのパソコンのこのブラウザーの中に保存されます。ブラウザーの履歴やデータを消すと一緒に消えるので、ときどきバックアップを保存してください。</div>'+
    '<div class="stackbtns"><button type="button" class="ghost" id="xCsv">記録を表計算用のファイル（CSV）で保存</button><button type="button" class="ghost" id="xJson">バックアップを保存</button>'+
    '<label class="filebtn ghost">バックアップから戻す<input type="file" id="iJson" accept=".json,application/json"></label></div>',
    after(){
      $('#xCsv').addEventListener('click',()=>{
        const q = s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
        const rows = [['日時','種目','カテゴリー','内容','セット','回数','重量kg','メモ']].concat(db.logs.map(l=>{ const e = EXMAP[l.id]||{}; return [l.t, e.name||l.id, CATS[e.cat]||'', l.kind==='watch'?'動画を見た':'実施', l.sets, l.reps, l.load, l.memo]; }));
        dl('swim_wt_kiroku_'+today()+'.csv', '﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'), 'text/csv');
      });
      $('#xJson').addEventListener('click',()=>dl('swim_wt_backup_'+today()+'.json', JSON.stringify(db), 'application/json'));
      $('#iJson').addEventListener('change',ev=>{ const f = ev.target.files[0]; if(!f) return; f.text().then(t=>{ try{ const o = JSON.parse(t); if(!o || !Array.isArray(o.logs)) throw 0; db = Object.assign({saved:[],prog:[],goal:'power',logs:[],videos:{},check:{}}, o); save(); applyUserLib(); say('バックアップから戻しました'); render(false); }catch(x){ say('このファイルは読み込めませんでした'); } }); });
    }

function dl(name, text, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text],{type})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); say(name+' を保存しました'); }

/* ---- セルフチェック ---- */
VIEWS.check = ()=>{
  return {title:'セルフチェック', html:
    '<p>左右の角度を入れると、目安に届いていない項目と、おすすめの修正エクササイズが出ます。</p>'+
    TESTS.map(t=>{
      const c = db.check[t.key]||{};
      return '<section class="test"><h2>'+esc(t.name)+'</h2><p>'+esc(t.desc)+'</p><p class="sub">目安は'+t.target+'度</p>'+
        '<div class="lr"><label>左（度）<input type="number" inputmode="numeric" data-ck="'+t.key+'" data-side="L" value="'+(c.L==null?'':c.L)+'"></label><label>右（度）<input type="number" inputmode="numeric" data-ck="'+t.key+'" data-side="R" value="'+(c.R==null?'':c.R)+'"></label></div>'+
        '<div class="ckres" id="ck-'+t.key+'" role="status"></div></section>';
    }).join(''),
    after(){ TESTS.forEach(drawCheck); $('#view').oninput = onCheckInput; }
  };
};
function onCheckInput(e){
  const k = e.target.dataset.ck; if(!k) return;
  db.check[k] = db.check[k]||{}; db.check[k][e.target.dataset.side] = e.target.value===''?null:Number(e.target.value); save();
  drawCheck(TESTS.find(t=>t.key===k));
}
function drawCheck(t){
  const box = $('#ck-'+t.key); if(!box) return; const c = db.check[t.key]||{};
  if(c.L==null && c.R==null){ box.innerHTML = ''; return; }
  const parts = []; let short = false;
  [['L','左'],['R','右']].forEach(([s,lab])=>{ const v = c[s]; if(v==null) return; if(v<t.target){ short = true; parts.push(lab+'は'+v+'度で、目安まであと'+(t.target-v)+'度'); } else parts.push(lab+'は'+v+'度で、目安に届いています'); });
  const diff = (c.L!=null && c.R!=null && Math.abs(c.L-c.R)>=10) ? ' 左右差が'+Math.abs(c.L-c.R)+'度あります（このツールでは10度以上を左右差の目安にしています）。' : '';
  box.innerHTML = '<div class="note '+(short||diff?'bad':'good')+'">'+parts.join('。')+'。'+diff+'</div>'+
    (short ? '<p><strong>おすすめの修正エクササイズ</strong></p><ul class="rows">'+t.fix.map(id=>exRow(EXMAP[id])).join('')+'</ul><button type="button" class="ghost" data-fixadd="'+t.key+'">この'+t.fix.length+'種目をプログラムに追加</button>' : '');
}

  let b;
  if((b = e.target.closest('[data-play]'))){ openPlayer(b.dataset.play); return; }
  if((b = e.target.closest('[data-pdone]'))){ const ex = EXMAP[b.dataset.pdone], rx = rxFor(ex, db.goal); addLog({id:ex.id, kind:'done', sets:nums(rx.sets)[0]||'', reps:ex.norx?'':rx.reps, load:'', memo:'プログラムから記録'}); say(ex.name+'を実施済みにしました'); render(false); return; }
  if((b = e.target.closest('[data-prm]'))){ db.prog = db.prog.filter(x=>x.id!==b.dataset.prm); save(); say('プログラムから外しました'); render(false); return; }
  if((b = e.target.closest('[data-tpl]'))){ const t = TEMPLATES[b.dataset.tpl]; if(t.goal) db.goal = t.goal; let n = 0; t.ids.forEach(id=>{ if(!db.prog.some(x=>x.id===id)){ db.prog.push({id}); n++; } }); save(); say(n+'種目を追加しました'); render(false); return; }
  if((b = e.target.closest('[data-fixadd]'))){ const t = TESTS.find(x=>x.key===b.dataset.fixadd); let n = 0; t.fix.forEach(id=>{ if(!db.prog.some(x=>x.id===id)){ db.prog.push({id}); n++; } }); save(); say(n+'種目をプログラムに追加しました'); return; }
  if((b = e.target.closest('[data-golist]'))){
    const k = b.dataset.golist;
    if(k==='cat'){ resetFilt({cat:b.dataset.cat}); go('list',{label:CATS[b.dataset.cat]}); }
    else if(k==='saved'){ resetFilt({saved:true}); go('list',{label:'保存済み'}); }
    else if(k==='prog'){ resetFilt({inProg:true}); go('list',{label:'プログラムに入れた種目'}); }
    else if(k==='done'){ resetFilt({done:true}); go('list',{label:'実施したことがある種目'}); }
    else if(k==='gym'){ resetFilt({gym:true}); go('list',{label:'体操の種目'}); }
    else if(k==='gympri'){ resetFilt({gym:true,pri:true}); go('list',{label:'競泳への優先度が高いとされた体操の種目'}); }
    else if(k==='nopaper'){ resetFilt({paper:'none'}); go('list',{label:'星1つの種目'}); }
    else if(k==='related'){ resetFilt({paper:'related'}); go('list',{label:'星2つの種目'}); }
    else { resetFilt(); go('list',{label:'すべての種目'}); }
    return;
  }
  if((b = e.target.closest('[data-go]'))){ go(b.dataset.go, b.dataset.id?{id:b.dataset.id}:null); return; }
  if((b = e.target.closest('[data-tab]'))){ go(b.dataset.tab); return; }
  if(e.target.closest('#back')) back();
});

/* ============ 聞き取り・助言・測定（2026年10月10日に追加） ============
 推奨の数字は ACSM 2009（文献 acsm2009）の要旨にあるものだけを使う。
 競泳選手としての注意は、元のアプリにあった講演資料と論文の記述を使う。 */
const LEVELS = {
  novice:{label:'初心者', def:'レジスタンストレーニングの経験がない、または数年間トレーニングをしていない人', freq:[2,3], load:'8から12RM（8回から12回で限界になる重さ）'},
  inter:{label:'中級者', def:'約6か月間、継続してレジスタンストレーニングをしている人', freq:[3,4], load:'1から12RMの広い範囲を周期的に使い、最終的には高負荷（1から6RM）に重点を置く'},
  adv:{label:'上級者', def:'数年のレジスタンストレーニング経験がある人', freq:[4,5], load:'1から12RMの広い範囲を周期的に使い、最終的には高負荷（1から6RM）に重点を置く'}
};
const ACSM_GOAL = {
  strength:'最大筋力：セット間の休憩は3分から5分。1秒から2秒で上げ、1秒から2秒で下ろす中程度の速さで行う。',
  hypertrophy:'筋肥大：1から12RMを周期的に使い、6から12RMに重点を置く。セット間の休憩は1分から2分、中程度の速さ。量の多い複数セットが勧められている。',
  power:'パワー：二つの方法がある。一つは筋力トレーニング。もう一つは軽い負荷（下半身は1RMの0から60パーセント、上半身は30から60パーセント）を速く動かす方法で、休憩は3分から5分、1種目あたり3から5セット。全身を使う多関節の種目に重点を置く。',
  endurance:'筋持久力：軽い負荷から中程度の負荷（1RMの40から60パーセント）で、15回を超える高回数を、90秒未満の短い休憩で行う。'
};
const ORDER_RULES = [['big','大きな筋肉の種目を、小さな筋肉の種目より先に行う'],['multi','多関節の種目を、単関節の種目より先に行う'],['high','高強度の種目を、低強度の種目より先に行う']];
function srcBox(keys){
  if(!keys || !keys.length) return '<p><span class="tag warn">根拠の文献は未登録</span> <span class="sub" style="display:inline">コーチの方針として載せている項目です。</span></p>';
  return '<details class="plain"><summary>根拠を見る（文献'+keys.length+'件）</summary>'+refList(keys)+'</details>';
}
function levelOf(exp){ return exp==='years'?'adv':exp==='half'?'inter':'novice'; }

/* しきい値を超えたときの気づき。メリットとデメリットを並べて返す */
function flagsFor(a){
  const out = []; if(!a) return out;
  const L = LEVELS[a.level];
  const f = Number(a.freq), reps = Number(a.reps), rest = Number(a.rest), sets = Number(a.sets), swim = Number(a.swim);
  if(a.freq!=='' && f > L.freq[1]) out.push({t:'週'+f+'回は、'+L.label+'に勧められている週'+L.freq[0]+'回から'+L.freq[1]+'回を超えています',
    merit:'ACSMは、経験を積んだ人ほど高い頻度を勧めています（中級者は週3回から4回、上級者は週4回から5回）。経験が増えれば選択肢になります。',
    demerit:'持久トレーニングと筋力トレーニングを同時に行うと、筋力やパワーの伸びが妨げられることがあり、持久トレーニングの量や頻度が多いほど大きくなるとされます。講演では、週の基本はスイム5回、ウエイト3回、休養2日とされ、ウエイトの量、特に下半身の疲労の管理が課題と指摘されました。',
    src:['acsm2009','wilson2012','asp']});
  if(a.freq!=='' && f>0 && f < L.freq[0]) out.push({t:'週'+f+'回は、'+L.label+'に勧められている週'+L.freq[0]+'回から'+L.freq[1]+'回より少なくなっています',
    merit:'水中練習の疲労と重なりにくくなります。講演では、疲労が残ると本来の力ではなく、こなすための力配分になると指摘されました。',
    demerit:'ACSMが'+L.label+'に勧める頻度に届いていません。',
    src:['acsm2009','asp']});
  if(a.reps!=='' && reps > 15) out.push({t:'1セット'+reps+'回は、筋持久力をねらう回数（15回を超える）です',
    merit:'ACSMは、局所の筋持久力には軽い負荷から中程度の負荷で15回を超える高回数を勧めています。',
    demerit:'講演の方針では、筋持久力は水中の反復練習で十分に高められるため、陸上では行いません。陸上の時間は出力の向上に使います。',
    src:['acsm2009','asp']});
  else if(a.reps!=='' && reps > 5) out.push({t:'1セット'+reps+'回は、講演の方針の上限（5回）を超えています',
    merit:(a.level==='novice'?'ACSMは、初心者には8から12RMの負荷を勧めています。':'ACSMは、筋肥大には6から12RMに重点を置くことを勧めています。')+'体が細い選手や、平泳ぎ・短距離の選手の一般準備期に限って用いる考え方もあります。',
    demerit:'講演の方針では、すべての種目を最大筋力で行い、5回を超えません。筋肥大は体重と水の抵抗が増えるため行わないとされています。ただし、筋肉量の増加が水の抵抗を増やすことを直接示した研究は限られています。',
    src:['acsm2009','asp','crowley2017']});
  if(a.rest!=='' && (a.goal==='strength'||a.goal==='power') && rest < 3) out.push({t:'セット間の休憩'+rest+'分は、ACSMが勧める3分から5分より短くなっています',
    merit:'全体の時間が短くなります。講演では、陸上トレーニングは90分で終わるように作ることが勧められました。',
    demerit:'ACSMは、最大筋力とパワーでは3分から5分の休憩を勧めています。講演では、休憩は画一的に決めず、次のセットで質の高い動きができるかを基準に各自で決めるとされました。',
    src:['acsm2009','asp','schoenfeld2016rest']});
  if(a.sets!=='' && a.goal==='power' && sets > 5) out.push({t:'1種目'+sets+'セットは、ACSMがパワーで勧める3から5セットを超えています',
    merit:'講演では、少ない回数を多くのセットに分ける例（デッドリフト2回を10セット）も示されました。',
    demerit:'セット数が多いときは、挙上の速さが落ちていないかを確かめてください。速さの低下が小さいうちにセットを終える方法が、疲労を抑えながら筋力とジャンプ能力を高められると報告されています。',
    src:['acsm2009','asp','pareja2017','weakley2021']});
  if(a.goal==='hypertrophy' || a.goal==='endurance') out.push({t:'目的が「'+GOALS[a.goal].label+'」になっています',
    merit:ACSM_GOAL[a.goal], demerit:GOALS[a.goal].swim, src:GOALS[a.goal].refs.concat(['acsm2009']).filter((k,i,s)=>s.indexOf(k)===i)});
  const miss = ORDER_RULES.filter(r=>!(a.order||[]).includes(r[0]));
  if(miss.length) out.push({t:'種目の順序で、まだ取り入れていない原則が'+miss.length+'つあります',
    merit:'ACSMは、運動の強さを保つために順序を工夫することを勧めています。取り入れていない原則：'+miss.map(r=>r[1]).join('。')+'。',
    demerit:'順序が逆になると、後半の主要な種目で強さを保ちにくくなります。ただし、セルフチェックで見つかった弱点のモビリティや肩の種目は、講演のとおりウォームアップに入れてかまいません。',
    src:['acsm2009','asp']});
  if(a.swim!=='' && a.freq!=='' && swim >= 8 && f >= 3) out.push({t:'水中練習が週'+swim+'回、ウエイトが週'+f+'回です',
    merit:'陸上の筋力トレーニングは、特にスタートやターン、短い距離の泳速に良い影響を示す研究が多いとされています。',
    demerit:'水中練習の量が多い選手ほど、干渉効果（筋力やパワーの伸びが妨げられること）が大きくなるとされます。ウエイトは量を絞り、質を高めてください。',
    src:['crowley2017','wilson2012','asp']});
  return out;
}
function flagHTML(fl){
  return '<section class="flag"><h3>'+esc(fl.t)+'</h3><div class="note good"><strong>メリット</strong>　'+esc(fl.merit)+'</div><div class="note bad"><strong>デメリット・注意</strong>　'+esc(fl.demerit)+'</div>'+srcBox(fl.src)+'</section>';
}

/* 不定期に出す助言 */
const ADVICE = [
  {id:'plateau1', t:'伸びが止まったとき、刺激をどう変えるか', b:'ACSMは、中級者以上には1から12RMの広い負荷の範囲を周期的に使うことを勧めています。同じ回数と重さを続けているなら、まず負荷の範囲を変えてください。また、求心性（上げる）、遠心性（下ろす）、等尺性（止める）の収縮、両側と片側の種目、単関節と多関節の種目を組み合わせることも、最適なプログラムの特徴として挙げられています。', src:['acsm2009'], c:a=>a.plateau==='yes'},
  {id:'plateau2', t:'重さを上げるタイミング', b:'ACSMは、今の重さで目標の回数より1回から2回多くできるようになった時点で、重さを2から10パーセント増やすことを勧めています。伸びが止まったと感じたら、まずこの基準で記録を見直してください。', src:['acsm2009'], c:a=>a.plateau==='yes'},
  {id:'plateau3', t:'伸びが止まったときに気をつけること', b:'原因がウエイトの中身ではなく、水中練習との重なりにあることがあります。持久トレーニングの量や頻度が多いほど、筋力やパワーの伸びは妨げられやすいとされます。また、挙上の速さの低下が小さいうちにセットを終える方法は、疲労を抑えながら筋力とジャンプ能力を高められると報告されています。量を足す前に、疲労を減らすことを検討してください。', src:['wilson2012','pareja2017','weakley2021'], c:a=>a.plateau==='yes'},
  {id:'drag1', t:'筋肉がつきすぎて、水の抵抗が増えていないか', b:'筋肉量の増加が水中の抵抗を増やすという考えは、実践の現場で広く共有されていますが、それを直接示した研究は限られています。講演の方針は、限られた陸上の時間を出力の向上に使うという優先順位の判断として理解できます。体重が増えているときは、泳ぎのタイムやスタートの指標が一緒に良くなっているかを確かめてください。', src:['asp','crowley2017'], c:a=>a.weight==='up'||a.goal==='hypertrophy'},
  {id:'test1', t:'どんなテストで確かめるか（跳ぶ力）', b:'競泳選手の研究をまとめたレビューでは、スタートの成績は自分の体重での垂直跳びの高さと非常に強く相関していました。下肢の最大筋力や跳躍のパワーも、スタートやターンのタイムと関連すると報告されています。垂直跳びを定期的に測り、このアプリの「測定を記録する」に残してください。', src:['thng2019','west2011','keiner2021']},
  {id:'test2', t:'どんなテストで確かめるか（体重とスキンフォールド）', b:'体重と皮下脂肪の厚さ（スキンフォールド）を同じ条件で定期的に測ると、体重の変化が脂肪によるものか、それ以外によるものかを見分ける手がかりになります。このアプリの「測定を記録する」に、体重、スキンフォールドの合計、垂直跳びを並べて残せます。', src:[], c:a=>a.skin!=='yes'||a.weight==='up'},
  {id:'order1', t:'種目の順序', b:'ACSMは、運動の強さを保つために、大きな筋肉の種目を小さな筋肉の種目より先に、多関節の種目を単関節の種目より先に、高強度の種目を低強度の種目より先に行うことを勧めています。', src:['acsm2009'], c:a=>(a.order||[]).length<3},
  {id:'rest1', t:'セット間の休憩', b:'ACSMは、最大筋力とパワーのトレーニングでは3分から5分の休憩を勧めています。講演では、休憩は画一的に決めず、次のセットで質の高い動きができるかを基準に各自で決めるとされました。', src:['acsm2009','asp']},
  {id:'taper1', t:'大会が近づいたら', b:'研究のメタ分析では、トレーニングの総量を41から60パーセント減らし、強度と頻度は保つテーパーが最も効果的でした。ウエイトも重さは保ち、セット数を減らします。', src:['bosquet2007']},

let adviceNow = null;
function pickAdvice(skipId){

/* 記録から見た今週の頻度 */
function actualFlags(){

}

function num(v){ return (v===''||v==null||isNaN(Number(v))) ? null : Number(v); }
function measuredGrowth(){
  /* 最新の身長と、それより半年以上前の身長を比べる。1年以上あいていれば「確定」に使える */

  if(hs.length<2) return null;
  const b = hs[hs.length-1]; const gap = t=>(new Date(b.date)-new Date(t.date))/86400000;
  let a = null;
  for(let i=hs.length-2;i>=0;i--){ if(gap(hs[i])>=365){ a = hs[i]; break; } }
  if(!a) for(let i=hs.length-2;i>=0;i--){ if(gap(hs[i])>=180){ a = hs[i]; break; } }
  if(!a) return null;
  const days = gap(a);
  return {rate:Math.round((b.h-a.h)/days*365*10)/10, from:a.date, to:b.date, year:days>=365};
}

  const sure = !!(mg && mg.year);

  else if(mg){ r.growthSrc = '半年以上あいた測定の記録（'+mg.from+'から'+mg.to+'）から1年分に換算。誤差が大きい'; }

    else if(a.trend==='down' || (g < 4 && a.trend!=='up')){ r.stage = 'post'; r.stageLabel = 'ジュニア（'+tag+'身長の伸びの山を過ぎ、まだ伸びている）'; }
    else { r.stage = 'pre'; r.stageLabel = 'ジュニア（'+tag+'身長の伸びの山の前か、その最中）'; }
  } else if(age!=null && age < 16){ r.stage = 'pre'; r.stageLabel = 'ジュニア（仮の判定：身長の記録がなく、16歳未満のため）'; }
  else if(age!=null){ r.stage = 'senior'; r.stageLabel = 'シニア（仮の判定：身長の記録がないため、年齢だけで判定）'; }
  else { r.stage = 'unknown'; r.stageLabel = '判定できません（年齢か身長の伸びを入れてください）'; }
  r.junior = r.stage==='pre' || r.stage==='post';
  const t50 = num(a.t50), t100 = num(a.t100), t400 = num(a.t400);
  const main = a.main==='100' ? t100 : a.main==='50' ? t50 : null;
  r.mainTime = main;
  r.band = a.main==='other' ? 'E' : main==null ? null : main<=25 ? 'A' : main<=40 ? 'B' : main<=60 ? 'C' : main<=80 ? 'D' : 'E';

  return r;
}

const GYM_CATS = {};
const GYM_COL = [['#1f2937','#0b1220'],['#7c2d12','#3b1406'],['#134e4a','#06302d'],['#1e3a8a','#0c1a45'],['#9a3412','#4a1907'],['#155e75','#082f3b'],['#4c1d95','#240d47'],['#831843','#3d0a1f'],['#365314','#192808'],['#3f3f46','#18181b'],['#713f12','#352006'],['#0f172a','#020617']];
(function(){
  const names = [...new Set(GYM_ROWS.map(r=>r[2]))];
  names.forEach((n,i)=>{ const k = 'g'+(i+1); GYM_CATS[k] = n; CATS[k] = '体操：'+n; CAT_COLOR[k] = GYM_COL[i%GYM_COL.length]; });
  const keyOf = n=>Object.keys(GYM_CATS).find(k=>GYM_CATS[k]===n);
  const cnt = {}; GYM_ROWS.forEach(r=>{ cnt[r[1]] = (cnt[r[1]]||0)+1; });
  const base = EX.slice();
  const PRI = ['ホローボディ','デッドバグ','スキャプラプルアップ','スキャプラプッシュアップ','ブルガリアンスクワット','CMJ','カウンタームーブメント','ブロードジャンプ','胸椎回旋','ウォールスライド'];
  GYM_ROWS.forEach(r=>{
    const name = r[1]; const adv = /プランシェ|十字|宙返り/.test(name);
    const pri = !adv && (name==='スクワット' || name==='懸垂' || PRI.some(p=>name.includes(p)));
    const twin = base.find(e=>e.name===name || e.name.startsWith(name+'（'));
    const e = {id:'gy_'+r[0], name, cat:keyOf(r[2]), type:'gym', gym:true, pri, adv, check:[], strokes:[], refs:[],
      muscles:(r[3]?'器具は'+r[3]+'。':'')+'主な筋肉は未登録'+(cnt[name]>1?'。同じ名前の種目が体操の別の分野にもあります':''),
      why:'体操の移行データから取り込んだ種目です。名前と分野'+(r[3]?'、器具':'')+'だけが登録されていて、やり方の説明はまだありません。',
      swim: pri ? '移行データでは、競泳への導入の優先度が高い例として挙げられています。ただし、これは研究で確かめられた効果ではなく、移行データを作った時点の見立てです。' : '競泳との関連は、まだ確認できていません。'+(twin?'':''),
      merit:['未登録です'], demerit:[adv ? '移行データの安全設計では、プランシェ、十字懸垂、宙返りなどは一般の初心者向けに勧めないとされています。肩、肘、手首、脊柱への負荷が大きい種目です' : '注意点は未登録です'],
      cue:'動かし方のポイントは未登録です'};
    if(twin) e.swim += ' 同じ名前の種目が、根拠つきで元の種目にあります（'+twin.name+'）。';
    EX.push(e); EXMAP[e.id] = e;
  });
})();
const BASE_N = EX.filter(e=>!e.gym).length;
const _browse = VIEWS.browse;
VIEWS.browse = ()=>{
  const v = _browse();
  const cards = Object.keys(GYM_CATS).map(c=>{ const n = EX.filter(e=>e.cat===c).length, col = CAT_COLOR[c];
    return '<li><button type="button" class="catcard gymcard" data-golist="cat" data-cat="'+c+'" style="background:linear-gradient(120deg,'+col[0]+','+col[1]+')" aria-label="体操、'+esc(GYM_CATS[c])+'、'+n+'種目"><span class="catname">'+esc(GYM_CATS[c])+'</span><span class="catn">'+n+'種目</span></button></li>'; }).join('');

};

  const N = {"giant1999":"1994年世界選手権の男子33名、女子34名の車輪101本を分析。車輪の前半は体から鉄棒へ、後半は鉄棒から体へエネルギーが移り、全体のエネルギーを増やすには筋による仕事が必要だった。","williams2015":"男子の初心者12名が鉄棒の車輪を8週間学ぶ過程を調べた。肩で大きなパワーを出せるかどうかが、上達を左右する要因だった。","fujihara2012":"あん馬の両足旋回を、吊り下げの補助具あり、なしで比べた。補助具は重心の軌道と力の大きさを変えるが、全体のパターンは変えなかった。","ironcross2004":"男子体操選手6名。つり輪と練習用の補助具で十字懸垂を行ったときの肩まわり9筋の筋電図を比べた。補助具では多くの筋の活動が下がり、肩の使い方がつり輪とは変わった。","farana2017":"チェコ代表レベルの女子体操選手7名。ロンダートの手の着き方2種類を比べ、けがの危険は主に、平行に着く型の2番目に着く手の側にあると結論している。","irwin2009":"男子エリート体操選手4名。旧来の跳馬と現行の跳馬テーブルで比べ、助走と踏切には差がなかったが、着手の角度が違い、テーブルでは上向きの離手速度が高かった。","hiley2015":"男子エリート選手1名の跳馬をもとにしたコンピュータモデルの研究。着手のときの速度と角運動量が大きいほど、その後の空中での回転量が増えた。","mills2009":"体操選手の筋力をもとにしたモデルで跳馬の着地を再現した。床からの力を最小にする着地では、骨や関節、筋にかかる体の中の負荷の多くがかえって増えた。","bradshaw2020":"女子体操選手7名。90センチの台から後方宙返りで着地したときの床からの力と、背中のセンサーの減速度を比べた。両者は置き換えられないと報告している。","navarro2021":"体操選手4名の後方抱え込み宙返り60本。高く、または速く回るよう指示すると、選手は股関節を伸ばすより膝を曲げる方向で調整する傾向があった。","tumbling2007":"女子体操選手13名。後方伸身と前方伸身の宙返りの踏切を筋電図で比べ、後方の踏切は接地時間が長く、ふくらはぎと太もも裏の活動が前方より大きかった。","yeadon1993":"エリートのトランポリン選手1名のひねり宙返り4種目。踏切のときの技術より、空中での技術のほうが、ひねりへの寄与が大きかった。","yeadon2003":"男子体操選手4名の倒立。全員が手首の力で前後の揺れを直す方法を使っていた。","mcclure2007":"症状のない成人54名。内旋が硬い側を4週間毎日伸ばしたところ、クロスボディストレッチの群は内旋の可動域が約20度増え、何もしない群より有意に大きかった。","chepeha2018":"内旋が硬い大学のバレーボール、水泳、テニスの選手37名。スリーパーストレッチを8週間毎日行った群は、肩の内旋と水平内転の可動域、肩の機能が有意に改善した。クロスボディではなく、同じ肩の後ろ側を伸ばす別のストレッチの研究。","takeuchi2021":"健常者12名。20秒3回のジャックナイフストレッチで膝を伸ばす可動域が増えた。筋と腱の硬さが下がったのは、強く行ったときだけだった。","davis2005":"ハムストリングスが硬い19名。30秒1回を週3日、4週間。3種類のストレッチのうち、何もしない群より有意に伸びたのは静的ストレッチだけだった。座って前屈する形そのものの研究ではない。","splitvib2011":"平均13.8歳の女子体操選手22名。前後開脚と前方ランジの姿勢で10秒4セットのストレッチを行うと柔軟性が向上した。振動を加える上乗せ効果は、利き脚でない側だけで有意だった。","fjerstad2018":"股関節の内転筋が硬い活動的な成人40名。60秒の静的ストレッチでの可動域の増加は約1度とわずかで、何もしない条件との差はなかった。筋力の低下もなかった。この3種目そのものではなく、内転筋のストレッチ一般の研究。","konrad2021":"8研究、165名のメタ分析。股関節の前側の筋の1回のストレッチは、120秒までならパフォーマンスに影響しないか良い影響の可能性があり、270秒から480秒ではごく小さな低下がみられた。","radford2006":"無作為化試験5本のメタ分析。ふくらはぎの静的ストレッチで、足首を反らす可動域が、伸ばした時間に応じて約2度から3度、有意に増えた。","schoenfeld2014":"19名が4種類のプランクを30秒ずつ行った。肘を前に出すロングレバーのプランクは、通常のプランクより腹直筋と外腹斜筋の活動が高かった。","imai2010":"健常な男性9名。フロントプランク、バードドッグ、サイドブリッジなどの体幹の筋活動を測り、不安定な面ではおおむね筋活動が高まった。","ji2021":"韓国の思春期のエリート競泳選手30名。12週間の体幹トレーニングで、無酸素パワーやプランクの持久力は従来のウエイトより伸びたが、泳ぎの記録の改善には差がなかった。","escamilla2006":"健常な男女21名。30度の傾斜でのリバースクランチは、腹直筋と内腹斜筋の活動が最も高い種目の群に入った。","schoffstall2010":"21名がクランチ、仰向けのVアップなどを行った。腹直筋と外腹斜筋の活動に種目の差はなく、器具なしの種目も器具ありと同じ程度に腹筋を働かせた。","ng1994":"健常な成人18名。うつ伏せで体を反らせる姿勢を基準に、2種類の背筋の保持運動を比べ、脊柱起立筋と多裂筋は基準の66から79パーセントで同じように働いていた。","ni2014":"ヨガの経験者30名。ダウンドッグとプランクは、外腹斜筋の強化に有効な姿勢とされた。","kinoshita2022":"倒立ができる健常な男性13名（体操選手ではない）。倒立に向けた4段階の姿勢で、肩まわりの筋活動は段階的に増えた。","kerwin2001":"6名の倒立。うまく保てたときは手首と肩の力で前後のバランスをとり、うまくいかないときほど股関節の力の影響が大きかった。","wyatt2021":"全国レベルの女子体操選手10名（平均10歳）。倒立を10秒を超えて保てる選手と、4秒から6秒の選手では、バランスのとり方が違っていた。","mcdonald2025":"倒立についての21研究の系統的レビュー。選手はふつう手首でバランスをとり、足りないときに肩、股関節、肘を使う。筋力が高いほど制御が良いと報告されている。","mizutori2021":"男子体操選手59名の伸腕プレス倒立。技能の低い群は肩の力が大きく、技能の高い群は動作の後半に股関節の力が大きかった。","niespodzinski2026":"男子体操選手41名（10歳から12歳の25名と成人16名）の平行棒でのプレス倒立。できる少年とできない少年の差は前鋸筋の活動にあり、肩甲骨の制御が成否に関わると示唆された。","angioi2026":"倒立で6歩歩ける選手10名。肩に痛みのある選手は歩く速さが遅く、腕がより曲がっていた。","marcolin2015":"健常な若い人8名が5種類の腕立て伏せを行った。上腕三頭筋と大胸筋の活動は、手幅の狭い腕立て伏せで最も高かった。ダイヤモンドの形そのものは扱っていない。","wurm2010":"足を台に乗せた腕立て伏せは、通常、膝つき、手を台に乗せた形のどれよりも、床からの力が大きかった。","koch2012":"活動的な健常男性22名。手をたたく腕立て伏せは、台から落ちる腕立て伏せより、力の立ち上がりが速かった。床からの力の最大値は同じ程度だった。","mckenzie2022":"トレーニング経験のある男性13名。バーのディップスはベンチのディップスより多くの筋で活動が高く、リングのディップスは大胸筋、広背筋、上腕二頭筋がバーより高かった。","wang2023":"実際に測ったのではなく、力学モデルで80通りの体型を計算した研究。同じ身長なら、脚が長く体幹が短い体型ほどプランシェのバランスに有利とされた。筋力は考えに入っていない。","youdas2010":"懸垂ができる男女25名。逆手のチンアップは大胸筋と上腕二頭筋、順手のプルアップは僧帽筋下部の活動が高く、広背筋には有意な差がなかった。","dickie2017":"筋力トレーニング経験のある男性19名。順手、逆手、手のひらを向かい合わせる握り、ロープの4種類の懸垂で、筋活動は全体にほぼ同じだった。上げるときは下ろすときより活動が高かった。","sanchezmoreno2017":"男性52名の加重懸垂。挙上の速さと、最大重量に対する割合には強い関係があり、速さの落ち方から残りの回数を見積もれた。","snarr2013":"男女15名。広背筋、僧帽筋中部、三角筋後部の活動は、通常のインバーテッドロウと吊り下げ器具を使った場合で差がなかった。","walker2023":"活動的な男性10名。リングのマッスルアップは、バーに比べて、引く局面で僧帽筋上部と上腕二頭筋、押す局面で上腕三頭筋の活動が高かった。","reinold2004":"健常者10名に7種類の外旋の運動を行わせた。棘下筋と小円筋の活動は、横向きに寝て行う外旋が最も高かった。","batalha2015":"若い男子競泳選手40名の無作為化試験。16週間のゴムバンドによる肩の強化を加えた群は、水中練習だけの群に比べ、外旋の筋力と、内旋と外旋のバランスが改善した。","hibberd2012":"大学競泳選手44名の無作為化試験。チューブでのY、T、Wや、90度に開いた位置での内旋と外旋などを週3回6週間行っても、筋力と肩甲骨の動きに、何もしない群との有意な差は出なかった。","dellatommasina2023":"男子競泳選手22名の無作為化試験。8週間のゴムバンドによる斜め方向の肩の強化は、外旋の筋力をわずかに改善したが、有意ではなかった。","distefano2009":"活動的な健常成人21名が12種目を行った。中臀筋の活動は、横向きに寝て脚を上げる運動が最も高く、クラム、ランジ、ホップより有意に高かった。","cambridge2012":"健常な男性9名のモンスターウォーク。バンドを膝から足首、足へと下げるほど中臀筋の活動が増えた。","haroy2019":"ノルウェーの男子サッカー選手652名の無作為化試験。コペンハーゲン・アダクションを行った群は、鼠径部の問題を訴える危険が41パーセント低かった。","ishoi2016":"19歳以下の男子サッカー選手24名の無作為化試験。8週間のコペンハーゲン・アダクションで、股関節の内転の筋力が約36パーセント増えた。","wristtrain2004":"男子高校野球選手43名の無作為化試験。全身の筋力トレーニングに手首と前腕の種目を12週間加えた群は、手首と前腕の筋力がより大きく伸びた。","maeo2023":"成人21名が12週間、ケーブルで肘を伸ばす運動を行った。腕を頭上に上げた姿勢のほうが、体の横の姿勢より、上腕三頭筋の体積の増加が約1.4倍から1.5倍大きかった。","sato2022":"トレーニング経験のない若い成人。週2回5週間、下ろす動きだけの肘を曲げる筋のトレーニングは、半分の量で、上げ下ろし両方の場合と同じ程度に筋力と筋の厚さを増やした。","kojima2021":"在宅のリハビリを受けている27名の無作為化試験（競技者ではない）。3か月、足の指でタオルをたぐる運動を加えた群は、片脚で立てる時間が有意に伸びた。","gullett2009":"トレーニング経験のある健常者15名。バックスクワットはフロントスクワットより膝を圧縮する力が有意に大きく、全体の筋活動は同じ程度だった。","west2011":"英国代表の男子短距離競泳選手11名。スクワットの筋力、垂直跳びの高さ、パワーが高いほど、15メートルまでのスタートのタイムが有意に速かった。","takai2013":"平均13.7歳の男子94名。自分の体重でのスクワットを1日100回、8週間行うと、体脂肪率が下がり、太もも前の筋の厚さ、膝を伸ばす筋力、垂直跳びが向上した。","collins2021":"男性16名と女性16名。体重の30パーセントの負荷で、ゴブレットスクワットはランドマインスクワットより大腿四頭筋の活動が大きかった。","helme2022":"トレーニング経験のある男性26名。後ろ足を台に乗せたスプリットスクワットでは、前足が縦方向の力の約84パーセントを担っていた。","park2016":"ランジに慣れた4名。リバースランジは大臀筋と大腿四頭筋の活動が高く、膝にかかるずれの力は比較的小さかった。","vandyk2019":"15研究、選手8459名のメタ分析。ノルディックハムストリングを含む予防プログラムは、ハムストリングの肉離れの危険を約半分に減らした。","tsaklis2015":"エリートの女子陸上選手20名。ハムストリングの10種目を比べ、ノルディックと、足を滑らせるレッグカールは強度が高い種目、ブリッジは中程度の種目に分類された。","martinfuentes2020":"筋電図の研究の系統的レビュー。デッドリフトでは脊柱起立筋と大腿四頭筋の活動が、大臀筋や大腿二頭筋より大きいと報告された。","saeterbakken2011":"筋力トレーニング経験のある若い男性12名。ダンベルで持ち上げられる最大重量はバーベルより約17パーセント低かったが、大胸筋と三角筋前部の筋活動に差はなかった。","garrido2010":"平均12歳の全国レベルの競泳選手28名。ベンチプレスなどの筋力とメディシンボール投げは、25メートルと50メートル自由形のタイムと中程度の有意な関連があった。垂直跳びとは関連がなかった。","saeterbakken2013":"健常な男性15名。立って行うダンベルのショルダー       const drawRes = ()=>{ const m = libMatches($('#lq').value); $('#lRes').innerHTML = m.length ? '<ul class="pickres">'+m.map(e=>'<li><label class="rad"><input type="checkbox" data-lpick="'+e.id+'"'+(libSel.has(e.id)?' checked':'')+'><span>'+esc(e.name)+'<span class="sub">'+esc(CATS[e.cat])+'</span></span></label></li>').join('')+'</ul>' : ($('#lq').value.trim()?'<p class="sub">当てはまる種目がありません。</p>':''); };
      $('#lq').addEventListener('input',drawRes);
      $('#lq').addEventListener('keydown',e=>{ if(e.key==='Enter') e.preventDefault(); });
      $('#lRes').addEventListener('change',e=>{ const id = e.target.dataset.lpick; if(!id) return; if(e.target.checked) libSel.add(id); else libSel.delete(id); drawPick(); });
      $('#lPick').addEventListener('click',e=>{ const b = e.target.closest('[data-lrm]'); if(!b) return; libSel.delete(b.dataset.lrm); drawPick(); drawRes(); $('#lq').focus(); });
      $('#lAuto').addEventListener('click',()=>{
        const f = $('#libForm'); const text = f.ltitle.value+'\n'+f.lnote.value+'\n'+f.lbody.value; let n = 0;
        EX.forEach(e=>{ const nm = e.name.split('（')[0]; if(nm.length>=3 && text.includes(nm) && !libSel.has(e.id)){ libSel.add(e.id); n++; } });
        drawPick(); drawRes(); say(n ? n+'種目が見つかり、選びました。合っているか確かめてください' : '種目の名前は見つかりませんでした');
      });
      $('#libForm').addEventListener('submit',ev=>{
        ev.preventDefault(); const f = ev.target; const title = f.ltitle.value.trim();
        if(!title){ $('#lErr').textContent = '題名を入れてください。'; f.ltitle.focus(); return; }
        const d = (new FormData(f)).get('ld')||'direct';
        const o = {id: libEdit || 'u_'+Date.now(), kind:(new FormData(f)).get('lkind')||'paper', title, src:f.lsrc.value.trim(), url:f.lurl.value.trim(), note:f.lnote.value.trim(), body:f.lbody.value.trim(), date:today(), links:[...libSel].map(id=>({id, d}))};
        db.lib = db.lib||[]; const i = db.lib.findIndex(y=>y.id===o.id); if(i>=0) db.lib[i] = o; else db.lib.push(o);
        save(); applyUserLib(); libSel = new Set(); libEdit = null; say('資料を登録しました。結びつけた種目は'+o.links.length+'です'); render(true);
      });
      const c = $('#lCancel'); if(c) c.addEventListener('click',()=>{ libEdit = null; libSel = new Set(); render(false); $('#libFormH').focus(); });
      $('#view').onclick = e=>{
        const ed = e.target.closest('[data-ledit]'), dl = e.target.closest('[data-ldel]');
        if(ed){ libEdit = ed.dataset.ledit; const y = db.lib.find(z=>z.id===libEdit); libSel = new Set((y.links||[]).map(l=>l.id)); render(false); $('#libFormH').focus(); }
        if(dl){ db.lib = db.lib.filter(z=>z.id!==dl.dataset.ldel); save(); applyUserLib(); say('資料を消しました'); render(false); }
      };
    }
  };
};

ROOTS.push('settings');
render(false);
</script>
</body>
</html>
