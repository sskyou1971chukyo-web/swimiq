<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWIMIQ-STRENGTH</title>
<link rel="apple-touch-icon" href="strength-icon-180.png">
<link rel="icon" type="image/png" href="strength-icon-192.png">
<link rel="manifest" href="strength.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="STRENGTH">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
/* SwimIQ の色の決まり：地は黒、文字は白。黄色は「いちばん押すもの」と「いま選んでいるもの」だけ。緑は良い結果、赤は注意と中止だけ */
:root{--ink:#fff;--sub:#c9c9c9;--bg:#000;--soft:#17181a;--pane2:#202124;--line:#4a4a4a;--am:#ffc400;--green:#35e06a;--greenbg:#0e2415;--red:#ff8e78;--redline:#ff4b2b;--redbg:#2a110c;--ambg:#2b2204}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
#app{max-width:720px;margin:0 auto;padding:env(safe-area-inset-top) 16px 120px}
#brand{font-family:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;font-style:italic;font-weight:400;font-size:2rem;line-height:1;padding:14px 0 4px;display:flex;align-items:center;gap:.3em}
#brand .b1{color:#fff}#brand .b2{color:var(--am);margin-left:-.3em}
#brand .b3{background:var(--am);color:#000;font-size:.5em;padding:.18em .5em .12em;border-radius:3px;letter-spacing:.05em}
#top{position:sticky;top:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:84px 1fr 84px;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #3a3b3d}
#title{font-size:1.1rem;margin:0;text-align:center;font-weight:700;grid-column:2}
#title:focus{outline:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--am);outline-offset:2px}
#back{min-height:46px;border:2px solid var(--line);background:var(--soft);border-radius:6px;font-weight:700;color:#fff}
h2{font-size:1.2rem;margin:26px 0 10px;line-height:1.4}
h3{font-size:1.05rem;margin:18px 0 8px}
p{margin:8px 0}
.sub{color:var(--sub);font-size:.9rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
a{color:var(--am)}
.cta{display:flex;align-items:center;justify-content:center;width:100%;min-height:60px;border-radius:8px;border:2px solid var(--am);background:var(--am);color:#000;font-weight:700;font-size:1.1rem;padding:10px 18px}
.ghost{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border-radius:8px;border:2px solid var(--line);background:var(--soft);color:#fff;font-weight:700;padding:8px 16px}
.ghost.sm{min-height:44px;font-size:.9rem;width:auto;padding:4px 14px}
.stack{display:grid;gap:10px}
@media(min-width:600px){.stack.two{grid-template-columns:1fr 1fr}}
.link{background:none;border:0;color:var(--am);text-decoration:underline;font-weight:700;min-height:44px;padding:4px 0;text-align:left}
.note{background:var(--soft);border-left:5px solid var(--line);border-radius:8px;padding:10px 14px;margin:10px 0}
.note.good{background:var(--greenbg);border-left-color:var(--green)}
.note.bad{background:var(--redbg);border-left-color:var(--redline)}
.note.warn{background:var(--ambg);border-left-color:var(--am)}
.tag{display:inline-block;font-size:.78rem;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:0 9px;margin:2px 6px 0 0;background:var(--pane2)}
.tag.ok{border-color:var(--green);color:var(--green);background:var(--greenbg)}
.tag.warn{border-color:var(--am);color:var(--am);background:var(--ambg)}
.tag.bad{border-color:var(--redline);color:var(--red);background:var(--redbg)}
.txt{display:block;width:100%;min-height:54px;border:2px solid var(--line);border-radius:8px;padding:8px 14px;background:var(--soft);color:#fff;margin-top:6px;color-scheme:dark}
label.f{display:block;font-weight:700;margin-top:14px}
details.more summary{cursor:pointer;color:var(--am);font-weight:700;min-height:44px;padding:8px 0}
details.more .inner{padding:4px 0 8px}
/* ノートのページ */
.page{border:1px solid #3a3b3d;border-radius:14px;background:var(--soft);padding:16px;margin:14px 0;position:relative}
.page.now{border-color:var(--am);box-shadow:inset 5px 0 0 var(--am)}
.page.done{opacity:.92}
.page h2{margin:0 0 6px;font-size:1.15rem;display:flex;align-items:center;gap:10px}
.step{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);font-size:.95rem;flex:none}
.page.now .step{background:var(--am);color:#000;border-color:var(--am)}
.page.done .step{background:var(--green);color:#000;border-color:var(--green)}
.here{color:var(--am);font-size:.85rem;font-weight:700;margin-left:auto}
.pagehead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:14px 0 0}
.pagehead .date{font-size:1.25rem;font-weight:700}
/* 選ぶ札 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{min-height:50px;min-width:64px;padding:6px 16px;border-radius:8px;border:2px solid var(--line);background:var(--pane2);font-weight:700;color:#fff}
.chip[aria-pressed=true]{background:var(--am);border-color:var(--am);color:#000}
/* 上げ下げ */
.stepper{display:grid;grid-template-columns:60px 1fr 60px;gap:8px;align-items:center;margin-top:6px}
.stepper button{min-height:56px;border-radius:8px;border:2px solid var(--line);background:var(--pane2);color:#fff;font-size:1.4rem;font-weight:700}
.stepper input{min-height:56px;text-align:center;font-size:1.3rem;font-weight:700;border:2px solid var(--line);border-radius:8px;background:var(--soft);color:#fff;width:100%;color-scheme:dark}
.unit{color:var(--sub);font-size:.85rem}
/* メニューの行 */
ul.rows{list-style:none;margin:8px 0 0;padding:0}
.row{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:stretch;border-top:1px solid #3a3b3d;padding:8px 0}
.row:first-child{border-top:0}
.rmain{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 4px;border-radius:8px;min-height:60px}
.rmain strong{display:block;font-size:1.05rem;line-height:1.35}
.rmain .d{display:block;color:var(--sub);font-size:.92rem}
.rmain .d b{color:#fff}
.st{min-height:60px;border-radius:8px;border:2px solid var(--line);background:var(--pane2);color:#fff;font-weight:700;font-size:.95rem;padding:4px}
.st.done{background:var(--greenbg);border-color:var(--green);color:var(--green)}
.st.skip{background:var(--redbg);border-color:var(--redline);color:var(--red)}
.row.done .rmain strong{color:var(--sub)}
.row.skip .rmain strong{text-decoration:line-through;color:var(--sub)}
.big{font-size:2.2rem;font-weight:800;line-height:1.1}
.big small{font-size:1rem;margin-left:4px}
.tiles{list-style:none;margin:8px 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles li{background:var(--pane2);border-radius:10px;padding:12px}
.tiles .sub{display:block}
/* 種目の一覧 */
.exl{list-style:none;margin:8px 0;padding:0}
.exl li{display:grid;grid-template-columns:1fr auto;gap:8px;border-top:1px solid #3a3b3d;align-items:center}
.exl .rmain{min-height:56px}
.exl .ghost.sm{margin:4px 0}
.stars{letter-spacing:1px}
.refs{list-style:none;padding:0;margin:0}
.refs li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;overflow-wrap:anywhere}
.refnote{margin:6px 0;background:var(--pane2);border-radius:8px;padding:6px 10px;font-size:.92rem}
.refnote.w{background:var(--ambg)}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
thead th{background:var(--pane2)}
.scroll{overflow-x:auto}
/* 体の絵 */
.body{width:100%;max-width:420px;margin:0 auto;display:block}
.body .hot .z{fill:var(--c);opacity:.35;stroke:var(--c);stroke-width:4;cursor:pointer}
.body .hot:hover .z,.body .hot:focus .z{opacity:.7}
.body .hot:focus{outline:none}
.body .lab text{fill:#fff;font-size:34px;font-weight:700}
.body .lab line{stroke:#fff;stroke-width:3}
.body .lab circle{fill:#fff}
.body .lab rect{fill:#000;stroke:#fff;stroke-width:3;rx:10}
/* グラフ */
.svgbox{background:var(--pane2);border-radius:10px;padding:8px;margin-top:8px}
.svgbox svg{display:block;width:100%;height:auto}
/* 下のシート */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
#sheet[hidden]{display:none}
.sheetin{background:#000;border:1px solid #3a3b3d;border-radius:16px 16px 0 0;width:100%;max-width:720px;margin:0 auto;max-height:92vh;overflow:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
.sheetin h2{margin:4px 0 8px}
/* 下のタブ */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#000;border-top:1px solid #3a3b3d;display:grid;grid-template-columns:repeat(4,1fr);padding:6px max(4px,calc(50% - 360px)) calc(6px + env(safe-area-inset-bottom))}
#tabs button{min-height:60px;border:0;background:none;color:var(--sub);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.78rem;border-radius:10px}
#tabs button svg{width:26px;height:26px}
#tabs button.on{color:var(--am);box-shadow:inset 0 4px 0 var(--am)}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:30;background:var(--am);color:#000;font-weight:700;border-radius:999px;padding:10px 20px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;border:2px solid #000}
#toast.show{opacity:1}
[hidden]{display:none !important}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

</nav>

on-non-experts/clinical-assessment-methods-classifying-generalized-joint-hypermobility/","bennell1998":"https://doi.org/10.1016/S0004-9514(14)60377-9","chisholm2012":"https://doi.org/10.3138/ptc.2011-41","hirshkowitz2015":"https://doi.org/10.1016/j.sleh.2014.12.010","milewski2014":"https://pubmed.ncbi.nlm.nih.gov/25028798/","saw2016":"https://doi.org/10.1136/bjsports-2015-094758","mountjoy2023":"https://doi.org/10.1136/bjsports-2023-106994","mann2016":"https://doi.org/10.1519/JSC.0000000000001055","gabbett2016":"https://doi.org/10.1136/bjsports-2015-095788","impellizzeri2020a":"https://doi.org/10.1123/ijspp.2019-0864","impellizzeri2020b":"https://doi.org/10.1007/s40279-020-01378-6","lesuer1997":"https://journals.lww.com/nsca-jscr/abstract/1997/11000/the_accuracy_of_prediction_equations_for.1.aspx","wilk2021":"https://doi.org/10.1007/s40279-021-01465-2","scj2022tempo":"https://doi.org/10.1519/SSC.0000000000000695","mcleod2010":"https://us.humankinetics.com/products/swimming-anatomy","sayers1999":"https://www.unm.edu/~rrobergs/478SayersText.doc","tessier2013":"https://pmc.ncbi.nlm.nih.gov/articles/PMC3827754","duncan2013":"https://wlv.openrepository.com/server/api/core/bitstreams/8a434998-78b6-4dc8-b351-5d367fd442ff/content"},"REF_NOTE":{"heneghan2019":"7研究168名（アスリートは20名のみ）の系統的レビュー。腕を上げる動作にともなって胸椎が伸展することが報告されている。エクササイズの効果を調べた研究ではない。","welbeck2019":"大学競泳選手34名の横断研究。胸椎回旋の可動域は、肩甲骨の動きの異常の有無で差がなく、肩の痛みとも相関しなかった。胸椎回旋エクササイズを直接支持する結果ではない。","johnson2012":"健常成人46名（競泳選手ではない）。胸椎回旋の可動域を測る5つの方法はいずれも信頼性が良好だった。測定法の研究であり、エクササイズの効果を調べたものではない。","barrett2016":"10研究の系統的レビュー（競泳選手に限らない）。背すじを伸ばした姿勢のほうが丸めた姿勢より肩の可動域が大きいという強い根拠がある一方、単回の実験にもとづくため長期的な意義は不明としている。","lee2020":"競泳選手ではなく、肩の機能障害がある患者32名の無作為化試験。フォームローラーと四つばいでの胸椎セルフモビライゼーションを週3回4週間行った群は、対照群より痛み、機能、肩の屈曲・外転・外旋の可動域が有意に改善した。","laudner2013":"症状のない大学競泳選手19名の横断研究。広背筋が硬い選手ほど、腕を上げるときの肩甲骨の動きが変わっていた。ストレッチの効果を調べた研究ではない。","herrington2014":"エリート競泳選手15名、カヌー選手、ラグビー選手、一般の対照を比べた研究。上腕を外旋した位置での肩屈曲の可動域は競技によって有意に異なり、広背筋の長さは競技の要求に応じて異なると結論している。","tavares2022":"競泳選手を対象とした11論文の系統的レビュー。ストレッチで肩の可動域が改善した研究が1件、筋力とストレッチの併用で肩の姿勢が改善した研究が2件あったが、全体として研究の質は低いと述べている。","laudner2015":"症状のない大学女子競泳選手39名。小胸筋への筋エネルギーテクニック（軽い等尺性収縮とストレッチの組み合わせ）を週2回6週間行った群は、小胸筋が長くなり、肩甲骨の前方位が減った。施術者が行う手技であり、セルフストレッチではない。","borstad2006":"競泳選手が対象ではない。小胸筋の3種類のストレッチを比べ、片側のセルフストレッチが最も大きな筋の長さの変化を生んだ。大胸筋ではなく小胸筋の研究。","muraki2009":"献体9体の研究（生きた人ではない）。小胸筋は肩の屈曲と肩甲骨面での挙上で大きく伸ばされた。","umehara2021":"競泳選手が対象ではない。小胸筋の硬さは30秒1回のストレッチ直後に下がり、回数を増やすとさらに下がった。長いストレッチのほうが効果を保ちやすいと結論している。","wolfram2023":"健常男性20名（競泳選手ではない）。肩を外転・外旋させたときの大胸筋の硬さの変化は、部位によって異なった。ストレッチの効果を調べた研究ではない。","muraki2007":"献体9肩の研究（生きた人ではない）。肩甲下筋の下部の線維は、挙上、外転、屈曲、水平外転と、挙上30度から90度での外旋で大きく伸ばされた。上部と中部を大きく伸ばす姿勢は見つからなかった。","lake2014":"スラスターではなくプッシュプレスの研究。筋力トレーニング経験のある男性で、ピークパワーは1RMの約75パーセントで最大となり、力学的な要求はジャンプスクワットと同程度だった。","soriano2019":"プッシュプレスなど頭上へ押し上げる種目の研究13件の総説。パワーと最大筋力の向上に役立つ可能性があるとする一方、長期的なトレーニング効果はまだよく分かっていないと述べている。","mcallister2014":"ウエイトトレーニング経験のある男性12名。4種目を1RMの85パーセントで比べ、ハムストリングスの筋活動はルーマニアンデッドリフトとグルートハムレイズで最も高かった。","delgado2019":"トレーニング経験1年以上の男性8名。1RMでの大臀筋の活動は、ルーマニアンデッドリフトとヒップスラストの間に有意な差がなかった。","lee2018":"男性21名。ルーマニアンデッドリフト1RMの70パーセントの重量で比べると、大腿直筋と大臀筋の筋活動、膝関節のトルクは、通常のデッドリフトのほうが有意に大きかった。ルーマニアンデッドリフトの優位を示す結果ではない。","mo2023":"トレーニング経験2年以上の若い男性12名。片脚ルーマニアンデッドリフトは大臀筋上部と大腿二頭筋を非常に強く活動させた。支える脚と反対側の手で負荷を持つと、中臀筋と大臀筋の活動が高まった。","sorensen2021":"女子エリートハンドボール選手23名。ルーマニアンデッドリフトは片脚でも両脚でもハムストリングスを強く活動させ、大腿二頭筋より半腱様筋の活動が高かった。","speirs2016":"アカデミーのラグビー選手18名。後ろ足を台に乗せるスプリットスクワットだけの群とバックスクワットだけの群を5週間、週2回鍛えたところ、両群とも1RM、40メートル走、方向転換が有意に向上し、群の間に差はなかった。","riemann2013":"若い成人32名。サイドランジはフォワードランジより足首と膝を伸ばす筋への負荷が大きく、股関節を伸ばす筋への負荷はフォワードランジのほうが大きかった。大臀筋や内転筋の筋活動を測った研究ではなく、このアプリの「大臀筋・内転筋」という表示を直接支える内容ではない。","signorile2002":"トレーニング経験1年以上の男性10名。4種類の握り方のうち、広い手幅で体の前に引く方法が、広背筋の筋活動が最も大きかった。","lusk2010":"健康な男性12名。1RMの70パーセントで、手幅にかかわらず順手のほうが逆手より広背筋の筋活動が大きかった。","andersen2014":"筋力トレーニング経験のある男性15名。手幅を変えても広背筋などの筋活動はおおむね同程度で、広い手幅では扱える重量が小さかった。","lehman2004":"トレーニング経験のある男性12名。ワイドグリップのプルダウンとシーテッドロウは、上腕二頭筋に対する広背筋の活動の比が最も高かったが、種目による違いは小さいと結論している。","handa2005":"ウエイトトレーニング経験のある男性8名。1RMの70パーセントで5種目を比べ、ベントオーバーロウは僧帽筋の活動が高く、広背筋の活動はシーテッドロウとラットプルダウンが最も高かった。","fenwick2009":"健康な男子大学生7名。立って行うベントオーバーロウは背中全体を左右対称に大きく活動させた一方、比べた3種目の中で腰椎への負荷が最も大きかった。","muyor2022":"運動習慣のある健康な成人20名（競泳選手ではない）。広背筋と上腕三頭筋の筋活動はストレートアームプルダウンで最も高かった。","rodriguezridao2020":"トレーニング経験1年以上の若い成人30名。大胸筋上部の活動は傾斜30度で最大となり、45度を超えると三角筋前部の活動が増えて大胸筋の活動が下がった。","trebs2010":"健康な男性15名。大胸筋の鎖骨部の活動は44度と56度で水平より大きく、胸肋部は水平で最も大きかった。","lauver2016":"トレーニング経験のある男性14名。挙上全体では大胸筋上部に角度による差はなかったが、挙上の途中の区間では30度と45度が水平より高かった。","calatayud2015":"大学生30名（男性22名、女性8名）。筋活動が同じ程度になるようにそろえたベンチプレスと、ゴムバンドで負荷をかけた腕立て伏せを5週間行うと、筋力の伸びは同じ程度だった。","suprak2011":"28名。通常の腕立て伏せで手にかかる荷重は体重の約69パーセント（上の位置）から約75パーセント（下の位置）、膝つきでは約54パーセントから約62パーセントだった。","ludewig2004":"健康な人と軽い肩の機能障害がある人の計30名。押し切ったところで肩甲骨をさらに前に出すプッシュアップ・プラスは、前鋸筋の活動が最も高かった。","clemons2010":"大学生年代の男女43名。座って胸からメディシンボールを押し出して投げる距離は、ベンチプレスのパワーと高く相関した。立って壁に投げるチェストパスそのものの研究ではなく、測定法の研究。","szymanski2007":"高校野球選手49名の無作為化試験（競泳選手ではない）。筋力トレーニングに回旋系のメディシンボール種目を12週間加えた群は、加えない群より体幹の回旋筋力、メディシンボール投げ、バット速度の向上が大きかった。","ikeda2007":"男子16名、女子10名のアスリート。横向きのメディシンボール投げの記録は、男子でのみ体幹回旋の力やスクワット1RMと有意に相関した。","tsartsapakis2023":"健康な女性44名の超音波測定。サイドプランクやデッドバグを含む5種目のうち、デッドバグが腹横筋の厚さを最も大きく増やした。","ekstrom2007":"健康な成人30名。9種目の筋電図を比べ、サイドブリッジ（サイドプランク）は中臀筋と外腹斜筋の強化に使える可能性があるとした。","mcgill2009":"健康な男性8名。サイドブリッジなどの各種のやり方で筋活動と脊柱の姿勢を測り、段階的に難しくする進め方を示した。","mcgill2015":"男性14名。脚を伸ばしたハンギングレッグレイズは腹直筋と外腹斜筋の活動が非常に高く、脊柱を圧縮する力は平均約3000ニュートンだった。","axler1997":"9名が12種類の腹筋運動を行った研究。腹筋の活動を脊柱の圧縮力で割った値は部分的なカールアップでおおむね最も高く、脊柱への負荷を最小にしながらすべての腹筋を鍛えられる単一の種目はなかった。","marshall2010":"ブタの頸椎の標本を使った実験（人の運動を調べたものではない）。ひねる力だけでは椎間板ヘルニアは始まらなかったが、くり返しの曲げ伸ばしと組み合わせると、67.5パーセントの標本で線維輪に亀裂が生じた。ひねりと曲げを同時にくり返す種目に注意が必要とする根拠。","karpinski2020":"ポーランドの全国レベルの男子競泳選手16名の無作為化試験。ロシアンツイストを含む4種目の体幹トレーニングを週3回6週間加えた群は、50メートル自由形が1.2パーセント短縮した。4種目をまとめた効果であり、ロシアンツイスト単独の効果は分からない。","thng2019":"競泳選手を対象とした16研究の系統的レビュー。スタートの成績は垂直跳びの高さと非常に強く相関した。この種目そのものを調べた研究ではない。","weston2015":"全国レベルのジュニア競泳選手20名。水中練習に週3回12週間の体幹トレーニングを加えた群は、50メートル自由形が2.0パーセント短縮した。体幹トレーニング全体の効果であり、この種目が含まれていたかは確認できていない。","morouco2011":"全国レベルの男子競泳選手10名。ラットプルダウンのパワーは、牽引泳で測った力と中程度から強い関連を示した。","liu2023":"思春期が早く始まった女子498名の研究。最終身長の判定基準を、過去1年の成長速度が年1センチ未満、または暦年齢か骨年齢が15歳以上としている。","banaszak2022":"低身長の患者の研究。成長速度が年1センチ未満になった時点を最終身長としている。","diurnal1997":"子ども53名。身長は朝9時から11時で約0.3センチ、11時から13時でさらに約0.2センチ縮み、起きてから約6時間でほぼ止まった。測り直しのばらつき（標準偏差）は約0.3センチ。午後の測定を勧めている。","capelli1998":"エリート選手20名。有酸素の割合は50ヤードで約15パーセント、100ヤードで約33パーセント、200ヤードで約62パーセントと報告されている。","ribeiro2015":"17名が100メートルを全力で泳いだときの内訳は、有酸素43.4パーセント、乳酸系33.1パーセント、非乳酸系23.5パーセントだった。","hellard2018":"エリート男子49名（ジュニア26名、シニア23名）。100メートル自由形の内訳は有酸素51パーセント、非乳酸系18パーセント、乳酸系31パーセント。乳酸系のエネルギーはジュニア38キロジュール、シニア62キロジュールで、年齢とともに無酸素の能力が重要になると結論している。","massini2021":"若い競泳選手の男女各13名。体重あたりのエネルギーコストに男女差はなく、割合の違いは50メートルで女子の乳酸系がやや高い程度だった。","gastin1999":"全力の60秒運動では、有酸素と無酸素の貢献がほぼ等しいとしている。","speedres2015":"競技経験のある泳者21名。50メートルと400メートルの速度差（スピードリザーブ）が大きいほど無酸素の容量が大きく、持久的な速度は低かった。8週間の有酸素トレーニングで差は縮んだ。","malina2015":"成熟度の測り方として、骨年齢、第二次性徴、身長が最も伸びる時期の年齢、初経の年齢を挙げ、体を傷つけない方法として、予測される大人の身長に対する割合と、身長が最も伸びる時期からのずれの計算を紹介している。後の二つは選手での検証がまだ必要としている。","lloyd2014":"適切な指導があれば子どもの筋力トレーニングは安全で、成長軟骨を傷めるという心配は証拠で支持されていない。同じ暦年齢でも生物学的には最大4年から5年の開きがある。頻度は連続しない日に週2回から3回。始めは1から2セット、1RMの60パーセント以下で技術を最優先し、次に2から4セット、6から12回、80パーセント以下へ進む。上級では85パーセントを超える重さを時期を区切って使える。","hogan2022":"10歳から15歳の女子663名の100メートル自由形。成熟度だけでタイムのばらつきの51パーセントが説明でき、12歳では早熟の選手が晩熟の選手の32倍、上位4分の1に入りやすかった。有利さは13歳ごろまでだった。","fone2022":"27研究の系統的レビュー。どの方法が最良かの合意はなく、主な方法の伸びは2から2.5パーセント程度。50メートルは最大筋力、水中の抵抗泳、体幹、プライオメトリクスで、100メートルと200メートルは主に水中の抵抗泳で、400メートルは最大筋力、プライオメトリクス、筋力と持久力の併用で伸びた研究がある。","wirth2022":"最大筋力を高める高い負荷を勧め、筋持久力のトレーニングは勧められないとする総説。筋力と速さの関係がはっきりしているのは400メートルより短い種目。今の練習量にウエイトをただ足すと全体の負荷が増え、オーバートレーニングの危険が高まるので、水中の量を減らすべきとしている。","nscaguide":"プログラムを作る前の評価（ニーズ分析）として、競技でけがが起きやすい部位と起き方を調べることと、選手一人ひとりのトレーニング歴とけがの履歴、関節の可動域、動きの観察、けがからの回復の状況を確かめることを挙げている。","riebe2015":"運動を始める前の健康チェックを、今の運動の習慣、兆候や症状と既往の病気の有無、行いたい運動の強さ、の三つで判断する方式に改めた。運動に関連する心臓の事故は、前ぶれの兆候や症状をともなうことが多いと述べている。","hardwick2006":"健康な20名。ウォールスライド、壁でのプッシュアップ・プラス、肩甲骨面での腕の挙上を比べた。腕を90度上げた位置での前鋸筋の活動に3種目の差はなく、ウォールスライドは90度以上で前鋸筋を働かせるのに有効な種目だと結論している。","sljump2026":"男子競泳選手14名。垂直跳び、スクワットジャンプ、立ち幅跳びとスタートの関係を調べた。スタートの飛距離は5メートルと10メートルの通過タイムと有意に関連したが、跳躍の指標は、キックスタートの踏み切りの速度とは有意に対応しなかった。跳ぶ方向の違いが重要だとしている。","giant1999":"1994年世界選手権の男子33名、女子34名の車輪101本を分析。車輪の前半は体から鉄棒へ、後半は鉄棒から体へエネルギーが移り、全体のエネルギーを増やすには筋による仕事が必要だった。","williams2015":"男子の初心者12名が鉄棒の車輪を8週間学ぶ過程を調べた。肩で大きなパワーを出せるかどうかが、上達を左右する要因だった。","fujihara2012":"あん馬の両足旋回を、吊り下げの補助具あり、なしで比べた。補助具は重心の軌道と力の大きさを変えるが、全体のパターンは変えなかった。","ironcross2004":"男子体操選手6名。つり輪と練習用の補助具で十字懸垂を行ったときの肩まわり9筋の筋電図を比べた。補助具では多くの筋の活動が下がり、肩の使い方がつり輪とは変わった。","farana2017":"チェコ代表レベルの女子体操選手7名。ロンダートの手の着き方2種類を比べ、けがの危険は主に、平行に着く型の2番目に着く手の側にあると結論している。","irwin2009":"男子エリート体操選手4名。旧来の跳馬と現行の跳馬テーブルで比べ、助走と踏切には差がなかったが、着手の角度が違い、テーブルでは上向きの離手速度が高かった。","hiley2015":"男子エリート選手1名の跳馬をもとにしたコンピュータモデルの研究。着手のときの速度と角運動量が大きいほど、その後の空中での回転量が増えた。","mills2009":"体操選手の筋力をもとにしたモデルで跳馬の着地を再現した。床からの力を最小にする着地では、骨や関節、筋にかかる体の中の負荷の多くがかえって増えた。","bradshaw2020":"女子体操選手7名。90センチの台から後方宙返りで着地したときの床からの力と、背中のセンサーの減速度を比べた。両者は置き換えられないと報告している。","navarro2021":"体操選手4名の後方抱え込み宙返り60本。高く、または速く回るよう指示すると、選手は股関節を伸ばすより膝を曲げる方向で調整する傾向があった。","tumbling2007":"女子体操選手13名。後方伸身と前方伸身の宙返りの踏切を筋電図で比べ、後方の踏切は接地時間が長く、ふくらはぎと太もも裏の活動が前方より大きかった。","yeadon1993":"エリートのトランポリン選手1名のひねり宙返り4種目。踏切のときの技術より、空中での技術のほうが、ひねりへの寄与が大きかった。","yeadon2003":"男子体操選手4名の倒立。全員が手首の力で前後の揺れを直す方法を使っていた。","mcclure2007":"症状のない成人54名。内旋が硬い側を4週間毎日伸ばしたところ、クロスボディストレッチの群は内旋の可動域が約20度増え、何もしない群より有意に大きかった。","chepeha2018":"内旋が硬い大学のバレーボール、水泳、テニスの選手37名。スリーパーストレッチを8週間毎日行った群は、肩の内旋と水平内転の可動域、肩の機能が有意に改善した。クロスボディではなく、同じ肩の後ろ側を伸ばす別のストレッチの研究。","takeuchi2021":"健常者12名。20秒3回のジャックナイフストレッチで膝を伸ばす可動域が増えた。筋と腱の硬さが下がったのは、強く行ったときだけだった。","davis2005":"ハムストリングスが硬い19名。30秒1回を週3日、4週間。3種類のストレッチのうち、何もしない群より有意に伸びたのは静的ストレッチだけだった。座って前屈する形そのものの研究ではない。","splitvib2011":"平均13.8歳の女子体操選手22名。前後開脚と前方ランジの姿勢で10秒4セットのストレッチを行うと柔軟性が向上した。振動を加える上乗せ効果は、利き脚でない側だけで有意だった。","fjerstad2018":"股関節の内転筋が硬い活動的な成人40名。60秒の静的ストレッチでの可動域の増加は約1度とわずかで、何もしない条件との差はなかった。筋力の低下もなかった。この3種目そのものではなく、内転筋のストレッチ一般の研究。","konrad2021":"8研究、165名のメタ分析。股関節の前側の筋の1回のストレッチは、120秒までならパフォーマンスに影響しないか良い影響の可能性があり、270秒から480秒ではごく小さな低下がみられた。","radford2006":"無作為化試験5本のメタ分析。ふくらはぎの静的ストレッチで、足首を反らす可動域が、伸ばした時間に応じて約2度から3度、有意に増えた。","schoenfeld2014":"19名が4種類のプランクを30秒ずつ行った。肘を前に出すロングレバーのプランクは、通常のプランクより腹直筋と外腹斜筋の活動が高かった。","imai2010":"健常な男性9名。フロントプランク、バードドッグ、サイドブリッジなどの体幹の筋活動を測り、不安定な面ではおおむね筋活動が高まった。","ji2021":"韓国の思春期のエリート競泳選手30名。12週間の体幹トレーニングで、無酸素パワーやプランクの持久力は従来のウエイトより伸びたが、泳ぎの記録の改善には差がなかった。","escamilla2006":"健常な男女21名。30度の傾斜でのリバースクランチは、腹直筋と内腹斜筋の活動が最も高い種目の群に入った。","schoffstall2010":"21名がクランチ、仰向けのVアップなどを行った。腹直筋と外腹斜筋の活動に種目の差はなく、器具なしの種目も器具ありと同じ程度に腹筋を働かせた。","ng1994":"健常な成人18名。うつ伏せで体を反らせる姿勢を基準に、2種類の背筋の保持運動を比べ、脊柱起立筋と多裂筋は基準の66から79パーセントで同じように働いていた。","ni2014":"ヨガの経験者30名。ダウンドッグとプランクは、外腹斜筋の強化に有効な姿勢とされた。","kinoshita2022":"倒立ができる健常な男性13名（体操選手ではない）。倒立に向けた4段階の姿勢で、肩まわりの筋活動は段階的に増えた。","kerwin2001":"6名の倒立。うまく保てたときは手首と肩の力で前後のバランスをとり、うまくいかないときほど股関節の力の影響が大きかった。","wyatt2021":"全国レベルの女子体操選手10名（平均10歳）。倒立を10秒を超えて保てる選手と、4秒から6秒の選手では、バランスのとり方が違っていた。","mcdonald2025":"倒立についての21研究の系統的レビュー。選手はふつう手首でバランスをとり、足りないときに肩、股関節、肘を使う。筋力が高いほど制御が良いと報告されている。","mizutori2021":"男子体操選手59名の伸腕プレス倒立。技能の低い群は肩の力が大きく、技能の高い群は動作の後半に股関節の力が大きかった。","niespodzinski2026":"男子体操選手41名（10歳から12歳の25名と成人16名）の平行棒でのプレス倒立。できる少年とできない少年の差は前鋸筋の活動にあり、肩甲骨の制御が成否に関わると示唆された。","angioi2026":"倒立で6歩歩ける選手10名。肩に痛みのある選手は歩く速さが遅く、腕がより曲がっていた。","marcolin2015":"健常な若い人8名が5種類の腕立て伏せを行った。上腕三頭筋と大胸筋の活動は、手幅の狭い腕立て伏せで最も高かった。ダイヤモンドの形そのものは扱っていない。","wurm2010":"足を台に乗せた腕立て伏せは、通常、膝つき、手を台に乗せた形のどれよりも、床からの力が大きかった。","koch2012":"活動的な健常男性22名。手をたたく腕立て伏せは、台から落ちる腕立て伏せより、力の立ち上がりが速かった。床からの力の最大値は同じ程度だった。","mckenzie2022":"トレーニング経験のある男性13名。バーのディップスはベンチのディップスより多くの筋で活動が高く、リングのディップスは大胸筋、広背筋、上腕二頭筋がバーより高かった。","wang2023":"実際に測ったのではなく、力学モデルで80通りの体型を計算した研究。同じ身長なら、脚が長く体幹が短い体型ほどプランシェのバランスに有利とされた。筋力は考えに入っていない。","youdas2010":"懸垂ができる男女25名。逆手のチンアップは大胸筋と上腕二頭筋、順手のプルアップは僧帽筋下部の活動が高く、広背筋には有意な差がなかった。","dickie2017":"筋力トレーニング経験のある男性19名。順手、逆手、手のひらを向かい合わせる握り、ロープの4種類の懸垂で、筋活動は全体にほぼ同じだった。上げるときは下ろすときより活動が高かった。","sanchezmoreno2017":"男性52名の加重懸垂。挙上の速さと、最大重量に対する割合には強い関係があり、速さの落ち方から残りの回数を見積もれた。","snarr2013":"男女15名。広背筋、僧帽筋中部、三角筋後部の活動は、通常のインバーテッドロウと吊り下げ器具を使った場合で差がなかった。","walker2023":"活動的な男性10名。リングのマッスルアップは、バーに比べて、引く局面で僧帽筋上部と上腕二頭筋、押す局面で上腕三頭筋の活動が高かった。","reinold2004":"健常者10名に7種類の外旋の運動を行わせた。棘下筋と小円筋の活動は、横向きに寝て行う外旋が最も高かった。","batalha2015":"若い男子競泳選手40名の無作為化試験。16週間のゴムバンドによる肩の強化を加えた群は、水中練習だけの群に比べ、外旋の筋力と、内旋と外旋のバランスが改善した。","hibberd2012":"大学競泳選手44名の無作為化試験。チューブでのY、T、Wや、90度に開いた位置での内旋と外旋などを週3回6週間行っても、筋力と肩甲骨の動きに、何もしない群との有意な差は出なかった。","dellatommasina2023":"男子競泳選手22名の無作為化試験。8週間のゴムバンドによる斜め方向の肩の強化は、外旋の筋力をわずかに改善したが、有意ではなかった。","distefano2009":"活動的な健常成人21名が12種目を行った。中臀筋の活動は、横向きに寝て脚を上げる運動が最も高く、クラム、ランジ、ホップより有意に高かった。","cambridge2012":"健常な男性9名のモンスターウォーク。バンドを膝から足首、足へと下げるほど中臀筋の活動が増えた。","haroy2019":"ノルウェーの男子サッカー選手652名の無作為化試験。コペンハーゲン・アダクションを行った群は、鼠径部の問題を訴える危険が41パーセント低かった。","ishoi2016":"19歳以下の男子サッカー選手24名の無作為化試験。8週間のコペンハーゲン・アダクションで、股関節の内転の筋力が約36パーセント増えた。","wristtrain2004":"男子高校野球選手43名の無作為化試験。全身の筋力トレーニングに手首と前腕の種目を12週間加えた群は、手首と前腕の筋力がより大きく伸びた。","maeo2023":"成人21名が12週間、ケーブルで肘を伸ばす運動を行った。腕を頭上に上げた姿勢のほうが、体の横の姿勢より、上腕三頭筋の体積の増加が約1.4倍から1.5倍大きかった。","sato2022":"トレーニング経験のない若い成人。週2回5週間、下ろす動きだけの肘を曲げる筋のトレーニングは、半分の量で、上げ下ろし両方の場合と同じ程度に筋力と筋の厚さを増やした。","kojima2021":"在宅のリハビリを受けている27名の無作為化試験（競技者ではない）。3か月、足の指でタオルをたぐる運動を加えた群は、片脚で立てる時間が有意に伸びた。","gullett2009":"トレーニング経験のある健常者15名。バックスクワットはフロントスクワットより膝を圧縮する力が有意に大きく、全体の筋活動は同じ程度だった。","west2011":"英国代表の男子短距離競泳選手11名。スクワットの筋力、垂直跳びの高さ、パワーが高いほど、15メートルまでのスタートのタイムが有意に速かった。","takai2013":"平均13.7歳の男子94名。自分の体重でのスクワットを1日100回、8週間行うと、体脂肪率が下がり、太もも前の筋の厚さ、膝を伸ばす筋力、垂直跳びが向上した。","collins2021":"男性16名と女性16名。体重の30パーセントの負荷で、ゴブレットスクワットはランドマインスクワットより大腿四頭筋の活動が大きかった。","helme2022":"トレーニング経験のある男性26名。後ろ足を台に乗せたスプリットスクワットでは、前足が縦方向の力の約84パーセントを担っていた。","park2016":"ランジに慣れた4名。リバースランジは大臀筋と大腿四頭筋の活動が高く、膝にかかるずれの力は比較的小さかった。","vandyk2019":"15研究、選手8459名のメタ分析。ノルディックハムストリングを含む予防プログラムは、ハムストリングの肉離れの危険を約半分に減らした。","tsaklis2015":"エリートの女子陸上選手20名。ハムストリングの10種目を比べ、ノルディックと、足を滑らせるレッグカールは強度が高い種目、ブリッジは中程度の種目に分類された。","martinfuentes2020":"筋電図の研究の系統的レビュー。デッドリフトでは脊柱起立筋と大腿四頭筋の活動が、大臀筋や大腿二頭筋より大きいと報告された。","saeterbakken2011":"筋力トレーニング経験のある若い男性12名。ダンベルで持ち上げられる最大重量はバーベルより約17パーセント低かったが、大胸筋と三角筋前部の筋活動に差はなかった。","garrido2010":"平均12歳の全国レベルの競泳選手28名。ベンチプレスなどの筋力とメディシンボール投げは、25メートルと50メートル自由形のタイムと中程度の有意な関連があった。垂直跳びとは関連がなかった。","saeterbakken2013":"健常な男性15名。立って行うダンベルのショルダープレスは三角筋の活動が最も高く、持ち上げられる最大重量は最も低かった。","perezolea2018":"平均19歳の男子競泳選手12名。50メートル自由形のタイムは、懸垂の回数ではなく、懸垂の動作の速さや速さの落ち方と強く関連した。加重ではなく自重の懸垂の研究。","comfort2011":"エリートのラグビー選手16名。最大重量の60パーセントで比べ、ハングパワークリーンのパワーは床から行うパワークリーンより高かった。太ももの中央から行う形が、パワーも力も最も大きかった。","kinoshita2023":"トレーニング経験のない成人14名。立って行うカーフレイズと座って行うカーフレイズを12週間比べ、腓腹筋の肥大は立って行うほうが明らかに大きく、ヒラメ筋は同じ程度だった。","alfredson1998":"慢性のアキレス腱症がある15名（平均44歳）。下ろす動きを重くしたふくらはぎのトレーニングを12週間行い、痛みが有意に減って全員がランニングに戻った。けがの治療としての研究。","khuu2016":"健常な女性16名。片脚スクワットは、浮かせた脚を前、中間、後ろのどこに置くかで、体幹、骨盤、股関節、膝の動きと負荷が変わった。","degot2021":"健常な男性の競技者27名。座って片手で3キロのボールを押し出すテストは、3回の平均を使うと信頼性が良好だった。測定法の研究。","ellestad2024":"大学生年代の健常者。片手に重りを持って歩くスーツケースキャリーは、同じ重さを持って立つだけの場合より背中の筋活動が高く、重りを持つ側では腹直筋と外腹斜筋の活動も高まった。","potdevin2011":"思春期の競泳選手23名（平均14歳）。水泳の練習に週2回6週間のプライオメトリクス（遠くへ跳ぶ、横に跳ぶ、高い台から落ちて跳ぶ）を加えた群だけが、ジャンプの高さと、50メートルと400メートル自由形の速さを有意に伸ばした。","bishop2009":"思春期の競泳選手22名の無作為化試験。8週間、週2回のプライオメトリクスを加えた群は、スタートから5.5メートルまでの時間と飛び出しの速さが大きく改善した。個々のジャンプの種目名は要旨にない。","rebutini2016":"競泳選手10名。立ち幅跳びの形のプライオメトリクスを9週間行い、スタートの水平方向の力が7パーセント、台を離れる速さが16パーセント、入水のときの水平方向の速さが22パーセント向上した。","sammoud2019":"思春期前の男子競泳選手26名（約10歳）。8週間、週2回のジャンプの練習を水泳の練習の一部と入れ替えた群は、立ち幅跳びと15メートル、25メートル自由形が改善し、けがの報告はなかった。","markovic2007":"健康な人を対象にした26研究のメタ分析。プライオメトリクスで、スクワットジャンプの高さが4.7パーセント、反動をつけた垂直跳びが8.7パーセント、ドロップジャンプが4.7パーセント向上した。","bobbert1987":"成人男性10名。20センチの台からのドロップジャンプを2つのやり方で行い、すばやく弾むやり方は、膝と足首にかかる力とパワーが高かった。やり方によって負荷が変わる。","kubo2007":"10名が片脚ずつ12週間、足首を中心にしたホッピングとドロップジャンプ、または重りを使った筋力トレーニングを行った。プライオメトリクスの側は関節のばねの硬さが高まり、3種類のジャンプの高さがすべて向上した。","cappa2011":"若い男性の競技者13名。4台のハードルを連続して跳ぶと、接地時間や地面からの力は、反動をつけた垂直跳びとは大きく違い、短い接地時間はスプリントなどの動きに近かった。","mero1994":"男子短距離選手7名。全力のバウンディング、片脚ホッピング、全力疾走などを比べ、片脚ホッピングは疾走やバウンディングより地面に加える力が大きかった。","morin2011":"活動的な男性12名。加速のあいだに力を水平方向へ向ける技術が、100メートル走の成績と有意に関連し、力の総量は関連しなかった。","meylan2009":"体育専攻の男女の学生80名。片脚での縦、前、横へのジャンプは、それぞれ別の能力を表していた。スプリントや方向転換を予測する力は低かった。","noyes1991":"前十字靱帯を損傷した患者67名に4種類の片脚ホップのテストを行い、左右差の異常を見つけるのに使えるかを調べた。けがの評価としての研究。","garciamasso2011":"活動的な健康な男性27名。3種類の跳ねる腕立て伏せを比べ、やり方によって力の出方と筋活動、衝撃の大きさが違った。","stockbrugger2001":"ビーチバレーの選手20名。後ろ向きに頭の上へ投げるメディシンボール投げの距離は、垂直跳びのパワーと強く関連し、測り直しても結果が安定していた。","myer2006":"女子高校生の競技者19名。週3回7週間、プライオメトリクスまたはバランスと安定化のトレーニングを行い、両方の群で、片脚で跳んで止まる課題での体の揺れ、ハムストリングスの筋力、垂直跳びが改善した。","hewett2005":"女子選手205名を追跡した研究。のちに前十字靱帯を損傷した9名は、ジャンプの着地で膝が内側に入る角度が8度大きく、地面からの力が20パーセント高かった。着地の形が大事である根拠。","krajewski2020":"健康なエリートの男子ラグビー選手14名。片脚で180度回って同じ脚で着地すると、利き脚でない側の膝は、着地で外に開く動きが大きかった。片脚での研究。","plisky2006":"高校のバスケットボール選手235名。前へ足を伸ばす距離の左右差が4センチを超える選手は、脚のけがが2.5倍多かった。","gribble2012":"1980年から2010年の研究をまとめた総説。このテストは信頼性と妥当性があり、脚のけがの危険や、トレーニングによる変化をとらえるのに使えると結論している。","plisky2009":"男子大学サッカー選手15名。Yバランステストは、同じ人が測っても別の人が測っても、結果がよく一致した。","springer2007":"18歳以上の健康な成人549名。目を開けた片脚立ちと目を閉じた片脚立ちの時間の基準値を作った。どちらも年齢とともに短くなり、性別による差はなかった。","crossley2011":"症状のない若い成人34名。片脚スクワットがうまくできる人は、中臀筋が早く働き始め、股関節を外に開く筋力が大きかった。","hebertlosier2017":"20歳から81歳の一般の成人566名。片脚のかかと上げを疲れるまで行うテストは、測り直しても結果が安定し、回数の中央値は男性24回、女性21回だった。","santo2017":"健康な高校生の競技者200名。かかととつま先をつけて歩くテストで、基準の14秒以内に合格したのは24.5パーセントだった。脳しんとうの評価としての研究で、トレーニングの効果を調べたものではない。","fitzgerald2000":"前十字靱帯を損傷した活動的な患者26名の無作為化試験。不安定な面で不意に揺らすトレーニングを加えた群は、リハビリがうまくいかなくなる人が少なかった。けがのリハビリとしての研究。","foster2001":"運動の時間（分）に、その練習全体のきつさを掛けて、練習の負荷を表す方法を示した。きつさは、運動が終わって30分後に聞いている。自転車運動とバスケットボールの練習で、心拍数から求めた負荷と一貫した関係があった。ただし、きつさから求めた値のほうが大きかった。","haddad2017":"この方法を調べた36の研究をまとめた総説。0（安静）から10（最大）の尺度を使い、負荷は「きつさ×練習の時間（分）」で表す。複数の競技、男女、年齢層、競技レベルで、妥当性と良好な信頼性が確かめられたと結論している。きつさの感じ方は、気温、音楽、カフェイン、一緒にいる人など、多くの要因で変わるとも述べている。","wallace2009":"よく鍛えられた競泳選手12名（男女各6名）の、20回の練習を調べた。きつさから求めた負荷は、心拍数から求めた負荷と、選手ごとに0.55から0.94の相関があった。コーチの見立ては、楽な練習では選手より低く、きつい練習では選手より高かった。","srperes2004":"成人20名（男女各10名）。レジスタンストレーニングでも、強度が上がるほど練習全体のきつさは上がり、強度を表す方法として使えそうだと結論している。一方、練習全体のきつさは、各セットの直後に聞いたきつさの平均より低く出ることがあるとしている。","robineau2016":"アマチュアのラグビー選手58名を、対照、筋力だけ、筋力と持久の間を0時間、6時間、24時間あける3つの群に分け、7週間行った。筋力は常に持久より先に行っている。ベンチプレスとハーフスクワットの最大筋力の伸びは、0時間の群が、6時間、24時間、筋力だけの群より小さかった。最大酸素摂取量の伸びは24時間の群がいちばん大きかった。著者は、相反する内容の練習の間は少なくとも6時間あけるよう勧めている。","murlasits2018":"同じ日に筋力と持久の練習を行う順番を比べた研究をまとめた。下半身の最大挙上重量は、筋力を先に行ったほうが平均3.96キログラム大きく伸びた。最大酸素摂取量は順番で差がなかった。","gao2023":"19の無作為化試験のメタ分析。筋力を先に行う順番のほうが下肢の筋力の伸びが大きかった（効果量0.19）。差は膝の伸展と屈曲の筋力で見られ、下肢のパワーでは差がなかった。練習の間隔は調べていない。","juul2017":"関節の緩さ（全身性関節過可動性）を分ける方法の系統的レビュー。ベイトンスコアは9項目、0から9点。大人の区切りは、過去の緩さの情報も含めて9点中5点を勧めている。子どもは合意がなく、5点、6点、7点が提案されていて、上の区切りは少なくとも6点としている。妥当性の研究がまだ足りないと結論している。","bennell1998":"健康な13名。壁に向かってランジをして、かかとを床につけたまま膝が壁につく、いちばん遠い位置で、親指の先から壁までの距離と、すねの角度を測った。測る人の中での再現性は0.97から0.98、測る人どうしの一致は距離で0.99だった。","chisholm2012":"足首にけがや不調のある患者53名。壁に向かうランジの距離を、患側だけと、左右差の両方で評価した。再現性は0.93から0.99。測り直しで変わりうる幅（最小検出変化）は、患側で1.0センチ、左右差で1.5センチだった。最初の評価には左右差を勧めている。","hirshkowitz2015":"全米睡眠財団の18名の専門家委員会が、文献をもとに年代ごとの睡眠時間の範囲を決めた。10代は8時間から10時間、若い成人と成人は7時間から9時間。必要な睡眠は人によって違い、範囲の外でも適切な人はいるが、大きく外れるのはまれだとしている。","milewski2014":"12歳から18歳の学生アスリート112名。睡眠と練習のアンケートと、21か月分のけがの記録を結びつけた。1晩の睡眠が8時間未満の選手は、8時間以上の選手より1.7倍けがをしやすかった。学年が上がるごとにけがの危険は1.4倍になった。","saw2016":"アスリートの主観の指標（気分、ストレス感など）と客観の指標（体力、生理、血液）を同時に測った56の研究の系統的レビュー。主観と客観の指標は一般に相関しなかった。主観の指標のほうが、練習量の急な増減と長期の負荷を、より敏感に一貫して反映した。","mountjoy2023":"国際オリンピック委員会の2023年の合意声明。エネルギー不足（使うエネルギーに対して食べる量が足りない状態）は、男女を問わず健康と競技力に影響する。糖質の不足と心の健康との関係、男子への影響の研究が増えたとしている。見つけ方と重さの段階づけの道具（REDs CAT2）と、体組成の安全な測り方の指針を示している。","mann2016":"大学アメリカンフットボールの選手101名。試験の週などの学業の負担が大きい週は、ふつうの週より、けがで練習が制限される確率が1.78倍だった。試合に出ている選手に限ると、学業の負担が大きい週とプレシーズンの差はなくなった。","gabbett2016":"急な負荷の増え方を見るために、直近1週間の負荷を、その前の約4週間の平均で割った比を提案した。比が0.8から1.3の範囲でけがが少なく、1.5以上で多い（クリケットの投手では次の7日間のけがが2倍から4倍）と述べている。競技によって負荷とけがの関係は違うので、慎重に当てはめるよう注意している。","impellizzeri2020a":"急性と慢性の負荷の比について、週の区切り方が恣意的であること、練習の負荷と体にかかる力学的な負荷は同じではないことなど、考え方の問題点を挙げている。","impellizzeri2020b":"慢性の負荷で割ることの意味がはっきりしないとして、この比とその土台の理論を使うのをやめるべきだと主張している。","lesuer1997":"トレーニング経験のない大学生67名（男40、女27）。ベンチプレス、スクワット、デッドリフトで7つの推定式を比べた。どの式も実測の最大挙上重量と相関は高かった（0.95以上）が、デッドリフトではすべての式が実際より低く見積もった。スクワットではエプリーの式の誤差がいちばん小さかった（約3パーセント）。","wilk2021":"動作の速さ（テンポ）と筋力、筋肥大の関係を調べた総説。筋肥大には、下ろす局面をゆっくり、上げる局面を速くする組み合わせが有利な可能性があるとしている。筋力に最も効くひとつのテンポは特定できていない。1セットの筋緊張時間は、筋力でおおむね2秒から20秒、筋肥大で20秒から70秒を提案しているが、最適な値を確定した資料はないと述べている。よく鍛えられた選手や、重い多関節種目、少ない回数の研究は少ない。","scj2022tempo":"24研究の系統的レビュー。最大筋力は、下ろす局面が中くらいの速さで上げる局面が速い組み合わせ（2から4秒、0、1、0）で伸びが最も大きかった。パワーは、上げる局面が爆発的であれば、1回の合計が未経験者で4秒未満、経験者で8秒未満が合っていた。筋肥大は1回の合計が8秒未満で、局面ごとの最適な時間は不明としている。","mcleod2010":"競泳のための筋力トレーニングの書籍。出版社のページによると、74種目のやり方と解剖の図、スタート、ターン、4泳法との関係、プログラムの組み方を扱う。章は、泳ぐ体、腕、肩、胸、腹、背中、脚、全身トレーニング。","sayers1999":"大学生108人（男59、女49）の壁タッチ式の跳躍高と体重から、フォースプレートで測ったピークパワーを推定する式を作った。反動なし（SJ）の式は、ピークパワー（W）＝60.7×跳躍高（cm）＋45.3×体重（kg）−2055（決定係数0.88、誤差の目安373W）。反動あり（CMJ）の式はSJより当てはまりが悪いと本文にある。","tessier2013":"ホッケー審判67人と一流選手20人で検証し、跳躍高と体重からの推定は個人のパワーの変化を追うには誤差が大きい（最小の検出可能な差が約700〜800W）と結論。推定値は「跳ぶ力の目安」として扱うべきとしている。","duncan2013":"12〜16歳91人では、大人向けの式（Sayers のSJとCMJなど）は実測と有意にずれた。子ども向けには体重と年齢と性別を含む別の式が必要と報告。"},"REF_WARN":{"barrett2016":"第1著者と第2著者の綴りは資料によって表記が揺れており、最終確認ができていません。","lee2020":"韓国の国内誌の論文です。","laudner2015":"共著者4名の氏名は確認できなかったため省略しています。","lee2018":"巻、号、ページは確認できなかったため省略しています。","andersen2014":"内容は解説記事で確認したもので、原文の要旨は読めていません。","calatayud2015":"内容は解説記事で確認したもので、原文の要旨は読めていません。","suprak2011":"内容は解説記事で確認したもので、原文の要旨は読めていません。","axler1997":"ハンギングレッグレイズが調べた種目に含まれることは、解説記事で確認したもので、原文では確認できていません。","liu2023":"病院の患者（女子）を対象にした基準で、この基準の出典は論文内に示されていません。男子の骨年齢の基準は確認できていません。","banaszak2022":"病院の患者を対象にした学会発表です。","diurnal1997":"題名、著者名、発行年は確認元のページに表示がなく、確認できていません。","capelli1998":"割合の数字は原文ではなく、Massiniら2021年の論文での引用で確認しました。","ribeiro2015":"共著者名と巻、ページは確認できなかったため省略しています。","gastin1999":"著者名は確認元のページに表示がなく、省略しています。","speedres2015":"著者名は確認元のページに表示がなく、省略しています。","wirth2022":"本文は途中までしか読めていません。","lloyd2014":"第4著者以降は省略しています。","nscaguide":"NSCAの公式サイトに載っている抜粋で確認しました。版、編者、発行年は確認できていません。","riebe2015":"医師の許可が必要になる細かい条件は、要旨には書かれておらず、確認できていません。","sljump2026":"著者名は確認元のデータベースのページに表示がなく、省略しています。内容もそのページの要約で確認したもので、原文は読めていません。","giant1999":"著者名は確認元のデータベースに表示がなく、省略しています。","fujihara2012":"対象者の人数は要旨に記載がありません。","ironcross2004":"著者名は確認元のデータベースに表示がなく okes":["Fr","Ba","Fly","Br"],"muscles":"胸椎の伸展・胸郭","why":"胸の真下にフォームローラーを置き、腰を反らさずに胸郭だけを反らす。肩の屈曲（腕を頭上へ上げる動き）の土台をつくる。","swim":"ストリームラインと入水〜前方伸展で腕を頭上へ運ぶ動き。","merit":["肩屈曲の制限が胸椎の硬さから来ている選手に効果的","ペアで補助すると伸展を深められる"],"demerit":["腰を反らせてしまうと腰に負担がかかり、胸郭のストレッチにならない","腰痛がある選手は注意"],"cue":"足をベンチに乗せ、股関節と膝を90°に。呼吸を止めない。","refs":["asp","lee2020","heneghan2019","barrett2016"],"lv":"related"},{"id":"m_prone_cross","name":"うつ伏せ片脚クロス（胸郭のストレッチ）","cat":"mobility","type":"mobility","asp":true,"check":["tho"],"strokes":["Fr","Ba"],"muscles":"胸郭・腹斜筋・股関節屈筋","why":"うつ伏せで両腕を横に広げ、片脚を反対側の脚を越えて床につける。","swim":"自由形・背泳ぎのローリング。","merit":["胸郭と股関節前面を同時に伸ばせる","器具不要"],"demerit":["腰を反らせると腰椎が代わりに動いてしまう","腰痛がある選手は範囲を小さく"],"cue":"腕は床から浮かさない。力を抜いてリラックス。","refs":["asp"],"lv":"none"},{"id":"m_lat_str","name":"広背筋ストレッチ（ポールを使う）","cat":"mobility","type":"mobility","asp":true,"check":["flex"],"strokes":["Fr","Ba","Fly","Br"],"muscles":"広背筋","why":"広背筋は上腕骨と骨盤をつなぐ大きな筋肉で、硬いと肩の屈曲が制限される。講演では上腕骨と骨盤のつながりを意識して伸ばす原則が示された。","swim":"ストリームライン、入水〜前方伸展、キャッチ〜プル。","merit":["肩屈曲180°に届かない選手の多くに当てはまる","ポール1本でできる"],"demerit":["腰を反らすと広背筋が伸びずに腰で代償する","伸ばしている側の肩がすくみやすい"],"cue":"体を真横ではなくやや前に倒す。わきの下から体側が伸びる感覚。","refs":["asp","laudner2013","herrington2014","tavares2022"],"lv":"related"},{"id":"m_scorpion","name":"スコーピオン大胸筋ストレッチ","cat":"mobility","type":"mobility","asp":true,"check":["pec","tho"],"strokes":["Fr","Ba","Fly"],"muscles":"大胸筋・胸郭","why":"うつ伏せで片腕を横に広げ、反対の脚を後ろから反対側へ回して胸の前を伸ばす。","swim":"入水後の前方伸展、プル、リカバリーでの肩の外転・外旋。","merit":["大胸筋テスト45°に届かない選手に直接対応","胸郭の回旋も同時に入る"],"demerit":["勢いをつけると肩の前方に負担がかかる","腰で回らないように範囲を調整"],"cue":"反動を使わず、伸びる位置で呼吸しながら保持。","refs":["asp","laudner2015","borstad2006","muraki2009","umehara2021","wolfram2023","tavares2022"],"lv":"related"},{"id":"m_subscap","name":"肩甲下筋ストレッチ（膝を使う）","cat":"mobility","type":"mobility","asp":true,"check":["er"],"strokes":["Fr","Ba","Fly","Br"],"muscles":"肩甲下筋","why":"片膝を立てて座り、肘を膝の内側に入れて反対の手で前腕を外側へ押す。外旋テストが15°未満の選手向け。","swim":"入水〜前方伸展とリカバリーで使う肩の外旋。","merit":["外旋可動域の制限に直接アプローチできる","肩の前側の詰まり感を減らす"],"demerit":["強く押しすぎると肩の前方が不安定になるおそれ","痛みが出る場合は中止する"],"cue":"背すじを丸めすぎない。心地よい伸び感で20–30秒。","refs":["asp","muraki2007","tavares2022"],"lv":"related"},{"id":"m_stick_er","name":"スティック外旋ストレッチ","cat":"mobility","type":"mobility","asp":true,"check":["er"],"strokes":["Fr","Ba","Fly","Br"],"muscles":"肩甲下筋・肩の内旋筋群","why":"仰向けで肘を体側で90°に曲げ、棒を使って前腕を外側へ倒す。ペアで行うパートナー外旋ストレッチの一人版。","swim":"肩の外旋可動域の確保。","merit":["一人でも負荷を細かく調整できる","左右差を確認しやすい"],"demerit":["押しすぎは肩前方への負担","肩の前方不安定感がある選手は専門家に相談"],"cue":"肘が体から離れないように。痛みのない範囲で。","refs":["asp","riemann2011"],"lv":"direct"},{"id":"s_prone_er","name":"プローン外旋リフトオフ","cat":"shoulder","type":"activation","asp":true,"check":["er"],"strokes":["Fr","Ba","Fly","Br"],"muscles":"棘下筋・小円筋・僧帽筋下部","why":"うつ伏せで肘を曲げ、外旋した位置で前腕を床から浮かせて保持する。可動域の端で外旋筋を使う「ストレッチ＋強化」の代表種目。","swim":"水泳選手は内旋筋が強く外旋筋が相対的に弱くなりやすい。外旋筋は肩の安定に重要。","merit":["外旋の可動域と筋力を同時に高められる","器具がいらない","講演の2時間版ルーティンにも含まれる"],"demerit":["負荷は小さいので筋力の大きな向上は期待しにくい","腰を反らせて代償しやすい"],"cue":"肩をすくめずに浮かせ、2–3秒保持。","refs":["asp","cools2015","wanivenhaus2012"],"lv":"direct"},{"id":"s_band_er","name":"セラバンド外旋","cat":"shoulder","type":"activation","asp":true,"check":["er"],"strokes":["Fr","Ba","Fly","Br"],"muscles":"棘下筋・小円筋","why":"肘を体側につけてバンドを外側へ引く。ローテーターカフの基本種目。","swim":"肩の内旋・外旋の筋力バランス。","merit":["負荷調整が簡単でプールサイドでもできる","ウォームアップに組み込みやすい"],"demerit":["体側での外旋は泳ぎの腕の位置（頭上）と異なるため、慣れたら腕を90°上げた位置へ進める","若年選手の研究では、陸上の補強を行っても内旋と外旋の筋力比がほとんど変わらなかった報告もあり、継続と十分な負荷が必要"],"cue":"肘と体の間にタオルを挟むと代償が減る。","refs":["asp","batalha2015","cools2015"],"lv":"direct"},{"id":"s_sl_er","name":"サイドライイング外旋","cat":"shoulder","type":"activation","asp":true,"check":["er"],"strokes":["Fr","Ba","Fly","Br"],"muscles":"棘下筋・小円筋","why":"横向きに寝て上側の腕でダンベルを持ち上げる外旋。講演では徒手抵抗版が紹介された。","swim":"外旋筋力の強化。","merit":["外旋種目の中で棘下筋・小円筋の筋活動が高い種目として報告されている","徒手抵抗なら相手の力に合わせられる"],"demerit":["重すぎると三角筋や体幹のひねりで代償する","1–3kg程度の軽い重量で丁寧に"],"cue":"肘の下に丸めたタオルを置き、ゆっくり下ろす。","refs":["asp","reinold2004"],"lv":"direct"},{"id":"s_bent_y","name":"ベントオーバーY","cat":"shoulder","type":"activation","asp":true,"check":["flex"],"strokes":["Fr","Ba","Fly","Br"],"muscles":"僧帽筋下部・前鋸筋","why":"前傾姿勢で腕をY字に斜め前へ上げる。僧帽筋下部は肩甲骨を下げながら上方回旋させ、腕を頭上へ上げる動きを支える。","swim":"ストリームラインと入水時の肩甲骨の位置。","merit":["講演で「水泳選手に多い不足」として挙げられた僧帽筋下部を直接ねらえる","バンドでも自重でもできる"],"demerit":["肩をすくめると僧帽筋上部の種目になってしまう","反動を使うと効果が薄れる"],"cue":"肩甲骨を下げる意識。肘を軽く伸ばして斜め前へ。10–15回×2–3セット。","refs":["asp","cools2015","kibler2012"],"lv":"direct"},{"id":"s_prone_w","name":"プローンW","cat":"shoulder","type":"activation","asp":true,"check":["pec","er"],"strokes":["Fr","Ba","Fly","Br"],"muscles":"僧帽筋中部・下部・外旋筋群","why":"うつ伏せで腕をW字にして肩甲骨を寄せて下げ、外旋位で持ち上げる。","swim":"丸まりやすい肩の姿勢を整え、大胸筋の硬さに対抗する。","merit":["肩甲骨の内転・下制と外旋を同時に使える","器具不要"],"demerit":["腰を反らせて持ち上げる代償が出やすい"],"cue":"額を床につけたまま、肘と手を同時に浮かせる。","refs":["asp","cools2015"],"lv":"direct"},{"id":"s_pushup_plus","name":"プッシュアッププラス＋交互ダウンドッグ","cat":"shoulder","type":"activation","asp":true,"check":["flex"],"strokes":["Fr","Ba","Fly","Br"],"muscles":"前鋸筋・体幹","why":"腕立ての最後にさらに床を押して肩甲骨を前に出す（プラス）。前鋸筋は肩甲骨の上方回旋を支え、肩甲骨の動きの乱れは肩の障害と関連する。","swim":"入水〜前方伸展でのリーチ。","merit":["前鋸筋を安全にねらえる","ダウンドッグと組み合わせて肩屈曲の可動域も使える"],"demerit":["肘や手首に痛みがある選手は膝つきで","腰が落ちると体幹の代償"],"cue":"首・背中・お尻を一直線に。","refs":["asp","kibler2012"],"lv":"direct"},{"id":"p_cmj","name":"カウンタームーブメントジャンプ（CMJ）","cat":"plyo","type":"plyo","check":[],"strokes":["start","Br"],"muscles":"下肢全体（伸張反射と爆発力）","why":"しゃがみ込みからすばやく真上に跳ぶ。下肢の爆発的な力発揮の基本で、測定指標にも使える。","swim":"スタートの飛び出し、ターンの壁蹴り。","merit":["下肢のパワーはスタートのタイムと関連することが報告されている","跳躍高を記録すれば疲労やトレーニング効果の確認に使える"],"demerit":["着地の衝撃があり、下肢の疲労が水中練習に影響しうる（講演の指摘）","跳ぶ回数を増やしすぎない"],"cue":"腕の振りを使って全力で跳ぶ。1回ずつ質を重視。","refs":["west2011","bishop2009","thng2019","asp"],"lv":"direct"},{"id":"p_box","name":"ボックスジャンプ","cat":"plyo","type":"plyo","check":[],"strokes":["start","Br"],"muscles":"主働筋：大腿四頭筋・大臀筋・中臀筋・腓腹筋・ヒラメ筋 ／ 補助筋：ハムストリングス・腹斜筋・腹横筋・脊柱起立筋","why":"箱の上に跳び乗る。着地が高い位置になるため衝撃が小さい。","swim":"スタート台からの飛び出しやターン壁の蹴り出しの爆発的なスピードと筋力を養う。通常の垂直跳びと比較して、(1)ボックスの高さが明確な目標になる、(2)ボックス上に着地するため下肢への着地ストレスを軽減できるという2つの利点がある。また、ジャンプ開始時に腕を爆発的に振ることで跳躍高を上げる使い方を学べ、スタートの飛距離と初速向上に直結する（SWIMMING ANATOMY）。","merit":["着地の衝撃が小さく、プライオメトリクスの入門に向く","3関節（股・膝・足首）をすばやく伸ばす練習になる"],"demerit":["箱の高さを競うと、跳ぶ練習ではなく脚をたたむ練習になる","降りるときは跳び降りず歩いて降りる","下肢への過度なストレスを避けるため、ボックスから飛び降りず、ゆっくりコントロールしてステップダウンして降りること（SAFETY TIP）"],"cue":"股関節・膝・足首をすばやく伸ばしきる。","refs":["bishop2009","thng2019","mcleod2010"],"lv":"direct"},{"id":"p_depth","name":"デプスジャンプ","cat":"plyo","type":"plyo","check":[],"strokes":["start"],"muscles":"下肢全体（反応筋力）","why":"台から落ちて着地した瞬間にすぐ跳ぶ。接地時間を短くして反応筋力を高める。","swim":"スタート・ターンでの力の立ち上がり。","merit":["短い時間で大きな力を出す能力を高める"],"demerit":["強度が高く、筋力の土台がある選手向け","回数は少なく（1セット3–5回、合計でも少なめ）","下肢に痛みがある選手は行わない"],"cue":"着地したらすぐ跳ぶ。台は30cm前後から。","refs":["nsca2016","thng2019"],"lv":"direct"},{"id":"p_broad","name":"立ち幅跳び（ブロードジャンプ）","cat":"plyo","type":"plyo","check":[],"strokes":["start"],"muscles":"下肢全体・臀筋","why":"前方へ遠くへ跳ぶ。スタートの飛び出しと同じ前方向の力発揮。","swim":"スタートの飛び出し方向（水平方向）。","merit":["水平方向の力発揮を練習できる","距離を記録すれば評価にも使える"],"demerit":["着地の衝撃が大きい","連続で跳ぶと質が落ちる"],"cue":"腕を大きく振り、1回ずつしっかり着地。","refs":["thng2019"],"lv":"direct"},{"id":"p_jsq","name":"ジャンプスクワット（軽負荷）","cat":"plyo","type":"plyo","check":[],"strokes":["start","Br"],"muscles":"下肢全体","why":"軽い負荷を持って最大スピードで跳ぶ。","swim":"スタート。国際レベルの短距離選手で、ジャンプスクワットのパワーとスタートのタイムの関連が報告されている。","merit":["負荷を少し加えてパワーを高められる","VBTで速度を測りやすい"],"demerit":["着地衝撃が大きい","重くしすぎると速度が落ちてパワー種目でなくなる"],"rx":{"power":{"sets":"3–4","reps":"3–5回","load":"バーのみ〜1RMの30%","rest":"2–3分"}},"cue":"最大スピードで跳ぶ。速度が落ちたらセット終了。","refs":["west2011","nsca2016"],"lv":"direct"},{"id":"o_clean","name":"パワークリーン（ハングを含む）","cat":"olympic","type":"olympic","check":[],"strokes":["start","Br","Fly"],"muscles":"全身（臀筋・ハムストリングス・大腿四頭筋・僧帽筋）","why":"床または膝上からバーを一気に引き上げて肩で受ける。股関節・膝・足首を同時に伸ばす動きで、力の立ち上がりの速さを高める。","swim":"スタートと壁蹴りでの3関節の同時伸展。","merit":["全身の爆発的な力発揮を高められる","ウエイトリフティング系の種目は力の立ち上がりやパワーの向上に有効とされる"],"demerit":["技術の習得に時間がかかる","肩で受ける姿勢（フロントラック）には手首・肘・肩の柔軟性が必要","疲労すると技術が崩れやすいので回数は少なく"],"cue":"1セットずつ集中。股関節・膝・足首を同時に伸ばす。","refs":["suchomel2015","asp"],"lv":"direct"},{"id":"o_pull","name":"クリーン none"},{"id":"sa_diag_lift","name":"ダイアゴナル・ケーブル・カラム・リフト（斜めケーブルリフト）","cat":"mb","type":"loaded","check":["tho","flex"],"strokes":["Ba","Fr","start"],"muscles":"主働筋：大腿四頭筋・大臀筋・中臀筋・脊柱起立筋・外腹斜筋・内腹斜筋・三角筋・上腕三頭筋 ／ 補助筋：ハムストリングス・前鋸筋・僧帽筋・大円筋・小円筋・棘上筋・菱形筋","why":"ハーフスクワット姿勢からケーブル（またはメディシンボール）を対角線上に引き上げ、脚の伸展と体幹の回旋・腕のリーチを連動させる全身種目（Variation: Diagonal Medicine Ball Lift）。","swim":"【なぜ行うのか】頭上へ手を伸ばす動作により、特に背泳ぎのストローク開始時の自信と筋力を養う。斜めの引き上げと体幹回旋を組み合わせることで、体幹を強化しつつ上半身と下半身の連動性（リンケージ）を高める。脚のスクワット要素がスタート・ターンの蹴り出しを強化し、特に背泳ぎの壁からのスタートで腕と脚の動きを連動させる感覚を陸上で養える。","merit":["背泳ぎのストローク開始（入水〜キャッチ）とスタートの全身連動を同時に鍛えられる","メディシンボール版（肩越しに高く投げ上げる）にすることで爆発的なパワー要素を追加できる","下半身から体幹、上肢への力の伝達（キネティックチェーン）が身につく"],"demerit":["膝がつま先より前に出ると膝関節を痛めるリスクがある","若年選手にいきなり負荷をかけるとフォームが崩れるため、最初は負荷（重り）なしで導入し、その後軽いメディシンボールへ移行すること"],"cue":"視線で手の軌道を追いながら体幹の回旋を取り入れる。膝がつま先より前に出ないように注意。","refs":["mcleod2010"],"lv":"related"},{"id":"sa_band_start","name":"バンド・レジステッド・スタート（チューブ抵抗付きスタート）","cat":"plyo","type":"plyo","check":[],"strokes":["start","Fr","Fly","Br"],"muscles":"主働筋：大腿四頭筋・大臀筋・中臀筋・脊柱起立筋 ／ 補助筋：ハムストリングス・大内転筋・長内転筋・短内転筋・恥骨筋・薄筋・外腹斜筋・内腹斜筋・腹横筋","why":"スタートの構え（フラットスタート姿勢）から、肩にかけたチューブ（バンド）の抵抗に逆らって爆発的に前方へ飛び出し、ストリームライン姿勢へ移行する。","swim":"【なぜ行うのか】スタート台から爆発的に飛び出すための筋肉をピンポイントで強化するため。開始姿勢の時点でバンドにわずかな張力（テンション）をかけておくことで、飛び出しの全可動域にわたって負荷と強化効果を持続できる。実際のスタートと同様にストリームライン姿勢への移行を意識することで実戦的なフォームを作れる。","merit":["スタートの飛び出し方向に特化した水平方向の爆発的パワーを強化できる","飛び出しからストリームライン姿勢への素早い移行を陸上で反復できる"],"demerit":["動作が複雑で難易度が高いため、若年層の選手は実施しないこと（書籍のSAFETY TIP）","前に倒れる際に手をついて受け身をとると上肢（手首・肘・肩）の怪我の原因になるため、動作の最後は片足を前に出して体を安定させること","腰を守るため、開始時に体幹の安定筋群を固め、動作中も維持すること"],"cue":"開始位置でバンドに少しテンションをかけた状態からスタート。最後は手を床につかず、片足を前に踏み出して止まる。","refs":["mcleod2010","thng2019"],"lv":"direct"},{"id":"sa_block_jump","name":"ブロックジャンプ・スタート・イントゥ・ストリームライン","cat":"plyo","type":"plyo","check":["flex"],"strokes":["start","Fr","Ba","Fly","Br"],"muscles":"大腿四頭筋・大臀筋・下腿三頭筋・広背筋・体幹筋群","why":"スタート台（または陸上のボックス）から飛び出し、空中で素早くストリームライン姿勢を作る（Variation: Dryland Block Jump Start Into Streamlined Position）。","swim":"【なぜ行うのか】スタートの爆発的な蹴り出しと、抵抗を減らすストリームライン姿勢への移行スピードを高めるため。ドライランド（陸上）版は、ウエイトルームでのサーキットやリフティングプログラムの中にスタート動作を組み込むために行う。","merit":["ウェイトトレーニング直後にスタートの神経系連動を組み込める","空中でのストリームライン構築の意識づけになる"],"demerit":["プールで行う場合、安全のため水深150cm（5フィート）以上の場所でのみ実施すること","浅いプールでは底への衝突衝撃を吸収するため着水時に膝を軽く曲げてストリームラインを解くこと","陸上版では下肢関節への過度なストレスを防ぐため、着地時に膝を軽く曲げて衝撃を吸収すること"],"cue":"飛び出しと同時に素早く耳の後ろで腕を挟み、ストリームラインを作る。着地は膝を柔らかく使う。","refs":["mcleod2010"],"lv":"related"},{"id":"sa_triceps_push","name":"スタンディング・ダブルアーム・トライセプス・プッシュダウン","cat":"push","type":"loaded","check":[],"strokes":["Fr","Fly","Ba","Br"],"muscles":"主働筋：上腕三頭筋 ／ 補助筋：広背筋・腹直筋（姿勢保持）","why":"ケーブルマシンの前に立ち、肘を体側に固定したまま両手でバー（またはロープ）を押し下げる。","swim":"【なぜ行うのか】全泳法の水中ストローク終盤（プッシュ〜フィニッシュ局面）において、水を最後まで力強く押し切る上腕三頭筋の筋力を高め、1ストロークあたりの推進距離を伸ばすため。","merit":["ストローク後半の押し切り（フィニッシュ）をピンポイントで強化できる","肩関節への負担が少なく安全に上肢のプッシュ力を鍛えられる"],"demerit":["重量が重すぎると上体が前傾し、背や体重で押す代償動作になりやすい","肘が体側から離れると上腕三頭筋への負荷が逃げる"],"cue":"肘を体側にピタッと固定し、前腕だけを動かして最後まで押し切る。","refs":["mcleod2010"],"lv":"related"},{"id":"sa_hip_add_rot","name":"スタンディング・ヒップ・アダクション＆ローテーション（股関節内転・内外旋）","cat":"lower","type":"activation","check":[],"strokes":["Br","start"],"muscles":"主働筋：内転筋群（大内転筋・長内転筋・短内転筋・恥骨筋・薄筋）・中臀筋・股関節の回旋筋群","why":"立位で足首または膝にチューブ（またはケーブル）をつけ、股関節の内転（挟み込み）および内旋・外旋を行う。","swim":"【なぜ行うのか】平泳ぎ特有のウィップキック（足首を返して水を強く挟み込む動作）の推進力を直接高めるとともに、股関節周囲の筋群を強化して平泳ぎ選手に多い膝関節の障害（ブレストストローカーズ・ニー）を予防するため。","merit":["通常のスクワット等では鍛えにくい平泳ぎ特有の「挟み込み・股関節回旋」を直接強化できる","膝への捻れストレスを減らし、股関節主導のキックを習得できる"],"demerit":["骨盤や上体が傾くと体幹の代償になり、股関節に効かなくなる","鼠径部や膝に痛みがある場合は負荷を落とすこと"],"cue":"骨盤を正面に固定し、体幹を真っ直ぐ保ったまま股関節から動かす。","refs":["mcleod2010"],"lv":"related"},{"id":"sa_physio_bridge","name":"フィジオボール・ブリッジ（バランスボール・ヒップブリッジ）","cat":"core","type":"core","check":[],"strokes":["Ba","Fr","Fly"],"muscles":"主働筋：大臀筋・ハムストリングス・脊柱起立筋 ／ 補助筋：腹横筋・内腹斜筋・外腹斜筋","why":"仰向けでバランスボールの上に踵・ふくらはぎを乗せ、お尻を持ち上げて肩から足首までを一直線に保つ（Variation: Single-Leg Physioball Bridge）。","swim":"【なぜ行うのか】背泳ぎのスイム姿勢において骨盤が沈むのを防ぎ、不安定な水中でも高いボディポジションを維持しながら強いキックを打ち続けるための背面・体幹安定性を養うため。","merit":["不安定なボール上で行うことで、水中の姿勢保持に近い体幹深層筋と大臀筋・ハムスト const $ = s=>document.querySelector(s);
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function num(v){ return (v===''||v==null||isNaN(Number(v))) ? null : Number(v); }
function pad(n){ return String(n).padStart(2,'0'); }
function today(){ const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dayOf(iso){ const d = new Date(iso); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function jdate(k){ const d = new Date(k+'T12:00:00'); return (d.getMonth()+1)+'月'+d.getDate()+'日（'+'日月火水木金土'[d.getDay()]+'）'; }
function md(k){ const p = k.split('-'); return Number(p[1])+'/'+Number(p[2]); }
function addDays(k, n){ const d = new Date(k+'T12:00:00'); d.setDate(d.getDate()+n); return dayOf(d); }
function weekStart(k){ const d = new Date(k+'T12:00:00'); d.setDate(d.getDate()-((d.getDay()+6)%7)); return dayOf(d); }
function kg(v){ return Number(v).toLocaleString('ja-JP'); }
function r1(v){ return Math.round(v*10)/10; }
function say(msg){ const t = $('#toast'); t.textContent = ''; setTimeout(()=>{ t.textContent = msg; t.classList.add('show'); },30); clearTimeout(say.h); say.h = setTimeout(()=>t.classList.remove('show'),3500); }
/* 推定1RM：Epley の式。10回を超える記録は推定に使わない（前の版からの決まり） */
function e1rm(w, r){ w = Number(w); r = Number(r); if(!(w>0) || !(r>0)) return null; if(r===1) return w; if(r>10) return null; return Math.round(w*(1+r/30)*2)/2; }
const BW_RE = /懸垂|プルアップ|チンアップ|プッシュアップ|腕立て|ディップス|逆上がり|倒立|マッスルアップ|ロープ|雲梯/;
function bwEx(e){ return !!e && BW_RE.test(e.name) && !/ラット|プルダウン|ケーブル|マシン/.test(e.name); }
function shortName(e){ return e ? e.name.split('（')[0].split('(')[0] : ''; }
function evLevel(e){ return e.lv || 'none'; }
function refKind(k){ return REF_KIND[k] || '論文'; }
function starHTML(e){ const l = evLevel(e); return '<span class="stars" role="img" aria-label="根拠の星'+LV_N[l]+'つ">'+LV_STAR[l]+'</span>'; }

const KEY = 'swimiqNote_v1', OLDKEY = 'swimWtMock_v2';
let db = {me:'', role:'athlete', syncUrl:'', days:{}, favs:[], tests:[], bw:[], sync:{sent:{}}, inbox:[], ready:false};
try{ const s = localStorage.getItem(KEY); if(s) db = Object.assign(db, JSON.parse(s)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
function oldDb(){ try{ const s = localStorage.getItem(OLDKEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function day(k){ db.days[k] = db.days[k] || {pre:null, rows:[], src:'', finished:null}; return db.days[k]; }
function lastBW(before){ const L = (db.bw||[]).filter(x=>!before || x.date<=before).sort((a,b)=>a.date<b.date?1:-1); return L.length ? L[0] : null; }
function setBW(date, w){ db.bw = db.bw||[]; const i = db.bw.findIndex(x=>x.date===date); if(i>=0) db.bw[i].w = w; else db.bw.push({date, w}); db.bw.sort((a,b)=>a.date<b.date?-1:1); }
function daysSorted(){ return Object.keys(db.days).sort(); }
function finishedDays(){ return daysSorted().filter(k=>db.days[k].finished); }

/* 行の中身：重さ、回数、セット。setList があればそれが本当の記録 */
function rowSets(r){ if(r.setList && r.setList.length) return r.setList; const n = Math.max(1, Number(r.sets)||1); const out = []; for(let i=0;i<n;i++) out.push({w:Number(r.kg)||0, r:Number(r.reps)||0}); return out; }
function rowLoad(r, k){ const e = EXMAP[r.exId]; if(!bwEx(e)) return 0; const b = lastBW(k); return b ? Number(b.w) : 0; }
function rowVol(r, k){ const add = rowLoad(r, k); return r1(rowSets(r).reduce((t,s)=>t+(Number(s.w)+add)*Number(s.r),0)); }
function rowBest(r, k){ const add = rowLoad(r, k); let best = null; rowSets(r).forEach(s=>{ const v = e1rm(Number(s.w)+add, s.r); if(v!=null && (best==null || v>best)) best = v; }); return best; }
function rowTxt(r){ const e = EXMAP[r.exId]; const bw = bwEx(e);
  const w = r.free && r.free.kg && !r.touched ? '重さは自分で' : (Number(r.kg)>0 ? kg(r.kg)+' kg' : (bw ? '体重のみ' : '自重'));
  const rp = r.free && r.free.reps && !r.touched ? '回数は自分で' : (r.reps||0)+' 回';
  const st = r.free && r.free.sets && !r.touched ? 'セットは自分で' : (r.sets||0)+' セット';
  if(r.setList && r.setList.length) return r.setList.map(s=>(Number(s.w)>0?kg(s.w)+'kg×':'')+s.r).join('、')+'（'+r.setList.length+'セット）';
  return (bw && Number(r.kg)>0 ? '体重＋' : '')+w+' × '+rp+' × '+st; }
function newRow(exId, o){ return Object.assign({rid:'r'+Date.now()+Math.random().toString(36).slice(2,6), exId, kg:0, reps:5, sets:3, rest:'', free:null, setList:null, status:'', touched:false, note:''}, o||{}); }

/* これまでの記録から、その種目の自己ベスト（推定1RM）と前回の内容 */
function histRows(exId, beforeDay){ const out = []; finishedDays().forEach(k=>{ if(beforeDay && k>=beforeDay) return; db.days[k].rows.forEach(r=>{ if(r.exId===exId && r.status==='done') out.push({k, r}); }); }); return out; }
function bestOf(exId, beforeDay){ let b = null; histRows(exId, beforeDay).forEach(x=>{ const v = rowBest(x.r, x.k); if(v!=null && (b==null || v>b.v)) b = {v, k:x.k}; }); return b; }
function lastOf(exId, beforeDay){ const h = histRows(exId, beforeDay); return h.length ? h[h.length-1] : null; }

function back(){ if(stack.length>1){ stack.pop(); render(true); } }
function render(focus){
  if(!db.ready){ stack = [{name:'start'}]; }
  const cur = stack[stack.length-1]; const v = VIEWS[cur.name](cur);
  $('#title').textContent = v.title; document.title = v.title+' ｜ SWIMIQ-STRENGTH';
  $('#view').innerHTML = v.html; $('#back').hidden = stack.length<2;
  $('#tabs').hidden = !db.ready;
  const root = stack[0].name;
  document.querySelectorAll('#tabs button').forEach(b=>{ const on = b.dataset.tab===root; b.classList.toggle('on',on); if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  if(v.after) v.after();
  if(focus){ window.scrollTo(0,0); $('#title').focus(); }
}

  /* 2 メニュー */
  const rows = d.rows; const doneN = rows.filter(r=>r.status==='done').length, skipN = rows.filter(r=>r.status==='skip').length;
  const srcTxt = {coach:'コーチから届いたメニュー', self:'自分で作ったメニュー', prev:'前回のメニューを写したもの'}[d.src] || '';
  const inbox = inboxFor(k);
  let menu = '';
  if(rows.length){ menu = (srcTxt?'<p class="sub" style="margin-top:0">'+esc(srcTxt)+(d.note?'　コーチのメモ：'+esc(d.note):'')+'</p>':'')+'<ul class="rows">'+rows.map(r=>{ const e = EXMAP[r.exId]; const b = bestOf(r.exId, k); const cur = r.status==='done' ? rowBest(r, k) : null; const pb = cur!=null && b && cur>b.v;
      return '<li class="row '+r.status+'"><button type="button" class="rmain" data-edit="'+r.rid+'" aria-label="'+esc(shortName(e))+'、'+esc(rowTxt(r))+'、押すと重さや回数を直す"><strong>'+esc(shortName(e))+(pb?' <span class="tag ok">自己ベスト</span>':'')+'</strong><span class="d">'+esc(rowTxt(r))+(r.rest?'　休憩 '+esc(r.rest):'')+'</span></button>'+
        '<button type="button" class="st '+r.status+'" data-st="'+r.rid+'" aria-label="'+esc(shortName(e))+'は'+(r.status==='done'?'できた。押すと、できなかったに変える':r.status==='skip'?'できなかった、またはやらなかった。押すと、まだに戻す':'まだ。押すと、できたにする')+'">'+(r.status==='done'?'✓ できた':r.status==='skip'?'✕ なし':'まだ')+'</button></li>'; }).join('')+'</ul>'+
      (d.finished ? '' : '<div class="stack two" style="margin-top:12px"><button type="button" class="ghost" data-go="ex" data-pick="1">種目を足す</button>'+(inbox.length?'<button type="button" class="ghost" id="menuGet">コーチのメニューを入れ直す</button>':'<button type="button" class="ghost" id="menuFetch">コーチのメニューを確かめる</button>')+'</div>'); }
  else { menu = '<p class="sub" style="margin-top:0">'+(inbox.length ? 'コーチからメニューが届いています。' : 'まだメニューがありません。コーチから届いていれば受け取れます。自分で作ることもできます。')+'</p>'+
      '<div class="stack">'+(inbox.length ? '<button type="button" class="cta" id="menuGet">コーチのメニューを開く（'+inbox[0].rows.length+'種目）</button>' : '<button type="button" class="'+(d.pre?'cta':'ghost')+'" id="menuFetch">コーチのメニューを受け取る</button>')+
      '<button type="button" class="ghost" data-go="ex" data-pick="1">自分で種目を選んで作る</button>'+(prevMenuDay(k)?'<button type="button" class="ghost" id="menuPrev">前回（'+md(prevMenuDay(k))+'）のメニューを写す</button>':'')+'</div>'; }
  /* 3 終える */
  let fin;
  if(d.finished){ const vol = r1(rows.filter(r=>r.status==='done').reduce((t,r)=>t+rowVol(r,k),0)); const pbs = rows.filter(r=>{ if(r.status!=='done') return false; const b = bestOf(r.exId, k); const c = rowBest(r,k); return c!=null && b && c>b.v; });
    fin = '<ul class="tiles"><li><span class="big">'+kg(vol)+'<small>kg</small></span><span class="sub">動かした重さの合計</span></li><li><span class="big">'+doneN+'<small>/'+rows.length+'</small></span><span class="sub">できた種目</span></li></ul>'+
      (pbs.length?'<div class="note good">自己ベスト更新：'+pbs.map(r=>esc(shortName(EXMAP[r.exId]))).join('、')+'</div>':'')+
      '<p id="syncLine" class="sub">'+esc(syncStatusTxt())+'</p>'+
      '<div class="stack two"><button type="button" class="ghost" id="syncBtn">コーチに今すぐ送る</button><button type="button" class="ghost" id="unfinish">終えるを取り消す（直す）</button></div>'; }
  else { fin = '<p class="sub" style="margin-top:0">'+(rows.length ? (doneN+skipN<rows.length ? 'まだ「まだ」の種目が'+(rows.length-doneN-skipN)+'つあります。全部に「できた」か「なし」を付けると、ここが押せます。' : '押すと、今日の内容を保存してコーチに送ります。') : '先にメニューを入れてください。')+'</p>'+
      '<button type="button" class="cta" id="finish" '+(rows.length && doneN+skipN===rows.length ? '' : 'disabled aria-disabled="true"')+'>今日の練習を終える</button>'; }
  const page = (n, title, body, extra)=>'<section class="page '+(step===n?'now':step>n?'done':'')+'" aria-labelledby="pg'+n+'"><h2 id="pg'+n+'" tabindex="-1"><span class="step" aria-hidden="true">'+n+'</span>'+title+(step===n?'<span class="here">いまここ</span>':'')+'</h2>'+body+'</section>';
  return {title: isToday ? '今日のノート' : jdate(k)+'のノート', html:
    '<div class="pagehead"><span class="date">'+jdate(k)+'</span><span class="sub">'+esc(db.me)+'</span></div>'+
    '<div class="stack two" style="margin:6px 0 0"><button type="button" class="ghost sm" id="dayPrev">前の日</button>'+(isToday?'':'<button type="button" class="ghost sm" id="dayToday">今日に戻る</button>')+'</div>'+
    page(1,'練習前', pre)+page(2,'今日のメニュー'+(rows.length?'　'+doneN+'/'+rows.length:''), menu)+page(3, d.finished?'終えました':'練習を終える', fin),
    after(){
      document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{ const i = $('#'+b.dataset.step); const v = (num(i.value)==null ? (b.dataset.step==='preBw' ? (bw?Number(bw.w):60) : 7) : Number(i.value)) + Number(b.dataset.d); i.value = r1(v); }));
      document.querySelectorAll('[data-fat]').forEach(b=>b.addEventListener('click',()=>{ document.querySelectorAll('[data-fat]').forEach(x=>x.setAttribute('aria-pressed', x===b ? String(x.getAttribute('aria-pressed')!=='true') : 'false')); }));
      const pf = $('#preF'); if(pf) pf.addEventListener('submit',ev=>{ ev.preventDefault(); const bwv = num($('#preBw').value), sl = num($('#preSl').value); const fb = document.querySelector('[data-fat][aria-pressed=true]'); const fat = fb ? Number(fb.dataset.fat) : null;
        if(bwv!=null) setBW(k, bwv); d.pre = {bw:bwv, sleep:sl, fat, skipped:false}; save(); say('練習前の記録を入れました'); render(false); $('#pg2').focus(); });
      const ps = $('#preSkip'); if(ps) ps.addEventListener('click',()=>{ d.pre = {bw:null, sleep:null, fat:null, skipped:true}; save(); render(false); $('#pg2').focus(); });
      const pe = $('#preEdit'); if(pe) pe.addEventListener('click',()=>{ d.pre = null; save(); render(false); $('#preBw').focus(); });
      document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openRow(k, b.dataset.edit)));
      document.querySelectorAll('[data-st]').forEach(b=>b.addEventListener('click',()=>{ const r = d.rows.find(x=>x.rid===b.dataset.st); if(d.finished){ say('終えるを取り消すと直せます'); return; } r.status = r.status==='' ? 'done' : r.status==='done' ? 'skip' : ''; if(r.status==='done') r.touched = true; save(); render(false); const again = document.querySelector('[data-st="'+r.rid+'"]'); if(again) again.focus(); say(shortName(EXMAP[r.exId])+'：'+(r.status==='done'?'できた':r.status==='skip'?'なし':'まだ')); }));
      const mf = $('#menuFetch'); if(mf) mf.addEventListener('click',()=>fetchMenu(true));
      const mg = $('#menuGet'); if(mg) mg.addEventListener('click',()=>{ applyInbox(k, inbox[0]); });
      const mp = $('#menuPrev'); if(mp) mp.addEventListener('click',()=>{ const pk = prevMenuDay(k); d.rows = db.days[pk].rows.map(r=>newRow(r.exId, {kg:r.kg, reps:r.reps, sets:r.sets, rest:r.rest})); d.src = 'prev'; save(); say(d.rows.length+'種目を写しました'); render(false); $('#pg2').focus(); });
      const fb = $('#finish'); if(fb) fb.addEventListener('click',()=>{ if(fb.disabled) return; d.finished = new Date().toISOString(); save(); say('今日の練習を記録しました'); render(false); $('#pg3').focus(); syncNow(false); });
      const uf = $('#unfinish'); if(uf) uf.addEventListener('click',()=>{ d.finished = null; save(); say('終えるを取り消しました。直したら、もう一度終えてください'); render(false); $('#pg2').focus(); });
      const sb = $('#syncBtn'); if(sb) sb.addEventListener('click',()=>syncNow(true));
      $('#dayPrev').addEventListener('click',()=>{ editDay = addDays(k,-1); render(true); });
      const dt = $('#dayToday'); if(dt) dt.addEventListener('click',()=>{ editDay = null; render(true); });
    }
  };
};
function prevMenuDay(k){ const L = daysSorted().filter(x=>x<k && db.days[x].rows.length); return L.length ? L[L.length-1] : null; }

/* ---- 行を直すシート ---- */
let sh = null;
function openRow(k, rid){ const d = day(k); const r = d.rows.find(x=>x.rid===rid); if(!r) return; if(d.finished){ say('終えるを取り消すと直せます'); return; }
  sh = {k, rid, orig:JSON.stringify(r), last:document.activeElement}; drawSheet(); $('#sheet').hidden = false; document.body.classList.add('lock'); $('#shT').focus(); }
function drawSheet(){ const d = day(sh.k); const r = d.rows.find(x=>x.rid===sh.rid); const e = EXMAP[r.exId]; const bw = bwEx(e); const add = rowLoad(r, sh.k);
  const last = lastOf(r.exId, sh.k); const best = bestOf(r.exId, sh.k); const per = r.setList && r.setList.length;
  const stp = (id, label, val, step, unit, min)=>'<label class="f" for="'+id+'">'+label+'</label><div class="stepper"><button type="button" data-sstep="'+id+'" data-d="'+(-step)+'" aria-label="'+label+'を減らす">−</button><input type="number" id="'+id+'" step="'+step+'" min="'+min+'" inputmode="decimal" value="'+val+'"><button type="button" data-sstep="'+id+'" data-d="'+step+'" aria-label="'+label+'を増やす">＋</button></div>'+(unit?'<span class="unit">'+unit+'</span>':'');
  $('#sheet').innerHTML = '<div class="sheetin"><h2 id="shT" tabindex="-1">'+esc(shortName(e))+'</h2>'+
    '<p class="sub" style="margin-top:0">'+(last?'前回（'+md(last.k)+'）：'+esc(rowTxt(last.r)):'この種目は初めてです')+(best?'　自己ベストの推定1RM '+kg(best.v)+' kg':'')+'</p>'+
    (r.free && !r.touched ? '<div class="note warn">コーチは「自分で決める」としています。やった数字を入れてください。</div>' : '')+
    (per ? '' : stp('shKg', bw ? '加える重さ（体重'+(add?' '+add+' kg':'')+'に足す分）' : '重さ', r.kg||0, 2.5, bw && !add ? '体重が未記入なので、体重の分は合計に入りません' : 'kg', 0)+stp('shReps','回数', r.reps||0, 1, '回', 0)+stp('shSets','セット数', r.sets||1, 1, 'セット', 1))+
    (per ? '<p class="f">セットごと</p>'+r.setList.map((s,i)=>'<div class="stepper" style="grid-template-columns:1fr 1fr" aria-label="'+(i+1)+'セット目"><label class="sr" for="sw'+i+'">'+(i+1)+'セット目の重さ</label><input type="number" id="sw'+i+'" data-sw="'+i+'" step="2.5" min="0" inputmode="decimal" value="'+s.w+'" aria-label="'+(i+1)+'セット目の重さ kg"><input type="number" id="sr'+i+'" data-sr="'+i+'" step="1" min="0" inputmode="numeric" value="'+s.r+'" aria-label="'+(i+1)+'セット目の回数"></div>').join('')+'<div class="stack two" style="margin-top:8px"><button type="button" class="ghost sm" id="shAddSet">セットを足す</button><button type="button" class="ghost sm" id="shDelSet">セットを減らす</button></div><button type="button" class="link" id="shSame">全部同じに戻す</button>'
      : '<button type="button" class="link" id="shPer">セットごとに重さや回数を変える</button>')+
    '<p class="f">結果</p><div class="chips" role="group" aria-label="結果"><button type="button" class="chip" data-shst="done" aria-pressed="'+(r.status==='done')+'">✓ できた</button><button type="button" class="chip" data-shst="skip" aria-pressed="'+(r.status==='skip')+'">✕ できなかった・やらなかった</button><button type="button" class="chip" data-shst="" aria-pressed="'+(r.status==='')+'">まだ</button></div>'+
    '<label class="f">メモ<input type="text" class="txt" id="shNote" value="'+esc(r.note)+'" placeholder="例：右肩が気になった"></label>'+
    '<div class="stack two" style="margin-top:16px"><button type="button" class="cta" id="shOk">閉じる</button><button type="button" class="ghost" id="shUndo">開いたときに戻す</button></div>'+
    '<button type="button" class="link" id="shRemove" style="margin-top:8px">この種目を今日のメニューから外す</button></div>';
  const upd = ()=>{ if(!per){ r.kg = num($('#shKg').value)||0; r.reps = num($('#shReps').value)||0; r.sets = Math.max(1, num($('#shSets').value)||1); } else { r.setList.forEach((s,i)=>{ s.w = num($('#sw'+i).value)||0; s.r = num($('#sr'+i).value)||0; }); } r.note = $('#shNote').value; r.touched = true; save(); };
  $('#sheet').querySelectorAll('input').forEach(i=>i.addEventListener('input', upd));
  $('#sheet').querySelectorAll('[data-sstep]').forEach(b=>b.addEventListener('click',()=>{ const i = $('#'+b.dataset.sstep); const v = (num(i.value)||0)+Number(b.dataset.d); i.value = Math.max(Number(i.min)||0, r1(v)); upd(); }));
  $('#sheet').querySelectorAll('[data-shst]').forEach(b=>b.addEventListener('click',()=>{ r.status = b.dataset.shst; r.touched = true; save(); drawSheet(); $('[data-shst="'+r.status+'"]').focus(); }));
  const pb = $('#shPer'); if(pb) pb.addEventListener('click',()=>{ r.setList = rowSets(r).map(s=>({w:s.w, r:s.r})); r.touched = true; save(); drawSheet(); $('#sw0').focus(); });
  const sm = $('#shSame'); if(sm) sm.addEventListener('click',()=>{ const s0 = r.setList[0]; r.kg = s0.w; r.reps = s0.r; r.sets = r.setList.length; r.setList = null; save(); drawSheet(); $('#shKg').focus(); });
  const as = $('#shAddSet'); if(as) as.addEventListener('click',()=>{ const l = r.setList[r.setList.length-1]; r.setList.push({w:l.w, r:l.r}); save(); drawSheet(); $('#sw'+(r.setList.length-1)).focus(); });
  const ds = $('#shDelSet'); if(ds) ds.addEventListener('click',()=>{ if(r.setList.length>1) r.setList.pop(); save(); drawSheet(); $('#shDelSet').focus(); });
  $('#shOk').addEventListener('click', closeSheet);
  $('#shUndo').addEventListener('click',()=>{ Object.assign(r, JSON.parse(sh.orig)); save(); drawSheet(); say('開いたときの内容に戻しました'); $('#shT').focus(); });
  $('#shRemove').addEventListener('click',()=>{ d.rows = d.rows.filter(x=>x.rid!==r.rid); db.undoRow = {k:sh.k, row:r}; save(); closeSheet(); say(shortName(e)+'を外しました。設定の画面から戻せます'); });
}
function closeSheet(){ $('#sheet').hidden = true; $('#sheet').innerHTML = ''; document.body.classList.remove('lock'); render(false); const b = document.querySelector('[data-edit="'+(sh&&sh.rid)+'"]'); if(b) b.focus(); else $('#pg2').focus(); sh = null; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('#sheet').hidden) closeSheet(); });

/* ============ コーチからのメニューを受け取る ============ */
function syncUrl(){ return (db.syncUrl||SYNC_URL||'').trim(); }
function inboxFor(k){ return (db.inbox||[]).filter(m=>!m.used && (m.date<=k || !m.date)).sort((a,b)=>a.date<b.date?1:-1); }
function rowsFromRaw(raw){ /* 新しい形 raw.rows[{exId,kg,reps,sets,rest,free}] と、前の版の形 raw.rows[{id,w,reps,iv,sets,sr}] の両方を読む */
  return (raw.rows||[]).map(r=>{ const exId = r.exId || r.id; if(!EXMAP[exId]) return null; const later = v=>v==='later';
    if(r.exId) return newRow(exId, {kg:Number(r.kg)||0, reps:Number(r.reps)||0, sets:Number(r.sets)||1, rest:r.rest||'', free:r.free||null});
    const free = {kg:later(r.w), reps:later(r.reps), sets:later(r.sets)}; const anyFree = free.kg||free.reps||free.sets;
    return newRow(exId, {kg:later(r.w)?0:Number(r.w)||0, reps:later(r.reps)?5:Number(r.reps)||0, sets:later(r.sets)?3:Number(r.sets)||1, rest:later(r.sr)?'':(r.sr?r.sr+'秒':''), free:anyFree?free:null}); }).filter(Boolean); }
async function fetchMenu(manual){ if(!syncUrl() || !db.me){ if(manual) say('送り先の設定がありません'); return; }
  if(manual) say('確かめています');
  try{ const r = await fetch(syncUrl()+'?action=menu&name='+encodeURIComponent(db.me.trim())); const j = await r.json(); if(!j.ok) throw new Error(j.error||'失敗');
    let n = 0; db.inbox = db.inbox||[]; (j.rows||[]).forEach(row=>{ let raw = {}; try{ raw = JSON.parse(row.JSON||'{}'); }catch(e){} const mid = String(row.uid||''); if(!mid || db.inbox.some(m=>m.mid===mid)) return;
      const rows = rowsFromRaw(raw); if(!rows.length) return; db.inbox.push({mid, date:String(raw.date||row['日付']||'').slice(0,10), rows, note:raw.note||'', by:raw.coach||raw.by||'', used:false}); n++; });
    save(); if(manual) say(n ? n+'件の新しいメニューが届きました' : '新しいメニューはありません'); render(false); }
  catch(e){ if(manual) say('受け取れませんでした。電波のある所でもう一度押してください'); } }
function applyInbox(k, m){ const d = day(k); const keep = d.rows.filter(r=>r.status==='done'); d.rows = keep.concat(m.rows.map(r=>Object.assign({}, r, {rid:'r'+Date.now()+Math.random().toString(36).slice(2,6)}))); d.src = 'coach'; d.note = m.note||''; m.used = true; save(); say('コーチのメニューを入れました'); render(false); $('#pg2').focus(); }

/* ============ コーチに送る ============ */
function syncOn(){ return !!(syncUrl() && (db.me||'').trim()); }
function syncItems(){ const S = db.sync = db.sync||{sent:{}}; S.sent = S.sent||{}; const me = db.me.trim(); const out = [];
  daysSorted().forEach(k=>{ const d = db.days[k]; const sig = JSON.stringify([d.pre, d.rows, d.finished, lastBW(k)]); if(S.sent['D|'+me+'|'+k]===sig) return;
    const items = [];
    if(d.pre && !d.pre.skipped){ const b = lastBW(k); items.push({uid:'C|'+me+'|'+k, kind:'調子', date:k, sleep:d.pre.sleep==null?'':d.pre.sleep, fat:d.pre.fat==null?'':d.pre.fat, memo:(b&&b.date===k?'体重 '+b.w+' kg':''), raw:d.pre}); }
    if(d.finished){ let vol = 0; d.rows.forEach(r=>{ const e = EXMAP[r.exId]; const v = r.status==='done' ? rowVol(r,k) : ''; if(r.status==='done') vol += v; const best = r.status==='done' ? rowBest(r,k) : null;
        items.push({uid:'R|'+me+'|'+k+'|'+r.rid, kind:r.status==='done'?'記録':'未実施', date:k, exId:r.exId, exName:e?e.name:r.exId, sets:rowSets(r).map(s=>(Number(s.w)>0?kg(s.w)+'kg×':'')+s.r).join(', '), vol:v, e1rm:best==null?'':best, rs:(r.reps||'')+' × '+(r.sets||''), memo:r.note||'', raw:r}); });
      items.push({uid:'S|'+me+'|'+k, kind:'練習', date:k, vol:r1(vol), memo:d.src==='coach'?'コーチのメニュー':'', raw:{src:d.src, finished:d.finished, n:d.rows.length}}); }
    if(items.length) out.push({k, sig, items}); });
  return out; }
function syncStatusTxt(){ const S = db.sync||{}; const n = syncOn() ? syncItems().length : 0; if(!syncOn()) return '送り先か名前が未設定のため、送れません'; if(n) return '未送信が '+n+' 日分あります'+(S.err?'（'+S.err+'）':''); return S.last ? '送信済み（'+new Date(S.last).toLocaleString('ja-JP')+'）' : '送るものはありません'; }
let syncBusy = false;
async function syncNow(manual){ if(!syncOn()){ if(manual) say(syncStatusTxt()); return; } if(syncBusy) return; const L = syncItems(); if(!L.length){ if(manual) say('送るものはありません'); return; }
  syncBusy = true; const S = db.sync; try{ const items = []; L.forEach(x=>items.push(...x.items));
    const res = await fetch(syncUrl(), {method:'POST', body:JSON.stringify({name:db.me.trim(), items})}); const j = await res.json(); if(!j.ok) throw new Error(j.error||'受け取り側の失敗');
    L.forEach(x=>{ S.sent['D|'+db.me.trim()+'|'+x.k] = x.sig; }); S.last = new Date().toISOString(); delete S.err; save(); if(manual) say(L.length+'日分を送りました'); }
  catch(e){ S.err = /Failed to fetch|NetworkError|Load failed/.test(String(e)) ? '通信できません' : String(e.message||e); save(); if(manual) say('送れませんでした。'+S.err); }
  finally{ syncBusy = false; const el = $('#syncLine'); if(el) el.textContent = syncStatusTxt(); } }
window.addEventListener('online', ()=>syncNow(false));

/* ============ 種目 ============ */
let pick = false; let exSel = db.exSel || 'fav';
function partGroups(){ return PARTS.map(p=>({k:'part:'+p.k, name:p.name})); }
function exList(key){ const [kind, v] = key.split(':'); const base = EX.filter(e=>!e.gym || e.linked);
  if(kind==='part') return EX.filter(e=>(PLACES[e.id]||[]).some(x=>x.part===v)).sort((a,b)=>((b.gym?0:1)-(a.gym?0:1)) || (LV_N[evLevel(b)]-LV_N[evLevel(a)]));
  if(kind==='stroke') return base.filter(e=>(e.strokes||[]).includes(v));
  if(key==='fav') return db.favs.map(id=>EXMAP[id]).filter(Boolean);
  if(key==='recent'){ const ids = []; finishedDays().reverse().forEach(k=>db.days[k].rows.forEach(r=>{ if(!ids.includes(r.exId)) ids.push(r.exId); })); return ids.map(id=>EXMAP[id]).filter(Boolean); }
  if(key==='all') return base.slice().sort((a,b)=>a.name.localeCompare(b.name,'ja'));
  return []; }
function exRow(e, k){ const inMenu = k && day(k).rows.some(r=>r.exId===e.id); const fav = db.favs.includes(e.id);
  return '<li><button type="button" class="rmain" data-go="detail" data-id="'+e.id+'"><strong>'+esc(shortName(e))+'</strong><span class="d">'+starHTML(e)+' '+esc(e.gym?'体操：'+(D.GYM_CATS[e.cat]||''):(CATS[e.cat]||''))+'</span></button>'+

VIEWS.ex = ()=>{ const k = curDay(); const q = db.exQ||''; let list = q ? EX.filter(e=>e.name.includes(q) || String(e.muscles||'').includes(q)).slice(0,60) : (exSel==='body' ? [] : exList(exSel));
