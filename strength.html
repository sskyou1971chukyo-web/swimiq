  if(!labOn()) return '';
  const p = d.backPain||'';
  return '<div class="q" id="lbBack"><div class="qh"><strong>今朝の腰</strong><span>必ず押す</span></div>'+painRadios('backPain', p)+'</div>'+
    '<div id="lbMore"'+(Number(p)>=2?'':' hidden')+'>'+NERVE.map(n=>triRadios(n[0], d[n[0]], n[1])).join('')+
      triRadios('restPain', d.restPain, 'じっとしていても痛い', ['なし','あり'])+triRadios('vsYesterday', d.vsYesterday, '昨日と比べて', ['改善','不変','悪化'])+'</div>'+
    '<details class="more" id="lbRed"'+(Number(p)>=3||RED3.some(r=>d[r[0]]==='あり')?' open':'')+'><summary>緊急の症状と体調の確認（当てはまるときだけ押す）</summary><div class="inner">'+
      RED3.map(r=>triRadios(r[0], d[r[0]], r[1], ['なし','あり'])).join('')+triRadios('illness', d.illness, '熱や体調不良', ['なし','あり'])+'</div></details>';
}
function labDailyRead(fd){
  if(!labOn()) return {};
  const o = {backPain:fd.get('backPain')||''};
  ['radiating','numbness','legWeakness','restPain','vsYesterday','bladder','perineal','legWeaknessNew','illness'].forEach(k=>{ const v = fd.get(k); if(v) o[k] = v; });
  if(Number(o.backPain)<2){ NERVE.forEach(n=>{ if(!fd.get(n[0])) o[n[0]] = 'なし'; }); }
  return o;
}
function labDailyMissing(fd){ return labOn() && !fd.get('backPain'); }
document.addEventListener('change',e=>{ if(e.target.name==='backPain' && e.target.closest('#dyForm')){ const n = Number(e.target.value);
  const m = $('#lbMore'); if(m) m.hidden = n<2; const r = $('#lbRed'); if(r && n>=3) r.open = true; } });

/* ---- 練習を始める前の腰 ---- */
let labPre = null;
VIEWS.labpre = ()=>{
  const dy = dailyOf(today()) || {};
  if(!labPre) labPre = {pain:dy.backPain||'', radiating:dy.radiating||'なし', numbness:dy.numbness||'なし', legWeakness:dy.legWeakness||'なし'};
  const R = labEval(today()); const bad = Number(labPre.pain)>=4 || nervWorse(labPre) || R.level==='emergency' || R.level==='stop';
  const rows = db.prog.filter(r=>EXMAP[r.id]); const hi = rows.filter(r=>lumbarOf(r.id)==='高');
  return {title:'練習の前に', html:
    '<section class="card" aria-labelledby="lpT"><h2 id="lpT" tabindex="-1">今の腰はどうですか</h2><p class="sub">'+(dy.backPain?'朝の答え（レベル'+dy.backPain+'）が入っています。変わっていれば押し直してください。':'押してください。')+'</p>'+painBtns('pre', labPre.pain)+
      '<details class="more"'+(nervAny(labPre)?' open':'')+'><summary>脚の症状　今：'+esc(nerveSum(labPre))+'</summary><div class="inner">'+NERVE.map(n=>triBtns('pre_'+n[0], labPre[n[0]], n[1])).join('')+'</div></details></section>'+
    (R.level!=='ok' ? '<div class="note '+(R.level==='caution'?'warn':'bad')+'"><strong>'+LV_TXT[R.level]+'</strong>　'+esc(R.headline)+'</div>' : '')+
    (hi.length && Number(labPre.pain)>=3 ? '<div class="note warn">腰の負担が高い種目が'+hi.length+'つあります（'+hi.map(r=>esc(EXMAP[r.id].name)).join('、')+'）。重さを増やさず、軽くするか外すことを検討してください。</div>' : '')+
    (bad ? '<div class="note bad" role="alert">'+(Number(labPre.pain)>=4?'腰痛がレベル'+labPre.pain+'です。今日の高負荷は推奨しません。':nervWorse(labPre)?'脚の症状が悪化しています。今日の練習は推奨しません。医療者の評価を優先してください。':esc(R.headline))+'</div>'+
      '<button type="button" class="cta" id="lpRest">今日は休む</button><button type="button" class="ghost" id="lpGo">それでも始める</button>'
      : '<button type="button" class="cta" id="lpGo"'+(labPre.pain?'':' aria-disabled="true"')+'>練習を始める</button>')
  };
};
UI_NEW.push('labpre');
const _homeNextL = homeNext;
homeNext = function(){
  const r = _homeNextL();
  if(!labOn()) return r;
  const R = labEval(today());
  if(R.level==='emergency' && !db.sessNow) return {go:'labstop', l1:'今日は練習しない', l2:'緊急の症状が記録されています。医療者へ'};
  if(r.go==='startgo') r.go = 'labpre';
  if(r.go==='daily') r.l2 = '睡眠、疲れ、腰を押すだけ';
  if(r.go==='finish') r.l2 = '終わりの腰と、きつさを押す';
  return r;
};
VIEWS.labstop = ()=>{ const R = labEval(today()); return {title:'今日の判断', html:
  '<section class="card stopcard" aria-labelledby="lsT"><h2 id="lsT" tabindex="-1">'+LV_TXT[R.level]+'</h2><p>'+esc(R.headline)+'</p>'+(R.concerns.length?'<ul>'+R.concerns.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul>':'')+(R.general.length?'<p><strong>'+R.general.map(esc).join('<br>')+'</strong></p>':'')+'</section>'+
  '<p class="sub">記録された症状にもとづく注意で、医療の診断ではありません。</p><button type="button" class="ghost" data-go="daily">今日の調子を直す</button>'}; };
UI_NEW.push('labstop');
document.addEventListener('click',e=>{
  let b;
  if((b = e.target.closest('[data-lp]'))){
    const [k, v] = b.dataset.lp.split(':'); const cur = stack[stack.length-1].name;
    if(cur==='labpre'){ if(k==='pre') labPre.pain = v; else labPre[k.slice(4)] = v; render(false); const f = document.querySelector('[data-lp="'+k+':'+v+'"]'); if(f) f.focus(); }
    else if(cur==='exec' && db.execNow){ const i = db.execNow.sets.findIndex(q=>!q.done); if(i<0) return; const q = db.execNow.sets[i];
      if(k==='set') q.pain = v; else q[k.slice(4)] = v; save(); render(false); const f = document.querySelector('[data-lp="'+k+':'+v+'"]'); if(f) f.focus(); }
    e.stopPropagation(); return; }
  if(e.target.closest('#lpRest')){ e.stopPropagation(); labPre = null; say('今日は休むことにしました。コーチに伝えてください'); go('home'); return; }
  if(e.target.closest('#lpGo')){ e.stopPropagation(); if(!labPre || !labPre.pain){ say('今の腰のレベルを押してください'); return; }
    db.sessNow = {start:new Date().toISOString(), pre:Object.assign({}, labPre)}; labPre = null; save(); say('練習を始めました。時間を計っています');
    const rows = db.prog.filter(r=>EXMAP[r.id]); const td = today(); const nx = rows.find(r=>!db.logs.some(l=>l.id===r.id && l.kind==='done' && dayOf(l.t)===td));
    if(nx) go('exec',{id:nx.id}); else go('program'); return; }
  if(labOn() && !db.sessNow && e.target.closest('#sessStart')){ e.stopPropagation(); go('labpre'); return; }
},true);

/* ---- 種目を行う画面：セットの腰と、コーチが承認した重さ ---- */
function labFinal(id){ const p = (db.labProps||[]).find(x=>x.date===today() && x.exerciseId===id && (x.decision==='承認'||x.decision==='変更') && x.final); return p ? p.final : null; }
const _execNowL = execNowFor;
execNowFor = function(id){
  const had = db.execNow && db.execNow.id===id && db.execNow.date===today();
  const x = _execNowL(id);
  if(!had){ const f = labFinal(id); if(f){ const w = nums(f.weight)[0], r = nums(f.reps)[0], n = nums(f.sets)[0];
      if(n && n>0){ while(x.sets.length>n) x.sets.pop(); while(x.sets.length<n) x.sets.push({w:'',r:'',done:false}); }
      x.sets.forEach(q=>{ if(w!=null) q.w = w; if(r!=null) q.r = r; }); x.labFinal = f; }
    if(labOn()){ const pre = db.sessNow && db.sessNow.pre; x.sets.forEach(q=>{ if(q.pain==null) q.pain = pre ? pre.pain : ''; }); }
    save(); }
  return x;
};
function labExecHTML(e, x, i, allDone){
  let h = '';
  const lum = lumbarOf(e.id);
  if(x.labFinal) h += '<div class="note good">コーチが承認した内容　'+esc(x.labFinal.weight)+'、'+esc(x.labFinal.reps)+'回、'+esc(x.labFinal.sets)+'セット</div>';
  if(labOn() && (db.goal==='hypertrophy'||db.goal==='endurance')) h += '<div class="note warn">腰部配慮「あり」の選手は、高回数のセットで腰痛が出て続けられないという申告があります。回数を2〜4回に下げてセット数を増やす形などを、コーチが判断してください。この代替案は実践上の工夫で、効果が同じと証明されたものではありません（SWIM STRENGTH LAB の規則）。</div>';
  if(x.labStop) h += '<div class="note bad" role="alert">'+esc(x.labStop)+'</div>';
  if(!labOn() || allDone) return h;
  const q = x.sets[i];
  return h+'<div class="q lbset"><div class="qh"><strong>このセットの腰</strong><span>'+(lum?'腰の負担 '+lum:'')+'　変わらなければそのまま</span></div>'+painBtns('set', q.pain, (i+1)+'セット目の腰痛のレベル')+
    '<details class="more"'+(nervAny(q)?' open':'')+'><summary>脚の症状　今：'+esc(nerveSum(q))+'</summary><div class="inner">'+NERVE.map(n=>triBtns('set_'+n[0], q[n[0]], n[1])).join('')+'</div></details></div>';
}
function labLumBadge(e){ const l = lumbarOf(e.id); return l ? '<span class="bdg'+(l==='高'?' stop':'')+'">腰の負担 '+l+'</span>' : ''; }
/* セットを終えたときの規則（SWIM STRENGTH LAB と同じ）：腰痛が開始前より上がる、または3以上なら、その種目は中止。脚の症状の悪化なら練習を終える */
function labAfterSet(x, s){
  if(!labOn()) return;
  const pre = db.sessNow && db.sessNow.pre ? Number(db.sessNow.pre.pain) : null; const p = Number(s.pain);
  if(nervWorse(s)){ x.sets = x.sets.filter(q=>q.done); x.labStop = '脚の症状の悪化が記録されました。運動の継続は推奨しません。この種目を終えたら、練習を終えて記録してください。医療者の評価を優先してください。'; x.restEnd = null; x.labEnd = true; say('脚の症状が悪化しました。練習を終えてください'); return; }
  if(p && ((pre!=null && p>pre) || p>=3)){ x.sets = x.sets.filter(q=>q.done); x.labStop = '腰痛がレベル'+(pre!=null?pre+'から':'')+p+'に上がりました。この種目はここで中止し、無理に続けないでください。'; x.restEnd = null; say('腰痛が上がりました。この種目は中止です'); return; }
  const nx = x.sets.find(q=>!q.done); if(nx){ nx.pain = s.pain; NERVE.forEach(n=>{ nx[n[0]] = s[n[0]]; }); }
}

/* ---- 練習の終わり：終わりの腰と脚の症状、緊急の確認 ---- */
const _finishL = VIEWS.finish;
VIEWS.finish = ()=>{
  const v = _finishL(); if(!labOn()) return v;
  const items = sessItems(); let mx = 0; items.forEach(x=>(x.l.setList||[]).forEach(q=>{ if(Number(q.pain)>mx) mx = Number(q.pain); }));
  const pre = db.sessNow && db.sessNow.pre; const def = mx || (pre ? pre.pain : '');
  const block = '<h3 class="part">腰</h3><div class="q"><div class="qh"><strong>終わってみて、腰は</strong><span>'+(pre?'始める前 レベル'+esc(pre.pain):'')+(mx?'　練習中の最高 レベル'+mx:'')+'</span></div>'+painRadios('postPain', def)+'</div>'+
    '<details class="more"><summary>脚の症状と、緊急の症状の確認（当てはまるときだけ）</summary><div class="inner">'+NERVE.map(n=>triRadios('post_'+n[0], pre?pre[n[0]]:'なし', n[1])).join('')+RED3.map(r=>triRadios('post_'+r[0], 'なし', r[1], ['なし','あり'])).join('')+'</div></details>';
  v.html = v.html.replace('<h3 class="part">3　きつさ</h3>', block+'<h3 class="part">3　きつさ</h3>');
  const a0 = v.after;
  v.after = ()=>{
    const f = $('#fForm');
    f.addEventListener('submit',ev=>{ const fd = new FormData(f); if(!fd.get('postPain')){ ev.preventDefault(); ev.stopImmediatePropagation(); $('#fErr').textContent = '保存できません。終わってみての腰のレベルを押してください。'; f.querySelector('[name=postPain]').focus(); return; }
      const post = {pain:fd.get('postPain')}; NERVE.concat(RED3).forEach(n=>{ post[n[0]] = fd.get('post_'+n[0]) || 'なし'; });
      window._labPost = post; window._labPre = db.sessNow && db.sessNow.pre; window._labN = (db.sessions||[]).length; }, true);
    if(a0) a0();
    f.addEventListener('submit',()=>{ if(window._labPost && (db.sessions||[]).length > window._labN){ const s = db.sessions[db.sessions.length-1]; s.post = window._labPost; s.pre = window._labPre || null; save();
        if(RED3.some(r=>s.post[r[0]]==='あり')) say('緊急の症状が記録されました。直ちに医療機関の評価を受けてください');
        else say('記録しました。次回の提案ができました'); }
      window._labPost = null; });
  };
  return v;
};

/* ---- 次回の提案（コーチ） ---- */
let labMod = null;
VIEWS.labprop = cur=>{
  const d = (cur && cur.date) || labNextDate(); const R = labEval(d); const L = labCfg();
  const saved = (db.labProps||[]).filter(p=>p.date===d);
  window._labProps = R.proposals; window._labDate = d;
  const card = (P, i)=>{ const sp = saved.find(x=>x.exerciseId===P.exerciseId); const stop = P.level==='stop'||P.level==='emergency';
    return '<section class="card" aria-labelledby="lpp'+i+'"><h3 id="lpp'+i+'" style="margin:0 0 6px">'+esc(P.exerciseName)+'</h3><div class="badges"><span class="bdg'+(stop?' stop':P.level==='ok'?' ok':'')+'">'+esc(P.decision)+'</span>'+(sp?'<span class="bdg'+(sp.decision==='却下'?' stop':' ok')+'">コーチ '+esc(sp.decision)+'</span>':'<span class="bdg warn">未決定</span>')+'</div>'+
      '<p style="margin:8px 0 0">前回 '+esc(P.prev.weight)+'kg×'+esc(P.prev.reps)+'回×'+esc(P.prev.sets)+'セット　腰 '+esc(P.prev.pain)+'</p><p style="margin:2px 0 0"><strong>次回 '+esc(P.next.weight)+'</strong>　'+esc(P.next.reps)+'回×'+esc(P.next.sets)+'</p>'+
      (sp && sp.final ? '<p class="sub">確定　'+esc(sp.final.weight)+'、'+esc(sp.final.reps)+'回、'+esc(sp.final.sets)+'セット'+(sp.note?'　メモ '+esc(sp.note):'')+'</p>' : '')+
      '<details class="plain"><summary>提案の理由</summary><ul>'+P.reasons.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul></details>'+
      (labMod===i ? '<div class="lr" style="margin-top:8px"><label>重さ<input type="text" class="txt" id="lmw" value="'+esc(sp&&sp.final?sp.final.weight:P.prev.weight+'kg')+'"></label><label>回数<input type="text" class="txt" id="lmr" value="'+esc(sp&&sp.final?sp.final.reps:P.prev.reps)+'"></label><label>セット<input type="text" class="txt" id="lms" value="'+esc(sp&&sp.final?sp.final.sets:P.prev.sets)+'"></label><label>メモ<input type="text" class="txt" id="lmn" value="'+esc(sp?sp.note||'':'')+'"></label></div><div class="two" style="margin-top:8px"><button type="button" class="cta" style="margin:0;min-height:56px" data-lpd="'+i+':変更">この内容で承認</button><button type="button" class="ghost" style="margin:0" data-lpm="-1">やめる</button></div>'
        : '<div class="two" style="margin-top:10px">'+(stop?'':'<button type="button" class="ghost" style="margin:0" data-lpd="'+i+':承認">承認</button>')+'<button type="button" class="ghost" style="margin:0" data-lpm="'+i+'">変更する</button>'+'<button type="button" class="ghost" style="margin:0'+(stop?'':';grid-column:1/-1')+'" data-lpd="'+i+':却下">却下</button></div>'+(stop?'<p class="sub">中止を推奨する種目には承認のボタンを出していません。行う場合は「変更する」で内容を記録してください。</p>':''))+
      '</section>'; };
  return {title:'次回の提案', html:
    '<section class="card '+(R.level==='ok'?'':'')+'" aria-labelledby="lprT" style="border-color:'+(R.level==='ok'?'var(--green)':R.level==='caution'?'var(--am)':'var(--redline)')+'"><p class="kicker" style="margin:0">'+uiDate(d)+'の判断</p><h2 id="lprT" tabindex="-1" style="margin:4px 0">'+LV_TXT[R.level]+'</h2><p style="margin:0">'+esc(R.headline)+'</p>'+
      (R.concerns.length?'<ul>'+R.concerns.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul>':'')+(R.general.length?'<p><strong>'+R.general.map(esc).join('<br>')+'</strong></p>':'')+
      '<div class="badges"><span class="bdg">運動許可 '+esc(L.clearance)+'</span><span class="bdg">腰部配慮 '+esc(L.lumbarCaution)+'</span>'+(L.restrictions?'<span class="bdg">制限 '+esc(L.restrictions)+'</span>':'')+'</div></section>'+
    (R.gaps.length?'<details class="more"><summary>データ不足 '+R.gaps.length+'件</summary><div class="inner"><ul>'+R.gaps.map(g=>'<li>'+esc(g)+'</li>').join('')+'</ul></div></details>':'')+
    '<details class="more"><summary>判定に使ったデータ</summary><div class="inner"><ul>'+R.dataUsed.map(g=>'<li>'+esc(g)+'</li>').join('')+'</ul><p class="sub">この提案は医療の診断ではなく、記録と決まった規則にもとづくコーチの判断の支えです。コーチが承認するまで、種目を行う画面には反映されません。重さを増やす割合（'+esc(L.increasePct)+'パーセント）と、必要な連続良好回数（'+esc(L.requiredGoodSessions)+'回）は、SWIM STRENGTH LAB の初期値で、根拠の資料はない仮の設定です。</p></div></details>'+
    (R.proposals.length ? R.proposals.map(card).join('') : '<div class="note">前回の練習の記録がないため、種目ごとの提案はまだ作れません。</div>')+
    ((db.labProps||[]).length ? '<details class="more"><summary>判断の履歴（'+db.labProps.length+'件）</summary><div class="inner"><ul class="hist">'+[...db.labProps].reverse().slice(0,20).map(p=>'<li><strong>'+esc(p.date)+'</strong> '+esc(p.exerciseName)+'　'+esc(p.decision)+(p.final?'　'+esc(p.final.weight)+'、'+esc(p.final.reps)+'回、'+esc(p.final.sets)+'セット':'')+'</li>').join('')+'</ul></div></details>' : ''),
    after(){
      $('#view').onclick = e=>{ let b;
        if((b = e.target.closest('[data-lpm]'))){ labMod = Number(b.dataset.lpm); if(labMod<0) labMod = null; render(false); const f = $('#lmw')||$('#lprT'); if(f) f.focus(); return; }
        if((b = e.target.closest('[data-lpd]'))){ const [i, dec] = b.dataset.lpd.split(':'); const P = window._labProps[Number(i)]; const d2 = window._labDate;
          const val = id=>{ const el = $('#'+id); return el ? el.value.trim() : ''; };
          const rec = {id:'lp_'+Date.now(), athleteId:LAB_ME, date:d2, exerciseId:P.exerciseId, exerciseName:P.exerciseName, proposed:P.decision, next:P.next, decision:dec, note:val('lmn'),
            final: dec==='却下' ? null : {weight: dec==='変更' ? val('lmw') : (String(P.next.weight).indexOf('検討案')>=0 ? P.prev.weight+'kg（増加は要コーチ指定）' : P.next.weight), reps: dec==='変更' ? val('lmr') : P.next.reps, sets: dec==='変更' ? val('lms') : P.next.sets, rest:P.next.rest}};
          db.labProps = (db.labProps||[]).filter(x=>!(x.date===d2 && x.exerciseId===P.exerciseId)); db.labProps.push(rec); labMod = null; save();
          say(P.exerciseName+'を「'+dec+'」にしました'); render(false); const h = $('#lpp'+i); if(h) h.focus(); } };
    }
  };
};
UI_NEW.push('labprop');

/* ---- 腰と運動許可（設定） ---- */
VIEWS.labset = ()=>{
  const L = labCfg(); const rows = db.prog.filter(r=>EXMAP[r.id]);

/* ============ 部位から選ぶ、お気に入り、今日のメニュー、運動時間の自動計算（2026年10月19日） ============
 部位の分け方は、コーチから渡された体系表（6大部位と細かい部位）に合わせた。競泳の補強で使う「ジャンプ・パワー」と「可動性」を足した。

PARTS.forEach(p=>{ if(Object.values(GYM_TO_PART).includes(p.k)) p.subs.push(['gx','体操の分類から（細かい部位は未登録）',[]]); });

const STAR = (on)=>'<svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z" fill="'+(on?'currentColor':'none')+'" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
function muscleList(e){ return String(e.muscles||'').replace(/^器具は[^。]*。/,'').replace(/（[^）]*）/g,'').split(/[・、,，]/).map(s=>s.trim()).filter(Boolean); }
function gymCatName(e){ return e.gym ? (GYM_CATS[e.cat]||'') : ''; }
/* 部位に出す種目：体操の種目のうち、元の種目の写し（twin）と、同じ名前の重なりは出さない */
let PART_POOL = null;
function partPool(){
  if(PART_POOL) return PART_POOL;
  const seen = new Set(); const out = [];
  EX.filter(e=>!e.gym).concat(EX.filter(e=>e.gym && !e.twin)).forEach(e=>{ const n = e.name.split('（')[0]; if(seen.has(n)) return; seen.add(n); out.push(e); });
  PART_POOL = out; return out;
}
function placeOf(e){
  /* 返り値：[{part, sub, main}] */
  const out = [];
  const mob = e.type==='mobility' || gymCatName(e)==='柔軟性・可動性';
  const pow = ['plyo','olympic','mb'].includes(e.type) || e.cat==='plyo' || e.cat==='olympic' || e.cat==='mb' || gymCatName(e)==='爆発的パワー';
  if(mob){ const ms = muscleList(e); const P = PARTS.find(p=>p.k==='mob'); let hit = null;
    for(const s of P.subs){ if(s[2].some(w=>ms.some(m=>m.includes(w)) || e.name.includes(w))){ hit = s[0]; break; } }
    out.push({part:'mob', sub:hit||'mo', main:true}); return out; }
  if(pow){ const sub = (e.type==='olympic'||e.cat==='olympic'||/クリーン|スナッチ|プル$|プッシュプレス|スラスター/.test(e.name)) ? 'po' : (e.type==='mb'||e.cat==='mb'||/メディシン|スロー|スラム|パス/.test(e.name)) ? 'pm' : 'pj';
    out.push({part:'power', sub, main:true}); }
  const ms = muscleList(e);
  ms.forEach((m, idx)=>{
    for(const P of PARTS){ if(P.k==='power'||P.k==='mob') continue;
      const s = P.subs.find(s=>s[2].some(w=>m.includes(w)));
      if(s){ if(!out.some(o=>o.sub===s[0])) out.push({part:P.k, sub:s[0], main: !pow && idx===0}); break; } }
  });
  if(!out.length && e.gym && GYM_TO_PART[gymCatName(e)]) out.push({part:GYM_TO_PART[gymCatName(e)], sub:'gx', main:false, gx:true});
  return out;
}
let PLACES = null;
function places(){ if(PLACES) return PLACES; PLACES = {}; partPool().forEach(e=>{ PLACES[e.id] = placeOf(e); }); return PLACES; }
function partItems(pk, sk){
  const P = places(); const list = [];
  partPool().forEach(e=>{ const ps = (P[e.id]||[]).filter(x=>x.part===pk && (!sk || x.sub===sk)); if(ps.length) list.push({e, main:ps.some(x=>x.main), sub:ps[0].sub}); });
  return list.sort((a,b)=>(b.main-a.main) || ((b.e.gym?0:1)-(a.e.gym?0:1)) || (LV_N[evLevel(b.e)]-LV_N[evLevel(a.e)]));
}

/* ---- 運動時間の自動計算 ---- */
function repSecBase(){ return Number(db.repSec)>0 ? Number(db.repSec) : 2; }
function repSecOf(id){ const t = (db.rx||{})[id]; const d = t && String(t.tempo||'').replace(/\D/g,''); if(d && d.length===4){ const s = d.split('').reduce((a,c)=>a+Number(c),0); if(s>0) return {sec:s, tempo:true}; } return {sec:repSecBase(), tempo:false}; }
function menuRow(id){ return db.prog.find(r=>r.id===id) || {id}; }
function menuRx(id){
  const e = EXMAP[id]; const r = menuRow(id); const rx = rxFor(e, db.goal); const f = labFinal(id); const t = (db.rx||{})[id] || {};
  const pick = (ov, fin, base)=> ov!=null && ov!=='' ? Number(ov) : (fin!=null ? fin : base);
  const secMode = (r.reps==null || r.reps==='') && !f && /秒/.test(String(rx.reps)) && !/回/.test(String(rx.reps).split('または')[0]);
  const sets = pick(r.sets, f?nums(f.sets)[0]:null, nums(rx.sets)[0]);
  const reps = pick(r.reps, f?nums(f.reps)[0]:null, nums(rx.reps)[0]);
  const rest = pick(r.rest, null, restSec(rx));
  const last = lastSetLog(id);
  const w = pick(r.w, f?nums(f.weight)[0]:null, last && last.setList && last.setList.length ? last.setList[last.setList.length-1].w : (last && Number(last.load)>0 ? Number(last.load) : null));
  const rs = repSecOf(id);
  return {sets, reps, rest, w, secMode, rs, hold:Number(t.hold)||0, edited: r.sets!=null||r.reps!=null||r.rest!=null||r.w!=null, final:!!f};
}
function exTime(id){
  const m = menuRx(id);
  if(!(m.sets>0) || !(m.reps>0)) return null;
  const per = m.secMode ? m.reps : m.reps*m.rs.sec + m.hold;
  const work = per*m.sets, restT = (m.rest||0)*Math.max(0, m.sets-1);
  return {sec: work+restT, work, restT, m, per};
}
function fmtDur(s){ s = Math.round(s); const m = Math.floor(s/60), r = s%60; return m ? m+'分'+(r?r+'秒':'') : r+'秒'; }
function exTimeFormula(id){
  const t = exTime(id); if(!t) return '処方が未登録のため計算していません。「回数・セット・休憩を変える」で入れると計算します。';
  const m = t.m;
  const one = m.secMode ? m.reps+'秒' : '（'+m.reps+'回×'+m.rs.sec+'秒'+(m.rs.tempo?'（テンポ）':'')+(m.hold?'＋上で'+m.hold+'秒':'')+'）';
  return one+'×'+m.sets+'セット＝'+fmtDur(t.work)+(m.sets>1&&m.rest?'、休憩'+fmtDur(m.rest)+'×'+(m.sets-1)+'＝'+fmtDur(t.restT):'')+'、合計 '+fmtDur(t.sec);
}
function menuTotal(){ let sec = 0, n = 0, miss = 0; db.prog.filter(r=>EXMAP[r.id]).forEach(r=>{ const t = exTime(r.id); if(t){ sec += t.sec; n++; } else miss++; }); return {sec, n, miss}; }

/* ============ 練習の終わり：動かした重さの積み上げグラフと、前回との比較（2026年10月19日） ============

const STK_COL = [['#e3ecf7','#000'],['#7da6d9','#000'],['#2c5a94','#fff'],['#b9cde8','#000'],['#4f80bd','#fff'],['#1b3d66','#fff']];

function stkFormula(l){
  const L = (l && l.setList || []).filter(q=>Number(q.r)>0); if(!L.length) return '記録なし';
  const same = L.every(q=>Number(q.w)===Number(L[0].w) && Number(q.r)===Number(L[0].r));
  return same ? (Number(L[0].w)||0)+' kg × '+L[0].r+'回 × '+L.length+'セット' : L.map(q=>(Number(q.w)||0)+'×'+q.r).join('、');

}
function stkBar(list, key, max, H, label, total, dim){
  /* list は行った順。下から積むので、上に来る最後の種目から並べる */
  const h = total>0 ? Math.max(4, Math.round(H*total/max)) : 0;
  const segs = list.slice().reverse().map(r=>{ const v = r[key]||0; if(!(v>0)) return ''; const c = STK_COL[r.i%STK_COL.length]; const sh = Math.max(3, Math.round(h*v/total));
    return '<div class="stkseg" style="height:'+sh+'px;background:'+c[0]+';color:'+c[1]+'">'+(sh>=26?'<b>'+(r.i+1)+'</b>':'')+(sh>=48?'<span>'+kgTxt(v)+'</span>':'')+'</div>'; }).join('');
  return '<div class="stkcol'+(dim?' dim':'')+'"><div class="stktot">'+kgTxt(total)+'<small> kg</small></div><div class="stkbar">'+segs+'</div></div>';
}
function finChartHTML(){

  let head, chart, aria, list;

    head = '<h2 id="stkT">今日動かした重さ　'+kgTxt(D.tot)+' kg</h2><p class="sub">行った順に、下から積んでいます</p>';
    aria = '積み上げの棒グラフ。合計'+D.tot+'キログラム。下から、'+D.rows.map(r=>(r.i+1)+' '+r.e.name+' '+r.v+'キログラム').join('、')+'。';

    list = D.rows.map(r=>'<li>'+sw(r)+'<div><strong>'+esc(r.e.name)+'</strong><span class="sub">'+esc(stkFormula(r.l))+' ＝ <b>'+kgTxt(r.v)+' kg</b></span></div></li>').join('');
  } else {

    const max = Math.max(D.tot, D.ptot);
    aria = '比較の積み上げ棒グラフ。前回は合計'+D.ptot+'キログラム、今日は合計'+D.tot+'キログラム。下から、'+D.rows.map(r=>(r.i+1)+' '+r.e.name+' 前回'+(r.pv==null?'記録なし':r.pv)+'、今日'+r.v).join('、')+'。';
    chart = '<div class="stkwrap two" role="img" aria-label="'+esc(aria)+'">'+stkBar(D.rows,'pv',max,300,'前回',D.ptot,true)+stkBar(D.rows,'v',max,300,'今日',D.tot)+'</div><div class="stkx" aria-hidden="true"><span>前回</span><span>今日</span></div>';
    list = D.rows.map(r=>{ const d = r.pv==null ? null : Math.round((r.v-r.pv)*10)/10;
      const pw = r.p ? Math.max(...r.p.setList.map(q=>Number(q.w)||0)) : null, tw = Math.max(...r.l.setList.map(q=>Number(q.w)||0));
      const note = (r.p && d>0 && tw<pw) ? '<span class="stknote">重さは '+pw+' kg から '+tw+' kg に下がり、回数やセットが増えたので合計は増えています</span>' : (r.p && d<0 && tw>pw) ? '<span class="stknote">重さは '+pw+' kg から '+tw+' kg に上がり、回数やセットが減ったので合計は減っています</span>' : '';
      return '<li>'+sw(r)+'<div><span class="stkh"><strong>'+esc(r.e.name)+'</strong><b>'+(d==null?'初めて':(d>=0?'＋':'−')+kgTxt(Math.abs(d))+' kg')+'</b></span>'+
        '<span class="sub">前回'+(r.p?'（'+fmtMD(dayOf(r.p.t))+'）'+esc(stkFormula(r.p))+' ＝ '+kgTxt(r.pv):'　記録なし')+'</span><span>今日　'+esc(stkFormula(r.l))+' ＝ '+kgTxt(r.v)+'</span>'+note+'</div></li>'; }).join('')+

  return '<section class="card stkcard" aria-labelledby="stkT">'+tabs+head+chart+'<h3 class="stksub">'+(cmp?'種目ごとの比較':'計算の内訳')+info+'</h3><ol class="stklist">'+list+'</ol>'+

/* ============ 記録：種目の推移（折れ線）と、ビッグ3のテストの比較（2026年10月19日） ============
 推移は、種目を選び、日ごとに「いちばん重い重さ」「動かした重さ（重さ×回数の合計）」「推定の最大（エプリーの式、10回以下のセット）」を折れ線で出す。
 横の間隔は実際の日数に合わせる。
 ビッグ3のテストは、ふだんの練習とは別に db.tests に記録する。1回なら実測、2回以上なら推定（10回以下）。 */
const TR_METRIC = [['max','いちばん重い重さ'],['vol','動かした重さ'],['est','推定の最大']];
const TR_PERIOD = [['m1','1か月',31],['m3','3か月',92],['y1','1年',366],['all','すべて',0]];
let trState = {id:null, metric:'max', period:'m3'};
function trExercises(){
  const last = {}; db.logs.forEach(l=>{ if(l.kind==='done' && EXMAP[l.id] && ((l.setList||[]).some(q=>Number(q.w)>0) || Number(l.load)>0)) last[l.id] = l.t; });
  return Object.keys(last).sort((a,b)=>last[a]<last[b]?1:-1);
}
function trPoints(id, metric){
  const by = {};
  doneLogs(id).forEach(l=>{ const d = dayOf(l.t); const L = (l.setList||[]).filter(q=>Number(q.r)>0);
    const sets = L.length ? L : (Number(l.load)>0 ? [{w:Number(l.load), r:nums(l.reps)[0]||0}] : []);
    sets.forEach(q=>{ const w = Number(q.w)||0, r = Number(q.r)||0; const o = by[d] = by[d] || {max:0, vol:0, est:null};
      if(w>o.max) o.max = w; o.vol += w*r; const e = e1rm(w,r); if(e!=null && (o.est==null || e>o.est)) o.est = e; }); });
  return Object.keys(by).sort().map(d=>({d, v: metric==='vol' ? Math.round(by[d].vol*10)/10 : by[d][metric]})).filter(p=>p.v!=null && p.v>0);
}
function dNum(d){ return Date.UTC(+d.slice(0,4), +d.slice(5,7)-1, +d.slice(8,10))/864e5; }
function niceStep(range){ const r = range/4; const p = Math.pow(10, Math.floor(Math.log10(r||1))); for(const m of [1,2,2.5,5,10]) if(m*p>=r) return m*p; return 10*p; }
function lineSVG(pts, unit, label){
  const W = 330, H = 270, L = 48, R = 18, T = 30, B = 46;
  const vs = pts.map(p=>p.v); let lo = Math.min(...vs), hi = Math.max(...vs); if(lo===hi){ lo = lo*0.9; hi = hi*1.1 || 1; }
  const st = niceStep(hi-lo); lo = Math.floor(lo/st)*st; hi = Math.ceil(hi/st)*st; if(lo<0) lo = 0;
  const x0 = dNum(pts[0].d), x1 = dNum(pts[pts.length-1].d);
  const X = d=> pts.length===1 ? (L+W-R)/2 : L+12+(dNum(d)-x0)/(x1-x0)*(W-R-L-24);
  const Y = v=> T+(hi-v)/(hi-lo)*(H-T-B);
  let g = ''; for(let v=lo; v<=hi+1e-9; v+=st){ const y = Y(v).toFixed(1); g += '<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="'+(v===lo?'#c9cbcf':'#3a3c40')+'" stroke-width="'+(v===lo?2:1)+'"/><text x="'+(L-8)+'" y="'+(+y+5)+'" text-anchor="end" fill="#c9cbcf" font-size="14" font-weight="700">'+kgTxt(Math.round(v*10)/10)+'</text>'; }
  const line = pts.length>1 ? '<polyline points="'+pts.map(p=>X(p.d).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ')+'" fill="none" stroke="#7da6d9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>' : '';
  const many = pts.length>8;
  const dots = pts.map((p,i)=>{ const last = i===pts.length-1; const x = X(p.d).toFixed(1), y = Y(p.v).toFixed(1);
    const showV = !many || last || i===0 || p.v===Math.max(...vs);
    return '<circle cx="'+x+'" cy="'+y+'" r="'+(last?10:many?5:8)+'" fill="'+(last?'#fff':'#e3ecf7')+'" stroke="#000" stroke-width="3"/>'+(showV?'<text x="'+x+'" y="'+(y-15)+'" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">'+kgTxt(p.v)+'</text>':''); }).join('');
  const ticks = (pts.length<=4 ? pts : [pts[0], pts[Math.floor((pts.length-1)/2)], pts[pts.length-1]]).map(p=>'<text x="'+X(p.d).toFixed(1)+'" y="'+(H-18)+'" text-anchor="middle" fill="#c9cbcf" font-size="14" font-weight="700">'+fmtMD(p.d)+'</text>').join('');
  const aria = label+'の折れ線グラフ。'+pts.map(p=>Number(p.d.slice(5,7))+'月'+Number(p.d.slice(8))+'日 '+p.v+unit).join('、')+'。';
  return '<svg class="trsvg" role="img" aria-label="'+esc(aria)+'" viewBox="0 0 '+W+' '+H+'" width="100%"><text x="4" y="16" fill="#c9cbcf" font-size="13" font-weight="700">'+unit+'</text>'+g+line+dots+ticks+'</svg>';
}
VIEWS.trend = cur=>{
  const ids = trExercises();
  if(cur && cur.id && EXMAP[cur.id]) trState.id = cur.id;
  if(!trState.id || !ids.includes(trState.id)) trState.id = ids[0] || null;
  if(!trState.id) return {title:'種目の推移', html:'<div class="note" style="margin-top:14px">重さを入れた記録がまだありません。練習でセットの重さと回数を記録すると、ここに折れ線で出ます。</div>'};
  const e = EXMAP[trState.id]; const mName = TR_METRIC.find(m=>m[0]===trState.metric)[1];
  const per = TR_PERIOD.find(p=>p[0]===trState.period);
  let pts = trPoints(trState.id, trState.metric);
  const allN = pts.length;
  if(per[2]) { const lim = dNum(today())-per[2]; pts = pts.filter(p=>dNum(p.d)>=lim); }
  const sel = '<label class="trlab">種目を選ぶ<select id="trSel" class="txt">'+ids.map(id=>'<option value="'+id+'"'+(id===trState.id?' selected':'')+'>'+esc(EXMAP[id].name)+'</option>').join('')+'</select></label>';
  const mt = '<div class="stktabs tr3" role="group" aria-label="見る数字">'+TR_METRIC.map(m=>'<button type="button" data-trm="'+m[0]+'" aria-pressed="'+(m[0]===trState.metric)+'">'+m[1]+'</button>').join('')+'</div>';
  const pd = '<div class="chips trchips" role="group" aria-label="期間">'+TR_PERIOD.map(p=>'<button type="button" class="chip'+(p[0]===trState.period?' on':'')+'" data-trp="'+p[0]+'" aria-pressed="'+(p[0]===trState.period)+'">'+p[1]+'</button>').join('')+'</div>';
  const info = trState.metric==='est' ? uiInfo('推定の最大の説明を開く','推定の最大', E1RM_INFO, '推定のしかた')
    : trState.metric==='vol' ? uiInfo('動かした重さの説明を開く','動かした重さ','<p>その日のこの種目の、各セットの 重さ×回数 を足しています。重さを下げて回数を増やしても増えるので、強くなったかどうかは「いちばん重い重さ」と合わせて見てください（アプリの作り手の考えで、論文で確かめたものではありません）。</p>','説明') : '';
  let body;
  if(!pts.length) body = '<div class="note">この期間には記録がありません。期間を「すべて」にすると、'+allN+'回の記録が出ます。</div>';
  else { const last = pts[pts.length-1], prev = pts[pts.length-2];
    const dl = prev ? Math.round((last.v-prev.v)*10)/10 : null;
    body = '<section class="card trcard" aria-labelledby="trT"><h2 id="trT">'+esc(e.name)+'</h2>'+
      '<p class="stkdiff">最新 '+kgTxt(last.v)+' kg'+(dl==null?'':'　前回より '+(dl===0?'変わらず':kgTxt(Math.abs(dl))+' kg '+(dl>0?'増':'減')))+'</p>'+
      '<p class="sub">'+pts.length+'回の記録　'+fmtMD(pts[0].d)+' から '+fmtMD(last.d)+' まで'+info+'</p>'+lineSVG(pts,'kg',e.name+'の'+mName)+
      '<p class="sub">横の間隔は、実際の日数に合わせています</p></section>'+
      '<section class="card"><h2>日ごとの記録</h2><ol class="trlist">'+pts.slice().reverse().map((p,i,a)=>{ const q = a[i+1]; const d = q ? Math.round((p.v-q.v)*10)/10 : null;
        return '<li><span class="sub">'+fmtMD(p.d)+'</span><strong>'+kgTxt(p.v)+' kg</strong><b>'+(d==null?'はじめ':d===0?'±0':(d>0?'＋':'−')+kgTxt(Math.abs(d))+' kg')+'</b></li>'; }).join('')+'</ol></section>';
  }
  return {title:'種目の推移', html: sel+mt+pd+body,
    after(){ $('#trSel').addEventListener('change',ev=>{ trState.id = ev.target.value; render(false); const s = $('#trSel'); if(s) s.focus(); say(EXMAP[trState.id].name+'にしました'); }); }};
};
document.addEventListener('click',e=>{ let b;
  if((b = e.target.closest('[data-trm]'))){ e.stopPropagation(); trState.metric = b.dataset.trm; render(false); const f = document.querySelector('[data-trm="'+trState.metric+'"]'); if(f) f.focus(); say(TR_METRIC.find(m=>m[0]===trState.metric)[1]+'の折れ線にしました'); return; }
  if((b = e.target.closest('[data-trp]'))){ e.stopPropagation(); trState.period = b.dataset.trp; render(false); const f = document.querySelector('[data-trp="'+trState.period+'"]'); if(f) f.focus(); say('期間を'+TR_PERIOD.find(p=>p[0]===trState.period)[1]+'にしました'); return; }
},true);

/* ---- ビッグ3のテスト ---- */
const BIG3 = [['bench','ベンチプレス'],['squat','スクワット'],['dead','デッドリフト']];
let b3Pick = null;
function b3Val(x){ if(!x) return null; const w = Number(x.w), r = Number(x.r); if(!(w>0) || !(r>0)) return null; if(r===1) return {v:w, est:false}; const e = e1rm(w,r); return e==null ? null : {v:e, est:true}; }
function b3Tests(){ return [...(db.tests||[])].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0); }
VIEWS.big3 = ()=>{
  const T = b3Tests();
  const addBtn = '<div class="stackbtns" style="margin-top:14px"><button type="button" class="cta" data-go="big3add">テストの結果を入れる</button></div>';
  if(!T.length) return {title:'ビッグ3のテスト', html:'<div class="note" style="margin-top:14px">テストの記録はまだありません。テストの日に、ベンチプレス、スクワット、デッドリフトの重さと回数を入れると、前のテストと比べられます。</div>'+addBtn};
  if(!b3Pick || !T[b3Pick[0]] || !T[b3Pick[1]]) b3Pick = [Math.max(0,T.length-2), T.length-1];
  const A = T[b3Pick[0]], Bt = T[b3Pick[1]]; const one = T.length===1;
  const opt = (sel)=>T.map((t,i)=>'<option value="'+i+'"'+(i===sel?' selected':'')+'>'+fmtMD(t.date)+'（'+t.date.slice(0,4)+'）</option>').join('');
  const pickers = one ? '' : '<div class="two b3pick"><label class="trlab">前のテスト<select id="b3A" class="txt">'+opt(b3Pick[0])+'</select></label><label class="trlab">今回のテスト<select id="b3B" class="txt">'+opt(b3Pick[1])+'</select></label></div>';
  const rows = BIG3.map(([k,n])=>({k, n, a: one?null:b3Val(A[k]), b: b3Val(Bt[k]), ra: A[k], rb: Bt[k]}));
  const max = Math.max(1, ...rows.map(r=>Math.max(r.a?r.a.v:0, r.b?r.b.v:0)));
  const sumOK = rows.every(r=>r.b) && (one || rows.every(r=>r.a));
  const sa = rows.reduce((t,r)=>t+(r.a?r.a.v:0),0), sb = rows.reduce((t,r)=>t+(r.b?r.b.v:0),0);
  const anyEst = rows.some(r=>(r.a&&r.a.est)||(r.b&&r.b.est));
  const val = (x, raw)=> x ? kgTxt(x.v)+(x.est?'（推定）':'') : (raw && Number(raw.w)>0 ? '推定できません' : '記録なし');
  const bar = (x, cls)=> x ? '<div class="b3bar '+cls+'" style="width:'+Math.max(3, Math.round(x.v/max*70))+'%"></div>' : '<div class="b3bar none"></div>';
  const aria = 'ビッグ3のテストの比較。'+rows.map(r=>r.n+(one?'':' 前 '+(r.a?r.a.v+'キログラム':'記録なし'))+'、今回 '+(r.b?r.b.v+'キログラム':'記録なし')).join('。')+'。';
  const chart = '<div role="img" aria-label="'+esc(aria)+'" class="b3chart">'+rows.map(r=>{ const d = r.a&&r.b ? Math.round((r.b.v-r.a.v)*10)/10 : null;
    return '<div class="b3row" aria-hidden="true"><div class="stkh"><strong>'+r.n+'</strong><b>'+(d==null?'':(d===0?'±0':(d>0?'＋':'−')+kgTxt(Math.abs(d))+' kg'))+'</b></div>'+
      (one?'':'<div class="b3line">'+bar(r.a,'old')+'<span class="sub">'+val(r.a,r.ra)+'</span></div>')+'<div class="b3line">'+bar(r.b,'new')+'<span class="b3v">'+val(r.b,r.rb)+'</span></div></div>'; }).join('')+'</div>';
  const detail = '<ol class="trlist b3detail">'+rows.map(r=>'<li><strong>'+r.n+'</strong><span class="sub">'+(one?'':'前 '+(r.ra&&Number(r.ra.w)>0?r.ra.w+' kg × '+r.ra.r+'回':'—')+'　')+'今回 '+(r.rb&&Number(r.rb.w)>0?r.rb.w+' kg × '+r.rb.r+'回':'—')+'</span></li>').join('')+'</ol>';
  return {title:'ビッグ3のテスト', html: pickers+
    '<section class="card" aria-labelledby="b3T"><h2 id="b3T">ビッグ3の合計</h2>'+
      (sumOK ? '<p class="b3sum">'+(one?'':kgTxt(sa)+' → ')+kgTxt(sb)+'<small> kg</small>'+(one?'':'　<span>'+(sb-sa>=0?'＋':'−')+kgTxt(Math.abs(Math.round((sb-sa)*10)/10))+' kg</span>')+'</p>' : '<p class="sub">3種目そろっていないので、合計は出していません。</p>')+
      (one?'<p class="sub">テストが1回だけなので、比べるものはまだありません。</p>':'<div class="b3leg"><span><i class="old"></i>前のテスト</span><span><i class="new"></i>今回</span></div>')+chart+

function bodyMirror(d){ let i = 0; return d.replace(/-?\d+(\.\d+)?/g, n=>{ const v = (i++ % 2 === 0) ? (896 - Number(n)) : Number(n); return String(Math.round(v*10)/10); }); }
function bodyTextW(t){ let w = 0; for(const ch of t){ w += ch.charCodeAt(0) > 255 ? 36 : 19; } return w + 40; }
function bodySVG(v, plain){
  const V = BODY_VIEWS[v];
  let s = '<image href="'+V.img+'" x="0" y="0" width="896" height="1776"/>';
  if(plain) return s;
  V.zones.forEach(z=>{ const m = BODY_MAP[z.key]; const n = bodyCount(m.part, m.sub);
    s += '<g class="hot" role="button" tabindex="0" data-go="part" data-part="'+m.part+'" data-sub="'+m.sub+'" aria-label="'+esc(m.name)+'、'+n+'種目" style="--c:'+z.color+'"><path class="z" d="'+z.d+'"/>'+(V.mirror?'<path class="z" d="'+bodyMirror(z.d)+'"/>':'')+'<title>'+esc(m.name)+'　'+n+'種目</title></g>'; });
  V.zones.forEach(z=>{ const m = BODY_MAP[z.key]; const [side, lx, ly] = z.label; const w = bodyTextW(m.name); const x = side==='L' ? lx - w : lx;
    s += '<g class="lab" role="button" tabindex="0" data-go="part" data-part="'+m.part+'" data-sub="'+m.sub+'" aria-label="'+esc(m.name)+'の名前札、'+bodyCount(m.part, m.sub)+'種目"><line x1="'+lx+'" y1="'+ly+'" x2="'+z.anchor[0]+'" y2="'+z.anchor[1]+'"/><circle cx="'+z.anchor[0]+'" cy="'+z.anchor[1]+'" r="9"/><rect x="'+x+'" y="'+(ly-31)+'" width="'+w+'" height="62"/><text x="'+(x+20)+'" y="'+(ly+13)+'">'+esc(m.name)+'</text></g>'; });
  return s;
}
