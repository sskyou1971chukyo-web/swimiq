<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWIMIQ-STRENGTH</title>
<link rel="apple-touch-icon" href="strength-icon-180.png">
<link rel="icon" type="image/png" href="strength-icon-192.png">
<link rel="manifest" href="strength.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="STRENGTH">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--ink:#111;--sub:#4a4a4a;--bg:#fff;--soft:#f3f3f3;--line:#c9c9c9;--dark:#1c1c1e;--blue:#0a4fb3;--green:#12662f;--greenbg:#e6f4ea;--red:#a31515;--redbg:#fdeaea;--amber:#7a4b00;--amberbg:#fff3d6;--focus:#ff9500}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
#app{max-width:760px;margin:0 auto;padding:env(safe-area-inset-top) 20px 120px}
#top{position:sticky;top:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:88px 1fr 88px;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
#title{font-size:1.15rem;margin:0;text-align:center;font-weight:700;line-height:1.4}
#title:focus{outline:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
#back{min-height:48px;border:2px solid var(--ink);background:var(--bg);border-radius:999px;font-weight:700}
h2{font-size:1.35rem;margin:36px 0 12px;line-height:1.4}
h3{font-size:1.1rem;margin:26px 0 10px}
p{margin:8px 0}
.sub{color:var(--sub);font-size:.9rem;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
a,.link{color:var(--blue);text-decoration:underline;background:none;border:0;padding:6px 0;min-height:44px;text-align:left;font-weight:700}
.link.strong{color:var(--ink)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:60px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:#fff;font-weight:700;font-size:1.05rem;padding:10px 20px}
.ghost{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:999px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);font-weight:700;padding:8px 18px;text-decoration:none}
.ghost.small{min-height:46px;font-size:.9rem;padding:4px 12px;width:auto;flex:1}
.stackbtns{display:grid;gap:12px}
@media(min-width:620px){.stackbtns{grid-template-columns:1fr 1fr}}
.note{background:var(--soft);border-left:6px solid var(--ink);border-radius:8px;padding:12px 14px;margin:10px 0}
.note.good{background:var(--greenbg);border-color:var(--green)}
.note.bad{background:var(--redbg);border-color:var(--red)}
.note.warn{background:var(--amberbg);border-color:var(--amber)}
.tag{display:inline-block;font-size:.78rem;font-weight:700;border:1.5px solid var(--ink);border-radius:999px;padding:0 9px;margin:4px 6px 0 0;background:#fff;color:var(--ink)}
.tag.ok{border-color:var(--green);color:var(--green)}
.tag.warn{border-color:var(--amber);color:var(--amber);background:var(--amberbg)}
/* ホーム */
.hero{background:var(--dark);color:#fff;border-radius:16px;padding:22px;margin-top:18px}
.hero .kicker{margin:0;font-weight:700}
.big{font-size:3rem;font-weight:800;line-height:1.1;margin:4px 0}
.big span{font-size:1.1rem;margin-left:6px}
/* サムネイル */
.th{display:block;background:#fff;overflow:hidden;flex:none}
.th img{width:100%;height:100%;object-fit:contain;display:block;image-rendering:auto}
.th.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;text-align:center;padding:6px;font-size:.8rem;line-height:1.3}
.th.sm{width:96px;height:96px;border-radius:10px;border:1px solid var(--line)}
.th.lg{width:100%;aspect-ratio:16/10;border-radius:14px}
.th.lg.ph{font-size:1.4rem}
/* 一覧 */
ul.rows,ul.prows,ul.cats,ul.mine,ul.tiles,ul.bars,ul.hist{list-style:none;margin:0;padding:0}
.row{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--bg);border:0;border-bottom:1px solid var(--line);padding:14px 0;min-height:96px}
.rowtxt{display:block;min-width:0}
.rowtxt strong{display:block;font-size:1.05rem;line-height:1.4}
.listhead{display:grid;gap:10px;margin:16px 0 4px}
.search{display:block;margin-top:18px;font-weight:700}
.search input,.field select,.logform input,.lr input,#player input[type=url]{display:block;width:100%;min-height:54px;border:2px solid var(--ink);border-radius:12px;padding:8px 14px;background:#fff;color:#111;margin-top:6px}
.field{display:block;font-weight:700;margin-top:18px}
/* カテゴリー */
.cats{display:grid;gap:12px}
@media(min-width:620px){.cats{grid-template-columns:1fr 1fr}}
.catcard{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;width:100%;height:170px;border:0;border-radius:12px;color:#fff;text-align:left;padding:16px 18px;overflow:hidden}
.catcard img{position:absolute;right:0;top:0;height:100%;width:55%;object-fit:cover;opacity:.9;-webkit-mask-image:linear-gradient(90deg,transparent,#000 60%);mask-image:linear-gradient(90deg,transparent,#000 60%)}
.catname{position:relative;font-size:1.3rem;font-weight:800;line-height:1.35;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.catn{position:relative;font-weight:700}
.mine{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.minecard{width:100%;min-height:110px;border:0;border-radius:12px;background:var(--soft);text-align:left;padding:16px}
.minecard strong{display:block;font-size:1.05rem;line-height:1.4}
/* 詳細 */
.dhero{background:var(--dark);color:#fff;margin:0 -20px;padding:20px}
.playbtn{position:relative;display:block;width:100%;padding:0;border:0;background:none;border-radius:14px}
.playicon{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;background:rgba(0,0,0,.72);color:#fff;display:flex;align-items:center;justify-content:center;font-size:3rem;border:3px solid #fff}
.playlabel{position:absolute;left:12px;bottom:12px;background:#000;color:#fff;font-weight:700;border-radius:999px;padding:4px 16px}
.dcat{font-weight:700;margin:14px 0 0}
.meta{margin:8px 0;display:grid;gap:6px}
.meta div{display:grid;grid-template-columns:8.5em 1fr;gap:8px}
.meta dt{color:#d0d0d0}.meta dd{margin:0;font-weight:700}
.dwhy{color:#f0f0f0}
.actions{display:grid;gap:12px;margin:18px 0}
@media(min-width:620px){.actions{grid-template-columns:1.4fr 1fr 1fr}}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
thead th{background:var(--dark);color:#fff}
.refs{padding-left:0;list-style:none;margin:0}
.refs li{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;overflow-wrap:anywhere}
.refs .sub{display:inline}
.refnote{margin:8px 0;background:var(--soft);border-radius:8px;padding:8px 10px}
.refnote.warnline{background:var(--amberbg)}
.refs a{display:inline-block}
.logform{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.logform label,.lr label{font-weight:700}
.wide{grid-column:1/-1}
.hist li{border-bottom:1px solid var(--line);padding:10px 0}
details.plain summary,#pReg summary{cursor:pointer;font-weight:700;color:var(--blue);min-height:44px;padding:8px 0}
/* 絞り込み */
#sheet,#player{position:fixed;inset:0;z-index:20;overflow:hidden;display:flex;flex-direction:column}
#sheet[hidden],#player[hidden]{display:none}
#sheet{background:var(--bg)}
.sheethead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);text-align:center}
.sheethead h2{margin:0;font-size:1.2rem}.sheethead p{margin:0;color:var(--sub)}
.sheetbody{overflow:auto;padding:0 20px 60px;max-width:760px;width:100%;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:54px;min-width:96px;padding:6px 20px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:700}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* 動画 */
#player{background:#000;color:#fff;overflow:auto}
.phead{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:12px 20px}
.phead h2{margin:0;font-size:1.15rem}
.pclose{min-height:48px;padding:4px 18px;border-radius:999px;border:2px solid #fff;background:#000;color:#fff;font-weight:700}
.pmedia{width:100%;max-width:1000px;margin:0 auto;background:#111}
.pmedia video,.pmedia iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}
.novideo{padding:20px;text-align:center}.novideo .th{max-width:420px;margin:0 auto}
.pbody{max-width:760px;width:100%;margin:0 auto;padding:6px 20px 60px}
.pcue{font-size:1.2rem;font-weight:700}
.pnote{text-align:center}
#player a,#player summary{color:#8cc4ff}
#player .cta{background:#fff;color:#000;border-color:#fff;margin:18px 0}
#player .ghost{background:#000;color:#fff;border-color:#fff}
#player label{display:block;font-weight:700;margin:14px 0}
#player input[type=file]{display:block;margin-top:8px;color:#fff;font-size:1rem}
/* 記録 */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.tiles li{background:var(--soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:190px;align-items:end;border-bottom:2px solid var(--ink);padding-top:28px}
.bars li{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bar{display:block;width:70%;background:var(--ink);border-radius:6px 6px 0 0;min-height:2px}
.barv{font-weight:700}
.barl{position:absolute;bottom:-30px;font-size:.8rem}
.bars+h2{margin-top:60px}
.filebtn{position:relative;cursor:pointer}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.filebtn:focus-within{outline:4px solid var(--focus);outline-offset:2px}
/* プログラム */
.prows li{border-bottom:1px solid var(--line);padding-bottom:12px}
.prows .row{border-bottom:0}
.prbtns{display:flex;gap:8px;flex-wrap:wrap}
.isdone .rowtxt strong{text-decoration:line-through}
.lr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.test{border-bottom:1px solid var(--line);padding-bottom:18px}

.advice{border:3px solid var(--ink);border-radius:16px;padding:18px;margin:18px 0}
.advice h2{margin:4px 0 8px;font-size:1.25rem}.advice h2:focus{outline:none}
.advice .kicker{margin:0;font-weight:700;color:var(--blue)}
.flag{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
.flag h3{margin:0 0 8px}
tbody th[scope=row]{min-width:6.5em;background:var(--soft)}
.intake{display:grid;gap:22px;margin-top:10px}
.intake fieldset{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0}
.intake legend,.intake>label{font-weight:700}
.intake input[type=number]{display:block;width:100%;max-width:220px;min-height:54px;border:2px solid var(--ink);border-radius:12px;padding:8px 14px;margin-top:6px;background:#fff;color:#111}
.rad{display:flex;align-items:center;gap:12px;min-height:54px;padding:6px 10px;border-radius:10px;font-weight:400;cursor:pointer}
.rad input{width:26px;height:26px;flex:none;accent-color:#111}
.rad:has(input:checked){background:var(--soft);font-weight:700}
.err{color:var(--red);font-weight:700}
.logform input[type=date]{display:block;width:100%;min-height:54px;border:2px solid var(--ink);border-radius:12px;padding:8px 14px;margin-top:6px;background:#fff;color:#111}

.judge{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.judge li{border-top:1px solid #555;padding-top:8px}
.judge span{display:block;color:#d0d0d0;font-size:.9rem}
.judge strong{font-size:1.1rem;line-height:1.5}
.intake select{display:block;width:100%;max-width:320px;min-height:54px;border:2px solid var(--ink);border-radius:12px;padding:8px 14px;margin-top:6px;background:#fff;color:#111}
#brand{font-family:Impact,Haettenschweiler,'Arial Narrow Bold','Hiragino Sans',sans-serif;font-style:italic;font-weight:400;font-size:2rem;line-height:1;padding:14px 0 2px;display:flex;align-items:baseline;gap:.28em;letter-spacing:.01em}
#brand .b1{color:var(--ink)}
#brand .b2{color:var(--blue)}
#brand .b3{color:var(--ink);font-size:.62em;border-bottom:4px solid var(--blue);padding-bottom:1px}
@media print{#brand{display:none}}
.stars{letter-spacing:1px}
.intake textarea.txt{display:block;width:100%;border:2px solid var(--ink);border-radius:12px;padding:8px 14px;margin-top:6px;background:#fff;color:#111;font:inherit;line-height:1.6}
.selchips,.pickres{list-style:none;margin:8px 0;padding:0}
.selchips{display:flex;flex-wrap:wrap;gap:8px}
.selchips .chip{min-height:46px;padding:4px 14px;font-size:.9rem}
.pickres{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.flag.stop{border:3px solid var(--red);background:var(--redbg)}
.intake input.txt{display:block;width:100%;min-height:54px;border:2px solid var(--ink);border-radius:12px;padding:8px 14px;margin-top:6px;background:#fff;color:#111}
.gymcard{height:120px}
[hidden]{display:none !important}
.intake h3.part{margin:10px 0 0;padding:8px 12px;background:var(--dark);color:#fff;border-radius:8px}
/* 下のタブ */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(4px,calc(50% - 380px)) calc(6px + env(safe-area-inset-bottom))}
#tabs button{min-width:0;padding:0 2px;white-space:nowrap;letter-spacing:-.02em;min-height:62px;border:0;background:none;color:var(--sub);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.74rem;border-radius:10px}
#tabs button svg{width:28px;height:28px}
#tabs button.on{color:var(--ink);box-shadow:inset 0 4px 0 var(--ink)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;font-weight:700;border-radius:999px;padding:10px 22px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;border:2px solid #fff}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
@media print{#tabs,#top,#toast,.prbtns,.stackbtns,.field,details{display:none !important}#app{padding:0}.th.sm{width:60px;height:60px}}

/* ===== SwimIQ の色分け（swimiq_lite_B.html と同じ）=====
   黒い地に白い文字。黄色は「いちばん押すもの」と「いま選んでいるもの」だけ。
   緑は 良い・できた、赤は 止める・注意 だけに使う。 */
:root{--ink:#ffffff;--sub:#c9c9c9;--bg:#000000;--soft:#17181a;--pane2:#202124;--line:#4a4a4a;--dark:#17181a;--blue:#ffc400;--green:#35e06a;--greenbg:#0e2415;--red:#ff8e78;--redline:#ff4b2b;--redbg:#2a110c;--amber:#ffc400;--amberbg:#2b2204;--focus:#ffc400;--am:#ffc400}
body{font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--am);outline-offset:2px}
.cta,#player .cta{background:var(--am);border-color:var(--am);color:#000;border-radius:6px}
.ghost,#player .ghost{background:var(--soft);border-color:var(--line);color:#fff;border-radius:6px}
#back,.pclose{background:var(--soft);border-color:var(--line);color:#fff;border-radius:6px}
.chip{background:var(--soft);border-color:var(--line);color:#fff;border-radius:6px}
.chip.on{background:var(--am);border-color:var(--am);color:#000}
#tabs{background:#000;border-top:1px solid #3a3b3d}
#tabs button{color:var(--sub)}
#tabs button.on{color:var(--am);box-shadow:inset 0 4px 0 var(--am)}
.hero,.dhero{background:var(--soft);border:1px solid #3a3b3d}
.dhero{border-width:0 0 1px}
.minecard,.tiles li{background:var(--soft);border:1px solid #3a3b3d;color:#fff}
.note{background:var(--soft);border-left-color:var(--line)}
.note.good{background:var(--greenbg);border-left-color:var(--green)}
.note.bad{background:var(--redbg);border-left-color:var(--redline)}
.note.warn{background:var(--amberbg);border-left-color:var(--am)}
.tag{background:var(--pane2);border-color:var(--line);color:#fff}
.tag.ok{border-color:var(--green);color:var(--green);background:var(--greenbg)}
.tag.warn{border-color:var(--am);color:var(--am);background:var(--amberbg)}
thead th{background:var(--pane2);color:#fff}
tbody th[scope=row]{background:var(--soft);color:#fff}
th,td{border-color:var(--line)}
.search input,.field select,.logform input,.lr input,#player input[type=url],.intake input[type=number],.intake select,.intake input.txt,.intake textarea.txt,.logform input[type=date]{background:var(--soft);color:#fff;border-color:var(--line);border-radius:6px;color-scheme:dark}
::placeholder{color:#9aa0ab}
.rad input{accent-color:#ffc400}
.rad:has(input:checked){background:var(--pane2);box-shadow:inset 4px 0 0 var(--am)}
.intake fieldset,.flag,.refs li,.pickres{border-color:var(--line)}
.intake h3.part{background:var(--am);color:#000;border-radius:6px}
.advice{border:2px solid var(--line);background:var(--soft)}
.flag{background:#0b0b0c}
.flag.stop{border:2px solid var(--redline);background:var(--redbg)}
.refnote{background:var(--pane2)}
.refnote.warnline{background:var(--amberbg)}
.bars{border-bottom-color:var(--line)}
.bar{background:var(--am)}
.judge li{border-top-color:var(--line)}
.judge span,.meta dt{color:var(--sub)}
#toast{background:var(--am);color:#000;border-color:#000}
#player a,#player summary{color:var(--am)}
#sheet{background:#000}
.sheethead,#top{border-bottom-color:#3a3b3d}
.row,.hist li,.prows li,.test{border-bottom-color:#3a3b3d}
.th.sm{border-color:#3a3b3d}
.err{color:var(--red)}
.playicon{background:rgba(0,0,0,.72);border-color:var(--am);color:var(--am)}
.playlabel{background:var(--am);color:#000;border-radius:6px}
.isdone .rowtxt strong{color:var(--sub)}
#brand{font-size:2.1rem;gap:.3em;align-items:center}
#brand .b1{color:#fff}
#brand .b2{color:var(--am);margin-left:-.3em}
#brand .b3{background:var(--am);color:#000;border:0;font-size:.5em;padding:.18em .5em .12em;border-radius:3px;letter-spacing:.05em}
@media print{
  :root{--ink:#111;--sub:#4a4a4a;--bg:#fff;--soft:#f3f3f3;--pane2:#eee;--line:#c9c9c9;--dark:#fff;--blue:#111}
  body{background:#fff;color:#111}
  .tag,.ghost,.minecard,.tiles li,.hero{background:#fff;color:#111}
}
/* 2026年10月13日に追加：練習ごとの記録、契約、水泳の画面 */
#tabs{grid-template-columns:repeat(6,1fr)}
@media(max-width:560px){#tabs{grid-template-columns:repeat(3,1fr)}#app{padding-bottom:200px}#toast{bottom:164px}}
.lr3{display:grid;gap:12px}
@media(min-width:620px){.lr3{grid-template-columns:1fr 1fr 1fr}}
.intake input[type=date]{display:block;width:100%;max-width:320px;min-height:54px;border:2px solid var(--line);border-radius:6px;padding:8px 14px;margin-top:6px;background:var(--soft);color:#fff;color-scheme:dark}
.tag.stop{border-color:var(--redline);color:var(--red);background:var(--redbg)}
.hero .note{margin-top:10px}
.hero .ghost{margin-top:12px}

/* ============ 画面の作り直し（2026年10月13日） ============
   説明や注記は消さず、押すと開く形にする。黄色は、いちばん押すボタンと、いま選んでいるものだけ。 */
#tabs{grid-template-columns:repeat(4,1fr)}
#tabs button{font-size:.82rem;min-height:66px}
@media(max-width:560px){#tabs{grid-template-columns:repeat(4,1fr)}#app{padding-bottom:130px}#toast{bottom:100px}}
#top{grid-template-columns:88px 1fr 88px}
.card{background:var(--soft);border:1px solid #2f3033;border-radius:16px;padding:18px;margin:16px 0}
.card h2{margin:0 0 10px;font-size:1.15rem}
.card h2:focus,.today h2:focus{outline:none}
.kicker{margin:0;font-weight:700;color:var(--sub);font-size:.9rem;letter-spacing:.04em}

const REF_NOTE = {"heneghan2019": "7研究168名（アスリートは20名のみ）の系統的レビュー。腕を上げる動作にともなって胸椎が伸展することが報告されている。エクササイズの効果を調べた研究ではない。", "welbeck2019": "大学競泳選手34名の横断研究。胸椎回旋の可動域は、肩甲骨の動きの異常の有無で差がなく、肩の痛みとも相関しなかった。胸椎回旋エクササイズを直接支持する結果ではない。", "johnson2012": "健常成人46名（競泳選手ではない）。胸椎回旋の可動域を測る5つの方法はいずれも信頼性が良好だった。測定法の研究であり、エクササイズの効果を調べたものではない。", "barrett2016": "10研究の系統的レビュー（競泳選手に限らない）。背すじを伸ばした姿勢のほうが丸めた姿勢より肩の可動域が大きいという強い根拠がある一方、単回の実験にもとづくため長期的な意義は不明としている。", "lee2020": "競泳選手ではなく、肩の機能障害がある患者32名の無作為化試験。フォームローラーと四つばいでの胸椎セルフモビライゼーションを週3回4週間行った群は、対照群より痛み、機能、肩の屈曲・外転・外旋の可動域が有意に改善した。", "laudner2013": "症状のない大学競泳選手19名の横断研究。広背筋が硬い選手ほど、腕を上げるときの肩甲骨の動きが変わっていた。ストレッチの効果を調べた研究ではない。", "herrington2014": "エリート競泳選手15名、カヌー選手、ラグビー選手、一般の対照を比べた研究。上腕を外旋した位置での肩屈曲の可動域は競技によって有意に異なり、広背筋の長さは競技の要求に応じて異なると結論している。", "tavares2022": "競泳選手を対象とした11論文の系統的レビュー。ストレッチで肩の可動域が改善した研究が1件、筋力とストレッチの併用で肩の姿勢が改善した研究が2件あったが、全体として研究の質は低いと述べている。", "laudner2015": "症状のない大学女子競泳選手39名。小胸筋への筋エネルギーテクニック（軽い等尺性収縮とストレッチの組み合わせ）を週2回6週間行った群は、小胸筋が長くなり、肩甲骨の前方位が減った。施術者が行う手技であり、セルフストレッチではない。", "borstad2006": "競泳選手が対象ではない。小胸筋の3種類のストレッチを比べ、片側のセルフストレッチが最も大きな筋の長さの変化を生んだ。大胸筋ではなく小胸筋の研究。", "muraki2009": "献体9体の研究（生きた人ではない）。小胸筋は肩の屈曲と肩甲骨面での挙上で大きく伸ばされた。", "umehara2021": "競泳選手が対象ではない。小胸筋の硬さは30秒1回のストレッチ直後に下がり、回数を増やすとさらに下がった。長いストレッチのほうが効果を保ちやすいと結論している。", "wolfram2023": "健常男性20名（競泳選手ではない）。肩を外転・外旋させたときの大胸筋の硬さの変化は、部位によって異なった。ストレッチの効果を調べた研究ではない。", "muraki2007": "献体9肩の研究（生きた人ではない）。肩甲下筋の下部の線維は、挙上、外転、屈曲、水平外転と、挙上30度から90度での外旋で大きく伸ばされた。上部と中部を大きく伸ばす姿勢は見つからなかった。", "lake2014": "スラスターではなくプッシュプレスの研究。筋力トレーニング経験のある男性で、ピークパワーは1RMの約75パーセントで最大となり、力学的な要求はジャンプスクワットと同程度だった。", "soriano2019": "プッシュプレスなど頭上へ押し上げる種目の研究13件の総説。パワーと最大筋力の向上に役立つ可能性があるとする一方、長期的なトレーニング効果はまだよく分かっていないと述べている。", "mcallister2014": "ウエイトトレーニング経験のある男性12名。4種目を1RMの85パーセントで比べ、ハムストリングスの筋活動はルーマニアンデッドリフトとグルートハムレイズで最も高かった。", "delgado2019": "トレーニング経験1年以上の男性8名。1RMでの大臀筋の活動は、ルーマニアンデッドリフトとヒップスラストの間に有意な差がなかった。", "lee2018": "男性21名。ルーマニアンデッドリフト1RMの70パーセントの重量で比べると、大腿直筋と大臀筋の筋活動、膝関節のトルクは、通常のデッドリフトのほうが有意に大きかった。ルーマニアンデッドリフトの優位を示す結果ではない。", "mo2023": "トレーニング経験2年以上の若い男性12名。片脚ルーマニアンデッドリフトは大臀筋上部と大腿二頭筋を非常に強く活動させた。支える脚と反対側の手で負荷を持つと、中臀筋と大臀筋の活動が高まった。", "sorensen2021": "女子エリートハンドボール選手23名。ルーマニアンデッドリフトは片脚でも両脚でもハムストリングスを強く活動させ、大腿二頭筋より半腱様筋の活動が高かった。", "speirs2016": "アカデミーのラグビー選手18名。後ろ足を台に乗せるスプリットスクワットだけの群とバックスクワットだけの群を5週間、週2回鍛えたところ、両群とも1RM、40メートル走、方向転換が有意に向上し、群の間に差はなかった。", "riemann2013": "若い成人32名。サイドランジはフォワードランジより足首と膝を伸ばす筋への負荷が大きく、股関節を伸ばす筋への負荷はフォワードランジのほうが大きかった。大臀筋や内転筋の筋活動を測った研究ではなく、このアプリの「大臀筋・内転筋」という表示を直接支える内容ではない。", "signorile2002": "トレーニング経験1年以上の男性10名。4種類の握り方のうち、広い手幅で体の前に引く方法が、広背筋の筋活動が最も大きかった。", "lusk2010": "健康な男性12名。1RMの70パーセントで、手幅にかかわらず順手のほうが逆手より広背筋の筋活動が大きかった。", "andersen2014": "筋力トレーニング経験のある男性15名。手幅を変えても広背筋などの筋活動はおおむね同程度で、広い手幅では扱える重量が小さかった。", "lehman2004": "トレーニング経験のある男性12名。ワイドグリップのプルダウンとシーテッドロウは、上腕二頭筋に対する広背筋の活動の比が最も高かったが、種目による違いは小さいと結論している。", "handa2005": "ウエイトトレーニング経験のある男性8名。1RMの70パーセントで5種目を比べ、ベントオーバーロウは僧帽筋の活動が高く、広背筋の活動はシーテッドロウとラットプルダウンが最も高かった。", "fenwick2009": "健康な男子大学生7名。立って行うベントオーバーロウは背中全体を左右対称に大きく活動させた一方、比べた3種目の中で腰椎への負荷が最も大きかった。", "muyor2022": "運動習慣のある健康な成人20名（競泳選手ではない）。広背筋と上腕三頭筋の筋活動はストレートアームプルダウンで最も高かった。", "rodriguezridao2020": "トレーニング経験1年以上の若い成人30名。大胸筋上部の活動は傾斜30度で最大となり、45度を超えると三角筋前部の活動が増えて大胸筋の活動が下がった。", "trebs2010": "健康な男性15名。大胸筋の鎖骨部の活動は44度と56度で水平より大きく、胸肋部は水平で最も大きかった。", "lauver2016": "トレーニング経験のある男性14名。挙上全体では大胸筋上部に角度による差はなかったが、挙上の途中の区間では30度と45度が水平より高かった。", "calatayud2015": "大学生30名（男性22名、女性8名）。筋活動が同じ程度になるようにそろえたベンチプレスと、ゴムバンドで負荷をかけた腕立て伏せを5週間行うと、筋力の伸びは同じ程度だった。", "suprak2011": "28名。通常の腕立て伏せで手にかかる荷重は体重の約69パーセント（上の位置）から約75パーセント（下の位置）、膝つきでは約54パーセントから約62パーセントだった。", "ludewig2004": "健康な人と軽い肩の機能障害がある人の計30名。押し切ったところで肩甲骨をさらに前に出すプッシュアップ・プラスは、前鋸筋の活動が最も高かった。", "clemons2010": "大学生年代の男女43名。座って胸からメディシンボールを押し出して投げる距離は、ベンチプレスのパワーと高く相関した。立って壁に投げるチェストパスそのものの研究ではなく、測定法の研究。", "szymanski2007": "高校野球選手49名の無作為化試験（競泳選手ではない）。筋力トレーニングに回旋系のメディシンボール種目を12週間加えた群は、加えない群より体幹の回旋筋力、メディシンボール投げ、バット速度の向上が大きかった。", "ikeda2007": "男子16名、女子10名のアスリート。横向きのメディシンボール投げの記録は、男子でのみ体幹回旋の力やスクワット1RMと有意に相関した。", "tsartsapakis2023": "健康な女性44名の超音波測定。サイドプランクやデッドバグを含む5種目のうち、デッドバグが腹横筋の厚さを最も大きく増やした。", "ekstrom2007": "健康な成人30名。9種目の筋電図を比べ、サイドブリッジ（サイドプランク）は中臀筋と外腹斜筋の強化に使える可能性があるとした。", "mcgill2009": "健康な男性8名。サイドブリッジなどの各種のやり方で筋活動と脊柱の姿勢を測り、段階的に難しくする進め方を示した。", "mcgill2015": "男性14名。脚を伸ばしたハンギングレッグレイズは腹直筋と外腹斜筋の活動が非常に高く、脊柱を圧縮する力は平均約3000ニュートンだった。", "axler1997": "9名が12種類の腹筋運動を行った研究。腹筋の活動を脊柱の圧縮力で割った値は部分的なカールアップでおおむね最も高く、脊柱への負荷を最小にしながらすべての腹筋を鍛えられる単一の種目はなかった。", "marshall2010": "ブタの頸椎の標本を使った実験（人の運動を調べたものではない）。ひねる力だけでは椎間板ヘルニアは始まらなかったが、くり返しの曲げ伸ばしと組み合わせると、67.5パーセントの標本で線維輪に亀裂が生じた。ひねりと曲げを同時にくり返す種目に注意が必要とする根拠。", "karpinski2020": "ポーランドの全国レベルの男子競泳選手16名の無作為化試験。ロシアンツイストを含む4種目の体幹トレーニングを週3回6週間加えた群は、50メートル自由形が1.2パーセント短縮した。4種目をまとめた効果であり、ロシアンツイスト単独の効果は分からない。", "thng2019": "競泳選手を対象とした16研究の系統的レビュー。スタートの成績は垂直跳びの高さと非常に強く相関した。この種目そのものを調べた研究ではない。", "weston2015": "全国レベルのジュニア競泳選手20名。水中練習に週3回12週間の体幹トレーニングを加えた群は、50メートル自由形が2.0パーセント短縮した。体幹トレーニング全体の効果であり、この種目が含まれていたかは確認できていない。", "morouco2011": "全国レベルの男子競泳選手10名。ラットプルダウンのパワーは、牽引泳で測った力と中程度から強い関連を示した。"};

/* ---- 動画プレーヤー ---- */
let playing = null, lastFocus = null;
function ytId(u){ const m = String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); return m?m[1]:null; }
function openPlayer(id){
  lastFocus = document.activeElement; playing = {id, logged:false};
  drawPlayer(); $('#player').hidden = false; document.body.classList.add('lock'); $('#pTitle').focus();
}
function drawPlayer(){
  const e = EXMAP[playing.id]; const url = sessionVideos[e.id] || db.videos[e.id]; const y = url && ytId(url);
  let media;
  if(y) media = '<iframe src="https://www.youtube-nocookie.com/embed/'+y+'?rel=0" title="'+esc(e.name)+'の動画" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
  else if(url) media = '<video id="pVideo" src="'+esc(url)+'" controls playsinline autoplay></video>';
  else media = '<div class="novideo">'+thumb(e,'lg')+'<p>この種目の動画はまだ登録されていません。下の「動画を登録する」から、動画ファイルか動画のアドレスを登録してください。</p></div>';
  $('#player').innerHTML =
    '<div class="phead"><button type="button" class="pclose" id="pClose">閉じる</button><h2 id="pTitle" tabindex="-1">'+esc(e.name)+'</h2></div>'+
    '<div class="pmedia">'+media+'</div>'+
    (y?'<p class="pnote"><a target="_blank" rel="noopener" href="'+esc(url)+'">動画が映らないときは、ユーチューブで開く</a></p>':'')+
    '<div class="pbody"><h3>動かし方のポイント</h3><p class="pcue">'+esc(e.cue)+'</p>'+
    '<h3>注意</h3><p>'+e.demerit.map(esc).join('。')+'。</p>'+
    '<button type="button" class="cta" id="pDone">見終わった（記録する）</button>'+
    '<details id="pReg"'+(url?'':' open')+'><summary>動画を登録する・入れ替える</summary>'+
      '<label>動画ファイルを選ぶ（このページを開いている間だけ有効）<input type="file" id="pFile" accept="video/*"></label>'+
      '<label>動画のアドレスを貼る（ユーチューブ、またはmp4ファイルのアドレス。保存されます）<input type="url" id="pUrl" value="'+esc(db.videos[e.id]||'')+'" placeholder="https://"></label>'+
      '<div class="stackbtns"><button type="button" class="ghost" id="pSet">このアドレスを登録する</button>'+(db.videos[e.id]?'<button type="button" class="ghost" id="pDel">登録を消す</button>':'')+'</div></details></div>';
  const v = $('#pVideo'); if(v) v.addEventListener('ended',markWatched);
}
function markWatched(){ if(playing && !playing.logged){ playing.logged = true; addLog({id:playing.id, kind:'watch'}); say('動画を見た記録を付けました'); } }
function closePlayer(){ $('#player').innerHTML = ''; $('#player').hidden = true; document.body.classList.remove('lock'); playing = null; render(false); if(lastFocus && document.contains(lastFocus)) lastFocus.focus(); else $('#title').focus(); }
$('#player').addEventListener('click',e=>{
  if(e.target.id==='pClose') closePlayer();
  if(e.target.id==='pDone'){ markWatched(); closePlayer(); }
  if(e.target.id==='pSet'){ const u = $('#pUrl').value.trim(); if(!/^https?:\/\//.test(u)){ say('httpsから始まるアドレスを入れてください'); return; } db.videos[playing.id] = u; delete sessionVideos[playing.id]; save(); say('動画を登録しました'); drawPlayer(); $('#pTitle').focus(); }
  if(e.target.id==='pDel'){ delete db.videos[playing.id]; save(); say('動画の登録を消しました'); drawPlayer(); $('#pTitle').focus(); }
});
$('#player').addEventListener('change',e=>{
  if(e.target.id==='pFile' && e.target.files[0]){ sessionVideos[playing.id] = URL.createObjectURL(e.target.files[0]); say('動画を読み込みました'); drawPlayer(); $('#pTitle').focus(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!$('#player').hidden) closePlayer(); else if(!$('#sheet').hidden) closeSheet(); } });

/* ---- 記録 ---- */
VIEWS.activity = ()=>{
  const done = db.logs.filter(l=>l.kind==='done'), watch = db.logs.filter(l=>l.kind==='watch');
  const days = []; const now = new Date();
  for(let i=6;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()-i); const k = dayOf(d); days.push({label:(d.getMonth()+1)+'/'+d.getDate(), n:done.filter(l=>dayOf(l.t)===k).length}); }
  const max = Math.max(1,...days.map(d=>d.n));
  const per = {}; done.forEach(l=>{ per[l.id] = (per[l.id]||0)+1; });
  const top = Object.entries(per).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return {title:'記録', html:
    '<ul class="tiles"><li><span class="big">'+done.length+'</span><span>これまでの実施</span></li><li><span class="big">'+weekCount()+'</span><span>直近7日の実施</span></li><li><span class="big">'+watch.length+'</span><span>動画を見た回数</span></li><li><span class="big">'+new Set(done.map(l=>dayOf(l.t))).size+'</span><span>実施した日数</span></li></ul>'+
    '<h2>直近7日の実施数</h2><ul class="bars">'+days.map(d=>'<li><span class="barv">'+d.n+'</span><span class="bar" style="height:'+Math.round(d.n/max*100)+'%"></span><span class="barl">'+d.label+'</span><span class="sr">'+d.label+'は'+d.n+'種目</span></li>').join('')+'</ul>'+
    '<h2>よく行っている種目</h2>'+(top.length?'<ol class="top">'+top.map(t=>'<li><button type="button" class="link" data-go="detail" data-id="'+t[0]+'">'+esc(EXMAP[t[0]]?EXMAP[t[0]].name:t[0])+'</button> '+t[1]+'回</li>').join('')+'</ol>':'<p class="sub">まだ記録がありません。種目の画面で「実施を記録する」を押すと、ここにたまっていきます。</p>')+
    '<h2>履歴（新しい順）</h2>'+(db.logs.length?'<ul class="hist">'+[...db.logs].reverse().slice(0,50).map(logLine).join('')+'</ul>':'<p class="sub">履歴はまだありません。</p>')+
    '<h2>データの保存と持ち出し</h2><div class="note">記録はこのパソコンのこのブラウザーの中に保存されます。ブラウザーの履歴やデータを消すと一緒に消えるので、ときどきバックアップを保存してください。</div>'+
    '<div class="stackbtns"><button type="button" class="ghost" id="xCsv">記録を表計算用のファイル（CSV）で保存</button><button type="button" class="ghost" id="xJson">バックアップを保存</button>'+
    '<label class="filebtn ghost">バックアップから戻す<input type="file" id="iJson" accept=".json,application/json"></label></div>',
    after(){
      $('#xCsv').addEventListener('click',()=>{
        const q = s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
        const rows = [['日時','種目','カテゴリー','内容','セット','回数','重量kg','メモ']].concat(db.logs.map(l=>{ const e = EXMAP[l.id]||{}; return [l.t, e.name||l.id, CATS[e.cat]||'', l.kind==='watch'?'動画を見た':'実施', l.sets, l.reps, l.load, l.memo]; }));
        dl('swim_wt_kiroku_'+today()+'.csv', '﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'), 'text/csv');
      });
      $('#xJson').addEventListener('click',()=>dl('swim_wt_backup_'+today()+'.json', JSON.stringify(db), 'application/json'));
      $('#iJson').addEventListener('change',ev=>{ const f = ev.target.files[0]; if(!f) return; f.text().then(t=>{ try{ const o = JSON.parse(t); if(!o || !Array.isArray(o.logs)) throw 0; db = Object.assign({saved:[],prog:[],goal:'power',logs:[],videos:{},check:{}}, o); save(); applyUserLib(); say('バックアップから戻しました'); render(false); }catch(x){ say('このファイルは読み込めませんでした'); } }); });
    }
  };
};
function dl(name, text, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text],{type})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); say(name+' を保存しました'); }

/* ---- プログラム ---- */
VIEWS.program = ()=>{
  const g = GOALS[db.goal];
  const groups = BLOCKS.map(b=>({b, rows:db.prog.filter(r=>EXMAP[r.id] && defaultBlock(EXMAP[r.id])===b)})).filter(x=>x.rows.length);
  const td = today();
  return {title:'プログラム', html:
    '<label class="field">トレーニングの目的<select id="pGoal">'+Object.keys(GOALS).map(k=>'<option value="'+k+'"'+(k===db.goal?' selected':'')+'>'+GOALS[k].label+'</option>').join('')+'</select></label>'+
    '<div class="note">'+esc(g.swim)+'</div><details class="plain"><summary>この目的の処方の根拠を見る</summary>'+refList(g.refs)+'</details>'+
    (groups.length ? groups.map(x=>'<h2>'+x.b+'</h2><ul class="prows">'+x.rows.map(r=>{
        const e = EXMAP[r.id], rx = rxFor(e, db.goal); const dn = db.logs.some(l=>l.id===e.id && l.kind==='done' && dayOf(l.t)===td);
        return '<li class="'+(dn?'isdone':'')+'"><button type="button" class="row" data-go="detail" data-id="'+e.id+'">'+thumb(e,'sm')+'<span class="rowtxt"><strong>'+esc(e.name)+'</strong>'+
          (e.norx?'<span class="sub">処方は未登録です。回数や重さはコーチが決めてください。</span><span class="sub" hidden>':'<span class="sub">')+esc(rx.sets)+'セット、'+esc(rx.reps)+(rx.load?'、'+esc(rx.load):'')+'、休息 '+esc(rx.rest)+'</span>'+(dn?'<span class="tags"><span class="tag ok">今日は実施済み</span></span>':'')+'</span></button>'+
          '<div class="prbtns"><button type="button" class="ghost small" data-play="'+e.id+'">動画</button><button type="button" class="ghost small" data-pdone="'+e.id+'">'+(dn?'もう一度記録':'実施済みにする')+'</button><button type="button" class="ghost small" data-prm="'+e.id+'" aria-label="'+esc(e.name)+'をプログラムから外す">外す</button></div></li>';
      }).join('')+'</ul>').join('')
      : '<div class="note">まだ種目が入っていません。下のひな形から入れるか、種目の画面で「プログラムに追加」を押してください。</div>')+
    '<h2>ひな形から入れる</h2><div class="stackbtns">'+Object.keys(TEMPLATES).map(k=>'<button type="button" class="ghost" data-tpl="'+k+'">'+TEMPLATES[k].label+'（'+TEMPLATES[k].ids.length+'種目）</button>').join('')+'</div>'+
    (db.prog.length?'<div class="stackbtns" style="margin-top:20px"><button type="button" class="ghost" id="pPrint">印刷する</button><button type="button" class="ghost" id="pClear">プログラムを空にする</button></div>':''),
    after(){
      $('#pGoal').addEventListener('change',e=>{ db.goal = e.target.value; save(); render(false); $('#pGoal').focus(); });
      const p = $('#pPrint'); if(p) p.addEventListener('click',()=>window.print());
      const c = $('#pClear'); if(c) c.addEventListener('click',()=>{ db.prog = []; save(); say('プログラムを空にしました'); render(false); });
    }
  };
};

/* ---- セルフチェック ---- */
VIEWS.check = ()=>{
  return {title:'セルフチェック', html:
    '<p>左右の角度を入れると、目安に届いていない項目と、おすすめの修正エクササイズが出ます。</p>'+
    TESTS.map(t=>{
      const c = db.check[t.key]||{};
      return '<section class="test"><h2>'+esc(t.name)+'</h2><p>'+esc(t.desc)+'</p><p class="sub">目安は'+t.target+'度</p>'+
        '<div class="lr"><label>左（度）<input type="number" inputmode="numeric" data-ck="'+t.key+'" data-side="L" value="'+(c.L==null?'':c.L)+'"></label><label>右（度）<input type="number" inputmode="numeric" data-ck="'+t.key+'" data-side="R" value="'+(c.R==null?'':c.R)+'"></label></div>'+
        '<div class="ckres" id="ck-'+t.key+'" role="status"></div></section>';
    }).join(''),
    after(){ TESTS.forEach(drawCheck); $('#view').oninput = onCheckInput; }
  };
};
function onCheckInput(e){
  const k = e.target.dataset.ck; if(!k) return;
  db.check[k] = db.check[k]||{}; db.check[k][e.target.dataset.side] = e.target.value===''?null:Number(e.target.value); save();
  drawCheck(TESTS.find(t=>t.key===k));
}
function drawCheck(t){
  const box = $('#ck-'+t.key); if(!box) return; const c = db.check[t.key]||{};
  if(c.L==null && c.R==null){ box.innerHTML = ''; return; }
  const parts = []; let short = false;
  [['L','左'],['R','右']].forEach(([s,lab])=>{ const v = c[s]; if(v==null) return; if(v<t.target){ short = true; parts.push(lab+'は'+v+'度で、目安まであと'+(t.target-v)+'度'); } else parts.push(lab+'は'+v+'度で、目安に届いています'); });
  const diff = (c.L!=null && c.R!=null && Math.abs(c.L-c.R)>=10) ? ' 左右差が'+Math.abs(c.L-c.R)+'度あります（このツールでは10度以上を左右差の目安にしています）。' : '';
  box.innerHTML = '<div class="note '+(short||diff?'bad':'good')+'">'+parts.join('。')+'。'+diff+'</div>'+
    (short ? '<p><strong>おすすめの修正エクササイズ</strong></p><ul class="rows">'+t.fix.map(id=>exRow(EXMAP[id])).join('')+'</ul><button type="button" class="ghost" data-fixadd="'+t.key+'">この'+t.fix.length+'種目をプログラムに追加</button>' : '');
}

/* ============ 共通の押したときの動き ============ */
document.addEventListener('click',e=>{
  if(e.target.closest('#sheet') || e.target.closest('#player')) return;
  let b;
  if((b = e.target.closest('[data-play]'))){ openPlayer(b.dataset.play); return; }
  if((b = e.target.closest('[data-pdone]'))){ const ex = EXMAP[b.dataset.pdone], rx = rxFor(ex, db.goal); addLog({id:ex.id, kind:'done', sets:nums(rx.sets)[0]||'', reps:ex.norx?'':rx.reps, load:'', memo:'プログラムから記録'}); say(ex.name+'を実施済みにしました'); render(false); return; }
  if((b = e.target.closest('[data-prm]'))){ db.prog = db.prog.filter(x=>x.id!==b.dataset.prm); save(); say('プログラムから外しました'); render(false); return; }
  if((b = e.target.closest('[data-tpl]'))){ const t = TEMPLATES[b.dataset.tpl]; if(t.goal) db.goal = t.goal; let n = 0; t.ids.forEach(id=>{ if(!db.prog.some(x=>x.id===id)){ db.prog.push({id}); n++; } }); save(); say(n+'種目を追加しました'); render(false); return; }
  if((b = e.target.closest('[data-fixadd]'))){ const t = TESTS.find(x=>x.key===b.dataset.fixadd); let n = 0; t.fix.forEach(id=>{ if(!db.prog.some(x=>x.id===id)){ db.prog.push({id}); n++; } }); save(); say(n+'種目をプログラムに追加しました'); return; }
  if((b = e.target.closest('[data-golist]'))){
    const k = b.dataset.golist;
    if(k==='cat'){ resetFilt({cat:b.dataset.cat}); go('list',{label:CATS[b.dataset.cat]}); }
    else if(k==='saved'){ resetFilt({saved:true}); go('favs'); }
    else if(k==='prog'){ resetFilt({inProg:true}); go('list',{label:'プログラムに入れた種目'}); }
    else if(k==='done'){ resetFilt({done:true}); go('list',{label:'実施したことがある種目'}); }
    else if(k==='gym'){ resetFilt({gym:true}); go('list',{label:'体操の種目'}); }
    else if(k==='gympri'){ resetFilt({gym:true,pri:true}); go('list',{label:'競泳への優先度が高いとされた体操の種目'}); }
    else if(k==='nopaper'){ resetFilt({paper:'none'}); go('list',{label:'星1つの種目'}); }
    else if(k==='related'){ resetFilt({paper:'related'}); go('list',{label:'星2つの種目'}); }
    else { resetFilt(); go('list',{label:'すべての種目'}); }
    return;
  }
  if((b = e.target.closest('[data-go]'))){ go(b.dataset.go, b.dataset.id?{id:b.dataset.id}:null); return; }
  if((b = e.target.closest('[data-tab]'))){ go(b.dataset.tab); return; }
  if(e.target.closest('#back')) back();
});

/* ============ 聞き取り・助言・測定（2026年10月10日に追加） ============
 推奨の数字は ACSM 2009（文献 acsm2009）の要旨にあるものだけを使う。
 競泳選手としての注意は、元のアプリにあった講演資料と論文の記述を使う。 */
const LEVELS = {
  novice:{label:'初心者', def:'レジスタンストレーニングの経験がない、または数年間トレーニングをしていない人', freq:[2,3], load:'8から12RM（8回から12回で限界になる重さ）'},
  inter:{label:'中級者', def:'約6か月間、継続してレジスタンストレーニングをしている人', freq:[3,4], load:'1から12RMの広い範囲を周期的に使い、最終的には高負荷（1から6RM）に重点を置く'},
  adv:{label:'上級者', def:'数年のレジスタンストレーニング経験がある人', freq:[4,5], load:'1から12RMの広い範囲を周期的に使い、最終的には高負荷（1から6RM）に重点を置く'}
};
const ACSM_GOAL = {
  strength:'最大筋力：セット間の休憩は3分から5分。1秒から2秒で上げ、1秒から2秒で下ろす中程度の速さで行う。',
  hypertrophy:'筋肥大：1から12RMを周期的に使い、6から12RMに重点を置く。セット間の休憩は1分から2分、中程度の速さ。量の多い複数セットが勧められている。',
  power:'パワー：二つの方法がある。一つは筋力トレーニング。もう一つは軽い負荷（下半身は1RMの0から60パーセント、上半身は30から60パーセント）を速く動かす方法で、休憩は3分から5分、1種目あたり3から5セット。全身を使う多関節の種目に重点を置く。',
  endurance:'筋持久力：軽い負荷から中程度の負荷（1RMの40から60パーセント）で、15回を超える高回数を、90秒未満の短い休憩で行う。'
};
const ORDER_RULES = [['big','大きな筋肉の種目を、小さな筋肉の種目より先に行う'],['multi','多関節の種目を、単関節の種目より先に行う'],['high','高強度の種目を、低強度の種目より先に行う']];
function srcBox(keys){
  if(!keys || !keys.length) return '<p><span class="tag warn">根拠の文献は未登録</span> <span class="sub" style="display:inline">コーチの方針として載せている項目です。</span></p>';
  return '<details class="plain"><summary>根拠を見る（文献'+keys.length+'件）</summary>'+refList(keys)+'</details>';
}
function levelOf(exp){ return exp==='years'?'adv':exp==='half'?'inter':'novice'; }

/* しきい値を超えたときの気づき。メリットとデメリットを並べて返す */
function flagsFor(a){
  const out = []; if(!a) return out;
  const L = LEVELS[a.level];
  const f = Number(a.freq), reps = Number(a.reps), rest = Number(a.rest), sets = Number(a.sets), swim = Number(a.swim);
  if(a.freq!=='' && f > L.freq[1]) out.push({t:'週'+f+'回は、'+L.label+'に勧められている週'+L.freq[0]+'回から'+L.freq[1]+'回を超えています',
    merit:'ACSMは、経験を積んだ人ほど高い頻度を勧めています（中級者は週3回から4回、上級者は週4回から5回）。経験が増えれば選択肢になります。',
    demerit:'持久トレーニングと筋力トレーニングを同時に行うと、筋力やパワーの伸びが妨げられることがあり、持久トレーニングの量や頻度が多いほど大きくなるとされます。講演では、週の基本はスイム5回、ウエイト3回、休養2日とされ、ウエイトの量、特に下半身の疲労の管理が課題と指摘されました。',
    src:['acsm2009','wilson2012','asp']});
  if(a.freq!=='' && f>0 && f < L.freq[0]) out.push({t:'週'+f+'回は、'+L.label+'に勧められている週'+L.freq[0]+'回から'+L.freq[1]+'回より少なくなっています',
    merit:'水中練習の疲労と重なりにくくなります。講演では、疲労が残ると本来の力ではなく、こなすための力配分になると指摘されました。',
    demerit:'ACSMが'+L.label+'に勧める頻度に届いていません。',
    src:['acsm2009','asp']});
  if(a.reps!=='' && reps > 15) out.push({t:'1セット'+reps+'回は、筋持久力をねらう回数（15回を超える）です',
    merit:'ACSMは、局所の筋持久力には軽い負荷から中程度の負荷で15回を超える高回数を勧めています。',

function num(v){ return (v===''||v==null||isNaN(Number(v))) ? null : Number(v); }
function measuredGrowth(){
  /* 最新の身長と、それより半年以上前の身長を比べる。1年以上あいていれば「確定」に使える */
  const hs = (db.tests||[]).filter(t=>num(t.h)!=null).sort((x,y)=>x.date<y.date?-1:1);
  if(hs.length<2) return null;
  const b = hs[hs.length-1]; const gap = t=>(new Date(b.date)-new Date(t.date))/86400000;
  let a = null;
  for(let i=hs.length-2;i>=0;i--){ if(gap(hs[i])>=365){ a = hs[i]; break; } }
  if(!a) for(let i=hs.length-2;i>=0;i--){ if(gap(hs[i])>=180){ a = hs[i]; break; } }
  if(!a) return null;
  const days = gap(a);
  return {rate:Math.round((b.h-a.h)/days*365*10)/10, from:a.date, to:b.date, year:days>=365};
}

  const sure = !!(mg && mg.year);
  if(sure){ r.growthSrc = '1年以上あいた測定の記録（'+mg.from+'から'+mg.to+'）から計算'; }
  else if(mg){ r.growthSrc = '半年以上あいた測定の記録（'+mg.from+'から'+mg.to+'）から1年分に換算。誤差が大きい'; }
  r.provisional = !sure;
  const tag = sure ? '' : '仮の判定：';
  if(g!=null){
    /* 確定は医療で使われる基準（過去1年の伸びが年1センチ未満）。本人の答えは1センチ刻みなので、1センチ以下を仮にシニアとする */
    if(sure ? g < GROW_LINE : g <= GROW_LINE){ r.stage = 'senior'; r.stageLabel = sure ? 'シニア（1年以上あいた記録で、身長の伸びが年1センチ未満）' : 'シニア（仮の判定：1年以上あいた身長の記録がまだないため）'; }

    else { r.stage = 'pre'; r.stageLabel = 'ジュニア（'+tag+'身長の伸びの山の前か、その最中）'; }
  } else if(age!=null && age < 16){ r.stage = 'pre'; r.stageLabel = 'ジュニア（仮の判定：身長の記録がなく、16歳未満のため）'; }
  else if(age!=null){ r.stage = 'senior'; r.stageLabel = 'シニア（仮の判定：身長の記録がないため、年齢だけで判定）'; }
  else { r.stage = 'unknown'; r.stageLabel = '判定できません（年齢か身長の伸びを入れてください）'; }
  r.junior = r.stage==='pre' || r.stage==='post';
  const t50 = num(a.t50), t100 = num(a.t100), t400 = num(a.t400);
  const main = a.main==='100' ? t100 : a.main==='50' ? t50 : null;

function intakeResultHTML(a){

    '<div class="note">この判定は、入力された数字を決まった規則に当てはめたものです。区分の境目の秒数と、ジュニアの中を分ける線（年4センチ未満で伸びが増えていなければ山を過ぎたとみなす）は、論文にある線ではなく、このアプリの仮の設定です。成長が止まったかどうかは、医療で使われている基準（過去1年の伸びが年'+GROW_LINE+'センチ未満）で判定し、1年以上あいた身長の記録がそろうまでは仮の判定と表示します。最終的な判断はコーチが行ってください。</div>';

    h += item(r.stage==='post'?'伸びの山を過ぎた時期に':'伸びの山の前か最中の時期に', r.stage==='post' ? '思春期以降は、神経の適応に加えて筋肉量の増加が筋力の伸びに加わるとされています。技術が保てることを条件に、重さを段階的に上げていく時期です。' : '思春期前の筋力の伸びは、主に神経の適応によるとされています。重さを追うより、正しい動きを数多く身につけることを優先してください。', ['lloyd2014']);

  } else {
    h += item('基本の方針', '泳ぎへの転移には、量が少なく、負荷または速度が高いトレーニングが最適とされています。最大筋力を高める高い負荷を使い、筋持久力をねらう高回数のトレーニングは行いません。', ['crowley2017','wirth2022','asp']);

  const N = {"giant1999":"1994年世界選手権の男子33名、女子34名の車輪101本を分析。車輪の前半は体から鉄棒へ、後半は鉄棒から体へエネルギーが移り、全体のエネルギーを増やすには筋による仕事が必要だった。","williams2015":"男子の初心者12名が鉄棒の車輪を8週間学ぶ過程を調べた。肩で大きなパワーを出せるかどうかが、上達を左右する要因だった。","fujihara2012":"あん馬の両足旋回を、吊り下げの補助具あり、なしで比べた。補助具は重心の軌道と力の大きさを変えるが、全体のパターンは変えなかった。","ironcross2004":"男子体操選手6名。つり輪と練習用の補助具で十字懸垂を行ったときの肩まわり9筋の筋電図を比べた。補助具では多くの筋の活動が下がり、肩の使い方がつり輪とは変わった。","farana2017":"チェコ代表レベルの女子体操選手7名。ロンダートの手の着き方2種類を比べ、けがの危険は主に、平行に着く型の2番目に着く手の側にあると結論している。","irwin2009":"男子エリート体操選手4名。旧来の跳馬と現行の跳馬テーブルで比べ、助走と踏切には差がなかったが、着手の角度が違い、テーブルでは上向きの離手速度が高かった。","hiley2015":"男子エリート選手1名の跳馬をもとにしたコンピュータモデルの研究。着手のときの速度と角運動量が大きいほど、その後の空中での回転量が増えた。","mills2009":"体操選手の筋力をもとにしたモデルで跳馬の着地を再現した。床からの力を最小にする着地では、骨や関節、筋にかかる体の中の負荷の多くがかえって増えた。","bradshaw2020":"女子体操選手7名。90センチの台から後方宙返りで着地したときの床からの力と、背中のセンサーの減速度を比べた。両者は置き換えられないと報告している。","navarro2021":"体操選手4名の後方抱え込み宙返り60本。高く、または速く回るよう指示すると、選手は股関節を伸ばすより膝を曲げる方向で調整する傾向があった。","tumbling2007":"女子体操選手13名。後方伸身と前方伸身の宙返りの踏切を筋電図で比べ、後方の踏切は接地時間が長く、ふくらはぎと太もも裏の活動が前方より大きかった。","yeadon1993":"エリートのトランポリン選手1名のひねり宙返り4種目。踏切のときの技術より、空中での技術のほうが、ひねりへの寄与が大きかった。","yeadon2003":"男子体操選手4名の倒立。全員が手首の力で前後の揺れを直す方法を使っていた。","mcclure2007":"症状のない成人54名。内旋が硬い側を4週間毎日伸ばしたところ、クロスボディストレッチの群は内旋の可動域が約20度増え、何もしない群より有意に大きかった。","chepeha2018":"内旋が硬い大学のバレーボール、水泳、テニスの選手37名。スリーパーストレッチを8週間毎日行った群は、肩の内旋と水平内転の可動域、肩の機能が有意に改善した。クロスボディではなく、同じ肩の後ろ側を伸ばす別のストレッチの研究。","takeuchi2021":"健常者12名。20秒3回のジャックナイフストレッチで膝を伸ばす可動域が増えた。筋と腱の硬さが下がったのは、強く行ったときだけだった。","davis2005":"ハムストリングスが硬い19名。30秒1回を週3日、4週間。3種類のストレッチのうち、何もしない群より有意に伸びたのは静的ストレッチだけだった。座って前屈する形そのものの研究ではない。","splitvib2011":"平均13.8歳の女子体操選手22名。前後開脚と前方ランジの姿勢で10秒4セットのストレッチを行うと柔軟性が向上した。振動を加える上乗せ効果は、利き脚でない側だけで有意だった。","fjerstad2018":"股関節の内転筋が硬い活動的な成人40名。60秒の静的ストレッチでの可動域の増加は約1度とわずかで、何もしない条件との差はなかった。筋力の低下もなかった。この3種目そのものではなく、内転筋のストレッチ一般の研究。","konrad2021":"8研究、165名のメタ分析。股関節の前側の筋の1回のストレッチは、120秒までならパフォーマンスに影響しないか良い影響の可能性があり、270秒から480秒ではごく小さな低下がみられた。","radford2006":"無作為化試験5本のメタ分析。ふくらはぎの静的ストレッチで、足首を反らす可動域が、伸ばした時間に応じて約2度から3度、有意に増えた。","schoenfeld2014":"19名が4種類のプランクを30秒ずつ行った。肘を前に出すロングレバーのプランクは、通常のプランクより腹直筋と外腹斜筋の活動が高かった。","imai2010":"健常な男性9名。フロントプランク、バードドッグ、サイドブリッジなどの体幹の筋活動を測り、不安定な面ではおおむね筋活動が高まった。","ji2021":"韓国の思春期のエリート競泳選手30名。12週間の体幹トレーニングで、無酸素パワーやプランクの持久力は従来のウエイトより伸びたが、泳ぎの記録の改善には差がなかった。","escamilla2006":"健常な男女21名。30度の傾斜でのリバースクランチは、腹直筋と内腹斜筋の活動が最も高い種目の群に入った。","schoffstall2010":"21名がクランチ、仰向けのVアップなどを行った。腹直筋と外腹斜筋の活動に種目の差はなく、器具なしの種目も器具ありと同じ程度に腹筋を働かせた。","ng1994":"健常な成人18名。うつ伏せで体を反らせる姿勢を基準に、2種類の背筋の保持運動を比べ、脊柱起立筋と多裂筋は基準の66から79パーセントで同じように働いていた。","ni2014":"ヨガの経験者30名。ダウンドッグとプランクは、外腹斜筋の強化に有効な姿勢とされた。","kinoshita2022":"倒立ができる健常な男性13名（体操選手ではない）。倒立に向けた4段階の姿勢で、肩まわりの筋活動は段階的に増えた。","kerwin2001":"6名の倒立。うまく保てたときは手首と肩の力で前後のバランスをとり、うまくいかないときほど股関節の力の影響が大きかった。","wyatt2021":"全国レベルの女子体操選手10名（平均10歳）。倒立を10秒を超えて保てる選手と、4秒から6秒の選手では、バランスのとり方が違っていた。","mcdonald2025":"倒立についての21研究の系統的レビュー。選手はふつう手首でバランスをとり、足りないときに肩、股関節、肘を使う。筋力が高いほど制御が良いと報告されている。","mizutori2021":"男子体操選手59名の伸腕プレス倒立。技能の低い群は肩の力が大きく、技能の高い群は動作の後半に股関節の力が大きかった。","niespodzinski2026":"男子体操選手41名（10歳から12歳の25名と成人16名）の平行棒でのプレス倒立。できる少年とできない少年の差は前鋸筋の活動にあり、肩甲骨の制御が成否に関わると示唆された。","angioi2026":"倒立で6歩歩ける選手10名。肩に痛みのある選手は歩く速さが遅く、腕がより曲がっていた。","marcolin2015":"健常な若い人8名が5種類の腕立て伏せを行った。上腕三頭筋と大胸筋の活動は、手幅の狭い腕立て伏せで最も高かった。ダイヤモンドの形そのものは扱っていない。","wurm2010":"足を台に乗せた腕立て伏せは、通常、膝つき、手を台に乗せた形のどれよりも、床からの力が大きかった。","koch2012":"活動的な健常男性22名。手をたたく腕立て伏せは、台から落ちる腕立て伏せより、力の立ち上がりが速かった。床からの力の最大値は同じ程度だった。","mckenzie2022":"トレーニング経験のある男性13名。バーのディップスはベンチのディップスより多くの筋で活動が高く、リングのディップスは大胸筋、広背筋、上腕二頭筋がバーより高かった。","wang2023":"実際に測ったのではなく、力学モデルで80通りの体型を計算した研究。同じ身長なら、脚が長く体幹が短い体型ほどプランシェのバランスに有利とされた。筋力は考えに入っていない。","youdas2010":"懸垂ができる男女25名。逆手のチンアップは大胸筋と上腕二頭筋、順手のプルアップは僧帽筋下部の活動が高く、広背筋には有意な差がなかった。","dickie2017":"筋力トレーニング経験のある男性19名。順手、逆手、手のひらを向かい合わせる握り、ロープの4種類の懸垂で、筋活動は全体にほぼ同じだった。上げるときは下ろすときより活動が高かった。","sanchezmoreno2017":"男性52名の加重懸垂。挙上の速さと、最大重量に対する割合には強い関係があり、速さの落ち方から残りの回数を見積もれた。","snarr2013":"男女15名。広背筋、僧帽筋中部、三角筋後部の活動は、通常のインバーテッドロウと吊り下げ器具を使った場合で差がなかった。","walker2023":"活動的な男性10名。リングのマッスルアップは、バーに比べて、引く局面で僧帽筋上部と上腕二頭筋、押す局面で上腕三頭筋の活動が高かった。","reinold2004":"健常者10名に7種類の外旋の運動を行わせた。棘下筋と小円筋の活動は、横向きに寝て行う外旋が最も高かった。","batalha2015":"若い男子競泳選手40名の無作為化試験。16週間のゴムバンドによる肩の強化を加えた群は、水中練習だけの群に比べ、外旋の筋力と、内旋と外旋のバランスが改善した。","hibberd2012":"大学競泳選手44名の無作為化試験。チューブでのY、T、Wや、90度に開いた位置での内旋と外旋などを週3回6週間行っても、筋力と肩甲骨の動きに、何もしない群との有意な差は出なかった。","dellatommasina2023":"男子競泳選手22名の無作為化試験。8週間のゴムバンドによる斜め方向の肩の強化は、外旋の筋力をわずかに改善したが、有意ではなかった。","distefano2009":"活動的な健常成人21名が12種目を行った。中臀筋の活動は、横向きに寝て脚を上げる運動が最も高く、クラム、ランジ、ホップより有意に高かった。","cambridge2012":"健常な男性9名のモンスターウォーク。バンドを膝から足首、足へと下げるほど中臀筋の活動が増えた。","haroy2019":"ノルウェーの男子サッカー選手652名の無作為化試験。コペンハーゲン・アダクションを行った群は、鼠径部の問題を訴える危険が41パーセント低かった。","ishoi2016":"19歳以下の男子サッカー選手24名の無作為化試験。8週間のコペンハーゲン・アダクションで、股関節の内転の筋力が約36パーセント増えた。","wristtrain2004":"男子高校野球選手43名の無作為化試験。全身の筋力トレーニングに手首と前腕の種目を12週間加えた群は、手首と前腕の筋力がより大きく伸びた。","maeo2023":"成人21名が12週間、ケーブルで肘を伸ばす運動を行った。腕を頭上に上げた姿勢のほうが、体の横の姿勢より、上腕三頭筋の体積の増加が約1.4倍から1.5倍大きかった。","sato2022":"トレーニング経験のない若い成人。週2回5週間、下ろす動きだけの肘を曲げる筋のトレーニングは、半分の量で、上げ下ろし両方の場合と同じ程度に筋力と筋の厚さを増やした。","kojima2021":"在宅のリハビリを受けている27名の無作為化試験（競技者ではない）。3か月、足の指でタオルをたぐる運動を加えた群は、片脚で立てる時間が有意に伸びた。","gullett2009":"トレーニング経験のある健常者15名。バックスクワットはフロントスクワットより膝を圧縮する力が有意に大きく、全体の筋活動は同じ程度だった。","west2011":"英国代表の男子短距離競泳選手11名。スクワットの筋力、垂直跳びの高さ、パワーが高いほど、15メートルまでのスタートのタイムが有意に速かった。","takai2013":"平均13.7歳の男子94名。自分の体重でのスクワットを1日100回、8週間行うと、体脂肪率が下がり、太もも前の筋の厚さ、膝を伸ばす筋力、垂直跳びが向上した。","collins2021":"男性16名と女性16名。体重の30パーセントの負荷で、ゴブレットスクワットはランドマインスクワットより大腿四頭筋の活動が大きかった。","helme2022":"トレーニング経験のある男性26名。後ろ足を台に乗せたスプリットスクワットでは、前足が縦方向の力の約84パーセントを担っていた。","park2016":"ランジに慣れた4名。リバースランジは大臀筋と大腿四頭筋の活動が高く、膝にかかるずれの力は比較的小さかった。","vandyk2019":"15研究、選手8459名のメタ分析。ノルディックハムストリングを含む予防プログラムは、ハムストリングの肉離れの危険を約半分に減らした。","tsaklis2015":"エリートの女子陸上選手20名。ハムストリングの10種目を比べ、ノルディックと、足を滑らせるレッグカールは強度が高い種目、ブリッジは中程度の種目に分類された。","martinfuentes2020":"筋電図の研究の系統的レビュー。デッドリフトでは脊柱起立筋と大腿四頭筋の活動が、大臀筋や大腿二頭筋より大きいと報告された。","saeterbakken2011":"筋力トレーニング経験のある若い男性12名。ダンベルで持ち上げられる最大重量はバーベルより約17パーセント低かったが、大胸筋と三角筋前部の筋活動に差はなかった。","garrido2010":"平均12歳の全国レベルの競泳選手28名。ベンチプレスなどの筋力とメディシンボール投げは、25メートルと50メートル自由形のタイムと中程度の有意な関連があった。垂直跳びとは関連がなかった。","saeterbakken2013":"健常な男性15名。立って行うダンベルのショルダー function weekStart(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function sessOfWeek(k){ return (db.sessions||[]).filter(s=>dayOf(weekStart(new Date(s.date+'T12:00:00')))===k); }
function planInfo(){
  const per = db.plan ? num(db.plan.perWeek) : null; const used = sessOfWeek(dayOf(weekStart(new Date()))).length;
  const has = per!=null && per>0;
  return {per: has?per:null, used, left: has ? Math.max(0, per-used) : null, over: has ? Math.max(0, used-per) : 0};
}
function streakWeeks(){
  const w = weekStart(new Date()); let n = 0;
  if(!sessOfWeek(dayOf(w)).length) w.setDate(w.getDate()-7);
  while(sessOfWeek(dayOf(w)).length && n<520){ n++; w.setDate(w.getDate()-7); }
  return n;
}

function uiSteppers(sel){
  document.querySelectorAll(sel).forEach(inp=>{
    if(inp.dataset.st) return; inp.dataset.st = '1';

    const inc = Number(inp.dataset.inc) || (inp.step==='0.5' ? 2.5 : inp.name==='min' ? 5 : 1);
    if(lab && !inp.getAttribute('aria-label')) inp.setAttribute('aria-label', lab.textContent.trim());
    const w = document.createElement('span'); w.className = 'stp'; inp.parentNode.insertBefore(w, inp);
    const mk = (sign, txt)=>{ const b = document.createElement('button'); b.type = 'button'; b.textContent = sign>0?'＋':'−'; b.setAttribute('aria-label', name+'を'+inc+txt);
      b.addEventListener('click',()=>{ const min = inp.min===''?-Infinity:Number(inp.min), max = inp.max===''?Infinity:Number(inp.max);
        let v = (inp.value===''?0:Number(inp.value)) + sign*inc; v = Math.min(max, Math.max(min, Math.round(v*100)/100)); inp.value = v;
        inp.dispatchEvent(new Event('input',{bubbles:true})); inp.dispatchEvent(new Event('change',{bubbles:true})); });
      return b; };
    w.appendChild(mk(-1,'減らす')); w.appendChild(inp); w.appendChild(mk(1,'増やす'));
  });
}

let uiRemoved = null, uiClear = false, uiSwiped = false;
function uiBadges(e){
  if(e.norx) return '<span class="bdg warn">処方は未登録</span>';
  const rx = rxFor(e, db.goal);
  return '<span class="bdg">'+esc(rx.sets)+' セット</span><span class="bdg">'+esc(rx.reps)+'</span>'+(rx.load?'<span class="bdg">'+esc(rx.load)+'</span>':'')+'<span class="bdg">休息 '+esc(rx.rest)+'</span>';
}
function uiToggleDone(id){
  const ex = EXMAP[id]; const td = today();
  const mine = db.logs.filter(l=>l.id===id && l.kind==='done' && dayOf(l.t)===td);
  if(mine.length){ const free = mine.filter(l=>!l.sess).pop();
    if(!free){ say('この種目は、もう練習の記録に入っています'); return; }
    db.logs.splice(db.logs.indexOf(free),1); save(); say(ex.name+'の実施済みを取り消しました'); }
  else { const rx = rxFor(ex, db.goal); addLog({id, kind:'done', sets:nums(rx.sets)[0]||'', reps:ex.norx?'':rx.reps, load:'', memo:'プログラムから記録'}); say(ex.name+'を実施済みにしました'); }
  render(false); const b = document.querySelector('[data-ck="'+id+'"]'); if(b) b.focus();
}
function uiProgRemove(id){
  const i = db.prog.findIndex(x=>x.id===id); if(i<0) return;
  uiRemoved = {row:db.prog[i], i}; db.prog.splice(i,1); save(); say(EXMAP[id].name+'を外しました。元に戻すこともできます');
  render(false); const u = $('#uiUndo'); if(u) u.focus();
}

/* 携帯では、種目を左へ払うと外せる。同じことは「メニューを開く」のボタンからもできる */
(function(){
  let li = null, x0 = 0, y0 = 0, dx = 0, moving = false;
  const v = $('#view');
  v.addEventListener('touchstart',e=>{ li = e.target.closest('.wrow'); if(!li) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; moving = false; },{passive:true});
  v.addEventListener('touchmove',e=>{ if(!li) return; dx = e.touches[0].clientX-x0; const dy = e.touches[0].clientY-y0;
    if(!moving){ if(Math.abs(dx)>12 && Math.abs(dx)>Math.abs(dy)*1.5) moving = true; else if(Math.abs(dy)>12){ li = null; return; } else return; }
    li.classList.add('sw'); li.style.transform = 'translateX('+Math.min(0,dx)+'px)'; li.style.opacity = String(Math.max(.3, 1+Math.min(0,dx)/260)); },{passive:true});
  v.addEventListener('touchend',()=>{ if(!li) return; const el = li; li = null; el.classList.remove('sw');
    if(moving){ uiSwiped = true; setTimeout(()=>{ uiSwiped = false; },350); }
    if(moving && dx<-110){ uiProgRemove(el.dataset.wid); return; }
    el.style.transform = ''; el.style.opacity = ''; });
})();

  const all = db.sessions||[]; const done = db.logs.filter(l=>l.kind==='done');
  const per = {}; done.forEach(l=>{ per[l.id] = (per[l.id]||0)+1; }); const top = Object.entries(per).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return {title:'記録', html:
    '<div class="wknav"><button type="button" class="ghost" id="wkPrev">前の週</button><h2 id="wkH" tabindex="-1">'+(uiWk===0?'今週':uiWk===-1?'先週':uiDate(k)+'の週')+'</h2><button type="button" class="ghost" id="wkNext"'+(uiWk>=0?' disabled':'')+'>次の週</button></div>'+
    '<section class="card" aria-label="この週のカレンダー"><div class="cardhead"><p class="kicker">'+uiDate(k)+'から</p>'+uiInfo('カレンダーの見方の説明を開く','カレンダーの見方',UI_CAL_INFO)+'</div>'+uiCal(w0)+bar+'</section>'+

    '<ul class="stats"><li><span class="k">練習</span><span class="v">'+cnt+'<small> 回</small></span><span class="p">前の週 '+pre+'</span></li>'+
      '<li><span class="k">負荷</span><span class="v">'+sum(k,s=>s.load)+'</span><span class="p">前の週 '+sum(kp,s=>s.load)+'</span></li>'+
      '<li><span class="k">重さ</span><span class="v">'+sum(k,s=>s.vol)+'<small> kg</small></span><span class="p">前の週 '+sum(kp,s=>s.vol)+'</span></li></ul>'+

    '<div class="two" style="margin-top:16px"><button type="button" class="navrow" data-go="tests"><strong>測定を記録する</strong>'+UI.chev+'</button><button type="button" class="navrow" data-go="data"><strong>保存と持ち出し</strong>'+UI.chev+'</button></div>'+

    '<div class="stackbtns" style="margin-top:12px"><button type="button" class="ghost" id="swEdit">このメニューを直す</button><button type="button" class="ghost" id="swDel">'+(swimDel?'もう一度押すと消します':'このメニューを消す')+'</button></div></section>' : '';

    SWIM_BLOCKS.map((b,i)=>{ const x = bv(b); return '<fieldset><legend>'+b+'</legend>'+
      '<label>距離（メートル）<input type="number" name="m'+i+'" min="0" step="1" data-inc="100" inputmode="numeric" value="'+esc(x.m)+'"></label>'+
      '<div class="chips" role="group" aria-label="'+b+'の距離を選ぶ" style="margin-top:8px">'+SWIM_M.map(v=>'<button type="button" class="chip" data-swm="'+i+':'+v+'" aria-label="'+b+'の距離を'+v+'メートルにする">'+v+'</button>').join('')+'</div>'+
      '<p class="fl" id="zl'+i+'">強度 <span class="tag warn">仮の設定</span></p><div class="zrow" role="radiogroup" aria-labelledby="zl'+i+'">'+[''].concat(SWIM_Z).map(z=>'<label><input type="radio" name="z'+i+'" value="'+z+'"'+((x.z||'')===z?' checked':'')+'><span>'+(z||'なし')+'</span></label>').join('')+'</div>'+
      '<details class="more"'+(x.text?' open':'')+'><summary>内容を文字で書く</summary><div class="inner"><textarea class="txt" name="t'+i+'" rows="3" aria-label="'+b+'の内容">'+esc(x.text)+'</textarea></div></details></fieldset>'; }).join('')+
    '<label>コーチのメモ（なくてもかまいません）<input type="text" class="txt" name="memo" value="'+esc(m?m.memo:'')+'"></label>'+
    '<p id="swErr" role="alert" class="err"></p><button type="submit" class="cta">この日のメニューを保存する</button>'+(m?'<button type="button" class="ghost" id="swCancel">直すのをやめる</button>':'')+'</form>' : '';
  const vids = Object.keys(VID_CATS).map(c=>{ const l = S.vids.filter(x=>x.cat===c); return l.length ? '<h3>'+VID_CATS[c]+'（'+l.length+'）</h3><ul class="hist">'+l.map(x=>'<li><strong>'+esc(x.title)+'</strong>'+(x.memo?'<span class="sub">'+esc(x.memo)+'</span>':'<br>')+

  return {title:'ワークアウト', html: uiSub('swim')+nav+show+form+
    '<h2 id="vH" tabindex="-1">ドリルと技術の動画</h2>'+vids+
    '<details class="more"><summary>動画を登録する</summary><div class="inner"><form id="vForm" class="intake" novalidate>'+
      '<label>題名（必ず入れてください）<input type="text" class="txt" name="vtitle"></label>'+
      '<label>動画のアドレス（必ず入れてください）<input type="url" class="txt" name="vurl" placeholder="https://"></label>'+

        S.vids.push({id:'v_'+Date.now(), title:t, url:u, cat:f.vcat.value, memo:f.vmemo.value.trim()}); save(); say('動画を登録しました'); render(false); $('#vH').focus(); });
      $('#view').onclick = e=>{ const b = e.target.closest('[data-vdel]'); if(!b) return; S.vids = S.vids.filter(x=>x.id!==b.dataset.vdel); save(); say('動画を一覧から消しました'); render(false); $('#vH').focus(); };
    }
  };
};

/* ---- 新しい画面の、押したときの動き（古い仕組みより先に受け取る） ---- */
document.addEventListener('click',e=>{
  if(uiSwiped){ uiSwiped = false; e.stopPropagation(); e.preventDefault(); return; }
  const stop = ()=>e.stopPropagation(); let b;
  const inInfo = !!e.target.closest('#info');
  if(e.target.id==='info' || e.target.closest('#infoX')){ uiClose(); stop(); return; }
  if(e.target.closest('#advNext')){ pickAdvice(adviceNow.id); uiAdvice(); const r = $('#advOpen strong'); if(r) r.textContent = adviceNow.t; stop(); return; }
  if(e.target.closest('#advOpen')){ uiAdvice(); stop(); return; }
  if(e.target.closest('#starOpen')){ uiOpen('星の基準', uiStarInfo()); stop(); return; }
  if((b = e.target.closest('[data-info]'))){ const x = uiInfos[b.dataset.info]; if(x) uiOpen(x.title, x.html); stop(); return; }
  if((b = e.target.closest('[data-wrm]'))){ uiClose(false); uiProgRemove(b.dataset.wrm); stop(); return; }
  if(inInfo){ if(e.target.closest('[data-go],[data-play],[data-golist]')) uiClose(false); return; }
  if((b = e.target.closest('[data-ck]'))){ uiToggleDone(b.dataset.ck); stop(); return; }
  if((b = e.target.closest('[data-wmenu]'))){ uiRowMenu(b.dataset.wmenu); stop(); return; }
  if((b = e.target.closest('[data-goal]'))){ db.goal = b.dataset.goal; save(); say('目的を'+GOALS[db.goal].label+'にしました'); render(false); const again = document.querySelector('[data-goal="'+db.goal+'"]'); if(again) again.focus(); stop(); return; }
  if(e.target.closest('#homeStart')){ db.sessNow = {start:new Date().toISOString()}; save(); say('練習を始めました。時間を計っています'); go('program'); stop(); return; }
},true);

/* 直近7日と直近28日の、練習の負荷（きつさ×分）の比。陸上の記録だけで計算する */
function acwr(){
  const ss = db.sessions||[]; if(!ss.length) return null;
  const now = new Date(); const d = n=>{ const x = new Date(now.getFullYear(), now.getMonth(), now.getDate()-n+1); return dayOf(x); };
  const first = ss.map(s=>s.date).sort()[0]; const days = Math.round((new Date(today()+'T12:00:00')-new Date(first+'T12:00:00'))/86400000)+1;
  const sum = n=>ss.filter(s=>s.date>=d(n)).reduce((t,s)=>t+(Number(s.load)||0),0);
  const a = sum(7), c = sum(28)/4;
  return {a, c:Math.round(c*10)/10, ratio: c>0 ? Math.round(a/c*100)/100 : null, enough: days>=28, days};
}
function jItem(t, body, src, lv, stop){

  return {t, body, src, lv, stop:!!stop, html:'<section class="jrow'+(stop?' stop':'')+'"><h3>'+esc(t)+'</h3><div class="badges">'+tag+'</div><p>'+esc(body)+'</p>'+srcBox(src)+'</section>'};
}

function restSec(rx){
  const t = String(rx.rest||''); if(!t || /なし/.test(t)) return 0;

  return /秒/.test(t) ? n : n*60;

function e1rm(w, r){ w = Number(w); r = Number(r); if(!(w>0) || !(r>0)) return null; if(r===1) return w; if(r>10) return null; return Math.round(w*(1+r/30)*2)/2; }
function doneLogs(id){ return db.logs.filter(l=>l.id===id && l.kind==='done'); }
function lastSetLog(id){ return [...doneLogs(id)].reverse().find(l=>l.setList && l.setList.length) || [...doneLogs(id)].reverse()[0] || null; }
function prOf(id){
  let w = null, est = null;
  doneLogs(id).forEach(l=>{ (l.setList||[]).forEach(q=>{ const a = Number(q.w), b = Number(q.r); if(a>0 && b>0){ if(w==null || a>w.w || (a===w.w && b>w.r)) w = {w:a, r:b, t:l.t}; const e = e1rm(a,b); if(e!=null && (est==null || e>est.v)) est = {v:e, w:a, r:b, t:l.t}; } });
    if(!(l.setList||[]).length && Number(l.load)>0){ const a = Number(l.load), b = nums(l.reps)[0]||0; if(w==null || a>w.w) w = {w:a, r:b, t:l.t}; } });
  return {w, est};
}
function rxOf(id){ db.rx = db.rx||{}; return db.rx[id]||{}; }
function execNowFor(id){
  if(db.execNow && db.execNow.id===id && db.execNow.date===today()) return db.execNow;
  const e = EXMAP[id], rx = rxFor(e, db.goal), last = lastSetLog(id);

  const sets = []; for(let i=0;i<n;i++){ const q = last && last.setList && last.setList[i]; const q0 = last && last.setList && last.setList[last.setList.length-1];

/* ============ 使いやすさ第一の画面（2026年10月17日） ============
 選手が押す回数を最小にする。ホームは黄色のボタン1つ（案7）、練習中は今のセットだけ（案3）、
 今日の調子は1画面で押すだけ（案8、最初は睡眠と疲れの2つ）、記録は動かした重さを先頭に（案9）、終わりの記録は自動で埋めてきつさだけ押す（案6）。
 水中練習の時刻は、コーチの「練習メニュー」アプリ（swim_menu_studio）のバックアップから読み込むか、設定で曜日ごとに入れる。
 保存されるデータの形は変えていない。新しく db.swimSched（曜日ごとの開始時刻）と db.dailyOpt（調子の項目の表示）を足した。 */
const WD = ['月','火','水','木','金','土','日'];
function wdIdx(d){ return (d.getDay()+6)%7; }
function hm2min(s){ const m = String(s||'').match(/(\d{1,2})[:：]?(\d{2})$/); return m ? Number(m[1])*60+Number(m[2]) : null; }
function swimToday(){ const ws = db.swimSched; if(!Array.isArray(ws)) return null; return (ws[wdIdx(new Date())]||[]).map(hm2min).filter(x=>x!=null).sort((a,b)=>a-b); }
/* 今日の水中練習の開始時刻から、今まで何時間か。まだなら、次の開始まで何時間か */
function swimGap(){
  const t = swimToday(); if(!t) return null;
  if(!t.length) return {none:true};
  const now = new Date(); const nm = now.getHours()*60+now.getMinutes();
  const past = t.filter(x=>x<=nm); const next = t.find(x=>x>nm);
  const out = {};
  if(past.length) out.since = Math.round((nm-past[past.length-1])/6)/10;
  if(next!=null) out.until = Math.round((next-nm)/6)/10;
  return out;
}
function swimGapText(){
  const g = swimGap(); if(!g) return '';
  if(g.none) return '今日は水中練習なし';
  if(g.since!=null && g.until==null) return '水中練習の開始から '+g.since+' 時間';
  if(g.since!=null) return '水中練習の開始から '+g.since+' 時間、次まで '+g.until+' 時間';
  return '水中練習まで '+g.until+' 時間';
}
/* 予定があるときは、聞き取りの「間の時間」より予定から出した時間を使う */
const _judgeBase = uiJudge;
uiJudge = function(){
  const sc0 = db.sched; const g = swimGap();
  if(g && !g.none && g.since!=null){ db.sched = Object.assign({}, sc0||{}, {same: (sc0 && sc0.same && sc0.same!=='none') ? sc0.same : 'aero', gap: g.since, order: g.until==null ? 'sfirst' : (sc0 && sc0.order) || 'sfirst'}); }
  else if(g && g.none){ db.sched = Object.assign({}, sc0||{}, {same:'none'}); }
  let out; try{ out = _judgeBase(); } finally { db.sched = sc0; }
  if(g && !g.none && g.since!=null) out = out.map(x=>{ if(/水中練習とウエイトの間/.test(x.t)){ x.body = '（水中練習の時刻の予定から自動で計算しています。）'+x.body; x.html = x.html.replace('</h3>','</h3><p class="sub">水中練習の時刻の予定から自動で計算</p>'); } return x; });
  return out;
};

function uexNorm(s){
  let t = String(s||'').normalize('NFKC').toLowerCase().replace(/[\s　・･,、。．.\-－—–/／()（）\[\]【】「」]/g,'');
  t = t.replace(/[ぁ-ん]/g, c=>String.fromCharCode(c.charCodeAt(0)+0x60));
  t = t.replace(/ー+/g,'ー');
  UEX_ALIAS.forEach(a=>{ if(t.includes(uexNormRaw(a[0]))) t = t.split(uexNormRaw(a[0])).join(uexNormRaw(a[1])); });
  return t;
}
function uexNormRaw(s){ return String(s).normalize('NFKC').toLowerCase().replace(/[\s　・]/g,'').replace(/[ぁ-ん]/g, c=>String.fromCharCode(c.charCodeAt(0)+0x60)); }
function uexGrams(t){ const g = new Set(); for(let i=0;i<t.length-1;i++) g.add(t.slice(i,i+2)); if(t.length===1) g.add(t); return g; }
function uexSim(a, b){
  const x = uexNorm(a), y = uexNorm(b); if(!x || !y) return 0;
  if(x===y) return 1;
  if(x.includes(y) || y.includes(x)) return Math.max(0.8, Math.min(x.length,y.length)/Math.max(x.length,y.length));
  const g1 = uexGrams(x), g2 = uexGrams(y); let n = 0; g1.forEach(g=>{ if(g2.has(g)) n++; });
  return 2*n/(g1.size+g2.size);
}
function uexSimilar(name, exceptId){
  return EX.filter(e=>e.id!==exceptId).map(e=>({e, s:uexSim(name, e.name)})).filter(x=>x.s>=0.5).sort((a,b)=>b.s-a.s).slice(0,6);
}
function uexApply(){
  /* 前に加えたものを外してから、保存されているものを加え直す */
  for(let i=EX.length-1;i>=0;i--){ if(EX[i].user){ delete EXMAP[EX[i].id]; EX.splice(i,1); } }
  (db.userEx||[]).forEach(u=>{
    const e = {id:u.id, name:u.name, cat:CATS[u.cat]?u.cat:'core', type:u.type||'loaded', user:true, check:[], strokes:u.strokes||[], refs:[],
      muscles:u.muscles||'未記入', why:u.why||'コーチが登録した種目です。', swim:u.swim||'競泳との関連は、登録した人の記入によります。',
      merit:[u.merit||'未記入'], demerit:[u.demerit||'注意点は未記入です'], cue:u.cue||'動かし方のポイントは未記入です',
      norx: !(u.sets||u.reps||u.load||u.rest), lumbar:u.lumbar||''};
    if(!e.norx){ const rx = {sets:u.sets||'3', reps:u.reps||'', load:u.load||'', rest:u.rest||''}; e.rx = {power:rx, strength:rx, hypertrophy:rx, endurance:rx}; e.norx = false; }
    if(u.video) db.videos[e.id] = db.videos[e.id] || u.video;
    EX.push(e); EXMAP[e.id] = e;
  });
}

/* ===== 共通ロジック（提案エンジン） ここから ===== */
var ENGINE = (function(){
  function addDays(d,n){var x=new Date(d+"T00:00:00");x.setDate(x.getDate()+n);return fmt(x);}
  function fmt(x){return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
  function roundHalf(v){return Math.round(v*2)/2;}
  function has(v){return v==="あり"||v==="悪化";}
  function worse(v){return v==="悪化";}

  function redFlags(rec){
    if(!rec) return [];
    var f=[];
    if(rec.bladder==="あり") f.push("排尿・排便の障害");
    if(rec.perineal==="あり") f.push("会陰部（またぎ部）の感覚異常");
    if(rec.legWeakness==="悪化") f.push("進行する下肢の筋力低下");
    if(rec.legWeaknessNew==="あり") f.push("新たな高度の下肢筋力低下");
    return f;
  }

  // sessions: その選手の過去セッション（targetDateより前）
  // mornings: その選手の朝の記録
  function evaluate(state, athleteId, targetDate){
    var athlete=(state.athletes||[]).find(function(a){return a.id===athleteId;});
    var S=(state.settings||{});
    var pct=(S.increasePct!=null?S.increasePct:2.5);
    var need=(S.requiredGoodSessions!=null?S.requiredGoodSessions:2);
    var sessions=(state.sessions||[]).filter(function(s){return s.athleteId===athleteId && s.date<targetDate && s.finished;}).sort(function(a,b){return a.date<b.date?-1:1;});
    var mornings=(state.mornings||[]).filter(function(m){return m.athleteId===athleteId && m.date<=targetDate;}).sort(function(a,b){return a.date<b.date?-1:1;});
    var last=sessions[sessions.length-1]||null;
    var morningToday=mornings.find(function(m){return m.date===targetDate;})||null;
    var morningAfterLast=last?mornings.find(function(m){return m.date===addDays(last.date,1);})||null:null;
    var R={athleteId:athleteId,targetDate:targetDate,level:"ok",headline:"",dataUsed:[],gaps:[],concerns:[],general:[],proposals:[],clearance:athlete?athlete.clearance:"不明"};
    if(!athlete){R.level="caution";R.headline="選手が選ばれていません";return R;}
    R.dataUsed.push("医療者の運動許可："+(athlete.clearance||"不明")+(athlete.restrictions?"（制限："+athlete.restrictions+"）":""));
    if(morningToday) R.dataUsed.push("本日朝の記録（腰痛"+morningToday.backPain+"、疲労"+morningToday.fatigue+"、睡眠"+morningToday.sleepH+"時間）"); else R.gaps.push("本日朝の回復状態が未入力です。未入力は「痛みなし」とは扱いません。");
    if(last){R.dataUsed.push("前回トレーニング "+last.date+"（セット数"+(last.sets||[]).length+"）"); if(!morningAfterLast) R.gaps.push("前回トレーニング翌朝（"+addDays(last.date,1)+"）の記録がありません。翌朝の悪化有無が確認できないため、重量増加は提案しません。");}
    else R.gaps.push("完了したトレーニング記録がまだありません。");
    if(!athlete.clearance||athlete.clearance==="不明") R.gaps.push("医療者の運動許可が未確認のため、高重量プログラムの自動提案と重量増加の提案を保留します。");

    // A. 緊急警告
    var flags=[].concat(redFlags(morningToday),redFlags(morningAfterLast),last?redFlags(last.post):[]);
    if(flags.length){R.level="emergency";R.headline="緊急：警告症状が記録されています。通常のトレーニング提案を停止します。";R.concerns.push("記録された警告症状："+Array.from(new Set(flags)).join("、"));R.general.push("直ちに医療機関（必要なら救急）での評価を優先してください。これは医療診断ではなく、記録された症状に基づく注意喚起です。");return R;}

    // A'. 神経症状の新規出現・悪化
    var nerveRecs=[];
    if(last){ if(last.pre) nerveRecs.push({t:"前回開始前",r:last.pre}); (last.sets||[]).forEach(function(s,i){nerveRecs.push({t:"前回セット"+(i+1),r:s});}); if(last.post) nerveRecs.push({t:"前回終了後",r:last.post}); }
    if(morningAfterLast) nerveRecs.push({t:"前回翌朝",r:morningAfterLast});
    if(morningToday && morningToday!==morningAfterLast) nerveRecs.push({t:"本日朝",r:morningToday});
    var baseline=null; var prevMorning=mornings.filter(function(m){return last?m.date<=last.date:m.date<targetDate;}).pop();
    if(prevMorning) baseline=prevMorning; else if(last&&last.pre) baseline=last.pre;
    var nerveWorse=[],nerveNew=[],nervePersist=false;
    nerveRecs.forEach(function(x){
      ["radiating","numbness","legWeakness"].forEach(function(k){
        var v=x.r[k]; if(worse(v)) nerveWorse.push(x.t+"："+label(k)+" 悪化");
        else if(v==="あり"){ if(baseline && baseline[k]==="なし") nerveNew.push(x.t+"："+label(k)+" 新たに出現"); else nervePersist=true; }
      });
    });
    if(nerveWorse.length||nerveNew.length){R.level="stop";R.headline="神経症状の新規出現または悪化が記録されています。トレーニング継続は推奨しません。";R.concerns=R.concerns.concat(nerveWorse,nerveNew);R.general.push("腰痛の数値が低くても、神経症状は独立して判定します。速やかな医療評価を推奨します。重量・回数の提案は行いません。");return R;}
    if(nervePersist){R.concerns.push("下肢の放散痛・しびれなどが継続しています。重量は増やさず、医療者の指示を確認してください。");}

    // 本日の腰痛状態
    var painToday=morningToday?Number(morningToday.backPain):null;
    if(painToday!=null && painToday>=4){R.level="stop";R.concerns.push("本日朝の腰痛がレベル"+painToday+"（強い痛み）です。本日の高負荷実施は推奨しません。");}
    else if(painToday!=null && painToday>=3){R.level=worseLevel(R.level,"caution");R.concerns.push("本日朝の腰痛がレベル3（明らかな痛み）です。重量は増やさず、負荷軽減・代替種目・延期を検討してください。");}
    if(morningToday && morningToday.restPain==="あり"){R.level=worseLevel(R.level,"caution");R.concerns.push("安静時にも痛みがあります。");}
    if(morningToday && morningToday.vsYesterday==="悪化"){R.level=worseLevel(R.level,"caution");R.concerns.push("前日より症状が悪化しています。");}

    // E. 全身疲労
    var fatigueFlag=false;
