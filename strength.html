  return {title: pick ? '種目を足す' : '種目', html:
    (pick ? '<div class="note warn">今日のメニューに入れる種目を選んでいます。「入れる」を押すと入ります。<br><button type="button" class="link" data-go="today">今日のノートに戻る</button></div>' : '')+
    '<label class="f">選び方<select class="txt" id="exSel">'+opts.map(o=>'<option value="'+o[0]+'"'+(o[0]===exSel?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select></label>'+
    '<label class="f">名前で探す<input type="search" class="txt" id="exQ" value="'+esc(q)+'" placeholder="例：スクワット、広背筋"></label>'+
    (exSel==='body' && !q ? bodyHTML() : '<p class="sub" role="status">'+list.length+'種目</p>'+(list.length ? '<ul class="exl">'+list.map(e=>exRow(e, k)).join('')+'</ul>' : '<p class="sub">'+(exSel==='fav'?'お気に入りはまだありません。種目の横の☆を押すと入ります。':'該当する種目がありません。')+'</p>')),
    after(){ $('#exSel').addEventListener('change',e=>{ exSel = e.target.value; db.exSel = exSel; db.exQ = ''; save(); render(false); $('#exSel').focus(); });
      let tm; $('#exQ').addEventListener('input',e=>{ clearTimeout(tm); tm = setTimeout(()=>{ db.exQ = e.target.value.trim(); save(); const pos = e.target.selectionStart; render(false); const i = $('#exQ'); i.focus(); try{ i.setSelectionRange(pos,pos); }catch(x){} },300); });
      document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{ if(b.disabled) return; const e = EXMAP[b.dataset.add]; const d = day(k); const last = lastOf(e.id, null); d.rows.push(newRow(e.id, last ? {kg:last.r.kg, reps:last.r.reps, sets:last.r.sets} : {kg:0, reps:5, sets:3})); if(!d.src) d.src = 'self'; save(); say(shortName(e)+'を入れました'+(last?'（前回の数字）':'')); render(false); const again = document.querySelector('[data-add="'+e.id+'"]'); if(again) again.focus(); }));
      document.querySelectorAll('[data-fav]').forEach(b=>b.addEventListener('click',()=>{ const id = b.dataset.fav; const i = db.favs.indexOf(id); if(i<0) db.favs.push(id); else db.favs.splice(i,1); save(); render(false); const again = document.querySelector('[data-fav="'+id+'"]'); if(again) again.focus(); say(i<0?'お気に入りに入れました':'お気に入りから外しました'); }));
      document.querySelectorAll('[data-bv]').forEach(b=>b.addEventListener('click',()=>{ bodyView = b.dataset.bv; render(false); document.querySelector('[data-bv="'+bodyView+'"]').focus(); }));
      document.querySelectorAll('.hot,.lab').forEach(g=>{ const h = ()=>{ exSel = 'part:'+g.dataset.part; db.exSel = exSel; save(); render(true); }; g.addEventListener('click',h); g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); h(); } }); });
    } }; };
/* 体の絵 */
let bodyView = 'front';
function bodyMirror(d){ let i = 0; return d.replace(/-?\d+(\.\d+)?/g, n=>{ const v = (i++ % 2 === 0) ? (896 - Number(n)) : Number(n); return String(Math.round(v*10)/10); }); }
function bodyTextW(t){ let w = 0; for(const ch of t){ w += ch.charCodeAt(0) > 255 ? 36 : 19; } return w + 40; }
function bodyHTML(){ const V = BODY_VIEWS[bodyView]; const cnt = pk=>EX.filter(e=>(PLACES[e.id]||[]).some(x=>x.part===pk)).length;
  let s = '<image href="'+V.img+'" x="0" y="0" width="896" height="1776"/>';
  V.zones.forEach(z=>{ const m = BODY_MAP[z.key]; s += '<g class="hot" role="button" tabindex="0" data-part="'+m.part+'" aria-label="'+esc(m.name)+'、'+cnt(m.part)+'種目" style="--c:'+z.color+'"><path class="z" d="'+z.d+'"/>'+(V.mirror?'<path class="z" d="'+bodyMirror(z.d)+'"/>':'')+'<title>'+esc(m.name)+'</title></g>'; });
  V.zones.forEach(z=>{ const m = BODY_MAP[z.key]; const [side, lx, ly] = z.label; const w = bodyTextW(m.name); const x = side==='L' ? lx - w : lx;
    s += '<g class="lab" role="button" tabindex="0" data-part="'+m.part+'" aria-label="'+esc(m.name)+'の名前札"><line x1="'+lx+'" y1="'+ly+'" x2="'+z.anchor[0]+'" y2="'+z.anchor[1]+'"/><circle cx="'+z.anchor[0]+'" cy="'+z.anchor[1]+'" r="8"/><rect x="'+x+'" y="'+(ly-28)+'" width="'+w+'" height="56"/><text x="'+(x+20)+'" y="'+(ly+12)+'">'+esc(m.name)+'</text></g>'; });
  return '<div class="chips" role="group" aria-label="見る向き">'+Object.keys(BODY_VIEWS).map(v=>'<button type="button" class="chip" data-bv="'+v+'" aria-pressed="'+(v===bodyView)+'">'+esc(BODY_VIEWS[v].name)+'</button>').join('')+'</div><p class="sub">体の部位を押すと、その部位の種目が出ます。</p><svg class="body" viewBox="0 0 896 1776" role="group" aria-label="体の絵">'+s+'</svg>'; }

/* ---- 種目の詳細（説明と根拠は前の版のまま） ---- */
function refItem(k, link){ const kind = refKind(k); const url = REF_URL[k] || (kind==='講演資料' ? '' : 'https://scholar.google.com/scholar?q='+encodeURIComponent(REFS[k]));
  return '<span class="tag '+(kind==='論文'?'ok':'warn')+'">'+kind+'</span>'+(link?'<span class="tag">'+D.D_LABEL[link.d]+'</span>'+(link.s?'<span class="tag">競泳選手が対象</span>':''):'')+'<br>'+esc(REFS[k])+(REF_NOTE[k]?'<p class="refnote"><strong>分かったこと</strong>　'+esc(REF_NOTE[k])+'</p>':'')+(REF_WARN[k]?'<p class="refnote w"><strong>確認の状況</strong>　'+esc(REF_WARN[k])+'</p>':'')+(url?'<a target="_blank" rel="noopener" href="'+esc(url)+'">'+(REF_URL[k]?'原文のページを開く':'グーグル・スカラーで探す')+'</a>':''); }
VIEWS.detail = cur=>{ const e = EXMAP[cur.id]; const k = curDay(); const links = EVID[e.id]||[]; const best = bestOf(e.id, null); const h = histRows(e.id, null).slice(-5).reverse();
  const inMenu = day(k).rows.some(r=>r.exId===e.id);
  return {title: shortName(e), html:
    '<p>'+starHTML(e)+' '+LV_LABEL[evLevel(e)]+(e.refs&&e.refs.length?'（文献'+e.refs.length+'件）':'')+'</p>'+
    (e.gym ? '<div class="note warn">体操の移行データの種目です。'+(e.linked?'':'やり方の説明と根拠は未登録です。')+'</div>' : '')+
    '<div class="stack two">'+(day(k).finished?'':'<button type="button" class="cta" id="dAdd" '+(inMenu?'disabled aria-disabled="true"':'')+'>'+(inMenu?'今日のメニューに入れてあります':'今日のメニューに入れる')+'</button>')+'<button type="button" class="ghost" id="dFav" aria-pressed="'+db.favs.includes(e.id)+'">'+(db.favs.includes(e.id)?'★ お気に入り':'☆ お気に入りに入れる')+'</button></div>'+
    (best?'<div class="note good">自己ベストの推定1RM '+kg(best.v)+' kg（'+md(best.k)+'）</div>':'')+
    (h.length?'<h2>最近の記録</h2><ul class="rows">'+h.map(x=>'<li class="row" style="grid-template-columns:1fr"><span class="rmain"><strong>'+md(x.k)+'</strong><span class="d">'+esc(rowTxt(x.r))+(x.r.note?'　'+esc(x.r.note):'')+'</span></span></li>').join('')+'</ul>':'')+
    '<h2>主な筋肉</h2><p>'+esc(e.muscles)+'</p>'+
    (e.why?'<h2>どんな種目か</h2><p>'+esc(e.why)+'</p>':'')+(e.swim?'<h2>水泳との関連</h2><p>'+esc(e.swim)+'</p>':'')+
    (e.cue?'<h2>ポイント</h2><p>'+esc(e.cue)+'</p>':'')+
    (e.merit&&e.merit.length?'<details class="more"><summary>メリット</summary><div class="inner note good">'+e.merit.map(esc).join('。<br>')+'。</div></details>':'')+
    (e.demerit&&e.demerit.length?'<details class="more"><summary>デメリット・注意</summary><div class="inner note bad">'+e.demerit.map(esc).join('。<br>')+'。</div></details>':'')+
    (e.refs&&e.refs.length?'<details class="more"><summary>根拠の文献（'+e.refs.length+'件）</summary><div class="inner"><ol class="refs">'+e.refs.map(r=>'<li>'+refItem(r, links.find(x=>x.k===r))+'</li>').join('')+'</ol></div></details>':'')+
    '<details class="more"><summary>動画で見る</summary><div class="inner"><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+encodeURIComponent(shortName(e)+' やり方')+'">ユーチューブで「'+esc(shortName(e))+'」を探す</a></div></details>',
    after(){ const a = $('#dAdd'); if(a) a.addEventListener('click',()=>{ if(a.disabled) return; const d = day(k); const last = lastOf(e.id, null); d.rows.push(newRow(e.id, last ? {kg:last.r.kg, reps:last.r.reps, sets:last.r.sets} : {kg:0, reps:5, sets:3})); if(!d.src) d.src = 'self'; save(); say('今日のメニューに入れました'); render(false); $('#dAdd').focus(); });
      $('#dFav').addEventListener('click',()=>{ const i = db.favs.indexOf(e.id); if(i<0) db.favs.push(e.id); else db.favs.splice(i,1); save(); render(false); $('#dFav').focus(); }); } }; };

/* ============ 結果 ============ */
function lineSVG(pts, color, unit){ if(pts.length<2) return '<p class="sub">2回以上記録すると、折れ線が出ます。</p>'; const W = 340, H = 110, L = 36, R = 8, T = 10, B = 24;
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]); const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys); const yr = (y1-y0)||1, xr = (x1-x0)||1;
  const X = x=>L+(x-x0)/xr*(W-L-R), Y = y=>T+(1-(y-y0)/yr)*(H-T-B);
  const d = pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  return '<div class="svgbox"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+pts.length+'点の折れ線。最小'+y0+'、最大'+y1+unit+'"><text x="2" y="'+(T+8)+'" fill="#c9c9c9" font-size="11">'+y1+'</text><text x="2" y="'+(H-B)+'" fill="#c9c9c9" font-size="11">'+y0+'</text><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="3" stroke-linejoin="round"/>'+pts.map(p=>'<circle cx="'+X(p[0]).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="4" fill="'+color+'"/>').join('')+'<text x="'+L+'" y="'+(H-6)+'" fill="#c9c9c9" font-size="11">'+md(dayOf(x0))+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" fill="#c9c9c9" font-size="11" text-anchor="end">'+md(dayOf(x1))+'</text></svg></div>'; }
function barsSVG(items, unit){ if(!items.length) return '<p class="sub">まだ記録がありません。</p>'; const max = Math.max(1, ...items.map(i=>i.v));
  return '<ul class="rows" role="list">'+items.map(i=>'<li class="row" style="grid-template-columns:76px 1fr 90px;align-items:center;min-height:44px"><span class="sub">'+esc(i.label)+'</span><span style="display:block;height:22px;background:var(--pane2);border-radius:4px"><span style="display:block;height:100%;width:'+Math.round(i.v/max*100)+'%;background:var(--am);border-radius:4px"></span></span><strong style="text-align:right">'+kg(i.v)+unit+'</strong></li>').join('')+'</ul>'; }
function weekVol(k0){ let v = 0; finishedDays().forEach(k=>{ if(weekStart(k)===k0) db.days[k].rows.forEach(r=>{ if(r.status==='done') v += rowVol(r,k); }); }); return r1(v); }
function trendOf(exId){ /* 仮の決まり：直近14日の自己ベストと、その前の28日の自己ベストを比べ、2.5パーセント以上の差で判定 */
  const td = today(); const a = addDays(td,-14), b = addDays(td,-42); let now = null, before = null;
  histRows(exId, null).forEach(x=>{ const v = rowBest(x.r, x.k); if(v==null) return; if(x.k>=a){ if(now==null||v>now) now = v; } else if(x.k>=b){ if(before==null||v>before) before = v; } });
  if(now==null || before==null) return {t:'まだ比べられません', cls:''}; const p = (now/before-1)*100; return p>=2.5 ? {t:'伸びている（'+r1(p)+'パーセント）', cls:'ok'} : p<=-2.5 ? {t:'下がっている（'+r1(p)+'パーセント）', cls:'bad'} : {t:'横ばい（'+r1(p)+'パーセント）', cls:'warn'}; }
VIEWS.result = ()=>{ const td = today(); const w0 = weekStart(td); const weeks = []; for(let i=7;i>=0;i--){ const k = addDays(w0,-7*i); weeks.push({label:md(k)+'週', v:weekVol(k)}); }
  const bwp = (db.bw||[]).slice(-30).map(x=>[new Date(x.date+'T12:00:00').getTime(), Number(x.w)]);
  const ids = []; finishedDays().forEach(k=>db.days[k].rows.forEach(r=>{ if(r.status==='done' && !ids.includes(r.exId)) ids.push(r.exId); })); const sel = db.resEx && ids.includes(db.resEx) ? db.resEx : ids[0];
  const e1 = sel ? histRows(sel, null).map(x=>({k:x.k, v:rowBest(x.r,x.k)})).filter(x=>x.v!=null) : [];
  const pre = daysSorted().filter(k=>db.days[k].pre && !db.days[k].pre.skipped).slice(-14);
  const tests = (db.tests||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  const tl = (key, label, unit)=>{ const pts = tests.filter(t=>num(t[key])!=null).map(t=>[new Date(t.date+'T12:00:00').getTime(), Number(t[key])]); return pts.length ? '<h3>'+label+'</h3>'+lineSVG(pts,'var(--ink)',unit) : ''; };
  const tr = sel ? trendOf(sel) : null;
  return {title:'結果', html:
    '<h2>今週の動かした重さ</h2><p class="big">'+kg(weekVol(w0))+'<small>kg</small></p><p class="sub">先週は '+kg(weekVol(addDays(w0,-7)))+' kg</p>'+barsSVG(weeks,' kg')+
    '<h2>種目ごとの推定1RM</h2>'+(ids.length ? '<label class="f">種目<select class="txt" id="resEx">'+ids.map(id=>'<option value="'+id+'"'+(id===sel?' selected':'')+'>'+esc(shortName(EXMAP[id]))+'</option>').join('')+'</select></label>'+
      (e1.length ? '<p>最新 '+kg(e1[e1.length-1].v)+' kg　自己ベスト '+kg(Math.max(...e1.map(x=>x.v)))+' kg　<span class="tag '+tr.cls+'">'+esc(tr.t)+'</span></p>'+lineSVG(e1.map(x=>[new Date(x.k+'T12:00:00').getTime(), x.v]),'var(--am)',' kg') : '<p class="sub">この種目は、重さと回数（10回以内）の記録があると推定1RMが出ます。</p>')+
      '<details class="more"><summary>この判定の決まり</summary><div class="inner"><p>推定1RMはEpleyの式（重さ×（1＋回数÷30））で、10回を超える記録は使いません。「伸びている、横ばい、下がっている」は、直近14日の自己ベストと、その前の28日の自己ベストを比べて、2.5パーセント以上の差で分けています。この2.5パーセントと日数は、このアプリの仮の設定で、根拠の資料はまだありません。睡眠、疲れ、心拍などと合わせた判断は、資料を確かめてから足します。</p></div></details>' : '<p class="sub">練習を終えると、ここに出ます。</p>')+
    '<h2>体重</h2>'+(bwp.length ? '<p>最新 '+bwp[bwp.length-1][1]+' kg</p>'+lineSVG(bwp,'var(--ink)',' kg') : '<p class="sub">練習前に体重を入れると、推移が出ます。</p>')+
    '<h2>睡眠と疲れ（直近14日）</h2>'+(pre.length ? '<div class="scroll"><table><thead><tr><th scope="col">日</th><th scope="col">睡眠</th><th scope="col">疲れ</th><th scope="col">動かした重さ</th></tr></thead><tbody>'+pre.map(k=>{ const p = db.days[k].pre; const v = db.days[k].finished ? r1(db.days[k].rows.filter(r=>r.status==='done').reduce((t,r)=>t+rowVol(r,k),0)) : null; return '<tr><td>'+md(k)+'</td><td>'+(num(p.sleep)!=null?p.sleep+'h':'')+'</td><td>'+(num(p.fat)!=null?FAT_WORDS[p.fat-1]:'')+'</td><td>'+(v!=null?kg(v)+' kg':'')+'</td></tr>'; }).join('')+'</tbody></table></div>' : '<p class="sub">練習前の記録を入れると、ここに並びます。</p>')+
    '<h2>測定（CMJ、スキンフォールド、心拍、HRV）</h2><p class="sub">入れた分だけ推移が出ます。今は数字を並べるだけで、判定の言葉は付けていません。判定の線は、資料を確かめてから足します。</p>'+
    tl('cmj','CMJ（反動あり）の高さ',' cm')+tl('skin','スキンフォールドの合計',' mm')+tl('hr','安静時心拍',' 拍')+tl('hrv','HRV','')+
    '<form id="tF" class="stack" style="margin-top:12px"><label class="f">測った日<input type="date" class="txt" id="tDate" value="'+td+'"></label><div class="stack two"><label class="f">CMJ（cm）<input type="number" class="txt" id="tCmj" step="0.5" min="0" inputmode="decimal"></label><label class="f">スキンフォールド合計（mm）<input type="number" class="txt" id="tSkin" step="0.5" min="0" inputmode="decimal"></label><label class="f">安静時心拍（拍/分）<input type="number" class="txt" id="tHr" step="1" min="0" inputmode="numeric"></label><label class="f">HRV（ms など、使っている機器の値）<input type="number" class="txt" id="tHrv" step="0.1" min="0" inputmode="decimal"></label></div><button type="submit" class="ghost">測定を記録する</button></form>',
    after(){ const s = $('#resEx'); if(s) s.addEventListener('change',()=>{ db.resEx = s.value; save(); render(false); $('#resEx').focus(); });
      $('#tF').addEventListener('submit',ev=>{ ev.preventDefault(); const o = {date:$('#tDate').value||td, cmj:num($('#tCmj').value), skin:num($('#tSkin').value), hr:num($('#tHr').value), hrv:num($('#tHrv').value)}; if(o.cmj==null&&o.skin==null&&o.hr==null&&o.hrv==null){ say('どれか一つは入れてください'); return; } db.tests = db.tests||[]; db.tests.push(o); save(); say('測定を記録しました'); render(false); $('#tDate').focus(); }); } }; };

  '<h2>バックアップ</h2><p class="sub">記録はこの携帯のこのブラウザーの中にあります。ときどき保存してください。</p><div class="stack two"><button type="button" class="ghost" id="bkSave">バックアップを保存</button><label class="ghost" style="position:relative">バックアップから戻す<input type="file" id="bkLoad" accept=".json,application/json" style="position:absolute;inset:0;opacity:0"></label></div>'+
  '<h2>このアプリについて</h2><p class="sub">版 '+APP_VER+'。種目 '+EX.length+'、文献 '+REF_ORDER.length+'件。種目の説明と根拠は、前の版で確かめたものをそのまま使っています。</p>',
  after(){ document.querySelectorAll('[data-role]').forEach(b=>b.addEventListener('click',()=>{ db.role = b.dataset.role; save(); document.querySelectorAll('[data-role]').forEach(x=>x.setAttribute('aria-pressed', x===b)); }));
    $('#sF').addEventListener('submit',ev=>{ ev.preventDefault(); const n = $('#sName').value.trim(); if(!n){ say('名前を入れてください'); $('#sName').focus(); return; } db.me = n; db.syncUrl = $('#sUrl').value.trim(); save(); say('保存しました'); render(false); $('#sName').focus(); });
    $('#syncBtn').addEventListener('click',()=>syncNow(true)); $('#menuFetch').addEventListener('click',()=>fetchMenu(true));
    const u = $('#undoRow'); if(u) u.addEventListener('click',()=>{ const x = db.undoRow; day(x.k).rows.push(x.row); db.undoRow = null; save(); say('戻しました'); render(false); $('#title').focus(); });
    $('#bkSave').addEventListener('click',()=>{ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'})); a.download = 'swimiq_strength_'+today()+'.json'; document.body.appendChild(a); a.click(); a.remove(); say('バックアップを保存しました'); });
    $('#bkLoad').addEventListener('change',ev=>{ const f = ev.target.files[0]; if(!f) return; f.text().then(t=>{ try{ const o = JSON.parse(t); if(!o || !o.days) throw 0; db = Object.assign({me:'', role:'athlete', syncUrl:'', days:{}, favs:[], tests:[], bw:[], sync:{sent:{}}, inbox:[], ready:true}, o); save(); say('戻しました'); render(true); }catch(x){ say('このファイルは読み込めませんでした'); } }); }); }
});

/* ============ 共通の押したときの動き ============ */
document.addEventListener('click',e=>{ if(e.target.closest('#sheet')) return; let b;
  if((b = e.target.closest('[data-go]'))){ pick = b.dataset.pick==='1'; if(b.dataset.go==='today'){ pick = false; } go(b.dataset.go, b.dataset.id?{id:b.dataset.id}:null); return; }
  if((b = e.target.closest('[data-tab]'))){ pick = false; go(b.dataset.tab); return; }
  if(e.target.closest('#back')) back(); });
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }); }
render(false);
if(db.ready){ fetchMenu(false); syncNow(false); }
</script>
</body>
</html>
