   2本の指で ひろげるか、上の ＋−で 大きさを 変えます。
   はみ出た ぶんは、指で 動かして 見られます。 */
var pdfZ=1;
function pdfZoomSet(z, cx, cy){
  var sc=$('pdfScroll'), im=$('pdfImg');
  if(!sc || !im) return;
  var old=pdfZ;
  pdfZ=Math.max(1, Math.min(5, z));
  /* つまんだ ところが 動かない ように、スクロールの いちを 合わせます */
  var r=sc.getBoundingClientRect();
  var px=(cx==null? r.width/2 : cx-r.left), py=(cy==null? r.height/2 : cy-r.top);
  var lx=(sc.scrollLeft+px)/old, ly=(sc.scrollTop+py)/old;
  im.classList.toggle('z', pdfZ>1.001);
  im.style.width=(100*pdfZ)+'%';
  $('pdfZv').textContent=Math.round(pdfZ*100)+'%';
  requestAnimationFrame(function(){
    sc.scrollLeft=lx*pdfZ-px; sc.scrollTop=ly*pdfZ-py;
  });
}
$('pdfZin').onclick =function(){ pdfZoomSet(pdfZ+0.5); };
$('pdfZout').onclick=function(){ pdfZoomSet(pdfZ-0.5); };
(function(){
  var sc=$('pdfScroll'), d0=0, base=1, cx=0, cy=0, lastTap=0;
  function dist(t){ var a=t[0], b=t[1];
    return Math.sqrt(Math.pow(a.clientX-b.clientX,2)+Math.pow(a.clientY-b.clientY,2)); }
  sc.addEventListener('touchstart', function(e){
    if(e.touches.length===2){
      d0=dist(e.touches); base=pdfZ;
      cx=(e.touches[0].clientX+e.touches[1].clientX)/2;
      cy=(e.touches[0].clientY+e.touches[1].clientY)/2;
    }else if(e.touches.length===1){
      var now=Date.now();
      if(now-lastTap<320){
        lastTap=0;
        pdfZoomSet(pdfZ>1.2?1:2.5, e.touches[0].clientX, e.touches[0].clientY);
      }else lastTap=now;
    }
  }, {passive:true});
  sc.addEventListener('touchmove', function(e){
    if(e.touches.length===2 && d0>0){
      try{ e.preventDefault(); }catch(err){}
      pdfZoomSet(base*(dist(e.touches)/d0), cx, cy);
    }
  }, {passive:false});
  sc.addEventListener('touchend', function(){ d0=0; }, {passive:true});
  sc.addEventListener('touchcancel', function(){ d0=0; }, {passive:true});
})();

var aSigT=null, aRT=null, rtMode='sound', rtOn=false;
try{ rtMode = localStorage.getItem('swimiq_rtmode') || 'sound'; }catch(e){}
try{ rtOn = (localStorage.getItem('swimiq_rton')==='1'); }catch(e){}
var rtScanning=false, rtRaf=null, rtAC=null, rtAn=null, rtSrcNode=null, rtBuf=null, rtFbuf=null, rtCv=null, rtCtx=null;
function rtPaint(){
  $('rtSig').textContent  = (aSigT!=null) ? aSigT.toFixed(2) : '--';

  var i, b=$('rtOnSeg').querySelectorAll('button');
  for(i=0;i<b.length;i++) b[i].setAttribute('aria-pressed', (b[i].dataset.ro==='on')===rtOn ? 'true':'false');
  $('rtOffPane').classList.toggle('hide', rtOn);
  $('rtOnPane').classList.toggle('hide', !rtOn);
  b=$('rtModeSeg').querySelectorAll('button');
  for(i=0;i<b.length;i++) b[i].setAttribute('aria-pressed', b[i].dataset.rm===rtMode ? 'true':'false');
  $('rtHowNote').textContent = T(rtMode==='sound' ? 'rtNoteSound' : (rtMode==='light' ? 'rtNoteLight' : 'rtNoteManual'));
  $('rtAuto').classList.toggle('hide', rtMode==='manual');
  $('rtMan').classList.toggle('hide', rtMode!=='manual');
}
function rtCalc(){
  if(aSigT!=null && aT0!=null){
    if(aT0>aSigT) aRT = aT0-aSigT;
    else { aRT=null; toast(T('rtBad')); }
  }
  rtPaint();
  paintSheet();
  paintNext();
}
function rtAudioInit(){
  if(rtAn) return true;
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    rtAC=new AC();
    rtSrcNode=rtAC.createMediaElementSource($('v'));
    rtAn=rtAC.createAnalyser(); rtAn.fftSize=1024;
    rtSrcNode.connect(rtAn); rtAn.connect(rtAC.destination);
    rtBuf=new Uint8Array(rtAn.fftSize);
    return true;
  }catch(e){ return false; }
}
function rtStop(found){
  rtScanning=false;
  if(rtRaf){ cancelAnimationFrame(rtRaf); rtRaf=null; }
  try{ $('v').pause(); }catch(e){}
  $('bPlay').innerHTML=T('playI');
  if(found){ $('rtStatus').textContent=T(aT0==null ? 'rtNextFoot' : 'rtFound'); rtCalc(); }
  else $('rtStatus').textContent=T('rtNotFound');
}
function rtScanStart(){
  var v=$('v'), useSound=(rtMode==='sound');
  if(useSound && !rtAudioInit()){ $('rtStatus').textContent=T('rtAudioNG'); return; }
  if(!useSound && !rtCv){ rtCv=document.createElement('canvas'); rtCv.width=64; rtCv.height=36; rtCtx=rtCv.getContext('2d'); }
  /* 足離れが すでに あるときは その 3秒前から、
     まだ ないときは いま 見ている ところから さがします */
  if(aT0!=null){ try{ v.currentTime=Math.max(0, aT0-3); }catch(e){} }
  rtScanning=true; $('rtStatus').textContent=T('rtFinding');
  if(rtAC && rtAC.state==='suspended'){ try{ rtAC.resume(); }catch(e){} }
  v.play().catch(function(){});
  var base=null, quiet=0;
  function loop(){
    if(!rtScanning) return;
    var t=v.currentTime;
    if(v.ended || (aT0!=null && t>=aT0)){ rtStop(false); return; }
    var val, voiceLike=false;
    if(useSound){
      rtAn.getByteTimeDomainData(rtBuf);
      var peak=0; for(var i=0;i<rtBuf.length;i++){ var dd=Math.abs(rtBuf[i]-128); if(dd>peak) peak=dd; }
      val=peak;                                   /* 0〜128 */
      /* 「よーい」の ような 声は、ひくい音が 多く なります。それは 合図と しません */
      if(!rtFbuf) rtFbuf=new Uint8Array(rtAn.frequencyBinCount);
      try{
        rtAn.getByteFrequencyData(rtFbuf);
        var hz=(rtAC?rtAC.sampleRate:48000)/2/rtFbuf.length, vo=0, all=0, q;
        for(q=1;q<rtFbuf.length;q++){
          var ff=q*hz; if(ff>8000) break;
          var ee=rtFbuf[q]*rtFbuf[q]; all+=ee;
          if(ff>=80 && ff<=520) vo+=ee;
        }
        voiceLike = (all>0) && ((vo/all) > 0.42);
      }catch(e){}
    }else{
      try{ rtCtx.drawImage(v,0,0,rtCv.width,rtCv.height); }catch(e){ rtStop(false); return; }
      var im; try{ im=rtCtx.getImageData(0,0,rtCv.width,rtCv.height).data; }catch(e){ rtStop(false); return; }
      var sum=0; for(var k=0;k<im.length;k+=4) sum += im[k]*0.299+im[k+1]*0.587+im[k+2]*0.114;
      val=sum/(im.length/4);                      /* 0〜255 */
    }
    if(base==null) base=val;
    var thr = useSound ? Math.max(20, base+14) : (base+16);
    if(quiet>5 && val>thr && !voiceLike){ aSigT=t; rtStop(true); return; }
    if(val<=thr){ base=base*0.9+val*0.1; quiet++; }
    rtRaf=requestAnimationFrame(loop);
  }
  rtRaf=requestAnimationFrame(loop);
}

/* ================================================================
   動画を ひろげる（ピンチアウト）
   2本の指で ひろげると 大きく なります。
   大きく した あとは 1本の指で 動かせます。
   2回 たたくと もとの 大きさに もどります。
   ================================================================ */
function makeZoomable(vid, tap, undo){
  if(!vid || !tap) return null;
  var sc=1, tx=0, ty=0;
  var pinch=false, panning=false, gesture=false;
  var sd=0, ssc=1, smx=0, smy=0, stx=0, sty=0;
  var px=0, py=0, ptx=0, pty=0, lastTap=0;
  vid.style.transformOrigin='0 0';
  function apply(){ vid.style.transform='translate('+tx+'px,'+ty+'px) scale('+sc+')'; }
  function clamp(){
    var w=tap.clientWidth||1, h=tap.clientHeight||1;
    if(sc<=1){ tx=0; ty=0; return; }
    var mnx=w-w*sc, mny=h-h*sc;
    if(tx>0) tx=0; if(tx<mnx) tx=mnx;
    if(ty>0) ty=0; if(ty<mny) ty=mny;
  }
  function reset(){ sc=1; tx=0; ty=0; apply(); }
  function mark(){ gesture=true; }
  function unmark(){ setTimeout(function(){ gesture=false; }, 120); }
  function dist(t){ var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.sqrt(dx*dx+dy*dy); }
  tap.addEventListener('touchstart', function(e){
    if(e.touches.length===2){
      var r=tap.getBoundingClientRect();
      pinch=true; panning=false; mark();
      sd=dist(e.touches); ssc=sc; stx=tx; sty=ty;
      smx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left;
      smy=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
      if(undo) undo();
      e.preventDefault();
    }else if(e.touches.length===1 && sc>1){
      panning=true; px=e.touches[0].clientX; py=e.touches[0].clientY; ptx=tx; pty=ty;
    }
  }, {passive:false});
  tap.addEventListener('touchmove', function(e){
    if(pinch && e.touches.length===2){
      if(sd<=0) return;
      var r=tap.getBoundingClientRect();
      var ns=Math.max(1, Math.min(5, ssc*(dist(e.touches)/sd)));
      var mx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left;
      var my=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
      tx = mx-(smx-stx)*(ns/ssc);
      ty = my-(smy-sty)*(ns/ssc);
      sc = ns;
      if(sc<1.02){ sc=1; tx=0; ty=0; } else clamp();
      apply(); e.preventDefault();
    }else if(panning && e.touches.length===1 && sc>1){
      var dx=e.touches[0].clientX-px, dy=e.touches[0].clientY-py;
      if(Math.abs(dx)+Math.abs(dy)>6) mark();
      tx=ptx+dx; ty=pty+dy; clamp(); apply(); e.preventDefault();
    }
  }, {passive:false});
  function end(e){
    if(pinch && e.touches.length<2){ pinch=false; if(sc<1.02) reset(); }
    if(panning && e.touches.length===0) panning=false;
    if(e.touches.length===0){
      var now=Date.now();
      if(!gesture && sc>1 && now-lastTap<320){ reset(); mark(); }
      lastTap=now;
      if(gesture) unmark();
    }
  }
  tap.addEventListener('touchend', end);
  tap.addEventListener('touchcancel', end);
  tap.addEventListener('click', function(e){
    if(gesture){ e.stopPropagation(); e.preventDefault(); }
  }, true);
  return { reset:reset, zoomed:function(){ return sc>1; } };
}

/* ===== きょりを かえた ときの つじつま合わせ =====
   たとえば 100m で 計った あとに 50m へ かえると、
   65m〜100m の きろくは その きょりには ありえません。
   そのままだと「せっていは 50m なのに ラップが 100m まで ある」
   という ちぐはぐな 画面に なるので、ここで そろえます。 */
function outOfRange(){
  var all=lapDists(Number($('dist').value)), ok={}, i, out=[];
  for(i=0;i<all.length;i++) ok[all[i]]=1;
  for(i=0;i<aSplits.length;i++) if(!ok[aSplits[i].d]) out.push(aSplits[i].d);
  return out;
}
var distWas=null;
function distApply(){
  var bad=outOfRange();
  if(bad.length){
    var list=bad.join('m・')+'m';
    if(!confirm(T('askTrim1')+$('dist').value+T('askTrim2')+list+T('askTrim3'))){
      /* けしたくない ときは、きょりを もとに もどします */
      if(distWas!=null) $('dist').value=distWas;
      paintTbl(); return;
    }
    var keep=[], all=lapDists(Number($('dist').value)), ok={}, i;
    for(i=0;i<all.length;i++) ok[all[i]]=1;
    for(i=0;i<aSplits.length;i++) if(ok[aSplits[i].d]) keep.push(aSplits[i]);
    aSplits=keep;
    toast(list+T('msgTrimmed'));
  }
  distWas=$('dist').value;
  selManual=false; aLastSel='';
  paintTbl();
}

             evLabel(r.event), T('anaNew'), '分析' ];

  /* 試合名が あれば 1行めに 大きく、2行めに 選手・種目・きょり・日づけ */

    ? '<button type="button" class="cTimeBtn" data-id="'+r.id+'">'+fmt(last.t)+'</button>'

               '　SR '+(ss.sr!=null?ss.sr.toFixed(1):'--')+

function paintList(){

  var W=1080, pad=56, row=62;
  var H=330+70+((r.splits||[]).length+1)*row+70+(sts.length+1)*row+80;
  var cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  var g=cv.getContext('2d');
  g.fillStyle='#000'; g.fillRect(0,0,W,H);
  g.fillStyle='#ffc400'; g.fillRect(0,0,W,10);
  var y=88;
  g.fillStyle='#fff'; g.font='900 46px sans-serif'; g.textBaseline='alphabetic';
  g.fillText('SwimIQ LITE　'+r.title, pad, y); y+=54;
  g.fillStyle='#b5b5b5'; g.font='700 26px sans-serif';
  g.fillText(new Date(r.at).toLocaleString('ja-JP')+'　'+r.pool+'mプール　'+r.dist+'m', pad, y); y+=52;
  var cw=(W-pad*2-24)/3;
  var vs=[[last?fmt(last.t):'--',(last?last.d+'m '+T('timeLbl'):T('timeLbl'))],
          [avg?avg.toFixed(2):'--',T('avgST')],
          [avg?(60/avg).toFixed(1):'--',T('avgSR')]];
  for(i=0;i<3;i++){

      g.fillText(all[q][1], pad+180, y+row*0.66);
      g.textAlign='right';
      g.fillStyle = q===0?'#000':'#b5b5b5';
      if(q!==0) g.font='800 28px sans-serif';
      g.fillText(all[q][2], W-pad-22, y+row*0.66);
      g.textAlign='left'; y+=row;
    }
    y+=40;
  }
  var lr=[];
  for(i=0;i<(r.splits||[]).length;i++){
    var pv=i>0?r.splits[i-1].t:0;
    lr.push([r.splits[i].d+'m', fmt(r.splits[i].t), segT(r.splits[i].t-pv)]);

  if(!lr.length) lr=[['-',T('nothing'),'']];
  table(T('glSplit'),[T('hDist'),T('hTime'),T('hSplit')],lr);
  var sr=[];
  for(i=0;i<sts.length;i++) sr.push([String(i+1), sts[i].toFixed(2), 'SR '+(60/sts[i]).toFixed(1)]);
  if(!sr.length) sr=[['-',T('notCount'),'']];

  return new Promise(function(res){
    try{ cv.toBlob(function(b){ res(b); },'image/jpeg',0.94); }catch(e){ res(null); }
  });
}

/* 音の 見わけかた（会話で うごきださないための 4つの じょうけん）
   1)大きさ 2)立ち上がりの するどさ 3)高い音の わりあい 4)すこし つづくこと

var SENS=[[5.0,0.110,3.2,0.55,3],[3.5,0.070,2.4,0.38,2],[2.4,0.040,1.8,0.20,2]];

/* いまの ようすを つねに 出します */

/* --- マイク --- */
function cAudio(){
  if(cAC||!cStream) return;
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    cAC=new AC(); cSR=cAC.sampleRate||48000;
    cSrc=cAC.createMediaStreamSource(cStream);
    cAn=cAC.createAnalyser(); cAn.fftSize=2048; cAn.smoothingTimeConstant=0;
    cTbuf=new Float32Array(cAn.fftSize);
    cFbuf=new Uint8Array(cAn.frequencyBinCount);
    cSrc.connect(cAn);
    cHist=[]; cHold=0; cWatch();
  }catch(e){ cAC=null; }
}
function cRms(){
  if(!cAn) return 0;
  try{ cAn.getFloatTimeDomainData(cTbuf); }catch(e){ return 0; }
  var s=0; for(var i=0;i<cTbuf.length;i++) s+=cTbuf[i]*cTbuf[i];
  return Math.sqrt(s/cTbuf.length);
}
/* 音の なかみを 1回の 計算で しらべます。
   hi    … 高い音（1400〜6000Hz）の わりあい
   voice … 人の こえの 芯（80〜520Hz）の わりあい。こえは ここが 大きく なります */
function cSpec(){
  if(!cAn||!cFbuf) return { hi:0, voice:0 };
  try{ cAn.getByteFrequencyData(cFbuf); }catch(e){ return { hi:0, voice:0 }; }
  var hz=cSR/2/cFbuf.length, lo=0, hi=0, vo=0, all=0;
  for(var i=1;i<cFbuf.length;i++){
    var f=i*hz; if(f>8000) break;
    var e=cFbuf[i]*cFbuf[i];
    all+=e;
    if(f<1400) lo+=e; else if(f<6000) hi+=e;
    if(f>=80 && f<=520) vo+=e;
  }
  return { hi:((lo+hi)>0 ? hi/(lo+hi) : 0), voice:(all>0 ? vo/all : 0) };
}
function cHi(){ return cSpec().hi; }
/* ===== 光を 見はる しくみ =====
   スタート台の ランプが 光った しゅんかん、画面が ぱっと 明るく なります。
   その とびあがりを 見つけます。声には まったく まどわされません。 */
var cLCan=null, cLCtx=null, cLBase=0, cLBaseB=0, cLHold=0;
function cLightInit(){
  if(!cLCan){
    cLCan=document.createElement('canvas'); cLCan.width=96; cLCan.height=54;
    cLCtx=cLCan.getContext('2d', { willReadFrequently:true });
  }
  cLBase=0; cLBaseB=0; cLHold=0;
}
/* 画面ぜんたいの 明るさ（m）と、まぶしい 点の 数（b）を 返します。
   ランプは 小さくても まぶしいので、点の 数の ほうが よく 見つかります。 */
function cLightLv(){
  var v=$('cv');
  if(!cLCtx || !v || !v.videoWidth) return null;
  try{
    cLCtx.drawImage(v, 0, 0, cLCan.width, cLCan.height);
    var d=cLCtx.getImageData(0,0,cLCan.width,cLCan.height).data, s=0, b=0, k, y;
    for(k=0;k<d.length;k+=4){
      y = d[k]*0.299 + d[k+1]*0.587 + d[k+2]*0.114;
      s += y; if(y>242) b++;
    }
    return { m:s/(d.length/4), b:b };
  }catch(e){ return null; }
}

var cVoiceSaid=0, cWentBySig=false, cRecOn=false;
function cWatch(){
  cancelAnimationFrame(cLvRaf);
  (function step(){
    cLvRaf=requestAnimationFrame(step);
    if(!cAn) return;
    var now=performance.now(), v=cRms(), P=sensP();
    cHist.push({t:now,v:v});
    while(cHist.length && now-cHist[0].t>500) cHist.shift();
    if(!cRun){ var a=(v>cBase)?0.02:0.05; cBase=cBase*(1-a)+v*a; }
    if(cBase<0.002) cBase=0.002;
    var bar=$('camLvB');

    /* ---- 光で まつ ---- */
    if(cTrig==='light'){
      var lv=cLightLv();
      if(lv){
        if(cLBase<=0){ cLBase=lv.m; cLBaseB=lv.b; }
        var jm = lv.m - cLBase;                 /* ぜんたいが 明るく なった ぶん */
        var jb = lv.b - cLBaseB;                /* まぶしい 点が ふえた ぶん */
        var hitM = (jm>7 && lv.m>cLBase*1.12);
        var hitB = (jb>18 && lv.b>cLBaseB*1.8+10);
        var pw = Math.max(jm*7, jb*3);
        bar.style.width=Math.min(100, Math.max(0, pw)).toFixed(0)+'%';
        bar.style.background = (hitM||hitB) ? '#ffffff' : '#64748b';
        if(!cArm){
          cLBase = cLBase*0.94 + lv.m*0.06; cLBaseB = cLBaseB*0.94 + lv.b*0.06;
          cLHold=0; return;
        }
        if(now-cArmAt<500){ cLHold=0; return; }
        if(hitM||hitB) cLHold++;
        else{ cLHold=0; cLBase=cLBase*0.97+lv.m*0.03; cLBaseB=cLBaseB*0.97+lv.b*0.03; }
        if(cLHold>=2){
          cLHold=0; cArm=false; cWentBySig=true; cGo(now);
          try{ if(navigator.vibrate) navigator.vibrate(30); }catch(e){}
          cSay(T('cWent'));
          setTimeout(function(){ if(cRun) cSay(''); },1600);
        }
      }
      return;
    }

    if(!cArm){ cHold=0; return; }
    var s=0,n=0, i, d;
    for(i=0;i<cHist.length;i++){ d=now-cHist[i].t; if(d>=150&&d<=350){ s+=cHist[i].v; n++; } }
    var before=n?s/n:cBase; if(before<0.002) before=0.002;
    var lim=Math.max(cBase*P[0],P[1]);
    var sp=cSpec();
    var okL=v>lim, okR=(v/before)>P[2], okH=sp.hi>P[3];
    var ok=okL&&okR&&okH, voiceLike=false;

    if(cTrig==='sharp'){
      /* ブザーや ピストルは 40〜110ms の あいだに 一気に 立ち上がります。
         「よーい」の 声は ゆっくり 立ち上がり、ひくい音が 多く なります。 */
      var s2=0, n2=0;
      for(i=0;i<cHist.length;i++){ d=now-cHist[i].t; if(d>=40&&d<=110){ s2+=cHist[i].v; n2++; } }
      var pre=n2?s2/n2:cBase; if(pre<0.002) pre=0.002;
      var fast = (v/pre) > 3.2;
      voiceLike = (sp.voice > 0.42);
      ok = ok && fast && !voiceLike;
    }

    bar.style.width=Math.min(100,(v/(lim*1.6))*100).toFixed(0)+'%';
    bar.style.background = ok ? '#ffffff' : (voiceLike ? '#f97362' : (okH ? '#fbbf24' : '#64748b'));

    if(now-cArmAt<500){ cHold=0; return; }
    /* 声だと 分かった ときは、そう 伝えて 待ちつづけます */
    if(voiceLike && okL && okR && now-cVoiceSaid>1600){
      cVoiceSaid=now; cSay(T('cVoiceIgn'));
      setTimeout(function(){ if(cArm) cSay(T('cArmed')); }, 1500);
    }
    if(ok) cHold++; else cHold=0;
    if(cHold>=P[4]){
      cHold=0; cArm=false; cWentBySig=true; cGo(now);
      try{ if(navigator.vibrate) navigator.vibrate(30); }catch(e){}
      cSay(T('cWent'));
      setTimeout(function(){ if(cRun) cSay(''); },1600);
    }
  })();
}
/* --- カメラ --- */

function cStopCam(){

/* ================= カメラの ズーム =================
   端末が ズームに 対応して いる ときは、その しくみを つかいます（画は きれいなまま）。
   対応して いない ときは、まん中を 切りとって 大きく うつします。
   そのばあい、録画にも 同じ 大きさで のこす ため、キャンバスを 通して 録ります。
   ズームは 録画を はじめる まえに 合わせて ください。          */
var cZoom=1, cZoomCap=null, cCanvas=null, cCtx2=null, cDrawRaf=null, cCanStream=null, cZoomSaid=false;
var C_ZMAX=6;
function cZoomInit(){
  cZoom=1; cZoomCap=null; cZoomSaid=false;
  try{
    var tr=cStream && cStream.getVideoTracks()[0];
    if(tr && tr.getCapabilities){
      var cap=tr.getCapabilities();
      if(cap && cap.zoom && cap.zoom.max > cap.zoom.min) cZoomCap=cap.zoom;
    }
  }catch(e){}
  $('cv').style.transform='';
  cZoomPaint();
}
function cZoomPaint(){
  var z=$('cZval'); if(z) z.textContent=cZoom.toFixed(1)+'x';
  var n=$('cZnow'); if(n) n.textContent=cZoom.toFixed(1)+'x';
  var a=$('cZin'), b=$('cZout');
  if(a) a.disabled = cZoom>=C_ZMAX-0.001;
  if(b) b.disabled = cZoom<=1.001;
}
function cZoomSet(z){
  z=Math.max(1, Math.min(C_ZMAX, z));
  if(Math.abs(z-cZoom)<0.001) return;
  cZoom=z;
  if(cZoomCap){
    try{
      var tr=cStream.getVideoTracks()[0];
      var zz=cZoomCap.min + (cZoomCap.max-cZoomCap.min)*((z-1)/(C_ZMAX-1));
      tr.applyConstraints({ advanced:[{ zoom: zz }] });
    }catch(e){}
    $('cv').style.transform='';
  }else{
    $('cv').style.transform = (z>1.001) ? ('scale('+z.toFixed(3)+')') : '';
    if(!cZoomSaid && z>1.001 && cRun){ cZoomSaid=true; toast(T('zoomHint')); }
  }
  cZoomPaint();
}
/* ================= 手ぶれ ほせい =================
   小さな 白黒の 絵を 1コマ前と くらべて、どれだけ ずれたかを しらべます。
   ゆっくりした 動き（わざと カメラを ふる）は のこし、
   こまかい ふるえだけを 打ち消して うつします。
   そのぶん まわりを すこし 切りますので、画は 6パーセントほど 大きく なります。 */
var cStabOn=false;
try{ cStabOn=(localStorage.getItem('swimiq_stab')!=='0'); }catch(e){ cStabOn=true; }
var SGW=48, SGH=27, S_MAX=5, S_CROP=1.06;
var sCan=null, sCtx=null, sPrev=null, sCur=null;
var sCx=0, sCy=0, sSx=0, sSy=0;            /* たまった ずれ と、なめらかに した ずれ */
var sFps=0, sFpsT=0, sFpsN=0;

function cStabPaint(){
  var b=$('cStab'); if(!b) return;
  b.textContent=T(cStabOn?'stabOn':'stabOff');
  b.setAttribute('aria-pressed', cStabOn?'true':'false');
}
function cStabReset(){
  if(!sCan){
    sCan=document.createElement('canvas'); sCan.width=SGW; sCan.height=SGH;
    sCtx=sCan.getContext('2d', { willReadFrequently:true });
  }
  sPrev=null; sCur=null; sCx=0; sCy=0; sSx=0; sSy=0;
  sFps=0; sFpsT=0; sFpsN=0;
}
/* いまの コマを 小さな 白黒に します */
function sGray(v){
  if(!sCtx) return null;
  try{
    sCtx.drawImage(v, 0, 0, SGW, SGH);
    var d=sCtx.getImageData(0,0,SGW,SGH).data;
    var g=new Uint8Array(SGW*SGH), i, k=0;
    for(i=0;i<d.length;i+=4){ g[k++]=(d[i]*77 + d[i+1]*151 + d[i+2]*28)>>8; }
    return g;
  }catch(e){ return null; }
}
/* 1コマ前と くらべて、いちばん よく かさなる ずれを さがします */
function sShift(a, b){
  var best=1e18, bx=0, by=0, dx, dy, x, y, sum, i, j, cnt;
  for(dy=-S_MAX; dy<=S_MAX; dy++){
    for(dx=-S_MAX; dx<=S_MAX; dx++){
      sum=0; cnt=0;
      for(y=S_MAX; y<SGH-S_MAX; y+=2){
        i=y*SGW; j=(y+dy)*SGW+dx;
        for(x=S_MAX; x<SGW-S_MAX; x+=2){
          sum += Math.abs(a[i+x]-b[j+x]); cnt++;
        }
        if(sum/Math.max(1,cnt) > best) break;    /* もう だめなら やめます */
      }
      sum = sum/Math.max(1,cnt);
      if(sum<best){ best=sum; bx=dx; by=dy; }
    }
  }
  return { x:bx, y:by };
}

/* 録画に つかう 映像を えらびます */
function cNeedCanvas(){ return cStabOn || (!cZoomCap && cZoom>1.001); }
function cRecSource(){
  if(!cNeedCanvas()) return cStream;
  try{
    var v=$('cv'), W=v.videoWidth||0, H=v.videoHeight||0;
    if(!W || !H) return cStream;
    cCanvas = $('cStabCv');
    cCanvas.width=W; cCanvas.height=H;
    cCtx2=cCanvas.getContext('2d');
    if(!cCtx2 || !cCanvas.captureStream) return cStream;
    cStabReset();
    $('cam').classList.toggle('stab', cStabOn);
    if(cDrawRaf) cancelAnimationFrame(cDrawRaf);
    (function draw(){
      cDrawRaf=requestAnimationFrame(draw);
      var z=Math.max(1,cZoom) * (cStabOn ? S_CROP : 1);
      var ox=0, oy=0;
      if(cStabOn){
        sCur=sGray(v);
        if(sCur && sPrev){
          var d=sShift(sPrev, sCur);
          sCx+=d.x; sCy+=d.y;
          sSx=sSx*0.88+sCx*0.12; sSy=sSy*0.88+sCy*0.12;   /* ゆっくりした 動きだけ のこす */
          var mx=(W/SGW), my=(H/SGH);
          var lim=W*(S_CROP-1)/2;
          ox=Math.max(-lim, Math.min(lim, (sCx-sSx)*mx));
          oy=Math.max(-lim*H/W, Math.min(lim*H/W, (sCy-sSy)*my));
        }
        if(sCur) sPrev=sCur;
      }
      var sw=W/z, sh=H/z, sx=(W-sw)/2 + ox, sy=(H-sh)/2 + oy;
      if(sx<0) sx=0; if(sy<0) sy=0;
      if(sx+sw>W) sx=W-sw; if(sy+sh>H) sy=H-sh;
      try{ cCtx2.drawImage(v, sx, sy, sw, sh, 0, 0, W, H); }catch(e){}
      /* おもすぎる ときは、手ぶれ ほせいを 自分で 切ります */
      if(cStabOn && cRun){
        var t=performance.now();
        if(!sFpsT) sFpsT=t; else { sFpsN++;
          if(t-sFpsT>2000){
            sFps=sFpsN/((t-sFpsT)/1000); sFpsT=t; sFpsN=0;
            if(sFps>0 && sFps<24){

/* 分析・くわしく画面の「結果」の枠を うごかす。
   枠の どこを おしても つかめる（どこでもドラッグ）。
   すこし 動かすと 移動、動かさず 指を はなすと ふつうの タップ。 */
function makeDraggable(box){
  if(!box) return;
  var cx=0, cy=0, sx=0, sy=0, ox=0, oy=0, baseL=0, baseT=0, w=0, h=0;
  var down=false, moved=false, pid=null, justDragged=false;
  var M=6, TH=6;
  box.addEventListener('pointerdown', function(e){
    if(e.button && e.button!==0) return;
    down=true; moved=false; pid=e.pointerId;
    sx=e.clientX; sy=e.clientY; ox=cx; oy=cy;
    var r=box.getBoundingClientRect();
    baseL=r.left-cx; baseT=r.top-cy; w=r.width; h=r.height;
  });
  box.addEventListener('pointermove', function(e){
    if(!down) return;
    var dx=e.clientX-sx, dy=e.clientY-sy;
    if(!moved){
      if(Math.abs(dx)+Math.abs(dy) < TH) return;   /* しきい値を こえたら 移動開始 */
      moved=true;
      try{ box.setPointerCapture(pid); }catch(err){}
    }
    var minx=M-baseL, maxx=window.innerWidth-w-M-baseL;
    var miny=M-baseT, maxy=window.innerHeight-h-M-baseT;
    cx=Math.max(minx, Math.min(ox+dx, maxx));
    cy=Math.max(miny, Math.min(oy+dy, maxy));
    box.style.transform='translate('+cx+'px,'+cy+'px)';
    e.preventDefault();
  });
  function end(e){
    if(!down) return; down=false;
    if(moved){
      try{ box.releasePointerCapture(pid); }catch(err){}
      justDragged=true; setTimeout(function(){ justDragged=false; }, 60);  /* 直後のタップを 打ち消す */
    }
  }
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
  /* 動かした直後の click（ボタン誤爆）を 止める */
  box.addEventListener('click', function(e){ if(justDragged){ e.stopPropagation(); e.preventDefault(); } }, true);
}

/* ================================================================
   きろくの 比較・進捗
   ================================================================
   種目・きょり・ことばで しぼりこみ、直近 3/5/10/ぜんぶの
   ベスト・平均・グラフ（タイム／ST・SR／かき数）を見せます。
   一覧から 2つ タップすると、ならべて くらべられます。       */
var EV_LABELS={ free:'自由形', back:'背泳ぎ', breast:'平泳ぎ', fly:'バタフライ', im:'個人メドレー', relay:'リレー', other:'その他' };
function evLabel(k){ return EV_LABELS[k] || EV_LABELS.other; }
function raceBest(r){
  return (r.splits && r.splits.length) ? r.splits[r.splits.length-1].t : null;
}
function raceStroke(r){
  /* 修正で入れた ストローク数・テンポ(manualN/manualST)が あれば 優先する
     （手入力の記録でも、動画の記録でも どちらでも 上書きできる） */
  var nOv  = (r.manualN!=null) ? r.manualN : null;
  var stOv = (r.manualST!=null && r.manualST>0) ? r.manualST : null;
  if(nOv!=null || stOv!=null){
    var st1=stOv, n1=nOv, j;
    if((st1==null || n1==null) && !r.manual){   /* 上書きされていない側は 動画のtapから 計算 */
      var a=r.strokes||[], s2=[];
      for(j=1;j<a.length;j++){ var dd=a[j]-a[j-1]; if(dd>0.05) s2.push(dd); }
      var ts2=tempoStats(s2, wantTurnsOf(r.dist, r.pool));
      if(st1==null && ts2.st!=null) st1=ts2.st;
      if(n1==null && a.length) n1=a.length;
    }
    return { st:st1, sr: st1?(60/st1):null, n:n1, turns:[] };
  }
  if(r.manual) return { st:null, sr:null, n:null, turns:[] };
  var arr=r.strokes||[], sts=[], i;
  for(i=1;i<arr.length;i++){ var d=arr[i]-arr[i-1]; if(d>0.05) sts.push(d); }
  var tp=tempoStats(sts, wantTurnsOf(r.dist, r.pool));
  return { st: tp.st, sr: tp.sr, n: arr.length || null, turns: tp.turns, outs: tp.outs };
}
/* ストローク数の かぞえかた：50mごとに 1くぎり
   （100m＝2くぎり、200m＝4くぎり、400m＝8くぎり、1500m＝30くぎり） */
function segCount(dist){
  dist = Number(dist)||0;
  return Math.max(1, Math.round(dist/50));
}
/* 動画の たたいた時刻（strokes）と ラップ（splits）から、
   50mごとの 本数・平均テンポを 計算する */
function segsFromStrokes(splits, strokes, wantTurns){
  var arr=strokes||[], out=[];
  splits = splits || [];
  if(!splits.length || !arr.length) return out;
  /* レース ぜんたいで 一度 しんだんし、ターンと おしまちがいを 平均から のぞきます */
  var iv=tempoTable(arr, wantTurns), prevT=0, i, k;
  for(i=0;i<splits.length;i++){
    var segEndT=splits[i].t, cnt=0, sum=0, num=0;
    for(k=0;k<arr.length;k++){ if(arr[k]>prevT && arr[k]<=segEndT) cnt++; }
    for(k=0;k<iv.length;k++){
      if(iv[k].t>prevT && iv[k].t<=segEndT && iv[k].kind==='ok'){ sum+=iv[k].d; num++; }
    }
    out.push({ n:(cnt||null), st: num ? sum/num : null });
    prevT=segEndT;
  }
  return out;
}
function raceStrokeSegs(r){
  var segs, splits=r.splits||[], out=[], i;
  if(r.manual) segs = r.manualSegs || [];
  else segs = segsFromStrokes(splits, r.strokes, wantTurnsOf(r.dist, r.pool));
  if(!segs.length) return [];
  for(i=0;i<segs.length;i++){
    var s=segs[i]||{};
    var st=(s.st!=null && s.st>0) ? s.st : null;
    var toD = (splits[i] && splits[i].d!=null) ? splits[i].d : (i+1)*50;
    out.push({ from:i*50, to:toD, n:(s.n!=null?s.n:null), st:st, sr: st?(60/st):null });
  }
  return out;
}

/* ===== きろくの 手入力（動画なし） =====
   動画が ない レースでも、日づけ・大会名・種目・きょり・記録タイム・
   ストローク数・ST を そのまま 入れて のこせます。
   のこった データは、比較・進捗の 画面でも 動画ありの きろくと

  var n=Number(s);
  return isNaN(n) ? null : n;
}

/* ================================================================
   PDFレポート（アプリ内で 作って、印刷→PDFで保存）
   ================================================================ */
function rpSVGsplits(r){
  var sp=(r.splits||[]).slice().sort(function(a,b){ return a.d-b.d; });
  if(!sp.length) return '';
  var laps=[]; for(var i=0;i<sp.length;i++){ laps.push({ d:sp[i].d, seg:sp[i].t-(i>0?sp[i-1].t:0), lab:(i>0?sp[i-1].d:0)+'-'+sp[i].d }); }
  var W=430,H=210,pad={l:34,r:12,t:22,b:34}, iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  var maxV=Math.max.apply(null,laps.map(function(l){return l.seg;})); var yMax=Math.ceil(maxV/2)*2+2;
  var gap=iw/laps.length, bw=gap*0.56, slow=maxV;
  var s='<svg viewBox="0 0 '+W+' '+H+'">';
  for(var g=0; g<=yMax; g+=4){ var yy=pad.t+ih-(g/yMax*ih);
    s+='<line x1="'+pad.l+'" y1="'+yy+'" x2="'+(W-pad.r)+'" y2="'+yy+'" stroke="#eceef1" stroke-width="1"/>';

  s+='<line x1="'+mx+'" y1="'+(H-52)+'" x2="'+(W-mx)+'" y2="'+(H-52)+'" stroke="#e4e6ea" stroke-width="1"/>';
  s+='<text x="'+mx+'" y="'+(H-36)+'" font-size="9.5" font-weight="700" fill="#9aa0ab">SwimIQ LITE B — レース分析レポート</text>';
  s+='<text x="'+(W-mx)+'" y="'+(H-36)+'" font-size="9.5" font-weight="700" fill="#9aa0ab" text-anchor="end">作成 '+esc(dt)+'</text>';
  s+='</svg>';
  return s;
}
function svgToJpeg(svg, W, H, scale){
  return new Promise(function(res,rej){
    var img=new Image();
    img.onload=function(){
      try{
        var c=document.createElement('canvas');
        c.width=Math.round(W*scale); c.height=Math.round(H*scale);
        var ctx=c.getContext('2d');
        ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,c.width,c.height);
        ctx.drawImage(img,0,0,c.width,c.height);
        c.toBlob(function(b){ if(!b){ rej(new Error('blob')); return; }
          b.arrayBuffer().then(function(ab){ res({ u8:new Uint8Array(ab), w:c.width, h:c.height }); }, function(){ rej(new Error('ab')); });
        }, 'image/jpeg', 0.92);
      }catch(e){ rej(e); }
    };
    img.onerror=function(){ rej(new Error('img')); };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}
function jpegToPdf(jpeg, w, h){
  var pw=595.28, ph=841.89, scale=Math.min(pw/w, ph/h);
  var iw=w*scale, ih=h*scale, ox=(pw-iw)/2, oy=(ph-ih)/2;
  var enc=new TextEncoder(), chunks=[], off=[], pos=0;
  function push(u8){ chunks.push(u8); pos+=u8.length; }
  function ps(str){ push(enc.encode(str)); }
  ps("%PDF-1.4\n");
  off[1]=pos; ps("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  off[2]=pos; ps("2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n");
  off[3]=pos; ps("3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+pw.toFixed(2)+" "+ph.toFixed(2)+"] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n");
  off[4]=pos; ps("4 0 obj\n<< /Type /XObject /Subtype /Image /Width "+w+" /Height "+h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpeg.length+" >>\nstream\n");
  push(jpeg); ps("\nendstream\nendobj\n");
  var content="q "+iw.toFixed(2)+" 0 0 "+ih.toFixed(2)+" "+ox.toFixed(2)+" "+oy.toFixed(2)+" cm /Im0 Do Q";
  off[5]=pos; ps("5 0 obj\n<< /Length "+content.length+" >>\nstream\n"+content+"\nendstream\nendobj\n");
  var xp=pos, xref="xref\n0 6\n0000000000 65535 f \n";
  for(var i=1;i<=5;i++) xref+=String(off[i]).padStart(10,'0')+" 00000 n \n";
  ps(xref); ps("trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n"+xp+"\n%%EOF");
  var total=0; chunks.forEach(function(c){ total+=c.length; });
  var out=new Uint8Array(total), o=0; chunks.forEach(function(c){ out.set(c,o); o+=c.length; });
  return new Blob([out], { type:'application/pdf' });
}
var pdfBlobCur=null, pdfNameCur='SwimIQ.pdf', pdfImgURL=null;
function downloadPDF(r){
  if(!r) return;
  toast(T('pdfMaking'));
  var W=794, H=1123;

/* ================================================================

   時計は 実際の時刻(performance.now)を もとに計算するので、
   画面を とじても タイムは ずれません。

function swFmt(s){
  if(s==null || isNaN(s) || s<0) s=0;
  var m=Math.floor(s/60), r=s-m*60;
  var ss=String(Math.floor(r)).padStart(2,'0');
  var cc=String(Math.floor((r-Math.floor(r))*100)).padStart(2,'0');
  return m+':'+ss+'.'+cc;
}
function swNow(){ return swElapsed + (swRunning ? (performance.now()-swStartTs)/1000 : 0); }
/* 数字が よこに ぶれないよう、1文字ずつ 同じ幅の わくに 入れて 表示します */
var swLastStr='';
function swPaint(){
  var str=swFmt(swNow());
  if(str===swLastStr) return;
  swLastStr=str;
  var out='', ch, i;
  for(i=0;i<str.length;i++){
    ch=str.charAt(i);
    out += '<span class="'+((ch===':'||ch==='.')?'sep':'dg')+'">'+ch+'</span>';
  }
  $('swTime').innerHTML=out;
}
function swLoop(){ swPaint(); swRaf=requestAnimationFrame(swLoop); }
function swRenderLaps(){
  var box=$('swLaps'), d=Number($('swDist').value)||50;
  if(!swLaps.length){
    box.innerHTML='<div class="swEmpty" data-t="swEmpty">'+T('swEmpty')+'</div>';
    return;
  }
  var html='', i;
  for(i=swLaps.length-1; i>=0; i--){
    var cum=swLaps[i], prev=(i>0?swLaps[i-1]:0), lap=cum-prev;
    var zlabel = (swMode==='num') ? (i+1) : ((i+1)*d+'m');
    html+='<div class="swRow'+(i===swLaps.length-1?' new':'')+'">'+
          '<span class="z">'+zlabel+'</span>'+
          '<span class="l">'+swFmt(cum)+'</span>'+
          '<span class="s">'+swFmt(lap)+'</span></div>';
  }

}
function swBtns(){
  var main=$('swMain'), lap=$('swLapBtn'), rst=$('swReset'), sav=$('swSave');
  main.className='btn big';
  if(swRunning){
    main.classList.add('r'); main.setAttribute('data-t','swStop');
    lap.classList.remove('hide'); rst.classList.add('hide');
  }else{
    main.classList.add('g');
    main.setAttribute('data-t', swElapsed>0 ? 'swResume' : 'swStart');
    lap.classList.add('hide');
    rst.classList.toggle('hide', !(swElapsed>0 || swLaps.length>0));
  }
  main.textContent=T(main.getAttribute('data-t'));
  lap.textContent=T('swLap');
  rst.textContent=T('swReset');
  sav.classList.toggle('hide', !(!swRunning && swLaps.length>0));
  sav.textContent=T('swSave');
  $('swState').textContent=T(swRunning ? 'swRun' : (swElapsed>0 ? 'swPause' : 'swReady'));

}
function swStart(){
  swRunning=true; swStartTs=performance.now();
  swBtns(); swLoop(); swVib(16);
}
function swStop(){
  swElapsed=swNow(); swRunning=false;
  if(swRaf){ cancelAnimationFrame(swRaf); swRaf=null; }
  swPaint(); swBtns(); swVib(16);
}
function swLap(){
  if(!swRunning) return;
  swLaps.push(swNow());
  swRenderLaps(); swBtns(); swVib(26);
}
function swReset(){
  swRunning=false;
  if(swRaf){ cancelAnimationFrame(swRaf); swRaf=null; }
  swElapsed=0; swLaps=[]; swLastStr='';
  swPaint(); swRenderLaps(); swBtns();
}

function vfSplRead(){
  var rows=$('vfSplWrap').querySelectorAll('.vfSplRow'), out=[], seen={}, i;

/* ===== タイムは 数字だけで 入れる =====
   00:00.00 の 右から うめていきます。
   れい： 4805 → 0:48.05、 10005 → 1:00.05 */
function dispFromDigits(raw){
  var d=String(raw).replace(/\D/g,'');
  if(!d) return '';
  d=d.slice(-6);                       /* いちばん長くて MM:SS.CC */
  var n=parseInt(d,10);
  var cc=String(n%100).padStart(2,'0');
  var ss=String(Math.floor(n/100)%100).padStart(2,'0');
  var mm=Math.floor(n/10000);
  return mm+':'+ss+'.'+cc;
}
function bindDigitTime(el){
  if(!el) return;
  el.setAttribute('inputmode','numeric');
  el.placeholder='0:00.00';
  el.addEventListener('input', function(){
    var d=this.value.replace(/\D/g,'');
    this.value = d ? dispFromDigits(d) : '';
  });
}

/* ================================================================
   クラウド同期（Googleスプレッドシート + GAS）
   数字のデータと 動画リンクだけ 共有します。動画そのもの(video)は
   おもいので 送らず、各端末に のこします。
   ================================================================ */
var SYNC_URL='';
try{ SYNC_URL = localStorage.getItem('swimiq_sync_url') || ''; }catch(e){}
function cloudRec(r){                       /* 送る用：動画Blobを のぞく */
  var o={}, k;
  for(k in r){ if(k==='video') continue; o[k]=r[k]; }
  if(o.updatedAt==null) o.updatedAt = r.at || Date.now();
  return o;
}
function cloudPush(recs){
  if(!SYNC_URL || !recs || !recs.length) return Promise.resolve(null);
  var body = JSON.stringify({ records: recs.map(cloudRec) });
  return fetch(SYNC_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:body })
    .then(function(r){ return r.json().catch(function(){ return {}; }); })
    .catch(function(){ return null; });
}
function cloudTomb(id){
  if(!SYNC_URL || !id) return Promise.resolve(null);
  return cloudPush([{ id:id, deleted:true, updatedAt:Date.now() }]);
}
function cloudPull(){
  if(!SYNC_URL) return Promise.resolve(null);
  return fetch(SYNC_URL, { method:'GET' })
    .then(function(r){ return r.json(); }).catch(function(){ return null; });
}
var syncing=false;
function syncNow(opts){
  opts = opts || {};
  if(!SYNC_URL){ if(opts.toast) toast(T('syncNoUrl')); return Promise.resolve(); }
  if(syncing) return Promise.resolve();
  syncing=true;
  if(opts.toast) toast(T('syncDoing'));
  return Promise.all([ dbAll(), cloudPull() ]).then(function(res){
    var local=res[0]||[], pulled=res[1];
    if(!pulled || !pulled.records){ throw new Error('pull'); }
    var cloud=pulled.records||[];
    var lmap={}; local.forEach(function(r){ lmap[r.id]=r; });
    var cmap={}; cloud.forEach(function(c){ if(c&&c.id) cmap[c.id]=c; });
    var chain=Promise.resolve();
    /* クラウド → ローカル（新しい方を のこす／消えたものは 消す） */
    cloud.forEach(function(cr){
      if(!cr||!cr.id) return;
      var lr=lmap[cr.id];
      var cu=cr.updatedAt||0, lu=lr?(lr.updatedAt||lr.at||0):-1;
      if(cr.deleted){ if(lr) chain=chain.then(function(){ return dbDel(cr.id); }); return; }
      if(!lr || cu>lu){
        if(lr && lr.video && !cr.video) cr.video=lr.video;   /* ローカルの動画は のこす */
        chain=chain.then(function(){ return dbPut(cr); });
      }
    });
    /* ローカル → クラウド（クラウドに無い・ローカルが新しい） */
    var toPush=[];
    local.forEach(function(lr){
      var cr=cmap[lr.id];
      var lu=lr.updatedAt||lr.at||0, cu=cr?(cr.updatedAt||0):-1;
      if(cr&&cr.deleted) return;
      if(!cr || lu>cu) toPush.push(lr);
    });
    return chain.then(function(){ return cloudPush(toPush); });
  }).then(function(){
    syncing=false;
    paintList();
    if(!$('compare').classList.contains('hide')) cmpReload();
    if(opts.toast) toast(T('syncDone'));
    setTimeout(uploadPending, 600);
  }).catch(function(){
    syncing=false;
    if(opts.toast) toast(T('syncNG'));
  });
}
/* 保存した記録を すぐ クラウドへ（うまくいかなくても 画面は そのまま） */
function pushOne(rec){ if(SYNC_URL && rec) cloudPush([rec]); }

/* ================================================================
   動画の 自動アップロード（GAS経由でGoogleドライブへ）
   ・アプリを 開いている間、動画つきの記録で まだリンクが 無いものを
     じゅんばんに アップロードして、リンクを 記録に 自動で 貼ります。
   ・上げ残しは 次に 開いたとき 自動で つづきを やります。
   ・大きすぎる動画（目安30MB超）は 自動では 上げず、印を 付けて とばします。
   ================================================================ */
var MAX_UP = 30*1024*1024;
var uploading=false;
function blobToB64(blob){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){ var s=String(r.result), i=s.indexOf(','); res(i>=0?s.slice(i+1):s); };
    r.onerror=function(){ rej(r.error); };
    r.readAsDataURL(blob);
  });
}
function needUpload(r){ return !!(SYNC_URL && r.video && !r.videoUrl && !r.vidSkip); }
function uploadOne(rec){
  if(rec.video.size > MAX_UP){
    rec.vidSkip=true; rec.updatedAt=Date.now();
    return dbPut(rec).then(function(){ pushOne(rec); toast(T('upBig')); });
  }
  return blobToB64(rec.video).then(function(b64){
    return fetch(SYNC_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'upload', id:rec.id,
        name:'swimiq_'+rec.id+((rec.video.type||'').indexOf('webm')>=0?'.webm':'.mp4'),
        mime:(rec.video.type||'video/mp4'), b64:b64 }) })
      .then(function(r){ return r.json().catch(function(){ return null; }); });
  }).then(function(res){
    if(res && res.ok && res.url){
      rec.videoUrl=res.url; rec.updatedAt=Date.now();
      return dbPut(rec).then(function(){ pushOne(rec); toast(T('upDoneOne')); });
    }
    throw new Error('upload');
  });
}
function uploadPending(){
  if(uploading || !SYNC_URL) return;
  uploading=true;
  dbAll().then(function(all){
    var q=all.filter(needUpload), i=0;
    if(!q.length){ uploading=false; return; }
    toast(T('upStart'));
    (function nx(){
      if(i>=q.length){ uploading=false; paintList(); return; }
      var rec=q[i++];
      uploadOne(rec).then(nx, function(){ uploading=false; });  /* 失敗したら止めて、次に開いたとき再挑戦 */
    })();
  }, function(){ uploading=false; });
}

/* ===== パソコン・ほかの端末と やりとり =====
   動画は おもすぎるので、書き出す 中身は 数字だけ（日づけ・種目・きょり・
   タイム・ST・SR・かき数）。CSV は パソコンの Excel などで そのまま 開けます。
   データを書き出す（JSON）は、ほかの スマホの SwimIQ LITE B に そのまま
   読み込ませる ための ものです。                                       */
function csvCell(s){
  s = String(s==null ? '' : s);
  if(/[",\n]/.test(s)) s = '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function buildCsv(all){
  var head=['日付','大会名・メモ','種目','きょり(m)','記録タイム','平均ST(秒)','平均SR','ストローク数'];
  var lines=[head.map(csvCell).join(',')];
  all.forEach(function(r){
    var t=raceBest(r), ss=raceStroke(r);
    lines.push([
      new Date(r.at).toLocaleDateString('ja-JP'),
      r.title||'', evLabel(r.event), r.dist||'',
      t!=null?fmt(t):'', ss.st!=null?ss.st.toFixed(2):'',
      ss.sr!=null?ss.sr.toFixed(1):'', ss.n!=null?ss.n:''
    ].map(csvCell).join(','));
  });
  return lines.join('\r\n');
}
$('exCsv').onclick=function(){

    var csv = '﻿' + buildCsv(all);

    var d=new Date(), name='swimiq_records_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.csv';

$('fImport').onchange=function(){
  var f = this.files && this.files[0];
  this.value='';
  if(!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    var data;
    try{ data = JSON.parse(String(reader.result)); }catch(e){ toast(T('exImportNG')); return; }
    var arr = data && data.records;
    if(!arr || !arr.length){ toast(T('exImportNG')); return; }
    var i=0, n=0;
    function next(){
      if(i>=arr.length){ toast(T('exImportOK')+'（'+n+T('lstCnt')+'）'); paintList(); return; }
      var src=arr[i]; i++;
      if(!src || src.dist==null || !src.splits){ next(); return; }
      var rec = {
        id: 'imp'+Date.now()+'_'+i+'_'+Math.floor(Math.random()*10000),
        at: src.at || Date.now(),
        title: src.title || (src.dist+'m'),
        pool: src.pool || 50, dist: src.dist, event: src.event || 'other',
        manual: true, t0: (src.t0!=null?src.t0:null),
        splits: src.splits || [], strokes: src.strokes || [],
        manualN: (src.manualN!=null ? src.manualN : (src.manual ? null : null)),
        manualST: (src.manualST!=null ? src.manualST : null),
        manualSegs: (src.manualSegs && src.manualSegs.length) ? src.manualSegs : segsFromStrokes(src.splits, src.strokes, wantTurnsOf(src.dist, src.pool)),
        videoUrl: (src.videoUrl||''),
        swimmerId: (src.swimmerId||''), swimmerName: (src.swimmerName||''),
        sigT: (src.sigT!=null?src.sigT:null), rt: (src.rt!=null?src.rt:null), rtMode: (src.rtMode||null),
        updatedAt: (src.updatedAt || src.at || Date.now()),
        thumb: ''
      };
      dbPut(rec).then(function(){ n++; next(); }, function(){ next(); });
    }
    next();
  };
  reader.onerror = function(){ toast(T('exImportNG')); };
  reader.readAsText(f);
};

function cmpBuildDistOptions(){
  var ev=$('cmpEvent').value, ds={}, i;
  for(i=0;i<cmpAll.length;i++){
    if(ev!=='all' && (cmpAll[i].event||'other')!==ev) continue;
    ds[cmpAll[i].dist]=1;
  }
  var keep=$('cmpDist').value||'all';
  var arr=Object.keys(ds).map(Number).sort(function(a,b){ return a-b; });
  var h='<option value="all">'+T('distAll')+'</option>';
  for(i=0;i<arr.length;i++) h+='<option value="'+arr[i]+'">'+arr[i]+'m</option>';
  $('cmpDist').innerHTML=h;
  $('cmpDist').value = (arr.indexOf(Number(keep))>=0) ? keep : 'all';
}

function cmpFiltered(){
  var ev=$('cmpEvent').value, ds=$('cmpDist').value, q=($('cmpQ').value||'').trim().toLowerCase();
  return cmpAll.filter(function(r){
    if(ev!=='all' && (r.event||'other')!==ev) return false;
    if(ds!=='all' && String(r.dist)!==ds) return false;
    if(q && (r.title||'').toLowerCase().indexOf(q)<0) return false;
    return raceBest(r)!==null;
  });
}
function cmpSetN(n){ cmpN=n; paintCompare(); }
function cmpSetTab(t){ cmpTab=t; paintCompare(); }

function paintCompare(){
  var filtered = cmpFiltered();                 /* 新しい じゅん（dbAll のまま） */
  var body = $('cmpBody');
  $('cmpCount').textContent = filtered.length + T('lstCnt');
  if(!filtered.length){
    body.innerHTML = '<div class="empty">'+T('cmpNoMatch')+'</div>';
    return;
  }
  var list = cmpN ? filtered.slice(0,cmpN) : filtered.slice();   /* 直近 N 本（新しい じゅん） */
  var times = filtered.map(raceBest).filter(function(v){ return v!==null; });
  var bestT = Math.min.apply(null, times);
  var bestRec = filtered.filter(function(r){ return raceBest(r)===bestT; })[0];
  var listTimes = list.map(raceBest).filter(function(v){ return v!==null; });
  var avgT = listTimes.length ? (listTimes.reduce(function(a,b){ return a+b; },0)/listTimes.length) : null;

  var h='';
  h+='<div class="cmpStats">'+
       '<div class="cmpStat"><b>'+T('cmpBest')+'</b><div class="v">'+fmt(bestT)+'</div>'+
         '<div class="d">'+(bestRec ? (new Date(bestRec.at).toLocaleDateString('ja-JP')+'　'+bestRec.title) : '')+'</div></div>'+
       '<div class="cmpStat"><b>'+T('cmpAvg')+'</b><div class="v">'+(avgT!=null?fmt(avgT):'--')+'</div>'+
         '<div class="d">'+list.length+T('cmpUnit')+'</div></div>'+
     '</div>';

  h+='<button class="btn y" id="cmpShare" type="button" style="width:100%;margin:0 0 14px;">'+T('cmpShareBtn')+'</button>';

  h+='<div class="seg" id="cmpSegN">'+
      ['3','5','10','0'].map(function(n){
        var label = n==='0' ? T('cmpAllN') : n+T('cmpUnit');
        return '<button type="button" data-n="'+n+'" aria-pressed="'+(cmpN===Number(n)?'true':'false')+'">'+label+'</button>';
      }).join('')+
     '</div>';

  h+='<div class="seg" id="cmpSegTab" style="margin-top:8px;">'+
      [['time',T('cmpTabTime')],['st',T('cmpTabST')],['sc',T('nStr')]].map(function(p){
        return '<button type="button" data-tab="'+p[0]+'" aria-pressed="'+(cmpTab===p[0]?'true':'false')+'">'+p[1]+'</button>';
      }).join('')+
     '</div>';

  h+='<div class="cmpGraphWrap"><canvas id="cmpCanvas" height="220"></canvas></div>';
  h+='<p class="cmpNote">'+(cmpTab==='sc' ? T('cmpNoteSC') : T('cmpNoteFast'))+'</p>';

  h+='<div class="gl">'+T('cmpListGl')+'</div>';
  h+='<p class="cmpNote">'+T('cmpPickHint')+'</p>';
  h+='<div id="cmpList"></div>';

  body.innerHTML = h;

  $('cmpShare').onclick=function(){ shareText(cmpProgressText(list, bestT, bestRec, avgT), T('cmpShareTitle')); };

  var segN=$('cmpSegN').querySelectorAll('button'), i;
  for(i=0;i<segN.length;i++) segN[i].onclick=function(){ cmpSetN(Number(this.dataset.n)); };
  var segT=$('cmpSegTab').querySelectorAll('button');
  for(i=0;i<segT.length;i++) segT[i].onclick=function(){ cmpSetTab(this.dataset.tab); };

  var lb=$('cmpList');
  for(i=0;i<list.length;i++){
    var r=list[i], t=raceBest(r), ss=raceStroke(r);
    var d=document.createElement('div'); d.className='cmpItem'+(cmpSel.indexOf(r.id)>=0?' sel':'');
    var diff = (t!=null && bestT!=null) ? (t-bestT) : null;
    d.innerHTML =
      '<div class="r1"><span class="t">'+fmt(t)+'</span>'+
        '<span class="tag">'+r.dist+'m　'+evLabel(r.event)+'</span>'+
        '<span class="diff'+(diff===0?' best':'')+'">'+(diff===0?T('cmpBestTag'):(diff!=null?'+'+diff.toFixed(2):''))+'</span>'+
        '<button class="cmpEdit" type="button">'+T('editBtn')+'</button>'+

function cmpProgressText(list, bestT, bestRec, avgT){
  var L=['SwimIQ LITE B　記録の比較',''];
  L.push(T('cmpBest')+'　'+fmt(bestT)+'　'+(bestRec?(new Date(bestRec.at).toLocaleDateString('ja-JP')+'　'+bestRec.title):''));
  L.push(T('cmpAvg')+'　'+(avgT!=null?fmt(avgT):'--')+'（'+list.length+T('cmpUnit')+'）');

  list.forEach(function(r){

      '　'+T('nStr')+' '+(ss.n!=null?ss.n:'--'));
  });
  return L.join('\n');
}

  L.push(T('avgST')+'　A '+(sa.st!=null?sa.st.toFixed(2):'--')+'　B '+(sb.st!=null?sb.st.toFixed(2):'--'));
  L.push(T('avgSR')+'　A '+(sa.sr!=null?sa.sr.toFixed(1):'--')+'　B '+(sb.sr!=null?sb.sr.toFixed(1):'--'));
  L.push(T('nStr')+'　A '+(sa.n!=null?sa.n:'--')+'　B '+(sb.n!=null?sb.n:'--'));
  return L.join('\n');
}

/* ===== グラフを かく（キャンバス） ===== */
function drawCmpChart(list, tab){
  var cv=$('cmpCanvas'); if(!cv) return;
  var cssW = Math.max(240, cv.parentNode.clientWidth - 20);
  var cssH = 220;
  var dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(cssW*dpr); cv.height = Math.round(cssH*dpr);
  cv.style.width = cssW+'px'; cv.style.height = cssH+'px';
  var g = cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,cssW,cssH);
  g.fillStyle='#000'; g.fillRect(0,0,cssW,cssH);

  var pts=[], i;
  for(i=0;i<list.length;i++){
    var r=list[i], v=null;
    if(tab==='time') v=raceBest(r);
    else if(tab==='st') v=raceStroke(r).st;
    else v=raceStroke(r).n;
    if(v!=null) pts.push({ r:r, v:v });
  }
  if(!pts.length){
    g.fillStyle='#b5b5b5'; g.font='800 14px "BIZ UDPGothic",sans-serif'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(T('cmpNoGraph'), cssW/2, cssH/2);
    return;
  }

  var padL=54, padR=14, padT=16, padB=30;
  var plotW=cssW-padL-padR, plotH=cssH-padT-padB;
  var vals=pts.map(function(p){ return p.v; });
  var minV=Math.min.apply(null, vals), maxV=Math.max.apply(null, vals);
  var pad=(maxV-minV)*0.15 || Math.max(0.1, Math.abs(minV)*0.02, 0.5);
  var loY=minV-pad, hiY=maxV+pad;

  /* タイム・ST・かき数の どれも、小さい ほうが よい きろく。
     だから 上に いくほど 数字が 小さく（＝よく）なるように そろえます。
     3つとも 同じ 見た目（線＋点）、同じ 色の きまり（ベストは 緑、ワーストは 赤）に します。 */
  var inset = Math.min(30, plotW*0.1);
  function xAt(idx){
    if(pts.length===1) return padL + plotW/2;
    return padL + inset + (plotW - inset*2) * idx/(pts.length-1);
  }
  function yAt(v){ return padT + (v-loY) / ((hiY-loY)||1) * plotH; }

  g.textBaseline='middle';
  var steps=4, s;
  for(s=0;s<=steps;s++){
    var vv = loY + (hiY-loY)*s/steps;
    var yy = padT + (plotH*s/steps);
    g.strokeStyle='#2c2c2c'; g.lineWidth=1;
    g.beginPath(); g.moveTo(padL,yy); g.lineTo(cssW-padR,yy); g.stroke();
    g.fillStyle='#b5b5b5'; g.font='700 12px "BIZ UDPGothic",sans-serif'; g.textAlign='right';
    g.fillText(tab==='sc' ? String(Math.round(vv)) : vv.toFixed(2), padL-8, yy);
  }

  var bestIdx=-1, worstIdx=-1;
  var bv=Math.min.apply(null, vals), wv=Math.max.apply(null, vals);
  pts.forEach(function(p,idx){
    if(p.v===bv && bestIdx<0) bestIdx=idx;
    if(p.v===wv) worstIdx=idx;
  });

  g.strokeStyle='#ffc400'; g.lineWidth=3; g.beginPath();
  pts.forEach(function(p,idx){
    var x=xAt(idx), y=yAt(p.v);
    if(idx===0) g.moveTo(x,y); else g.lineTo(x,y);
  });
  g.stroke();

  var showAll = pts.length<=8;
  pts.forEach(function(p,idx){
    var x=xAt(idx), y=yAt(p.v);
    g.fillStyle='#ffc400'; g.beginPath(); g.arc(x,y,5,0,Math.PI*2); g.fill();
    if(showAll || idx===bestIdx || idx===worstIdx){
      var lbl = tab==='time' ? fmt(p.v) : (tab==='sc' ? String(p.v) : p.v.toFixed(2));
      var putBelow = (y - padT) < 22;                 /* いちばん上に近いときは 数字を 下に 出す */
      g.fillStyle='#fff'; g.font='900 13px sans-serif'; g.textAlign='center'; g.textBaseline='alphabetic';
      g.fillText(lbl, x, putBelow ? (y+22) : (y-14));
      g.textBaseline='middle';
    }
    if(idx===bestIdx){ g.strokeStyle='#35e06a'; g.lineWidth=3; g.beginPath(); g.arc(x,y,9,0,Math.PI*2); g.stroke(); }
    else if(idx===worstIdx){ g.strokeStyle='#ff4b2b'; g.lineWidth=3; g.beginPath(); g.arc(x,y,9,0,Math.PI*2); g.stroke(); }
  });

  g.fillStyle='#b5b5b5'; g.font='700 11px sans-serif'; g.textAlign='center'; g.textBaseline='alphabetic';
  var showEvery = pts.length>8 ? Math.ceil(pts.length/6) : 1;
  pts.forEach(function(p,idx){
    if(idx%showEvery!==0 && idx!==pts.length-1) return;
    var x=xAt(idx), dd=new Date(p.r.at);
    g.fillText((dd.getMonth()+1)+'/'+dd.getDate(), x, padT+plotH+18);
  });
}

(function(){

  document.addEventListener('click', function(e){
    var el = e.target && e.target.closest ? e.target.closest('button, .btn, label.btn') : null;
    if(!el) return;
    if(el.id && SKIP[el.id]) return;
    try{ if(navigator.vibrate) navigator.vibrate(200); }catch(_){}
  }, true);
})();
