function viewMeet(){
  /* カテゴリーの設定が届いたら、並べ直します */
  if(MEET_CATS === null){
    loadCategories().then(()=>{ if(currentMode === 'meet') viewMeet(); });
  }
  const body = document.getElementById('viewBody');
  body.innerHTML = `
    <div class="card">
      <h2>試合で探す</h2>
      <p class="hint">年と月を選ぶと、その年月の試合が試合名の欄に並びます。年度(4月〜翌年3月)でまとめて探すときは、上の「年度」のタブを使ってください。</p>
      <p class="hint"><b>大会の種類</b>を選ぶと、その試合の毎年の回だけが並びます（例:「梅村杯」を選ぶと、第17回から第21回までが年の新しい順に出ます）。去年の同じ試合と見くらべたいときに便利です。</p>
      <div class="pick2">
        <label class="fld wide">大会の種類<select id="vmSeries" onchange="vmSeriesChanged()"></select></label>
      </div>
      <div class="pick2" style="margin-top:10px">
        <label class="fld">年<select id="vmYear"></select></label>
        <label class="fld">月<select id="vmMonth"></select></label>
        <label class="fld wide">試合名<select id="vmName"></select></label>
      </div>
      <div id="meetOut" style="margin-top:16px"></div>
    </div>`;

  const sSel = document.getElementById('vmSeries');
  const ySel = document.getElementById('vmYear');
  const mSel = document.getElementById('vmMonth');
  const nSel = document.getElementById('vmName');
  const years = [...new Set(DATA.meets.map(m=>m.year).filter(y=>y>0))].sort((a,b)=>b-a);

  // 大会の種類(系統)の一覧を作る。開催回数の多いものが上に来る
  const SERIES = meetSeriesGroups(DATA.meets);
  function fillSeries(){
    sSel.innerHTML = '<option value="">すべての大会（年と月で探す）</option>';
    const cats = MEET_CATS || [];
    if(!cats.length){
      // カテゴリーの設定がまだ無いときは、今までどおり順に並べます
      SERIES.forEach(g=>{
        const o = document.createElement('option');
        o.value = g.key;
        o.textContent = g.key + '（' + g.n + '回）';
        sSel.appendChild(o);
      });
      return;
    }
    // カテゴリーごとに見出しを付けて並べる
    const box = new Map();
    SERIES.forEach(g=>{
      const c = catOf(g.key);
      if(!box.has(c)) box.set(c, []);
      box.get(c).push(g);
    });
    const order = cats.map(c=>c.name).concat(['その他の大会']);
    order.forEach(cname=>{
      const list = box.get(cname);
      if(!list || !list.length) return;
      const grp = document.createElement('optgroup');
      grp.label = cname;
      list.forEach(g=>{
        const o = document.createElement('option');
        o.value = g.key;
        o.textContent = g.key + '（' + g.n + '回）';
        grp.appendChild(o);
      });
      sSel.appendChild(grp);
    });
  }
  // 種類を選んだら、その試合の回だけを試合名の欄に並べる
  window.vmSeriesChanged = function(){
    const key = sSel.value;
    const byYM = !key;
    ySel.disabled = !byYM; mSel.disabled = !byYM;
    ySel.parentElement.style.opacity = byYM ? '1' : '.45';
    mSel.parentElement.style.opacity = byYM ? '1' : '.45';
    if(byYM){ fillNames(); return; }
    const g = SERIES.find(g=>g.key===key);
    nSel.innerHTML = '';
    (g ? g.list : []).forEach(x=>{
      const o = document.createElement('option');
      o.value = x.i;
      o.textContent = `${x.m.year}年${x.m.month}月 ${meetKindTag(x.m.meet)}${x.m.meet} ${x.m.course||''}${x.m.ref?'(参考)':''}`;
      nSel.appendChild(o);
    });
    if(nSel.options.length===0){
      nSel.innerHTML = '<option value="">この大会の記録はありません</option>';
      document.getElementById('meetOut').innerHTML = ''; return;
    }
    draw();
  };

  function fillYears(){
    ySel.innerHTML = '';
    years.forEach(y=>{
      const o = document.createElement('option');
      o.value = y; o.textContent = y+'年';
      ySel.appendChild(o);
    });
  }
  function fillMonths(){
    const y = Number(ySel.value);
    const months = [...new Set(DATA.meets.filter(m=>m.year===y).map(m=>m.month).filter(m=>m>0))]
      .sort((a,b)=>b-a);
    mSel.innerHTML = '<option value="0">すべての月</option>';
    months.forEach(mo=>{
      const o = document.createElement('option');
      o.value = mo; o.textContent = mo+'月';
      mSel.appendChild(o);
    });
  }
  function fillNames(){
    const y = Number(ySel.value);
    const mo = Number(mSel.value);
    const hits = DATA.meets
      .map((m,i)=>({m,i}))
      .filter(x=>x.m.year===y && (mo===0 || x.m.month===mo))
      .sort((a,b)=>(b.m.year*100+b.m.month)-(a.m.year*100+a.m.month));
    nSel.innerHTML = '';
    hits.forEach(x=>{
      const o = document.createElement('option');
      o.value = x.i;
      o.textContent = `${x.m.month}月 ${x.m.meet} ${x.m.course||''}${x.m.ref?'(参考)':''}`;
      nSel.appendChild(o);
    });
    if(hits.length===0){
      nSel.innerHTML = '<option value="">この年月の試合はありません</option>';
      document.getElementById('meetOut').innerHTML = '';
      return;
    }
    draw();  // いちばん新しい試合を自動で表示する
  }
  function draw(){
    if(nSel.value==='') return;
    const idx = Number(nSel.value);
    const out = document.getElementById('meetOut');
    // データがまだ無いときは、読み直してからもう一度描く
    if(!DATA || !DATA.records){
      out.innerHTML = '<p class="hint">記録を読み込んでいます…</p>';
      loadRecords().then(()=>{ if(DATA && DATA.records) draw(); })
        .catch(()=>{ out.innerHTML = '<p class="hint">記録を読み込めませんでした。ページを再読み込みしてください。</p>'; });
      return;
    }
    const rows = ((DATA&&DATA.records)?DATA.records:[]).map(rec).filter(r=>DATA.meets.indexOf(r.meet)===idx);
    if(rows.length===0){ out.innerHTML = '<p class="hint">この大会の記録はありません。</p>'; return; }
    // 種目ごとにまとめる
    const groups = eventGroups(rows);   // 決まった順番(自由形→背泳ぎ→…／50m→100m→…)に並べる
    let html = `<p class="hint">${rows.length}件の記録。ベスト更新は記録のうしろに赤い丸のベの印がつきます。各種目は5人まで表示、残りは表の中を下にすべらせて見られます。名前のうしろは、その大会のときの学年です。OB・OGは順位に入れず、その種目のいちばん下にまとめています。</p>`;
    groups.forEach(gr=>{
      const g = sortActiveThenOb(gr.list);   // 現役→OB・OGの順
      html += `<h3 style="margin:16px 0 6px; font-size:1.1rem; color:var(--blue); text-align:center">${esc(gr.key)}</h3>
        <div class="tablewrap" style="max-height:300px"><table><tr><th>名前</th><th>記録</th><th>大会前ベスト</th></tr>`;
      g.forEach(x=>{
        const r = x.r;
        html += `<tr><td class="nw">${nameWithGrade(r.name, x.g)}</td>
          <td class="num nw">${r.pb? BEST_MARK :''}${raceLink(r, esc(fmtTime(r.time)))}${recordBadges(r.sec, r.stroke, r.dist, r.sex, r.meet.course, {name:r.name, meet:r.meet, sex:r.sex})}</td>
          <td class="num nw">${esc(fmtTime(r.best))}</td></tr>`;
      });
      html += '</table></div>';
    });
    out.innerHTML = html;
    // リレーがあれば、いちばん下に付け足す(表示が切りかわっていないか印で確かめる)
    const stamp = String(idx) + '_' + Date.now();
    out.dataset.stamp = stamp;
    appendRelays(DATA.meets[idx], 'meetOut', stamp);
  }
  ySel.onchange = ()=>{ fillMonths(); fillNames(); };
  mSel.onchange = fillNames;
  nSel.onchange = draw;
  fillSeries(); fillYears(); fillMonths(); fillNames();
}

/* ============================================================
   レースの画面
     1本の泳ぎだけを取り出して、くわしく見る画面です。
     試合の一覧や、選手の記録の一覧から、記録を押すとひらきます。
     ここから 動画・分析・レポート・声かけ へ進みます。
============================================================ */
const RACE_STORE = {};       // ひらいたレースを覚えておく箱
let RACE_SEQ = 0;
// 分析アプリ(SwimIQ)の場所。ふつうは同じ場所の index.html。
// ただし、このアプリをパソコンの中のファイルとして直接ひらいているときは、
// 同じ場所に index.html が無いので、ウェブの住所のほうを使います。
const SWIMIQ_WEB = 'https://sskyou1971chukyo-web.github.io/swimiq/index.html';
const SWIMIQ_URL = (location.protocol === 'file:') ? SWIMIQ_WEB : './index.html';

// 表の中の記録を、押せるボタンにする
function raceLink(r, inner){
  const id = 'rc' + (++RACE_SEQ);
  RACE_STORE[id] = r;
  return `<button type="button" class="ktcell" style="font-weight:800"
    onclick="openRace('${id}')" aria-label="このレースをくわしく見る">${inner}</button>`;
}

// 区間タイムから、通過・ラップ・泳速の表を作る
function raceLapTable(r){
  if(!r.splits || !r.splits.length) return '';
  const all = r.splits.concat([r.time]);
  const step = r.dist && all.length ? Math.round(r.dist / all.length) : 50;
  let h = `<h3 style="margin:18px 0 6px; font-size:1.1rem; color:var(--blue)">区間ごとの記録</h3>
    <div class="tablewrap"><table><tr><th>距離</th><th>通過</th><th>ラップ</th><th>泳速 m/s</th></tr>`;
  for(let i=0; i<all.length; i++){
    const a = toSec(all[i]), b = (i===0) ? 0 : toSec(all[i-1]);
    const lap = (a!=null && b!=null) ? (a-b) : null;
    const sp = (lap && lap>0) ? (step/lap).toFixed(2) : '';
    h += `<tr><td class="nw">${step*(i+1)}m</td>
      <td class="num nw">${esc(fmtTime(all[i]))}</td>
      <td class="num nw" style="color:var(--blue); font-weight:700">${lap!=null? lap.toFixed(2):''}</td>
      <td class="num nw">${sp}</td></tr>`;
  }
  return h + '</table></div>';
}

// SwimIQ にわたす合言葉(あとで自動で選べるようにするため)
function swimiqLink(r, mode){
  // 通過タイムと記録も一緒に渡す。こうすると SwimIQ 側で探し直す必要がなくなる
  const q = new URLSearchParams({
    mode: mode, name: r.name, meet: r.meet.meet || '',
    year: String(r.meet.year || ''), month: String(r.meet.month || ''),
    date: r.meet.date || '', course: r.meet.course || '',
    dist: String(r.dist || ''), stroke: r.stroke || '',
    sex: r.sex || '', round: r.round || '',
    time: String(r.time || ''),
    splits: (r.splits || []).join(','),
    tempo: String(r.tempo || ''),
    count: String(r.count || '')
  });
  return SWIMIQ_URL + '?' + q.toString();
}
function raceGo(id, mode){
  const r = RACE_STORE[id];
  if(!r) return;
  const ttl = { video:'動画', analyze:'分析', report:'レポート' }[mode] || '';
  // うしろに毎回ちがう番号を付けて、古い写しが使われないようにする
  openIQ(swimiqLink(r, mode) + '&embed=1&v=' + Date.now(),
         r.name + '　' + evShort(r.dist, r.stroke) + '　' + ttl);
}
// レース分析のアプリ SwimIQ を、レースを指定せずに このアプリの中でひらく
function openSwimIQ(){
  var m=document.getElementById('toolMenu');
  if(m && !m.hasAttribute('hidden')) toggleToolMenu();   // メニューはたたんでおく
  openIQ(SWIMIQ_URL + '?embed=1&v=' + Date.now(), 'レース分析');
}
// 分析の画面を、このアプリの中でひらく
function openIQ(url, title){
  const m = document.getElementById('iqModal');
  const f = document.getElementById('iqFrame');
  document.getElementById('iqTitle').textContent = title || '';
  f.src = url;
  m.classList.remove('hide');
  document.body.style.overflow = 'hidden';
}
// まず分析の画面にたずねる。まだ決定していなければ、あちらで問いかけが出る
function closeIQ(){
  const f = document.getElementById('iqFrame');
  try{
    if(f && f.contentWindow){
      f.contentWindow.postMessage({ swimiq:'askClose' }, '*');
      // 返事が来なければ、2秒後にそのままとじる（古い画面のとき用）
      clearTimeout(window.__iqWait);
      window.__iqWait = setTimeout(closeIQnow, 2000);
      return;
    }
  }catch(e){}
  closeIQnow();
}
function closeIQnow(){
  clearTimeout(window.__iqWait);
  const m = document.getElementById('iqModal');
  const f = document.getElementById('iqFrame');
  m.classList.add('hide');
  f.src = 'about:blank';        // 動画の再生を止めるため、中身を空にする
  document.body.style.overflow = '';
}
// 分析の画面から「もどる」が押されたら、窓をとじる
window.addEventListener('message', function(ev){
  if(!ev.data) return;
  if(ev.data.swimiq === 'close') closeIQnow();
  if(ev.data.swimiq === 'stay') clearTimeout(window.__iqWait);
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && !document.getElementById('iqModal').classList.contains('hide')) closeIQ();
});

/* ============================================================
   レース分析の画面をつくる部品 (2026.08.31)
   いまスプレッドシートにある値だけで組み立てます。
   まだ測れないもの(飛び込み反応・ターン・ドルフィンキックなど)は
   枠ごと出しません。空欄が並ぶと こわれて見えるからです。
============================================================ */

// 「1.15 / 1.20」のような文字を、数の列にひらく
function splitNums(txt){
  return String(txt || '').split('/').map(x=>{
    const v = parseFloat(String(x).trim());
    return isNaN(v) ? null : v;
  });
}
// 同じ選手・同じ種目・同じ水路で、これより前のいちばん新しい一本をさがす
function prevRaceOf(r){
  const all = ((DATA && DATA.records) ? DATA.records : []).map(rec);
  let best = null;
  all.forEach(x=>{
    if(x.name !== r.name) return;
    if(Number(x.dist) !== Number(r.dist)) return;
    if(x.stroke !== r.stroke) return;
    if((x.meet.course||'') !== (r.meet.course||'')) return;
    if(x.stamp >= r.stamp) return;
    if(x.sec == null) return;
    if(!best || x.stamp > best.stamp) best = x;
  });
  return best;
}
// 区間データの枠をつくる。中身のあるものだけ返す
function raceCells(r){
  const cells = [];
  const cnt = splitNums(r.count).filter(v=>v!=null && v>0);
  const tmp = splitNums(r.tempo).filter(v=>v!=null && v>0);

  if(cnt.length){
    const total = cnt.reduce((a,b)=>a+b, 0);
    const per = (Number(r.dist) > 0 && total > 0) ? (Number(r.dist)/total).toFixed(2) : null;
    cells.push(`<div class="cell dark"><div class="k">総ストローク数</div>
      <div class="v">${total}<span class="u">回</span></div>
      ${per ? `<div class="d">1かきあたり ${per}m</div>` : '<div class="d">かき数の合計</div>'}</div>`);
  }
  if(tmp.length){
    const avg = tmp.reduce((a,b)=>a+b, 0) / tmp.length;
    cells.push(`<div class="cell dark"><div class="k">平均テンポ</div>
      <div class="v">${avg.toFixed(2)}<span class="u">秒</span></div>
      <div class="d">1かきにかかる時間</div></div>`);
    cells.push(`<div class="cell dark"><div class="k">毎分のかき数</div>
      <div class="v">${Math.round(60/(tmp.reduce((a,b)=>a+b,0)/tmp.length))}<span class="u">回</span></div>
      <div class="d">テンポから計算</div></div>`);
  }
  // 区間ごとのテンポが2つ以上あれば、前半と後半のちがいを出す
  if(tmp.length >= 2){
    const half = Math.floor(tmp.length/2);
    const a = tmp.slice(0, half).reduce((x,y)=>x+y,0)/half;
    const b = tmp.slice(half).reduce((x,y)=>x+y,0)/(tmp.length-half);
    const df = b - a;
    cells.push(`<div class="cell"><div class="k">後半のテンポの変化</div>
      <div class="v">${(df>=0?'+':'')}${df.toFixed(2)}<span class="u">秒</span></div>
      <div class="d ${df<=0?'up':'dn'}">${df<=0 ? '後半のほうが速いかき' : '後半はかきが遅くなった'}</div></div>`);
  }
  const pv = prevRaceOf(r);
  if(pv && r.sec != null){
    const df = r.sec - pv.sec;
    cells.push(`<div class="cell"><div class="k">前回の同じ種目との差</div>
      <div class="v">${(df>=0?'+':'')}${df.toFixed(2)}<span class="u">秒</span></div>
      <div class="d ${df<=0?'up':'dn'}">${esc(pv.meet.year+'年'+pv.meet.month+'月')}　${esc(toStr(pv.sec)||'')}</div></div>`);
  }
  if(!cells.length) return '';
  // 奇数のときは、最後の枠を横いっぱいにする
  if(cells.length % 2 === 1){
    cells[cells.length-1] = cells[cells.length-1].replace('class="cell', 'style="grid-column:1 / -1" class="cell');
  }
  return `<div class="sec"><div class="sechd"><span class="bar"></span><h3>区間データ</h3>
    <span class="nt">入っている分だけ</span></div>
    <div class="grid">${cells.join('')}</div></div>`;
}
// ラップの棒グラフ
function raceLapBars(r){
  if(!r.splits || !r.splits.length) return '';
  const all = r.splits.concat([r.time]);
  const step = (r.dist && all.length) ? Math.round(r.dist/all.length) : 50;
  const laps = [];
  for(let i=0; i<all.length; i++){
    const a = toSec(all[i]), b = (i===0) ? 0 : toSec(all[i-1]);
    laps.push((a!=null && b!=null) ? (a-b) : null);
  }
  const ok = laps.filter(v=>v!=null && v>0);
  if(!ok.length) return '';
  const mx = Math.max.apply(null, ok), mn = Math.min.apply(null, ok);
  let h = `<div class="sec"><div class="sechd"><span class="bar"></span><h3>ラップタイム</h3>
    <span class="nt">${step}m ごと</span></div><div class="laps">`;
  laps.forEach((v,i)=>{
    const from = step*i + 1, to = step*(i+1);
    const w = (v!=null && v>0 && mx>0) ? Math.round(v/mx*100) : 0;
    const isBest = (v!=null && v===mn);
    h += `<div class="lap"><span class="no">${from} 〜 ${to}</span>
      <span class="tr"><span class="fl${isBest?' best':''}" style="width:${w}%"></span></span>
      <span class="t">${v!=null ? v.toFixed(2) : '—'}</span></div>`;
  });
  return h + '</div></div>';
}


/* ============================================================
   説明文を たたむ (2026.09.01)
   画面に出ている長い説明を、はじめは閉じた状態にします。
   ・「？ 説明 ひらく」を押すと出てきます
   ・読みこみ中などの おしらせは たたみません
     (入れ物の中にそれ一つしかない文は おしらせとみなします)
============================================================ */
(function(){
  var MIN = 24;                       // これより短い文は そのまま出す
  function foldable(el){
    if(!el || el.tagName !== 'P') return false;
    if(!el.classList.contains('hint')) return false;
    if(el.dataset.nofold === '1') return false;
    if(el.closest('.hintFold')) return false;
    var txt = (el.textContent || '').trim();
    if(txt.length < MIN) return false;
    // 入れ物の中に これ一つしかないときは、おしらせの文とみなして そのままにする
    var par = el.parentElement;
    if(par && par.children.length <= 1) return false;
    return true;
  }
  function foldIn(root){
    var list = (root || document).querySelectorAll('p.hint');
    for(var i=0; i<list.length; i++){
      var el = list[i];
      if(!foldable(el)) continue;
      var group = [el], nx = el.nextElementSibling;
      while(nx && foldable(nx)){ group.push(nx); nx = nx.nextElementSibling; }   // つづきの説明はまとめる
      var d = document.createElement('details');
      d.className = 'hintFold';
      var sm = document.createElement('summary');
      sm.textContent = '説明';
      d.appendChild(sm);
      el.parentNode.insertBefore(d, el);
      group.forEach(function(g){ d.appendChild(g); });
    }
  }
  function run(){ try{ foldIn(document); }catch(e){} }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', run);
  }else{ run(); }
  // 画面が組み直されるたびに、新しく出てきた説明もたたむ
  var timer = null;
  try{
    new MutationObserver(function(){
      if(timer) return;
      timer = setTimeout(function(){ timer = null; run(); }, 60);
    }).observe(document.body || document.documentElement, {childList:true, subtree:true});
  }catch(e){}
})();

/* ============================================================
   閲覧 2: 名前で探す
============================================================ */
function viewName(autoName){
  JUMP_NAME = '';
  const body = document.getElementById('viewBody');
  body.innerHTML = `
    <div class="card"><h2>名前で探す</h2><div id="nameFinder"></div></div>
    <div id="nameOut"></div>`;
  makeFinder(document.getElementById('nameFinder'), showPerson);
  if(autoName){
    const p = rosterOf(autoName);
    if(p){
      const my = myProfile();
      showPerson(p, !!(my && my.name === p.name));
    }
  }

  function showPerson(p, isMine){
    const rows = ((DATA&&DATA.records)?DATA.records:[]).map(rec).filter(r=>r.name===p.name)
      .sort((a,b)=>b.stamp-a.stamp);
    const out = document.getElementById('nameOut');
    // 生年月日を yyyy-mm-dd の形に直す(入力欄に入れるため)
    let birthVal = '';
    if(p.birth){
      const d = new Date(p.birth.replace(/\//g,'-'));
      if(!isNaN(d.getTime())){
        birthVal = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      }
    }
    const mineBar = isMine? `<div class="hint" style="margin-bottom:10px">この携帯は ${esc(p.name)} さんの携帯として登録されています。
      <button class="btn ghost" style="min-height:44px; margin-left:8px" onclick="unlinkDevice()">登録を変える</button></div>` : '';
    const profileCard = `
      ${mineBar}
      <div class="card"><h2>${esc(p.name)} さんの選手情報</h2>
        <p class="hint">生年月日を入れておくと、学年は毎年4月に自動で進級し、卒業すると自動で社会人(OB・OG)になります。今の学年: ${esc(p.grade||'未設定')}</p>
        <div class="stack" style="align-items:end">
          <label class="fld">男女
            <select id="pfSex">
              <option value="" ${!p.sex?'selected':''}>未設定</option>
              <option value="男" ${p.sex==='男'?'selected':''}>男</option>
              <option value="女" ${p.sex==='女'?'selected':''}>女</option>
            </select></label>
          <label class="fld">生年月日<input type="date" id="pfBirth" value="${birthVal}"></label>
          <button class="btn solid" onclick="saveProfile('${esc(p.name)}')">選手情報を保存する</button>
        </div>
        <div id="pfMsg" style="margin-top:10px"></div>
      </div>`;
    if(rows.length===0){
      out.innerHTML = profileCard + `<div class="card"><p class="hint">${esc(p.name)}さんの記録はまだありません。</p></div>`;
      out.scrollIntoView({behavior:'smooth'});
      return;
    }
    // 種目ごとにベストを出す
    const evs = {};
    rows.forEach(r=>{
      const k = r.stroke + '_' + r.dist + '_' + (r.meet.course||'');
      if(!evs[k] || (r.sec!=null && r.sec < evs[k].sec)) evs[k] = r;
    });
    let html = profileCard + `<div class="card"><h2>${esc(p.name)} さんの種目別ベスト</h2>
      <p class="hint">タイムを押すと出した大会が出ます。グラフのボタンを押すと、記録の推移が全画面で開きます。</p>
      <div class="tablewrap"><table><tr><th>種目</th><th>水路</th><th>ベスト</th><th></th></tr>`;
    Object.values(evs).sort((a,b)=>a.dist-b.dist).forEach((r,bi)=>{
      const cs = r.meet.course || '長水路';
      html += `<tr><td class="nw" style="font-weight:700">${evShort(r.dist, r.stroke)}</td>
        <td class="nw">${courseTag(cs)}</td>
        <td class="num nw"><button type="button" class="ktcell nmtime" data-i="${bi}" aria-expanded="false"
          aria-label="${esc(toStr(r.sec)||fmtTime(r.time))}。押すと出した大会が出ます">${esc(toStr(r.sec)||fmtTime(r.time))}</button>${recordBadges(r.sec, r.stroke, r.dist, r.sex, cs, {name:p.name, meet:r.meet, sex:r.sex})}</td>
        <td><button class="btn" style="min-height:46px"
          onclick="nameGraph('${r.stroke}',${r.dist},'${esc(cs)}')">グラフ</button></td></tr>
      <tr class="ktdetail nmdetail" data-i="${bi}" hidden><td colspan="4">大会: ${esc(r.meet.meet)} (${r.meet.year}年${r.meet.month}月)</td></tr>`;
    });
    html += `</table></div></div>
      <div class="card"><h2>すべての出場記録 (新しい順)</h2>
      <p class="hint">記録を押すと、そのレースの画面がひらきます。区間タイムや、動画・分析・レポートへ進めます。</p>
      <div class="tablewrap"><table><tr><th>大会</th><th>種目</th><th>記録</th></tr>`;
    rows.forEach(r=>{
      html += `<tr><td>${r.meet.year}年${r.meet.month}月 ${esc(r.meet.meet)} ${courseTag(r.meet.course)}</td>
        <td class="nw">${evShort(r.dist, r.stroke)}</td>
        <td class="num nw">${r.pb? BEST_MARK :''}${raceLink(r, esc(fmtTime(r.time)))}${recordBadges(r.sec, r.stroke, r.dist, r.sex, r.meet.course, {name:r.name, meet:r.meet, sex:r.sex})}</td></tr>`;
    });
    html += '</table></div></div>';
    out.innerHTML = html;
    // ベストのタイムを押すと、出した大会がひらいたり閉じたりする
    out.querySelectorAll('button.nmtime').forEach(b=>{
      b.onclick = ()=>{
        const det = out.querySelector(`tr.nmdetail[data-i="${b.dataset.i}"]`);
        det.hidden = !det.hidden;
        b.setAttribute('aria-expanded', String(!det.hidden));
      };
    });
    if(!isMine) out.scrollIntoView({behavior:'smooth'});
    // グラフボタンから呼ばれる関数
    window.nameGraph = function(stroke, dist, course){
      renderProgress('nmChart', 'nmTitle', 'nmChartBox', p, stroke, dist, course);
    };
  }
}

// 選手情報(男女・生年月日)を保存する
async function saveProfile(name){
  const msg = document.getElementById('pfMsg');
  const sex = document.getElementById('pfSex').value;
  const birth = document.getElementById('pfBirth').value;
  msg.innerHTML = '<div class="loading">保存しています…</div>';
  try{
    await apiSave({ action:'saveProfile', name:name, sex:sex, birth:birth });
    // 手元の名簿にもすぐ反映する
    const p = INIT.roster.find(x=>x.name===name);
    if(p){ p.sex = sex; p.birth = birth; }
    msg.innerHTML = '<div class="okmsg">保存しました。学年の自動計算は、次にアプリを開いたときに反映されます。</div>';
  }catch(err){
    msg.innerHTML = '<div class="errmsg">保存できませんでした: '+esc(err.message)+'</div>';
  }
}

   種目選びの共通部品 (種目・性別・水路)
============================================================ */
function eventPicker(box, onChange, withCourse){
  box.innerHTML = `
    <div class="pick2">
      <label class="fld">泳法<select data-k="st"></select></label>
      <label class="fld">距離<select data-k="ds"></select></label>
      <label class="fld">男女<select data-k="sx"><option>男子</option><option>女子</option></select></label>
      ${withCourse? '<label class="fld">水路<select data-k="cs"><option>長水路</option><option>短水路</option></select></label>':''}
    </div>`;
  const st = box.querySelector('[data-k="st"]');
  const ds = box.querySelector('[data-k="ds"]');
  STROKES.forEach(s=>{ const o=document.createElement('option'); o.value=s.code; o.textContent=s.ja; st.appendChild(o); });
  function fillDist(){
    ds.innerHTML='';
    STROKES.find(s=>s.code===st.value).dists.forEach(d=>{
      const o=document.createElement('option'); o.value=d; o.textContent=d+'m'; ds.appendChild(o);
    });
  }
  fillDist();
  function state(){
    return { stroke:st.value, dist:Number(ds.value),
      sex:box.querySelector('[data-k="sx"]').value,
      course: withCourse? box.querySelector('[data-k="cs"]').value : '' };
  }
  box.querySelectorAll('select').forEach(s=>s.onchange=()=>{ if(s===st) fillDist(); onChange(state()); });
  onChange(state());
}

/* ============================================================
   標準記録のライン (赤=日本選手権 / 緑=インカレ)
   をグラフに描きこむ道具
============================================================ */
const stdLinePlugin = {
  id: 'stdLines',
  afterDatasetsDraw(chart){
    const lines = chart.options.stdLines || [];
    const {ctx, chartArea, scales} = chart;
    lines.forEach((L, i)=>{
      const scale = L.axis==='x' ? scales.x : scales.y;
      if(!scale) return;
      const px = scale.getPixelForValue(L.value);
      ctx.save();
      ctx.strokeStyle = L.color; ctx.lineWidth = 3; ctx.setLineDash([10,7]);
      ctx.beginPath();
      if(L.axis==='x'){
        if(px<chartArea.left||px>chartArea.right){ ctx.restore(); return; }
        ctx.moveTo(px, chartArea.top); ctx.lineTo(px, chartArea.bottom);
      } else {
        if(px<chartArea.top||px>chartArea.bottom){ ctx.restore(); return; }
        ctx.moveTo(chartArea.left, px); ctx.lineTo(chartArea.right, px);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      // 全画面表示では線の文字は描かない(重なり防止。値は上の説明行に出す)
      if(chart.options.stdLineLabels===false){ ctx.restore(); return; }
      ctx.fillStyle = L.color;
      ctx.font = "700 15px 'BIZ UDPGothic', sans-serif";
      if(L.axis==='x'){
        // ラベルは棒と重ならないよう、グラフの上の余白に出す
        const y = chartArea.top - 10 - (lines.length - 1 - i) * 22;
        const rightSide = px > (chartArea.left + chartArea.right) / 2;
        ctx.textAlign = rightSide ? 'right' : 'left';
        ctx.fillText(L.label, rightSide ? px - 8 : px + 8, Math.max(y, 14));
      } else {
        const y2 = px - 8 - i*20;   // 縦グラフ用も同じくずらす
        ctx.textAlign = 'left';
        ctx.fillText(L.label, chartArea.left + 8, y2);
      }
      ctx.restore();
    });
  }
};
Chart.register(stdLinePlugin);

// 棒グラフのそれぞれの棒に、記録のタイムを書きこむ道具
const barValuePlugin = {
  id: 'barValues',
  afterDatasetsDraw(chart){
    if(!chart.options.barValues) return;
    const {ctx, chartArea} = chart;
    const meta = chart.getDatasetMeta(0);
    ctx.save();
    ctx.font = "800 16px 'M PLUS 1', sans-serif";
    meta.data.forEach((bar, i)=>{
      const v = chart.data.datasets[0].data[i];
      const label = toStr(v);
      const barWidth = bar.x - chartArea.left;
      if(barWidth > 95){
        // 棒が長ければ、棒の中の右はしに白い文字で
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'right';
        ctx.fillText(label, bar.x - 10, bar.y + 6);
      } else {
        // 棒が短ければ、棒の外がわの右に濃い文字で
        ctx.fillStyle = '#14273F';
        ctx.textAlign = 'left';
        ctx.fillText(label, bar.x + 8, bar.y + 6);
      }
    });
    ctx.restore();
  }
};
Chart.register(barValuePlugin);

// 折れ線グラフのそれぞれの点に、記録のタイムを書きこむ道具
const pointValuePlugin = {
  id: 'pointValues',
  afterDatasetsDraw(chart){
    if(!chart.options.pointValues) return;
    const {ctx, chartArea} = chart;
    const meta = chart.getDatasetMeta(0);
    const data = chart.data.datasets[0].data;
    const bestSec = Math.min.apply(null, data);
    ctx.save();
    meta.data.forEach((pt, i)=>{
      const v = data[i];
      const isBest = v === bestSec;
      ctx.font = (isBest? "800 17px" : "700 15px") + " 'M PLUS 1', sans-serif";
      ctx.fillStyle = isBest ? '#E5372E' : '#14273F';
      ctx.textAlign = 'center';
      // ふだんは点の上に。上端に近いときは点の下に出す
      let y = pt.y - 14;
      if(y < chartArea.top + 18) y = pt.y + 28;
      // 左右の点は、グラフの外にはみ出さないように内側へよせる
      let x = pt.x;
      if(x < chartArea.left + 40){ ctx.textAlign = 'left'; x = pt.x + 6; }
      if(x > chartArea.right - 40){ ctx.textAlign = 'right'; x = pt.x - 6; }
      const label = toStr(v) + (isBest ? ' ベスト' : '');
      ctx.fillText(label, x, y);
    });
    ctx.restore();
  }
};
Chart.register(pointValuePlugin);

  ov.id = 'fsOverlay';
  ov.hidden = true;

  const ov = ensureFsOverlay();
  document.getElementById('fsTitle').textContent = title;
  document.getElementById('fsLegend').innerHTML = legendHtml || '';
  ov.hidden = false;
  document.body.style.overflow = 'hidden';

function renderProgress(canvasId, titleId, boxId, p, stroke, dist, course){
  const rows = ((DATA&&DATA.records)?DATA.records:[]).map(rec).filter(r=>
    r.name===p.name && r.stroke===stroke && r.dist===dist &&
    (r.meet.course||'長水路')===course && r.sec!=null
  ).sort((a,b)=>a.stamp-b.stamp);
  if(rows.length===0) return;
  const sex = (INIT.roster.find(x=>x.name===p.name)||{}).sex==='女'?'女子':'男子';
  const std = stdFor(stroke, dist, sex, course);

        labels: rows.map(r=>`${r.meet.year}年${r.meet.month}月 ${r.meet.meet}${r.meet.ref?'(参考)':''}`),

          data: rows.map(r=>r.sec),

          tooltip:{ displayColors:false, padding:14,

            bodyFont:{family:'M PLUS 1', size:19, weight:'800'},

        scales:{

// 標準記録をさがす。標準記録シートを最優先にして、
// なければ大会シート由来の値(長水路のみ)で補う
function stdFor(stroke, dist, sex, course){
  course = course || '長水路';
  const ev = dist + stroke;
  const all = INIT.standardsAll || {};
  let japanStr = all['日本選手権_'+course+'_'+sex+'_'+ev] || null;
  // ジャパンオープンは標準記録シートに登録された年だけ表示される
  const openStr = all['ジャパンオープン_'+course+'_'+sex+'_'+ev] || null;
  const incStr = all['インカレ_'+course+'_'+sex+'_'+ev] || null;
  if(course === '長水路' && !japanStr){
    const s = (INIT.standards||{})[ev+'_'+sex];
    if(s) japanStr = s.japan || null;
  }
  return { japan:toSec(japanStr), japanStr,
           open:toSec(openStr),  openStr,
           inc:toSec(incStr),    incStr };
}
// グラフに引く標準記録のライン一式を作る (赤=日本選手権 緑=インカレ)
/* ------------------------------------------------------------
   平均の線
     直近3レース … いちばん新しい方から3本の平均
     半年平均     … いちばん新しい記録の日から、6か月さかのぼった間の平均
     年間平均     … 同じく12か月さかのぼった間の平均
   どれも「いまの実力」の目安です。ベストは一度きりの記録なので、
   ふだんどのあたりで泳げているかは、この線のほうがよく分かります。
------------------------------------------------------------ */
// 大会の年月を「通しの月数」に直す(引き算しやすくするため)
function monthNo(r){ return (r.meet.year||0)*12 + ((r.meet.month||1)-1); }

// 直近3レースの平均。まだ3本ないときは、あるぶんだけで平均を出す
function recentAvgLine(rows, axis){
  const secs = rows.filter(r=>r.sec!=null).slice(-3).map(r=>r.sec);
  if(secs.length===0) return null;
  const avg = secs.reduce((a,b)=>a+b,0) / secs.length;
  return { axis, value:avg, color:'#7B2D8B',
           label:'直近'+secs.length+'レース平均 '+toStr(avg) };
}

// ある月数のあいだの平均。months は 6 なら半年、12 なら1年
function periodAvgLine(rows, months, name, color, axis){
  const list = rows.filter(r=>r.sec!=null);
  if(list.length===0) return null;
  const newest = Math.max(...list.map(monthNo));
  const from = newest - (months - 1);          // その月もふくめて数える
  const secs = list.filter(r=>monthNo(r) >= from).map(r=>r.sec);
  if(secs.length===0) return null;
  const avg = secs.reduce((a,b)=>a+b,0) / secs.length;
  return { axis, value:avg, color,
           label:name+' '+toStr(avg)+'（'+secs.length+'本）' };
}

// 3本の平均線をまとめて作る。中身が同じになる線は、重ねずに1本だけ残す
function avgLineList(rows, axis){
  const out = [];
  const cand = [
    recentAvgLine(rows, axis),
    periodAvgLine(rows, 6,  '半年平均', '#E58E00', axis),
    periodAvgLine(rows, 12, '年間平均', '#008B9E', axis)
  ];
  cand.forEach(L=>{
    if(!L) return;
    if(out.some(x=>Math.abs(x.value - L.value) < 0.005)) return;
    out.push(L);
  });
  return out;
}

function stdLineList(std, axis){
  const L = [];
  if(std.japan) L.push({axis, value:std.japan, color:'#E5372E', label:'JPN '+fmtTime(std.japanStr)});
  if(std.open)  L.push({axis, value:std.open,  color:'#1663C7', label:'JPOPN '+fmtTime(std.openStr)});
  if(std.inc)   L.push({axis, value:std.inc,   color:'#17934A', label:'Incolle '+fmtTime(std.incStr)});
  return L;
}

/* ============================================================

     いまは、じぶんの選手をえらんで ベストと最近のレースを見る画面です。
     つぎの段で「強みと弱み」のまとめを ここに足します。

function viewMe(){
  const body = document.getElementById('viewBody');
  const role = myRole(), name = myAthlete();
  const roleJa = ROLE_NAME[role] || '';
  if(!name){
    body.innerHTML = `
      <div class="card"><h2>じぶんの選手を えらぶ</h2>
      <p class="hint">${roleJa? roleJa+'として使っています。':''}
        よく見る選手を えらんでおくと、つぎからは この画面にすぐ出ます。</p>
      <div id="meFinder"></div></div>`;
    makeFinder(document.getElementById('meFinder'), p=>setMyAthlete(p.name));
    return;
  }
  // その選手の記録を集める
  const rows = ((DATA&&DATA.records)?DATA.records:[]).map(rec)
    .filter(r=>r.name===name && r.sec!=null);
  const best = {};
  rows.forEach(r=>{
    const k = r.dist+'_'+r.stroke+'_'+(r.meet.course||'長水路');
    if(!best[k] || r.sec < best[k].sec) best[k] = r;
  });
  const keys = Object.keys(best).sort((a,b)=>{
    const x=a.split('_'), y=b.split('_');
    return (Number(x[0])-Number(y[0])) || x[1].localeCompare(y[1]);
  });
  const saikin = rows.slice().sort((a,b)=>b.stamp-a.stamp).slice(0,5);

  let html = `<div class="card">
    <h2>${esc(name)} さんのページ</h2>
    <p class="hint">${roleJa? roleJa+'として使っています。':''}
      <button type="button" class="btn ghost" style="min-height:40px; padding:4px 12px; font-size:.9rem"
        onclick="setMyAthlete('')">選手を えらび直す</button></p></div>`;

  if(!keys.length){
    html += `<div class="card"><p class="hint">まだ記録がありません。</p></div>`;
  } else {
    html += `<div class="card"><h2>ベストタイム</h2>
      <p class="hint">種目を押すと、その種目の伸びのグラフがひらきます。</p>
      <div class="tablewrap"><table><tr><th>種目</th><th>水路</th><th>記録</th><th>いつ</th></tr>`;
    keys.forEach(k=>{
      const r = best[k];
      html += `<tr><td class="nw">${jumpEventBtn(r)}</td>
        <td class="nw">${courseTag(r.meet.course)}</td>
        <td class="num nw" style="font-weight:800">${esc(toStr(r.sec)||fmtTime(r.time))}</td>
        <td class="nw">${r.meet.year}年${r.meet.month}月</td></tr>`;
    });
    html += `</table></div></div>`;
  }

  if(saikin.length){
    html += `<div class="card"><h2>さいきんのレース</h2>
      <p class="hint">記録を押すと、そのレースの画面がひらきます。</p>
      <div class="tablewrap"><table><tr><th>大会</th><th>種目</th><th>記録</th></tr>`;
    saikin.forEach(r=>{
      html += `<tr><td>${r.meet.year}年${r.meet.month}月 ${esc(r.meet.meet)}</td>
        <td class="nw">${evShort(r.dist, r.stroke)}</td>
        <td class="num nw">${r.pb? BEST_MARK :''}${raceLink(r, esc(fmtTime(r.time)))}</td></tr>`;
    });
    html += `</table></div></div>`;
  }
  body.innerHTML = html;
}

/* ============================================================
   比較: ふたりの選手を並べて、種目ごとのベストを見くらべる
============================================================ */
let CMP_A = null, CMP_B = null;
function viewCompare(){
  const body = document.getElementById('viewBody');
  body.innerHTML = `
    <div class="card"><h2>ひとり目をえらぶ</h2><div id="cmpF1"></div></div>
    <div class="card"><h2>ふたり目をえらぶ</h2><div id="cmpF2"></div></div>
    <div id="cmpOut"></div>`;
  makeFinder(document.getElementById('cmpF1'), p=>{ CMP_A = p; cmpDraw(); });
  makeFinder(document.getElementById('cmpF2'), p=>{ CMP_B = p; cmpDraw(); });
  cmpDraw();
}
// その選手の、種目と水路ごとのベストを取り出す
function cmpBests(name){
  const box = {};
  ((DATA&&DATA.records)?DATA.records:[]).forEach(row=>{
    let r;
    try{ r = rec(row); }catch(e){ return; }      // 読めない行はとばす
    if(!r || !r.meet) return;
    if(r.name !== name || r.sec == null) return;
    const k = r.dist + '_' + r.stroke + '_' + (r.meet.course || '長水路');
    if(!box[k] || r.sec < box[k].sec) box[k] = r;
  });
  return box;
}
function cmpDraw(){
  try{ cmpDrawInner(); }
  catch(err){
    const box = document.getElementById('cmpOut');
    if(box) box.innerHTML = '<div class="card"><div class="errmsg">くらべる表を作れませんでした: '
      + esc(String(err && err.message ? err.message : err)) + '</div></div>';
  }
}
function cmpDrawInner(){
  const out = document.getElementById('cmpOut');
  if(!out) return;
  if(!CMP_A || !CMP_B){
    const ima = [CMP_A?('ひとり目 '+CMP_A.name):'', CMP_B?('ふたり目 '+CMP_B.name):'']
      .filter(x=>x).join('　');
    out.innerHTML = `<div class="card"><h2>くらべる</h2>
      <p class="hint">ふたりえらぶと、種目ごとのベストが ここに並びます。
      ${ima? '<br>いま えらんでいるのは　'+esc(ima) : ''}</p></div>`;
    return;
  }
  if(CMP_A.name === CMP_B.name){
    out.innerHTML = `<div class="card"><p class="hint">同じ選手が えらばれています。ちがう選手をえらんでください。</p></div>`;
    return;
  }
  const A = cmpBests(CMP_A.name), B = cmpBests(CMP_B.name);
  const keys = [...new Set([...Object.keys(A), ...Object.keys(B)])].sort((x,y)=>{
    const px = x.split('_'), py = y.split('_');
    return (Number(px[0]) - Number(py[0])) || px[1].localeCompare(py[1]);
  });
  if(!keys.length){
    out.innerHTML = `<div class="card"><p class="hint">ふたりとも、まだ記録がありません。</p></div>`;
    return;
  }
  const gA = CMP_A.grade || '', gB = CMP_B.grade || '';
  let html = `<div class="card"><h2>${esc(CMP_A.name)} と ${esc(CMP_B.name)} のくらべ</h2>
    <p class="hint">両方に記録がある種目だけ、差が出ます。速いほうに色がつきます。
      ${esc(CMP_A.name)}（${esc(gA||'学年未設定')}）／${esc(CMP_B.name)}（${esc(gB||'学年未設定')}）</p>
    <div class="tablewrap"><table>
      <tr><th>種目</th><th>水路</th><th>${esc(CMP_A.name)}</th><th>${esc(CMP_B.name)}</th><th>差</th></tr>`;
  let winA = 0, winB = 0;
  keys.forEach(k=>{
    const p = k.split('_'), dist = Number(p[0]), stroke = p[1], course = p[2];
    const a = A[k], b = B[k];
    const ta = a ? (toStr(a.sec) || fmtTime(a.time)) : '—';
    const tb = b ? (toStr(b.sec) || fmtTime(b.time)) : '—';
    let diff = '—', sa = '', sb = '';
    if(a && b){
      const d = a.sec - b.sec;
      if(d < 0){ winA++; sa = 'font-weight:800; color:var(--blue)'; }
      else if(d > 0){ winB++; sb = 'font-weight:800; color:var(--blue)'; }
      diff = (d === 0) ? '同じ'
           : (Math.abs(d).toFixed(2) + '秒 ' + (d < 0 ? esc(CMP_A.name) : esc(CMP_B.name)) + 'が速い');
    }
    html += `<tr><td class="nw" style="font-weight:700">${evShort(dist, stroke)}</td>
      <td class="nw">${courseTag(course)}</td>
      <td class="num nw" style="${sa}">${esc(ta)}</td>
      <td class="num nw" style="${sb}">${esc(tb)}</td>
      <td class="nw">${diff}</td></tr>`;
  });
  html += `</table></div>
    <p class="hint" style="margin-top:10px">両方に記録がある種目のうち、
      ${esc(CMP_A.name)} が速いのは ${winA} 種目、${esc(CMP_B.name)} が速いのは ${winB} 種目です。</p>
    </div>`;
  out.innerHTML = html;
  out.scrollIntoView({behavior:'smooth'});
}

function viewRank(){
  const body = document.getElementById('viewBody');
  body.innerHTML = `
    <div class="card redline"><h2>ランキング</h2>
      <div id="rkPick"></div>
      <p class="hint" style="margin-top:10px">今の部員(現役の学生)だけのランキングです。県大会の記録も含まれます。卒業・引退した選手の記録は、歴代記録の画面で見られます。</p>
      <div class="stack" style="margin-top:14px">
        <button type="button" class="btn red solid big" id="rkShow" disabled>グラフを全画面で見る</button>
      </div>
      <div id="rkOut" style="margin-top:16px"></div>
    </div>`;
  let cur = null;
  // ランキングは現役の学生だけ。名簿で学年が入っていて、OB・OGでない人が対象
  const activeNames = new Set(INIT.roster.filter(p=>p.grade && p.grade!=='OB' && p.grade!=='OG').map(p=>p.name));
  function draw(st){
    cur = st || cur; if(!cur) return;
    // 選手ごとのベストを出す (名前・秒数・出した大会の文字、の形にそろえる)
    const bestMap = {};
    ((DATA&&DATA.records)?DATA.records:[]).map(rec).forEach(r=>{
      if(r.stroke!==cur.stroke || r.dist!==cur.dist || r.sex!==cur.sex) return;
      if(cur.course && (r.meet.course||'')!==cur.course) return;
      if(r.sec==null) return;
      if(!activeNames.has(r.name)) return;
      if(!bestMap[r.name] || r.sec < bestMap[r.name].sec){
        bestMap[r.name] = { name:r.name, sec:r.sec,
          meetText:`${r.meet.year}年${r.meet.month}月 ${r.meet.meet}` };
      }
    });
    // 県大会の記録も合流させる(現役の学生のみ)。
    // 男女は名簿から名前で引き当てる。水路は大会名に25mとあるものだけ短水路、それ以外は長水路とみなす
    const sexMap = {};
    INIT.roster.forEach(p=>{ if(p.sex) sexMap[p.name] = p.sex==='女' ? '女子' : '男子'; });
    KENTAI.forEach(k=>{
      const name = k[2];
      if(!activeNames.has(name)) return;
      if(sexMap[name] !== cur.sex) return;
      const m = String(k[4]).match(/^(\d+)([A-Za-z]+)$/);
      if(!m || Number(m[1])!==cur.dist || m[2]!==cur.stroke) return;
      const course = String(k[1]).includes('25m') ? '短水路' : '長水路';
      if(cur.course && course!==cur.course) return;
      const sec = toSec(k[6]);
      if(sec==null) return;
      const dm = String(k[0]).match(/^(\d{4})\/(\d{1,2})/);
      const meetText = (dm ? Number(dm[1])+'年'+Number(dm[2])+'月 ' : '') + kentaiMeetLabel(k[1]) + ' (県大会)';
      if(!bestMap[name] || sec < bestMap[name].sec){
        bestMap[name] = { name:name, sec:sec, meetText:meetText };
      }
    });
    const ranked = Object.values(bestMap).sort((a,b)=>a.sec-b.sec).slice(0,15);
    const out = document.getElementById('rkOut');
    if(ranked.length===0){
      out.innerHTML='<p class="hint">この条件の記録はありません。</p>';
      document.getElementById('rkShow').disabled = true;
      return;
    }
    // 表
    let html = `<p class="hint">タイムを押すと出した大会が出ます。</p>
      <div class="tablewrap"><table><tr><th>順位</th><th>名前</th><th>ベスト</th></tr>`;
    ranked.forEach((r,i)=>{
      const cls = i===0?'rank1':i===1?'rank2':i===2?'rank3':'';
      const medal = i<3? `<span class="medal m${i+1}">${i+1}位</span>` : `${i+1}位`;
      html += `<tr class="${cls}"><td class="nw">${medal}</td><td class="nw">${esc(r.name)}</td>
        <td class="num nw"><button type="button" class="ktcell rktime" data-i="${i}" aria-expanded="false"
          aria-label="${toStr(r.sec)}。押すと出した大会が出ます">${toStr(r.sec)}</button>${recordBadges(r.sec, cur.stroke, cur.dist, cur.sex, cur.course, {student:true})}</td></tr>
      <tr class="ktdetail rkdetail" data-i="${i}" hidden><td colspan="3">大会: ${esc(r.meetText)}</td></tr>`;
    });
    out.innerHTML = html + '</table></div>';
    out.querySelectorAll('button.rktime').forEach(b=>{
      b.onclick = ()=>{
        const det = out.querySelector(`tr.rkdetail[data-i="${b.dataset.i}"]`);
        det.hidden = !det.hidden;
        b.setAttribute('aria-expanded', String(!det.hidden));
      };
    });
    // グラフは全画面表示ボタンから開く(小さな画面での重なりをなくすため)
    const std = stdFor(cur.stroke, cur.dist, cur.sex, cur.course);
    const lines = stdLineList(std, 'x');
    const btn = document.getElementById('rkShow');
    btn.disabled = false;
    btn.onclick = ()=>{
      const colors = ranked.map((_,i)=>
        i===0?'#F5B301': i===1?'#94A7BC': i===2?'#C77B3F':'#1663C7');
      const secs = ranked.map(r=>r.sec).concat(lines.map(L=>L.value));
      const min = Math.min(...secs), max = Math.max(...secs), padPx=(max-min)*0.08||1;
      openFullGraph(
        `${cur.dist}m${strokeJa(cur.stroke)} ${cur.sex} (${cur.course}) ランキング`,
        stdLegendHtml(lines, '棒を押すとタイムが出ます。左に長いほど速いタイムです。'),
        {
          type:'bar',
          data:{ labels: ranked.map((r,i)=>(i+1)+'位 '+r.name),
            datasets:[{ data: ranked.map(r=>r.sec), backgroundColor: colors, borderRadius:8 }] },
          options:{
            indexAxis:'y', responsive:true, maintainAspectRatio:false,
            stdLines:lines, stdLineLabels:false, barValues:true,
            plugins:{ legend:{display:false},
              tooltip:{ displayColors:false, padding:14,
                titleFont:{family:'BIZ UDPGothic', size:15, weight:'700'},
                bodyFont:{family:'M PLUS 1', size:19, weight:'800'},
                callbacks:{ label:c=>' '+toStr(c.parsed.x) } } },
            scales:{
              x:{ min:min-padPx, max:max+padPx,
                title:{display:true, text:'タイム(左が速い)', font:{family:'BIZ UDPGothic', weight:'700'}},
                ticks:{ callback:v=>toStr(v), font:{family:'M PLUS 1', size:13} } },
              y:{ ticks:{ font:{family:'BIZ UDPGothic', size:14, weight:'700'} } }
            }
          }
        });
    };
  }
  eventPicker(document.getElementById('rkPick'), draw, true);
}

/* ============================================================
   閲覧: 中京歴代ランキング
   昔の記録を手で打ち込め、現役が上回ると自動で順位が入れ替わります
============================================================ */
function viewLegend(){
  const body = document.getElementById('viewBody');
  body.innerHTML = `
    <div class="card redline"><h2>中京歴代記録</h2>
      <div id="lgPick"></div>
      <p class="hint" style="margin-top:10px">1957年からの歴代記録の歴代トップ10です。現役の部員が上回ったときだけ、自動で順位が入れ替わります。OB・OGの今の記録では書き換わりません。</p>
      <div id="lgOut" style="margin-top:12px"></div>
    </div>`;
  let cur = null;
  // 自動の入れ替えは現役の部員だけ。OB・OGや名簿にいない人の
  // 今の大会記録では、歴代記録は書き換わらない
  const obNames = new Set(INIT.roster.filter(p=>p.grade==='OB'||p.grade==='OG').map(p=>p.name));
  const activeNames = new Set(INIT.roster.filter(p=>p.grade && p.grade!=='OB' && p.grade!=='OG').map(p=>p.name));
  eventPicker(document.getElementById('lgPick'), st=>{ cur = st; drawLegend(cur); }, true);

  function drawLegend(st){
    cur = st || cur; if(!cur) return;
    // 現役部員の大会記録: 選手ごとにいちばん速いもの
    const bestMap = {};
    ((DATA&&DATA.records)?DATA.records:[]).map(rec).forEach(r=>{
      if(r.stroke!==cur.stroke || r.dist!==cur.dist || r.sex!==cur.sex) return;
      if((r.meet.course||'')!==cur.course) return;
      if(r.sec==null) return;
      if(obNames.has(r.name) || !activeNames.has(r.name)) return;
      if(!bestMap[r.name] || r.sec < bestMap[r.name].sec){
        bestMap[r.name] = { name:r.name, sec:r.sec, note:`${r.meet.year}年` };
      }
    });
    // 手で打ち込んだ歴代記録も合わせる(同じ人は速いほうを残す)
    (DATA.legacy||[]).forEach(L=>{
      const m = String(L.event).match(/^(\d+)\s*(Fr|Ba|Br|Fly|IM)/);
      if(!m) return;
      if(Number(m[1])!==cur.dist || m[2]!==cur.stroke) return;
      if(L.sex!==cur.sex || L.course!==cur.course) return;
      const sec = toSec(L.time);
      if(sec==null) return;
      if(!bestMap[L.name] || sec < bestMap[L.name].sec){
        bestMap[L.name] = { name:L.name, sec:sec, note: L.year? L.year+'年' : '' };
      }
    });
    const ranked = Object.values(bestMap).sort((a,b)=>a.sec-b.sec).slice(0,10);
    const out = document.getElementById('lgOut');
    if(ranked.length===0){ out.innerHTML='<p class="hint">この条件の記録はまだありません。</p>'; return; }
    let html = `<div class="tablewrap"><table><tr><th>順位</th><th>名前</th><th>記録</th><th>備考</th></tr>`;
    ranked.forEach((r,i)=>{
      const cls = i===0?'rank1':i===1?'rank2':i===2?'rank3':'';
      const medal = i<3? `<span class="medal m${i+1}">${i+1}位</span>` : `${i+1}位`;
      // 歴代記録には、世界記録・アジア記録・日本記録・学生記録の札だけを付ける
      // (日本選手権突破などの現役向けの札は、昔の記録には出さない)
      const badge = recordBadges(r.sec, cur.stroke, cur.dist, cur.sex, cur.course, {student:true});
      html += `<tr class="${cls}"><td class="nw">${medal}</td><td class="nw">${esc(r.name)}</td>
        <td class="num nw" style="font-weight:800">${toStr(r.sec)}${badge}</td>
        <td class="nw" style="color:var(--gray); font-size:.92rem">${esc(r.note)}</td></tr>`;
    });
    out.innerHTML = html + '</table></div>';
  }

}

/* ============================================================
   記録のふだ (WR=世界記録 AS=アジア記録 NR=日本記録 UR=学生記録)
   タイムが記録に届いていたら、しるしを返します
============================================================ */
const RECORD_KINDS = [
  ['世界記録','WR','#0D2B52'],
  ['アジア記録','AS','#7B2D8B'],
  ['日本記録','NR','#E5372E'],
  ['学生記録','UR','#17934A']
];
/* 学生記録の印は、その大会のときに大学生だった人にだけ出す。
   who は {name, meet, sex} か、学生と分かっているときは {student:true}。
   分からないときは出さない */
function isStudentAt(who){
  if(!who) return false;
  if(who.student === true) return true;
  if(!who.name) return false;
  return /^[1-9]年$/.test(gradeAtMeet(who.name, who.meet, who.sex) || '');
}
function recordBadges(sec, stroke, dist, sex, course, who){
  if(sec==null) return '';
  const all = INIT.standardsAll || {};
  const ev = dist + stroke;
  const student = isStudentAt(who);
  let out = '';
  RECORD_KINDS.forEach(k=>{
    if(k[0] === '学生記録' && !student) return;   // 卒業後や不明の人には出さない
    const t = toSec(all[k[0]+'_'+(course||'長水路')+'_'+sex+'_'+ev]);
    if(t!=null && sec<=t){
      out += ` <span class="pbtag" style="background:${k[2]}">${k[1]}</span>`;
    }
  });
  return out;
}

// "200Br" のような種目名を "200mBR" の短い表記に直す
function kentaiEventJa(ev){
  if(!ev) return '種目不明';
  const m = String(ev).match(/^(\d+)([A-Za-z]+)$/);
  if(!m) return ev;
  return m[1] + 'm' + strokeShort(m[2]);
}

// 大会名から都道府県を見つける
function kentaiPref(meet){
  return KENTAI_PREFS.find(p=>String(meet).includes(p.f)) || null;
}

// 大会名を短い表記にする。東京都選手権→東京。標準的な名前でなければカッコで補足を付ける
function kentaiMeetLabel(meet){
  const p = kentaiPref(meet);
  if(!p) return meet;
  const extra = String(meet).replace(p.f,'').replace('選手権','')
    .replace('水泳競技大会','').replace(/[（()）]/g,'').trim();
  return extra ? p.s + '(' + extra + ')' : p.s;
}

function viewKentai(){
  const body = document.getElementById('viewBody');
  body.innerHTML = `
    <div class="card">
      <h2>県大会の記録</h2>
      <p class="hint">県選手権などの記録が見られます。はじめは今年の分だけ表示しています。地図やプルダウンでしぼりこめます。</p>
      <button type="button" class="btn ghost" id="ktMapBtn" aria-expanded="false"
        style="min-height:48px; margin-bottom:10px">地図(地方ブロック)から選ぶ</button>
      <div id="ktMap" hidden>
        <div id="ktBlocks" role="group" aria-label="地方ブロックを選ぶ"
          style="display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:10px"></div>
        <div id="ktPrefs" class="chips" role="group" aria-label="県を選ぶ"></div>
      </div>
      <div class="stack">
        <label class="fld">選手を選ぶ
          <select id="ktName"><option value="">すべての選手</option></select>
        </label>
        <label class="fld">大会を選ぶ
          <select id="ktMeet"><option value="">すべての大会</option></select>
        </label>
        <label class="fld">年を選ぶ
          <select id="ktYear"><option value="">すべての年</option></select>
        </label>
      </div>
      <p id="ktStatus" class="hint" role="status" aria-live="polite"></p>
      <div id="ktOut" style="margin-top:12px"></div>
    </div>`;

  const nSel = document.getElementById('ktName');
  const mSel = document.getElementById('ktMeet');
  const ySel = document.getElementById('ktYear');
  // 場所のしぼりこみ。t は '' (なし) / 'block' / 'pref' / 'meet'
  let place = { t:'', v:'' };

  // 選手プルダウン。まず並べて、名簿のふりがなが読めたら、あいうえお順に並べ直す
  const allNames = [...new Set(KENTAI.map(r=>r[2]))];
  function fillNames(kanaMap){
    const keep = nSel.value;
    const key = n => (kanaMap && kanaMap[n]) || n;
    const sorted = allNames.slice().sort((a,b)=>key(a).localeCompare(key(b),'ja'));
    nSel.innerHTML = '<option value="">すべての選手</option>';
    sorted.forEach(n=>{
      const o = document.createElement('option'); o.value = n; o.textContent = n;
      nSel.appendChild(o);
    });
    nSel.value = keep;
  }
  fillNames(null);
  // 名簿(ふりがな付き)が手に入ったら並べ直す。通信できないときは何もしない
  loadInit().then(()=>{
    if(!INIT || !INIT.roster) return;
    const kanaMap = {};
    INIT.roster.forEach(p=>{ if(p.kana) kanaMap[p.name] = p.kana; });
    fillNames(kanaMap);
  }).catch(()=>{});

  // 大会プルダウン。短い表記にして、県のよみがなで、あいうえお順
  const meetList = [...new Set(KENTAI.map(r=>r[1]))].map(mt=>{
    const p = kentaiPref(mt);
    return { meet:mt, label:kentaiMeetLabel(mt), kana:(p? p.k : mt), block:(p? p.b : '') };
  }).sort((a,b)=> a.kana.localeCompare(b.kana,'ja') || a.label.localeCompare(b.label,'ja'));
  meetList.forEach(x=>{
    const o = document.createElement('option'); o.value = x.meet; o.textContent = x.label;
    mSel.appendChild(o);
  });

  const ktYears = [...new Set(KENTAI.map(r=>r[0].slice(0,4)))].sort((a,b)=>b.localeCompare(a));
  ktYears.forEach(y=>{
    const o = document.createElement('option'); o.value = y; o.textContent = y + '年'; ySel.appendChild(o);
  });
  // はじめは、いちばん新しい年(今年)だけを表示する
  if(ktYears.length) ySel.value = ktYears[0];

  // 簡易日本地図。地方ブロックのボタンを日本の並びで置く。データのない地方は押せない
  const blocksWithData = new Set(meetList.map(x=>x.block).filter(Boolean));
  const BLOCK_POS = [
    { b:'北海道',    col:6, row:1 },
    { b:'東北',      col:5, row:1 },
    { b:'北信越',    col:4, row:1 },
    { b:'関東',      col:4, row:2 },
    { b:'東海',      col:3, row:2 },
    { b:'近畿',      col:2, row:2 },
    { b:'中国',      col:1, row:2 },
    { b:'四国',      col:2, row:3 },
    { b:'九州・沖縄', col:1, row:3 }
  ];
  const blockBox = document.getElementById('ktBlocks');
  BLOCK_POS.forEach(x=>{
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'chip'; btn.textContent = x.b;
    btn.style.gridColumn = x.col; btn.style.gridRow = x.row;
    btn.style.minHeight = '48px';
    btn.dataset.block = x.b;
    if(!blocksWithData.has(x.b)){
      btn.disabled = true; btn.setAttribute('aria-disabled','true');
      btn.title = 'この地方の記録はまだありません';
      btn.style.opacity = '0.4';
    } else {
      btn.setAttribute('aria-label', x.b + '地方の記録にしぼりこむ');
      btn.onclick = ()=>{ setPlace('block', x.b); };
    }
    blockBox.appendChild(btn);
  });

  const mapBtn = document.getElementById('ktMapBtn');
  const mapBox = document.getElementById('ktMap');
  mapBtn.onclick = ()=>{
    const open = mapBox.hidden;
    mapBox.hidden = !open;
    mapBtn.setAttribute('aria-expanded', String(open));
    mapBtn.textContent = open ? '地図をとじる' : '地図(地方ブロック)から選ぶ';
  };

  function paintMap(){
    blockBox.querySelectorAll('.chip').forEach(b=>{
      b.classList.toggle('on', place.t==='block' && b.dataset.block===place.v);
    });
    const prefBox = document.getElementById('ktPrefs');
    prefBox.innerHTML = '';
    // 選んだ地方の県ボタンを、あいうえお順で出す。県を選び直せるように地方選択中もpref選択中も出す
    const curBlock = place.t==='block' ? place.v
      : place.t==='pref' ? (KENTAI_PREFS.find(p=>p.s===place.v)||{}).b : '';
    if(!curBlock) return;
    const prefsHere = KENTAI_PREFS.filter(p=>p.b===curBlock &&
        meetList.some(x=>{ const mp = kentaiPref(x.meet); return mp && mp.s===p.s; }))
      .sort((a,b)=>a.k.localeCompare(b.k,'ja'));
    const all = document.createElement('button');
    all.type='button'; all.className = 'chip' + (place.t==='block' ? ' on':'');
    all.textContent = curBlock + 'ぜんぶ';
    all.onclick = ()=>{ setPlace('block', curBlock); };
    prefBox.appendChild(all);
    prefsHere.forEach(p=>{
      const b = document.createElement('button');
      b.type='button'; b.className = 'chip' + (place.t==='pref' && place.v===p.s ? ' on':'');
      b.textContent = p.s;
      b.setAttribute('aria-label', p.s + 'の記録にしぼりこむ');
      b.onclick = ()=>{ setPlace('pref', p.s); };
      prefBox.appendChild(b);
    });
  }

  function setPlace(t, v){
    place = { t:t||'', v:v||'' };
    if(t!=='meet') mSel.value = '';
    paintMap();
    draw();
  }

  function placeText(){
    if(place.t==='block') return place.v + '地方';
    if(place.t==='pref') return place.v;
    if(place.t==='meet') return kentaiMeetLabel(place.v);
    return '';
  }

  function draw(){
    const name = nSel.value, year = ySel.value;
    const rows = KENTAI.filter(r=>{
      if(name && r[2]!==name) return false;
      if(year && r[0].slice(0,4)!==year) return false;
      if(place.t==='meet' && r[1]!==place.v) return false;
      if(place.t==='pref'){ const p = kentaiPref(r[1]); if(!p || p.s!==place.v) return false; }
      if(place.t==='block'){ const p = kentaiPref(r[1]); if(!p || p.b!==place.v) return false; }
      return true;
    }).slice().sort((a,b)=> b[0].localeCompare(a[0]));
    /* 学年は名簿の入学年度から、その大会のときのものを計算する。
       同じ日の中では、OB・OGを現役のうしろに回す */
    const ktGrade = r=>{
      const d = String(r[0]).split('/');
      const g = gradeAtMeet(r[2], { year:Number(d[0]), month:Number(d[1]) }, '');
      return g || String(r[3]||'');
    };
    const gcache = new Map();
    rows.forEach(r=>gcache.set(r, ktGrade(r)));
    rows.sort((a,b)=>{
      const d = b[0].localeCompare(a[0]);
      if(d) return d;
      return (isObGrade(gcache.get(a))?1:0) - (isObGrade(gcache.get(b))?1:0);
    });
    const pt = placeText();
    document.getElementById('ktStatus').textContent =
      (pt? pt + 'で ' : '') + (year? year + '年の' : '') + rows.length +
      '件の記録が見つかりました。新しい日付から順に並んでいます。大会名を押すと日付と正式な大会名、種目名を押すとラウンドや順位が出ます。';
    const out = document.getElementById('ktOut');
    if(rows.length===0){ out.innerHTML = '<p class="hint">この条件の記録はありません。</p>'; return; }
    let html = '<div class="tablewrap"><table>' +
      '<tr><th>大会</th><th>名前</th><th>種目</th><th>記録</th></tr>';
    rows.forEach((r,idx)=>{
      const grade = gcache.get(r) || '';
      const time = r[6] ? esc(r[6]) : '-';
      const best = r[8] ? BEST_MARK : '';
      html += `<tr>
        <td><button type="button" class="ktcell" data-i="${idx}" data-k="meet" aria-expanded="false"
          aria-label="${esc(kentaiMeetLabel(r[1]))}。押すと日付と大会名が出ます">${esc(kentaiMeetLabel(r[1]))}</button></td>
        <td class="nw">${nameWithGrade(r[2], grade)}</td>
        <td><button type="button" class="ktcell" data-i="${idx}" data-k="ev" aria-expanded="false"
          aria-label="${esc(kentaiEventJa(r[4]))}。押すとラウンドと順位が出ます">${esc(kentaiEventJa(r[4]))}</button></td>
        <td class="num nw">${best}${time}</td></tr>
      <tr class="ktdetail" data-i="${idx}" hidden><td colspan="4">
        <div class="ktd-meet" hidden>日付: ${esc(r[0])}　大会: ${esc(r[1])}</div>
        <div class="ktd-ev" hidden>ラウンド: ${esc(r[5]||'-')}　順位: ${esc(r[7]||'-')}　備考: ${esc(r[9]||'-')}</div>
      </td></tr>`;
    });
    html += '</table></div>';
    out.innerHTML = html;
    // 大会名や種目名を押すと、そのすぐ下に詳しい情報がひらいたり閉じたりする
    out.querySelectorAll('button.ktcell').forEach(b=>{
      b.onclick = ()=>{
        const det = out.querySelector(`tr.ktdetail[data-i="${b.dataset.i}"]`);
        const box = det.querySelector(b.dataset.k==='meet' ? '.ktd-meet' : '.ktd-ev');
        box.hidden = !box.hidden;
        b.setAttribute('aria-expanded', String(!box.hidden));
        det.hidden = det.querySelector('.ktd-meet').hidden && det.querySelector('.ktd-ev').hidden;
      };
    });
  }
  nSel.onchange = draw;
  ySel.onchange = draw;
  mSel.onchange = ()=>{ setPlace(mSel.value? 'meet':'', mSel.value); };
  draw();
}

/* ============================================================
   閲覧 6: グラフ (選手×種目の記録の推移)
   距離・種目・水路は、その選手が出場したものだけ選べます
============================================================ */
function viewGraph(autoName){
  const body = document.getElementById('viewBody');
  body.innerHTML = `
    <div class="card"><h2>グラフにする選手を選ぶ</h2><div id="gFinder"></div></div>
    <div id="gStage"></div>`;
  makeFinder(document.getElementById('gFinder'), showAthlete);
  if(autoName){
    const p = INIT.roster.find(x=>x.name===autoName);
    if(p) showAthlete(p);
  }
  function showAthlete(p){
    const stage = document.getElementById('gStage');
    // 出場した種目だけをあつめる (泳法_距離_水路 → 記録の一覧)
    const evs = {};
    ((DATA&&DATA.records)?DATA.records:[]).map(rec).forEach(r=>{
      if(r.name!==p.name || r.sec==null) return;
      const k = r.stroke+'_'+r.dist+'_'+(r.meet.course||'長水路');
      (evs[k]=evs[k]||[]).push(r);
    });
    const keys = Object.keys(evs);
    if(keys.length===0){
      stage.innerHTML = `<div class="card"><p class="hint">${esc(p.name)}さんの記録はまだありません。</p></div>`;
      return;
    }
    stage.innerHTML = `
      <div class="card redline"><h2>${esc(p.name)} さん どの種目をグラフにしますか</h2>
        <p class="hint">出場したことのある距離と種目だけが選べます。ボタンを押すとグラフが全画面で開きます。</p>
        <div class="pick2">
          <label class="fld">距離<select id="gDist"></select></label>
          <label class="fld">種目<select id="gStroke"></select></label>
          <label class="fld">水路<select id="gCourse"></select></label>
          <span id="gCount" style="font-weight:800; font-size:1.2rem; align-self:end; padding-bottom:14px" aria-live="polite"></span>
        </div>
        <div class="stack" style="margin-top:10px">
          <button type="button" class="btn red solid big" id="gShow">グラフを全画面で見る</button>
        </div>
      </div>`;

    const dSel = document.getElementById('gDist');
    const sSel = document.getElementById('gStroke');
    const cSel = document.getElementById('gCourse');
    const parts = k => { const [st,d,cs] = k.split('_'); return {stroke:st, dist:Number(d), course:cs}; };
    function fillDist(){
      const dists = [...new Set(keys.map(k=>parts(k).dist))].sort((a,b)=>a-b);
      dSel.innerHTML = '';
      dists.forEach(d=>{
        const o = document.createElement('option');
        o.value = d; o.textContent = d+'m';
        dSel.appendChild(o);
      });
    }
    function fillStroke(){
      const d = Number(dSel.value);
      const strokes = [...new Set(keys.filter(k=>parts(k).dist===d).map(k=>parts(k).stroke))];
      // 種目の並びはいつもの順 (自由形→背→平→バタフライ→個メ)
      strokes.sort((a,b)=>STROKES.findIndex(s=>s.code===a)-STROKES.findIndex(s=>s.code===b));
      sSel.innerHTML = '';
      strokes.forEach(st=>{
        const o = document.createElement('option');
        o.value = st; o.textContent = strokeJa(st);
        sSel.appendChild(o);
      });
    }
    function fillCourse(){
      const d = Number(dSel.value), st = sSel.value;
      const courses = [...new Set(keys.filter(k=>parts(k).dist===d && parts(k).stroke===st).map(k=>parts(k).course))]
        .sort();
      cSel.innerHTML = '';
      courses.forEach(cs=>{
        const o = document.createElement('option');
        o.value = cs; o.textContent = cs;
        cSel.appendChild(o);
      });
    }
    function draw(){
      const d = Number(dSel.value), st = sSel.value, cs = cSel.value;
      const rows = evs[st+'_'+d+'_'+cs] || [];
      document.getElementById('gCount').textContent = rows.length + '本';
      const btn = document.getElementById('gShow');
      btn.disabled = rows.length===0;
      btn.onclick = ()=>renderProgress('gChart', 'gTitle', 'gChartBox', p, st, d, cs);
    }
    dSel.onchange = ()=>{ fillStroke(); fillCourse(); draw(); };
    sSel.onchange = ()=>{ fillCourse(); draw(); };
    cSel.onchange = draw;
    // 最初は、いちばん多く泳いでいる種目を自動で選んでおく
    fillDist();
    let bestKey = keys[0];
    keys.forEach(k=>{ if(evs[k].length > evs[bestKey].length) bestKey = k; });
    const bp = parts(bestKey);
    dSel.value = bp.dist;
    fillStroke();
    sSel.value = bp.stroke;
    fillCourse();
    cSel.value = bp.course;
    draw();
    if(!autoName) stage.scrollIntoView({behavior:'smooth'});
  }
}

  // 読み取りを実行したとき、入力欄の言葉をボタンとして覚える

      if(f){ if(!f.on){ f.on = true; changed = true; } }
      else { list.push({ t, on:true }); changed = true; }
    });
    if(changed){ termSave(kind, list); }
