window.adminFixSave = async function(k){
  const msg = document.getElementById('rfMsg');
  const x = RF_HITS[k];
  const m = DATA.meets[x.r[0]];
  const nwName = String(document.getElementById('rfEdName').value || '').replace(/[\s\u3000]+/g, '');
  const nwEvent = String(document.getElementById('rfEdEvent').value || '').trim();
  const nwTime = String(document.getElementById('rfEdTime').value || '').trim();
  const nwRound = String(document.getElementById('rfEdRound').value || '');
  const nwCourse = String(document.getElementById('rfEdCourse').value || '');
  const spEl = document.getElementById('rfEdSplits');
  const nwSplits = spEl ? String(spEl.value || '').trim() : '';
  if(!nwName){ msg.innerHTML = '<div class="errmsg">名前を入れてください。</div>'; return; }
  if(!/^\d+(Fr|Ba|Br|Fly|IM)$/.test(nwEvent)){
    msg.innerHTML = '<div class="errmsg">種目は 100Fr のような形で入れてください(Fr=自由形 Ba=背泳ぎ Br=平泳ぎ Fly=バタフライ IM=個人メドレー)。</div>'; return;
  }
  if(toSec(nwTime)==null && ['棄権','失格','欠場'].indexOf(nwTime)===-1){
    msg.innerHTML = '<div class="errmsg">タイムは 1:54.83 か 54.83 の形(または 棄権・失格・欠場)で入れてください。</div>'; return;
  }
  // 通過タイムの書き方を確かめる
  if(nwSplits){
    const parts = nwSplits.split(/[\/／,、]/).map(t=>t.trim()).filter(t=>t);
    const bad = parts.filter(t=>toSec(t)==null);
    if(bad.length){
      msg.innerHTML = '<div class="errmsg">通過タイムが読み取れません: 「' + esc(bad.join('」「'))
        + '」。28.50 / 1:00.12 のように、スラッシュで区切って入れてください。</div>'; return;
    }
    const want = Math.max(0, Math.round(Number(x.r[4]) / 50) - 1);
    if(want && parts.length !== want){
      if(!confirm(x.r[4] + 'mの通過タイムは、ふつう' + want + '個です。'
        + 'いま入っているのは' + parts.length + '個です。\n\nこのまま進めますか。')) return;
    }
    // 最後の通過タイムより、記録が速くなっていないか
    const last = toSec(parts[parts.length-1]);
    const fin = toSec(nwTime);
    if(last!=null && fin!=null && fin <= last){
      if(!confirm('最後の通過タイム(' + parts[parts.length-1] + ')より、'
        + '記録(' + nwTime + ')のほうが速くなっています。\n\nこのまま進めますか。')) return;
    }
  }
  if(!confirm('この記録をスプレッドシートごと書き換えます。よろしいですか。')) return;
  msg.innerHTML = '<div class="loading">直しています…</div>';
  try{
    const res = await apiSave({ action:'editRecord', password:ADMIN_PW,
      old:{ meet:m.meet, year:m.year, month:m.month, course:m.course,
            name:x.r[1], event:x.r[4]+x.r[3], time:x.r[5], round:String(x.r[8]||'') },
      nw:{ name:nwName, event:nwEvent, time:nwTime, round:nwRound, course:nwCourse,
           splits:nwSplits } });
    // 覚えていた記録データを捨てて読み直す
    localStorage.removeItem('cust_rec_cache');
    DATA = null;
    try{ await loadRecords(true); }catch(e){}
    msg.innerHTML = `<div class="okmsg">直しました。`
      + (res.splits ? `通過タイムは「${esc(res.splits)}」になりました。`
                    : (res.splits === '' ? '通過タイムは空にしました。' : ''))
      + `${res.logFixed ? '(入力ログの控えもそろえました)' : ''}</div>`;
    // 直った状態を見せる(同じ探し方でもう一度)
    if(RF_MODE === 'check') adminFixCheckAll(); else adminFixSearch();
  }catch(err){
    msg.innerHTML = '<div class="errmsg">直せませんでした: '+esc(err.message)+
      '。GAS側にeditRecordの窓口(パッチv11)が入っているか確認してください。</div>';
  }
};

      <td><button class="btn red" style="min-height:44px" onclick="adminDeleteMeetAll('${esc(m.meet)}','${esc(m.course)}',${m.year||0},${m.month||0})">記録ごと削除</button></td></tr>`;

// 登録済みの大会の水路を、ボタン一つで長水路と短水路で切り替える
// 大会登録と全レースの両方をGAS側で書き換えて、ベスト比較も付け直す
async function adminChangeCourse(meet, course, year, month){
  const newCourse = (course === '長水路') ? '短水路' : '長水路';
  if(!confirm(meet + ' の水路を ' + course + ' から ' + newCourse +
    ' に切り替えます。この大会として登録された記録の水路もまとめて書き換わります。よろしいですか。')) return;
  const msg = document.getElementById('amMsg');
  msg.innerHTML = '<div class="loading">水路を切り替えています…</div>';
  try{
    const r = await apiSave({ action:'changeMeetCourse', password:ADMIN_PW,
      meet: meet, course: course, newCourse: newCourse,
      year: year||0, month: month||0 });
    if(r && r.error) throw new Error(r.error);
    // 手元に覚えている大会一覧もその場で書き換える
    (INIT.meets||[]).forEach(m=>{ if(m.meet===meet && (m.course||'')===course && (!year || (m.year||0)===year) && (!month || (m.month||0)===month)) m.course = newCourse; });
    localStorage.removeItem('cust_rec_cache');
    DATA = null;
    try{ await loadRecords(true); }catch(e){}
    msg.innerHTML = `<div class="okmsg">${esc(meet)} を ${newCourse} に切り替えました(書き換えた記録 ${r.count||0} 件)。</div>`;
    adminDrawMeets();
  }catch(err){
    msg.innerHTML = '<div class="errmsg">切り替えられませんでした: ' + esc(err.message) +
      '。GAS側に changeMeetCourse の窓口(今回のパッチ)が入っているか確認してください。</div>';
  }
}
// ----- 大会の見出しを作る共通部品 -----
// ラップの入りぐあいを、行のあたまに目印として出します
//   ⏱ … その大会の記録ぜんぶにラップが入っている
//   △ … 一部の種目にだけ入っている(残りのPDFを取り込むとよい)
//   (空白) … まったく入っていない
/* ラップの分母は「ラップが入るはずの記録の数」を使います。
   50m種目には通過タイムがなく、棄権・失格にはタイムそのものがないので、
   これらを分母に入れると、完全に取り込めた大会でも△になってしまいます。 */
function lapNeedOf(m){
  if(!m) return 0;
  if(m.lapNeed !== undefined) return Number(m.lapNeed) || 0;
  return Number(m.count) || 0;   // 古いGASのときは今までどおり
}
function meetLapMark(m){
  // 大会名の前に付けていた ⏱ ✔ △ の印は、読みにくいので出さないことにしました。
  // ラップの入りぐあいは、行のうしろの「ラップ85/85」などの数字で分かります。
  return '';
}
// プルダウンに出す1行分の文字を作る
function meetLabel(m){
  let s = meetKindTag(m.meet) + `${m.meet} ${m.year||'?'}年${m.month||'?'}月 ${m.course||''}`;
  if(m.date) s += ` / ${m.date}`;
  if(m.place) s += ` / ${m.place}`;
  if(m.lapDone) s += ' / ラップなしで確定';
  else if(m.lap !== undefined){
    const need = lapNeedOf(m);
    s += need ? ` / ラップ${m.lap}/${need}` : ' / ラップ対象なし';
  }
  return s;
}

// ----- 大会の情報を直す(大会名・実施日・会場・水路) -----
// 直したい大会を選ぶプルダウンを、全レースの大会一覧で作り直す
function adminDrawMeetEditSelect(){
  const sel = document.getElementById('meName');
  if(!sel) return;
  const meets = (DATA && DATA.meets) ? DATA.meets : [];
  const keep = sel.value;
  sel.innerHTML = '<option value="">選んでください</option>';
  const cats = MEET_CATS || [];
  // 新しい大会が上に来るように並べる（番号は元のまま持っておく）
  const list = meets.map((m,i)=>({ m, i }))
                    .sort((a,b)=>(b.m.year*100+(b.m.month||0)) - (a.m.year*100+(a.m.month||0)));
  function addOpt(parent, x){
    const o = document.createElement('option');
    o.value = x.i;
    o.textContent = meetLabel(x.m);
    parent.appendChild(o);
  }
  if(!cats.length){
    // カテゴリーの設定がまだ無いときは、これまでどおり順に並べます
    list.forEach(x=>addOpt(sel, x));
  } else {
    // 県大会・全国大会などのまとまりごとに、見出しを付けて分けます
    const box = new Map();
    list.forEach(x=>{
      const c = catOf(x.m.meet);
      if(!box.has(c)) box.set(c, []);
      box.get(c).push(x);
    });
    const order = cats.map(c=>c.name).concat(['その他の大会']);
    order.forEach(cname=>{
      const arr = box.get(cname);
      if(!arr || !arr.length) return;
      const grp = document.createElement('optgroup');
      grp.label = cname + '（' + arr.length + '件）';
      arr.forEach(x=>addOpt(grp, x));
      sel.appendChild(grp);
    });
  }
  sel.value = keep;
  const now = document.getElementById('meNow');
  if(now && meets.length===0){
    now.textContent = '大会一覧を読み込み中です。少し待つと選べるようになります。';
  }
}
// 大会を選んだら、いまの内容を入力欄に入れる
function adminPickMeetEdit(){
  const sel = document.getElementById('meName');
  const now = document.getElementById('meNow');
  const msg = document.getElementById('meMsg');
  if(msg) msg.innerHTML = '';
  const m = (sel && sel.value && DATA && DATA.meets) ? DATA.meets[Number(sel.value)] : null;
  if(!m){
    ['meMeet','meDate','mePlace','meLapWhy'].forEach(id=>{
      const el = document.getElementById(id); if(el) el.value = '';
    });
    const cb0 = document.getElementById('meLapDone');
    if(cb0) cb0.checked = false;
    if(now) now.textContent = '';
    return;
  }
  document.getElementById('meMeet').value = m.meet || '';
  document.getElementById('meDate').value = m.date || '';
  document.getElementById('mePlace').value = m.place || '';
  document.getElementById('meCourse').value = m.course || '長水路';
  let s = `いまの内容: ${m.meet} / ${m.year||'?'}年${m.month||'?'}月 / ${m.course||'(水路なし)'}`
        + ` / 実施日 ${m.date||'(なし)'} / 会場 ${m.place||'(なし)'}`;
  if(m.lapDone){
    s += ` / ✔ラップなしで確定${m.lapDoneWhy ? '（' + m.lapDoneWhy + '）' : ''}`;
  } else if(m.lap !== undefined){
    const need = lapNeedOf(m);
    if(need === 0) s += ' / ラップ対象なし (50m種目だけの大会です)';
    else if(m.lap >= need) s += ` / ⏱ラップ ${m.lap}/${need} (ぜんぶ入っています)`;
    else if(m.lap > 0) s += ` / △ラップ ${m.lap}/${need} (一部だけ。残りの種目のPDFを取り込むと入ります)`;
    else s += ` / ラップなし (この大会のPDFを取り込み直すと入ります)`;
  }
  const cb = document.getElementById('meLapDone');
  if(cb) cb.checked = !!m.lapDone;
  const wy = document.getElementById('meLapWhy');
  if(wy) wy.value = m.lapDoneWhy || '';
  if(m.dateCount > 1){
    s += ` ※この大会には日付が${m.dateCount}種類あります(日をまたぐ大会)。`
       + `実施日を書きかえると、全部おなじ日付になります`;
  }
  if(now) now.textContent = s;

// 直した内容をGASへ送る
async function adminUpdateMeet(){
  const msg = document.getElementById('meMsg');
  const sel = document.getElementById('meName');
  const m = (sel && sel.value && DATA && DATA.meets) ? DATA.meets[Number(sel.value)] : null;
  if(!m){ msg.innerHTML = '<div class="errmsg">直したい大会を選んでください。</div>'; return; }
  const newMeet = document.getElementById('meMeet').value.trim();
  const newDate = document.getElementById('meDate').value.trim();
  const newPlace = document.getElementById('mePlace').value.trim();
  const newCourse = document.getElementById('meCourse').value;
  if(!newMeet){ msg.innerHTML = '<div class="errmsg">大会名を入れてください。</div>'; return; }
  if(newDate && !/^\d{4}\D{1,2}\d{1,2}/.test(newDate)){
    msg.innerHTML = '<div class="errmsg">実施日は 2025-06-29 の形で入れてください。</div>'; return;
  }
  const changes = [];
  if(newMeet !== m.meet) changes.push(`大会名: ${m.meet} → ${newMeet}`);
  if(newDate !== (m.date||'')) changes.push(`実施日: ${m.date||'(なし)'} → ${newDate||'(なし)'}`);
  if(newPlace !== (m.place||'')) changes.push(`会場: ${m.place||'(なし)'} → ${newPlace||'(なし)'}`);
  if(newCourse !== (m.course||'')) changes.push(`水路: ${m.course||'(なし)'} → ${newCourse}`);
  if(changes.length===0){ msg.innerHTML = '<div class="errmsg">変わったところがありません。</div>'; return; }
  if(!confirm('つぎのように直します。\n\n' + changes.join('\n') +
    '\n\nこの大会の記録すべてに反映されます。よろしいですか。')) return;
  msg.innerHTML = '<div class="loading">直しています…</div>';
  try{
    const r = await apiSave({ action:'updateMeet', password:ADMIN_PW,
      meet: m.meet, year: m.year||0, month: m.month||0, course: m.course||'',
      newMeet, newDate, newPlace, newCourse });
    if(r && r.error) throw new Error(r.error);
    localStorage.removeItem('cust_rec_cache');
    localStorage.removeItem('cust_init_cache');
    DATA = null;
    try{ await loadRecords(true); }catch(e){}
    try{ await loadInit(); }catch(e){}
    // 直したあとの大会を選びなおす
    adminDrawMeetEditSelect();
    adminDrawCmpSelects();
    const idx = (DATA && DATA.meets)
      ? DATA.meets.findIndex(x=>x.meet===newMeet && (x.course||'')===newCourse) : -1;
    const sel2 = document.getElementById('meName');
    if(sel2) sel2.value = (idx>=0) ? String(idx) : '';
    adminPickMeetEdit();
    let ok = `<div class="okmsg">直しました。記録 ${r.count||0} 件`;
    if(r.relayFixed) ok += ` / リレー ${r.relayFixed} 件`;
    if(r.regFixed) ok += ` / 登録簿 ${r.regFixed} 件`;
    ok += ' を書きかえました。</div>';
    if(r.courseChanged){
      ok += '<div class="hint">※水路が変わりました。大会前ベストと「！」の付けなおしが必要です。'
          + '上の「試合名の登録」の一覧にある水路のボタンを2回押すと付けなおせます。</div>';
    }
    document.getElementById('meMsg').innerHTML = ok;
  }catch(err){
    msg.innerHTML = '<div class="errmsg">直せませんでした: ' + esc(err.message) +
      '。GAS側に updateMeet の窓口(v20パッチ)が入っていて、' +
      '「新バージョン」でデプロイされているか確認してください。</div>';
  }
}

/* その大会の記録を、全レースからまとめて消す。
   まず何件消えるかを数えて見せ、大会名を打ち込んでもらってから消します */
async function adminDeleteMeetAll(meet, course, year, month){
  const msg = document.getElementById('amMsg');
  msg.innerHTML = '<div class="loading">何件あるか数えています…</div>';
  let info;
  try{
    info = await apiSave({ action:'countMeetRecords', password:ADMIN_PW,
      meet, course, year, month });
  }catch(err){
    msg.innerHTML = '<div class="errmsg">数えられませんでした: ' + esc(err.message)
      + '。GAS側に countMeetRecords の窓口(パッチv44)が入っているか、'
      + 'デプロイを新バージョンにしたかを確かめてください。</div>';
    return;
  }
  if(!info || !info.count){
    msg.innerHTML = '<div class="errmsg">この大会の記録が全レースに見つかりませんでした。'
      + '「一覧から外す」のほうを使ってください。</div>';
    return;
  }
  const ask = meet + ' の記録を、全レースからまとめて消します。\n\n'
    + '  記録   ' + info.count + '件\n'
    + '  リレー ' + (info.relay || 0) + '件\n'
    + '  選手   ' + (info.people || 0) + '名\n'
    + '  種目   ' + (info.events || 0) + '種目\n\n'
    + '消す前に控えを取りますが、元にもどすのは手間がかかります。\n'
    + 'よければ、下の欄に大会名をそのまま打ち込んでください。';
  const said = prompt(ask, '');
  if(said === null) { msg.innerHTML = ''; return; }
  if(String(said).replace(/[\s\u3000]/g,'') !== String(meet).replace(/[\s\u3000]/g,'')){
    msg.innerHTML = '<div class="errmsg">大会名がちがったので、何もしませんでした。</div>';
    return;
  }
  msg.innerHTML = '<div class="loading">消しています…</div>';
  try{
    const res = await apiSave({ action:'deleteMeetRecords', password:ADMIN_PW,
      meet, course, year, month });
    if(INIT && INIT.meets){
      INIT.meets = INIT.meets.filter(m=>!(m.meet===meet && m.course===course));
    }
    localStorage.removeItem('cust_rec_cache');
    localStorage.removeItem('cust_init_cache');
    DATA = null;
    try{ await loadRecords(true); }catch(e){}
    msg.innerHTML = '<div class="okmsg">' + esc(meet) + ' の記録を消しました。'
      + '全レース ' + res.count + '件'
      + (res.relay ? ' / リレー ' + res.relay + '件' : '')
      + (res.logDeleted ? ' / 入力ログ ' + res.logDeleted + '件' : '')
      + '。控えはスプレッドシートの「全レース控えv44」と「削除した記録」に残っています。'
      + 'このあとGASで rebuildPB を実行すると、大会前ベストが付け直されます。</div>';
    adminDrawMeets();
  }catch(err){
    msg.innerHTML = '<div class="errmsg">消せませんでした: ' + esc(err.message) + '</div>';
  }
}

// ----- 標準記録のスクショ取り込み -----
async function adminImportStd(){
  const msg = document.getElementById('asMsg');
  const kind = document.getElementById('asKind').value;
  const pasted = document.getElementById('asText').value.trim();
  const file = document.getElementById('asFile').files[0];
  if(!pasted && !file){
    msg.innerHTML='<div class="errmsg">ページの文字を貼り付けるか、スクショ画像を選んでください。</div>';
    return;
  }
  msg.innerHTML = '<div class="loading">AIが表を読み取っています。30秒ほどかかることがあります…</div>';
  try{
    let res;
    if(pasted){
      // 文字の貼り付け方式(精度が高いのでこちらを優先)
      res = await apiSave({ action:'importStandardsText', password:ADMIN_PW,
        kind:kind, text:pasted });
    } else {
      // スクショ画像方式
      const b64 = await new Promise((ok, ng)=>{
        const r = new FileReader();
        r.onload = ()=>ok(String(r.result).split(',')[1]);
        r.onerror = ()=>ng(new Error('画像が読めませんでした'));
        r.readAsDataURL(file);
      });
      res = await apiSave({ action:'importStandards', password:ADMIN_PW,
        kind:kind, image:b64, mime:file.type||'image/png' });
    }
    INIT = null; localStorage.removeItem('cust_rec_cache');
    await loadInit();
    msg.innerHTML = `<div class="okmsg">${esc(kind)}の標準記録を${res.count}件登録しました。閲覧の標準記録画面で確認できます。</div>`;
    document.getElementById('asFile').value='';
    document.getElementById('asText').value='';
  }catch(err){
    msg.innerHTML = '<div class="errmsg">取り込めませんでした: '+esc(err.message)+'</div>';
  }
}

      openMyPage(picked.name);
    }catch(err){
      msg.innerHTML = '<div class="errmsg">登録できませんでした: '+esc(err.message)+'</div>';
    }
  };
  window.skipWelcome = function(){
    localStorage.setItem('cust_my_profile', JSON.stringify({ name:'', staff:true }));
    inputBuilt = true; startInput(); showTabBare('input');
  };
}

// タブの見た目だけ切りかえる(処理は呼ばない)
function showTabBare(t){
  currentTab = t;
  document.getElementById('tabInput').setAttribute('aria-selected', t==='input');
  document.getElementById('tabView').setAttribute('aria-selected', t==='view');
  document.getElementById('tabAdmin').setAttribute('aria-selected', t==='admin');
  document.getElementById('paneInput').hidden = t!=='input';
  document.getElementById('paneView').hidden = t!=='view';
  document.getElementById('paneAdmin').hidden = t!=='admin';
  const nav = document.getElementById('navbar');
  if(nav) nav.hidden = (t!=='view');
  document.body.classList.toggle('hasnav', t==='view');
}

async function openMyPage(name){
  showTabBare('view');
  currentMode = 'graph';
  currentNav = 'best'; NAV_LAST.best = 'graph';
  document.querySelectorAll('#navbar button[data-n]').forEach(b=>
    b.setAttribute('aria-selected', b.dataset.n==='best'));
  drawSubBar('graph');
  const body = document.getElementById('viewBody');
  body.innerHTML = '<div class="loading">あなたの記録を読み込んでいます…</div>';
  try{
    await loadRecords();
    viewGraph(name);   // 本人のグラフを自動で表示する
  }catch(err){
    body.innerHTML = '<div class="errmsg">読み込めませんでした: '+esc(err.message)+'</div>';
  }
}

/* ============================================================
   お知らせ (試合の追加・アプリの更新)
============================================================ */
function banner(text, kind, btnLabel, btnFn){
  const box = document.getElementById('globalMsg');
  const div = document.createElement('div');
  div.className = kind==='ok' ? 'okmsg' : 'errmsg';
  div.style.cssText = 'margin-bottom:14px; display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; text-align:left;';
  const span = document.createElement('span');
  span.textContent = text;
  div.appendChild(span);
  if(btnLabel){
    const b = document.createElement('button');
    b.className = 'btn ' + (kind==='ok'?'solid':'red solid');
    b.style.minHeight = '48px';
    b.textContent = btnLabel;
    b.onclick = btnFn;
    div.appendChild(b);
  }
  const close = document.createElement('button');
  close.className = 'btn ghost';
  close.style.minHeight = '48px';
  close.textContent = '閉じる';
  close.onclick = ()=>div.remove();
  div.appendChild(close);
  box.appendChild(div);
}

// 新しい試合が登録されていたら知らせる
function checkMeetNews(){
  const key = 'cust_known_meets';
  const nowList = INIT.meets.map(m=>m.meet+'_'+m.year+'_'+m.month+'_'+(m.course||''));
  let known = null;
  try{ known = JSON.parse(localStorage.getItem(key)||'null'); }catch(e){}
  if(known){
    const fresh = nowList.filter(k=>!known.includes(k));
    if(fresh.length>0){
      const names = fresh.slice(0,3).map(k=>k.split('_')[0]).join('、');
      banner(`試合が更新されました。新しく ${names} が追加されています。`, 'ok');
    }
  }
  localStorage.setItem(key, JSON.stringify(nowList));
}

// 新しい版を初めて開いたときに、更新内容を一度だけ知らせる
function announceAppNews(){
  const key = 'cust_seen_version';
  const seen = localStorage.getItem(key);
  if(seen && seen !== APP_VERSION){
    banner('アプリが新しくなりました。' + APP_NEWS, 'ok');
  }
  localStorage.setItem(key, APP_VERSION);
}

// GitHub上のアプリが新しくなっていたら更新ボタンを出す
async function checkAppUpdate(){
  if(location.protocol === 'file:') return;  // 手元で開いたときは確認しない
  try{
    const url = location.href.split('?')[0].split('#')[0] + '?v=' + Date.now();
    const res = await fetch(url, { cache:'no-store' });
    const text = await res.text();
    const m = text.match(/APP_VERSION\s*=\s*'([^']+)'/);
    if(m && m[1] !== APP_VERSION){
      banner('アプリが新しくなっています。更新ボタンを押してください。', 'ok',
        '更新する', ()=>{ location.replace(location.pathname + '?v=' + Date.now()); });
    }
  }catch(e){}
}

/* ============================================================
   起動
============================================================ */
async function boot(){
  const body = document.getElementById('inBody');
  body.innerHTML = '<div class="loading">読み込んでいます…</div>';
  try{
    await loadInit();
  }catch(err){
    body.innerHTML = '<div class="errmsg">読み込めませんでした: '+esc(err.message)+
      '。通信の状態と、ファイル冒頭の GAS_URL を確認してください。</div>';
    return;
  }
  checkMeetNews();
  checkAppUpdate();
  announceAppNews();
  askRoleIfNeeded();   // はじめての人には、立場をたずねる
  const my = myProfile();
  if(my && my.staff){
    showTab('view');   // 標準は記録を見るタブ
  } else if(my && my.name && INIT.roster.find(p=>p.name===my.name)){
    syncMyProfile(my);
    openMyPage(my.name);
  } else {
    showWelcome();
  }
}
boot();
</script>
