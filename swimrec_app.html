<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- 指でつまんだときに画面が縮まないようにします。文字の大きさはメニューで変えられます -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SwimIQ | 中京大学水泳部</title>
<!-- ホーム画面に追加したとき、アプリのように全画面で開くための設定 -->
<meta name="theme-color" content="#1663C7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CUST記録帳">
<link rel="manifest" href="swimrec_manifest.webmanifest">
<link rel="apple-touch-icon" href="swimrec-icon-180.png">
<link rel="icon" type="image/png" href="swimrec-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=M+PLUS+1:wght@500;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ================= 基本デザイン =================
   赤・青・白 = プールのコースロープの配色
   フォント = BIZ UDゴシック (低視力の方向けのUDフォント)
=================================================== */
:root{
  --blue:      #1663C7;   /* プールブルー */
  --blue-deep: #0D2B52;   /* 電光掲示板の紺 */
  --blue-pale: #E6F0FB;   /* うすい水色 */
  --red:       #E5372E;   /* コースロープの赤 */
  --red-pale:  #FDEAE8;
  --white:     #FFFFFF;
  --bg:        #F3F8FE;
  --ink:       #14273F;   /* 本文の濃紺 */
  --gray:      #5E718A;
  --line:      #C9D8EA;
  --gold:      #F5B301;
  --silver:    #94A7BC;
  --bronze:    #C77B3F;
  --green:     #17934A;
}
*{ box-sizing:border-box; margin:0; padding:0; }
/* 文字の大きさのもと。16px は iPhone のふつうの大きさです。
   --fs を 1 / 1.125 / 1.25 と変えると、画面全体の字がそろって大きくなります */
html{ font-size:calc(16px * var(--fs, 1)); }
body{
  font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
/* 画面ぜんたいが 左右に ゆれるのを止める (2026.09.05)
   たて（上下）のスクロールだけを ゆるし、よこ（左右）の動きは しません。
   よこに動かしたいところ（大会の切りかえの列や 表）には、
   下の .subs / .tablewrap で よこの動きだけを ゆるし直しています */
html, body{
  max-width:100%;
  overflow-x:hidden;
  overscroll-behavior-x:none;
  touch-action:pan-y;
}
.num{ font-family:"M PLUS 1","BIZ UDPGothic",sans-serif; font-variant-numeric:tabular-nums; text-align:right; }

/* ---------- ヘッダーとコースロープ ---------- */
header{ background:var(--white); padding:18px 24px 14px; }
/* タイトルは、下のタブや本文と左右のはしをそろえる(中央に寄せる) */
.brand{ display:flex; align-items:center; gap:18px; flex-wrap:wrap;
        max-width:1180px; margin:0 auto; width:100%; }
.brand h1{ margin:0; flex:0 0 auto; }
/* ロゴは横長なので、幅で大きさを決める(画面が広いほど大きく) */
.brand img.logo{ width:clamp(280px, 34vw, 460px); height:auto; display:block; }
.brand .sub{ color:var(--gray); font-size:clamp(.95rem, 1.5vw, 1.35rem);
             font-weight:600; flex:1 1 auto; }
/* コースロープ: 赤白青の帯。このアプリの目印です */
.rope{ height:12px; background:repeating-linear-gradient(90deg,
  var(--red) 0 34px, var(--white) 34px 46px, var(--blue) 46px 80px, var(--white) 80px 92px); }

/* ---------- 大タブ (入力 / 閲覧) ---------- */
.tabs{ display:flex; gap:14px; padding:16px 24px 0; max-width:1180px; margin:0 auto; }
.tab{
  flex:1; min-height:64px; font-size:1.25rem; font-weight:700;
  border:3px solid var(--blue); border-radius:14px 14px 0 0;
  background:var(--white); color:var(--blue); cursor:pointer;
}
.tab[aria-selected="true"]{ background:var(--blue); color:var(--white); }
.tab.red{ border-color:var(--red); color:var(--red); }
.tab.red[aria-selected="true"]{ background:var(--red); color:var(--white); }
.tab:focus-visible{ outline:4px solid var(--gold); outline-offset:2px; }
/* タブの大きさの比率 入力:見る:設定 = 2:6:2 */
.tabs .tab:nth-child(1){ flex:2; }
.tabs .tab:nth-child(2){ flex:6; }
.tabs .tab:nth-child(3){ flex:2; }

main{ max-width:1180px; margin:0 auto; padding:20px 24px 80px; }

/* ---------- 下の帯（どの画面からでも移れる4つの入口） ---------- */
body.hasnav main{ padding-bottom:calc(96px + env(safe-area-inset-bottom)); }
#navbar{ position:fixed; left:0; right:0; bottom:0; z-index:60;
  display:grid; grid-template-columns:.55fr repeat(4,1fr) .55fr; gap:0;
  background:var(--white); border-top:3px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -3px 14px rgba(0,0,0,.10); }
#navbar button{ min-height:72px; border:none; background:none; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-family:inherit; font-weight:800; color:var(--gray); padding:6px 2px;
  white-space:nowrap; letter-spacing:-.02em;
  /* 帯の字だけは、文字の大きさの設定を上げても はみ出さないようにします */
  font-size:clamp(9px, 3vw, 13px); }
/* 両はしの もどる・すすむ */
#navbar button.navarrow{ font-size:clamp(8px, 2.6vw, 11px); }
#navbar button:disabled{ opacity:.3; cursor:default; }
#navbar button .nvi{ font-size:1.4rem; line-height:1; }
#navbar button[aria-selected="true"]{ color:var(--blue); background:#EAF2FB; }
#navbar button:focus-visible{ outline:4px solid var(--gold); outline-offset:-4px; }
/* 画面の中の切りかえ（横に並べて、はみ出たら指でずらす） */
.subs{ display:flex; gap:10px; overflow-x:auto; padding:2px 2px 12px;
  -webkit-overflow-scrolling:touch;
  max-width:100%; touch-action:pan-x pan-y; overscroll-behavior-x:contain; }
.sub{ flex:0 0 auto; min-height:52px; padding:6px 18px; white-space:nowrap;
  border:2px solid var(--line); border-radius:26px; background:var(--white);
  color:var(--navy); font-family:inherit; font-size:1.02rem; font-weight:700; cursor:pointer; }
.sub[aria-selected="true"]{ background:var(--blue); border-color:var(--blue); color:var(--white); }
.sub:focus-visible{ outline:4px solid var(--gold); outline-offset:2px; }
/* ---------- レースの画面（1本の泳ぎをくわしく見る） ---------- */
#raceModal{ position:fixed; inset:0; z-index:70; background:rgba(15,34,51,.55);
  display:flex; align-items:flex-start; justify-content:center; overflow:auto;
  padding:0 0 40px; -webkit-overflow-scrolling:touch; }
#raceModal.hide{ display:none; }
#raceCard{ width:min(720px, 100%); background:var(--white); min-height:100%;
  padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 40px); }
.rcTop{ display:flex; align-items:flex-start; gap:10px; margin-bottom:6px; }
.rcTop > div:first-child{ min-width:0; }
.rcTop .rcClose{ flex:0 0 auto; margin-left:auto; min-height:48px; padding:6px 18px; border-radius:12px;
  white-space:nowrap;
  border:2px solid var(--line); background:var(--white); color:var(--gray);
  font-family:inherit; font-weight:800; font-size:1rem; cursor:pointer; }
.rcMeet{ font-size:.95rem; font-weight:700; color:var(--gray); }
.rcName{ font-size:1.5rem; font-weight:800; color:var(--navy); margin:2px 0 0; }
.rcEvent{ font-size:1.1rem; font-weight:800; color:var(--blue); }
.rcTime{ font-size:2.6rem; font-weight:800; color:var(--navy); line-height:1.1; margin:10px 0 2px; }
.rcSub{ font-size:.95rem; font-weight:700; color:var(--gray); }
.rcActs{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px; }
.rcActs button{ min-height:62px; border:none; border-radius:14px; cursor:pointer;
  font-family:inherit; font-size:1.05rem; font-weight:800; color:var(--white); padding:8px; }
.rcActs .a1{ background:#E58E00; } .rcActs .a2{ background:var(--blue); }
.rcActs .a3{ background:#6D28D9; } .rcActs .a4{ background:#0F766E; }
.rcActs button:disabled{ background:#B9C4CE; cursor:default; }
/* 分析の画面を、このアプリの中に窓としてひらく */
#iqModal{ position:fixed; inset:0; z-index:90; background:#0a2a48;
  display:flex; flex-direction:column; }
#iqModal.hide{ display:none; }
#iqBar{ flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px; background:#0a2a48; }
#iqBar button{ min-height:46px; padding:6px 18px; border:none; border-radius:12px;
  background:rgba(255,255,255,.92); color:#0a2a48; cursor:pointer;
  font-family:inherit; font-size:1rem; font-weight:800; }
#iqBar .iqt{ color:#fff; font-weight:800; font-size:1rem; }
#iqFrame{ flex:1 1 auto; width:100%; border:none; display:block; }
/* アプリの名前（文字のロゴ） */
.wordmark{ margin:0; font-size:2.1rem; font-weight:800; letter-spacing:-.02em; color:var(--navy); }
.wordmark span{ color:var(--blue); }
@media (max-width:640px){ .wordmark{ font-size:1.7rem; } }
/* はじめての人に、立場をたずねる画面 */
#roleAsk{ position:fixed; inset:0; z-index:80; background:rgba(15,34,51,.72);
  display:flex; align-items:center; justify-content:center; padding:20px; }
#roleAsk.hide{ display:none; }
#roleCard{ width:min(460px,100%); background:var(--white); border-radius:18px; padding:26px 22px; }
#roleCard h2{ margin:0 0 6px; font-size:1.35rem; color:var(--navy); }
#roleCard p{ margin:0 0 18px; color:var(--gray); font-size:1rem; line-height:1.6; }
.rolebtn{ width:100%; min-height:72px; margin-bottom:12px; border:2px solid var(--line);
  border-radius:14px; background:var(--white); cursor:pointer; font-family:inherit;
  font-size:1.12rem; font-weight:800; color:var(--navy); padding:10px 14px; text-align:left; }
.rolebtn small{ display:block; font-size:.9rem; font-weight:600; color:var(--gray); margin-top:4px; }
.rolebtn:hover{ border-color:var(--blue); }
/* 入力・設定の画面から、記録を見る画面へもどるボタン */
.backrow{ margin-bottom:14px; }
.backbtn{ min-height:52px; padding:6px 20px; font-size:1.02rem; font-weight:700; }
/* 補助のボタンは横一列にして、場所をとらないようにする */
.toolrow{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
.toolrow .btn{ min-height:46px; padding:6px 6px; font-size:.92rem; font-weight:700;
  line-height:1.25; white-space:normal; }
@media (max-width:400px){ .toolrow .btn{ font-size:.82rem; } }
/* スタッフ用の小さなボタン（ヘッダーの右） */
.staffbtn{ min-height:44px; padding:6px 16px; border:2px solid var(--line); border-radius:12px;
  background:var(--white); color:var(--gray); font-family:inherit; font-weight:700;
  font-size:.95rem; cursor:pointer; }
.staffbtn[aria-selected="true"]{ background:var(--navy); border-color:var(--navy); color:var(--white); }

/* ---------- 閲覧のモード選択 ---------- */
.modes{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
.modehead{ font-weight:800; font-size:1.02rem; margin:0 0 6px; color:var(--navy); }
#officialLinks{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
.offbtn{ display:flex; align-items:center; justify-content:center;
  aspect-ratio:1/1; padding:10px; border:2px solid var(--line); border-radius:14px;
  background:#fff; text-decoration:none; color:var(--navy);
  box-shadow:0 1px 3px rgba(0,0,0,.06); }
.offbtn:active{ transform:scale(.98); }
.officon{ width:78%; height:78%; border-radius:12px; display:flex; align-items:center; justify-content:center;
  overflow:hidden; border:1px solid var(--line); }
.officon svg{ width:100%; height:100%; }
@media (max-width:640px){
  .brand{ gap:8px; }
  .brand img.logo{ width:min(88vw, 320px); }
  .brand .sub{ font-size:.9rem; flex:1 1 100%; } #officialLinks{ grid-template-columns:repeat(4,1fr); gap:8px; }
  .offbtn{ padding:8px; } }
.mode{
  min-height:62px; font-size:1.08rem; font-weight:700;
  border:2.5px solid var(--line); border-radius:12px;
  background:var(--white); color:var(--ink); cursor:pointer;
}
.mode[aria-selected="true"]{ border-color:var(--red); background:var(--red); color:var(--white); }
.mode:focus-visible{ outline:4px solid var(--gold); outline-offset:2px; }

/* ---------- 共通部品 ---------- */
.card{ background:var(--white); border:1.5px solid var(--line); border-radius:16px; padding:22px; margin-bottom:20px; }
.card h2{ font-size:1.25rem; margin-bottom:12px; display:flex; align-items:center; gap:10px; }
.card h2::before{ content:""; width:10px; height:26px; border-radius:4px; background:var(--blue); }
.card.redline h2::before{ background:var(--red); }
.hint{ color:var(--gray); font-size:.95rem; margin-bottom:10px; }
.stack{ display:flex; flex-wrap:wrap; gap:10px; }

.btn{
  min-height:58px; padding:10px 22px; font-size:1.08rem; font-weight:700;
  border-radius:12px; border:2.5px solid var(--blue);
  background:var(--white); color:var(--blue); cursor:pointer;
  font-family:inherit;
}
.btn:hover{ background:var(--blue-pale); }
.btn.on{ background:var(--blue); color:var(--white); }
.btn.big{ min-height:72px; font-size:1.3rem; padding:12px 34px; }
.btn.red{ border-color:var(--red); color:var(--red); }
.btn.red.on, .btn.red.solid{ background:var(--red); color:var(--white); }
.btn.solid{ background:var(--blue); color:var(--white); }
.btn.ghost{ border-color:var(--line); color:var(--gray); }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.btn:focus-visible{ outline:4px solid var(--gold); outline-offset:2px; }

select,input[type="text"]{
  font-family:inherit; font-size:1.1rem; padding:12px 14px;
  border:2.5px solid var(--line); border-radius:12px; background:var(--white);
  min-height:58px; color:var(--ink);
}
select:focus,input:focus{ outline:4px solid var(--gold); outline-offset:1px; }
label.fld{ display:flex; flex-direction:column; gap:6px; font-weight:700; font-size:.95rem; }

/* ---------- 選手を探す部品 ---------- */
.finder .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
.chip{
  min-height:52px; padding:6px 18px; font-size:1.02rem; font-weight:700;
  border:2.5px solid var(--line); border-radius:999px;
  background:var(--white); color:var(--ink); cursor:pointer; font-family:inherit;
}
.chip.on{ border-color:var(--blue); background:var(--blue); color:var(--white); }
.chip.on.redc{ border-color:var(--red); background:var(--red); }
.chip:focus-visible{ outline:4px solid var(--gold); outline-offset:2px; }
.athlist{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; margin-top:12px; }
.ath{
  min-height:66px; border:2.5px solid var(--line); border-radius:12px;
  background:var(--white); cursor:pointer; text-align:left; padding:8px 14px; font-family:inherit;
}
.ath:hover{ border-color:var(--blue); background:var(--blue-pale); }
.ath .nm{ font-size:1.15rem; font-weight:700; display:block; }
.ath .kn{ color:var(--gray); font-size:.85rem; }
.ath:focus-visible{ outline:4px solid var(--gold); outline-offset:2px; }
.ath.sel{ border-color:var(--red); background:var(--red-pale); }
.ath.sel .nm::after{ content:" 選択中"; color:var(--red); font-size:.8rem; }
.selbar{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-top:10px;
  padding:10px 14px; background:var(--blue-pale); border-radius:12px; }
/* 一覧表のタイム入力欄 */
.rowtime{ font-family:"M PLUS 1",sans-serif; font-variant-numeric:tabular-nums;
  font-size:1.35rem; font-weight:800; min-height:56px; width:150px;
  border:2.5px solid var(--line); border-radius:10px; padding:6px 10px; text-align:right; }
.rowtime.ok{ border-color:var(--green); background:#F2FBF5; }
.rowtime.bad{ border-color:var(--red); background:var(--red-pale); }
.rowdone{ color:var(--green); font-weight:700; }

/* ---------- 入力の進みぐあい ---------- */
.steps{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.step{ padding:8px 16px; border-radius:999px; background:var(--white); border:2px solid var(--line);
  color:var(--gray); font-weight:700; font-size:.92rem; }
.step.now{ background:var(--red); border-color:var(--red); color:var(--white); }
.step.done{ background:var(--blue-pale); border-color:var(--blue); color:var(--blue); }

/* ---------- テンキー ---------- */
.timeview{
  font-size:4.2rem; text-align:center; letter-spacing:.03em; font-weight:800;
  background:var(--blue-pale); border:3px solid var(--blue); border-radius:16px;
  padding:14px 10px; margin-bottom:16px; min-height:110px;
}
.timeview .ph{ color:var(--gray); font-size:1.05rem; font-weight:400; font-family:"BIZ UDPGothic",sans-serif; }
.pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:520px; margin:0 auto; }
.key{
  min-height:88px; font-size:2rem; font-weight:800; border-radius:14px;
  border:2.5px solid var(--line); background:var(--white); cursor:pointer;
  font-family:"M PLUS 1",sans-serif;
}
.key:hover{ background:var(--blue-pale); }
.key.fn{ font-size:1.1rem; font-family:"BIZ UDPGothic",sans-serif; color:var(--gray); }
.key:focus-visible{ outline:4px solid var(--gold); outline-offset:2px; }
.padwrap .btn.big{ width:100%; max-width:520px; margin:18px auto 0; display:block; }

/* ---------- 電光掲示板 (確認画面) ---------- */
.board{
  background:var(--blue-deep); border-radius:20px; padding:34px 26px; text-align:center;
  color:var(--white); border:6px solid var(--blue);
}
.board .who{ font-size:1.5rem; font-weight:700; }
.board .what{ font-size:1.15rem; color:#9FC3F0; margin-top:4px; }
.board .time{ font-size:5.2rem; font-weight:800; color:var(--gold); letter-spacing:.04em; margin:10px 0 4px; }
.board .cmp{ font-size:1.1rem; margin-top:6px; }
.board .cmp .up{ color:#FF8A80; font-weight:800; }
.board .cmp .down{ color:#9FC3F0; }
.confirmbtns{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:22px; }

/* ---------- 表 ---------- */
table{ width:100%; border-collapse:collapse; background:var(--white); }
th{ background:var(--blue); color:var(--white); font-size:.95rem; padding:10px 12px; text-align:center; position:sticky; top:0; }
td{ padding:10px 12px; border-bottom:1.5px solid var(--line); font-size:1.02rem; }
tr.rank1 td{ background:#FFF6DA; font-weight:700; }
tr.rank2 td{ background:#EEF3F8; font-weight:700; }
tr.rank3 td{ background:#F9EDE2; font-weight:700; }
.medal{ display:inline-block; min-width:2.1em; text-align:center; border-radius:8px; padding:2px 6px;
  color:var(--white); font-weight:800; margin-right:6px; }
.medal.m1{ background:var(--gold); } .medal.m2{ background:var(--silver); } .medal.m3{ background:var(--bronze); }
.pbtag{ color:var(--white); background:var(--red); border-radius:8px; padding:2px 8px; font-size:.85rem; font-weight:700; white-space:nowrap; }
/* 水路の色分け。長水路は青、短水路はだいだい色。文字も残すので読み上げでも分かります */
.csTag{ color:#fff; border-radius:8px; padding:2px 8px; font-size:.85rem; font-weight:700; white-space:nowrap; display:inline-block; }
/* 名前を押せるようにしたボタン。見た目は今までの名前と同じにする */
/* 設定画面のタブ。押されているものだけ濃い色になります */
.adtab{ flex:1; min-width:110px; min-height:52px; font-weight:700; }
.nameLink{ background:none; border:0; padding:0; margin:0; font:inherit; font-weight:700;
  color:var(--navy); text-decoration:underline; text-underline-offset:3px;
  cursor:pointer; min-height:44px; }
.nameLink:hover, .nameLink:focus{ color:var(--blue); }
.csLong{ background:#1A56B0; }
.csShort{ background:#B45309; }
.nw{ white-space:nowrap; }
.pbicon{ display:inline-block; vertical-align:middle; margin-right:6px; line-height:0; }
/* hidden(かくす印)は、表示の指定より必ず強く効かせる */
[hidden]{ display:none !important; }
.pick2{ display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; align-items:end; }

.pick3 .fld{ min-width:0; }
.pick3 .wide{ grid-column:1/-1; }
.pick2 .fld{ min-width:0; }

.tablewrap{ max-height:560px; overflow:auto; border:1.5px solid var(--line); border-radius:12px;

/* ---------- グラフ ---------- */
#fsOverlay{ position:fixed; inset:0; background:#F4F8FF; z-index:9999; display:flex; flex-direction:column; }

.legendline{ display:flex; gap:22px; flex-wrap:wrap; margin-top:10px; font-size:.95rem; font-weight:700; }
.legendline .sw{ display:inline-block; width:34px; height:0; border-top:4px dashed; vertical-align:middle; margin-right:6px; }

/* ---------- そのほか ---------- */

/* ボタンを押したときの灰色のちらつきを消し、押しやすくする */
button{ -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
@media (max-width:640px){

  .tabs{ padding:12px 12px 0; gap:8px; }

/* ============================================================
   画面の説明文を たたんでおくしくみ (2026.09.01)
   長い説明は はじめ閉じておき、「説明」を押したときだけ ひらきます。
   読みこみ中や 見つかりませんでした のような おしらせは たたみません。
============================================================ */
.hintFold{ margin:0 0 10px; }
.hintFold > summary{
  display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  list-style:none; width:auto;
  font-size:.85rem; font-weight:700; color:var(--blue);
  background:#f1f5f9; border:1px solid #dbe4ec; border-radius:999px;
  padding:4px 12px; min-height:32px; user-select:none;
}
.hintFold > summary::-webkit-details-marker{ display:none; }
.hintFold > summary::before{ content:'？'; font-weight:900; }
.hintFold > summary::after{ content:'ひらく'; font-weight:700; opacity:.7; }
.hintFold[open] > summary::after{ content:'とじる'; }
.hintFold > summary:hover{ background:#e6edf5; }
.hintFold[open] > summary{ margin-bottom:8px; }
.hintFold .hint{ margin-bottom:8px; }
.hintFold .hint:last-child{ margin-bottom:0; }

/* ============================================================
   黄色ばん (2026.09.01)
   地は落ちついた黄色、文字は黒、読むものは白い箱にのせます。
   下の帯は黒にして、画面の底を締めます。
============================================================ */
:root{
  --yellow:      #F5CE1E;   /* 地の色 */
  --yellow-deep: #E4BB10;   /* 境目や押したとき */
  --sub-ink:     #6B5300;   /* 黄色の上にのせる小さな字 */
  --black:       #12120E;
}
body{ background:var(--yellow); }

header{ background:var(--yellow);
  /* iPhoneの上のでっぱり（時計やダイナミックアイランド）に かぶらないように、
     端末が教えてくれる安全な余白のぶんだけ 下げる */
  padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 24px)
          6px calc(env(safe-area-inset-left) + 24px); }
.brand{ align-items:baseline; flex-wrap:nowrap; gap:10px; }
/* ロゴ。SWIM はふとい書体、IQ は中ぬき、右かたに ™。
   Impact は iPhone に入っていないので、よく似た Anton を control にしています */
.brand h1.wordmark{
  flex:0 0 auto; margin:0; line-height:1;
  font-family:Impact,"Anton","Haettenschweiler","Arial Narrow",sans-serif;
  font-size:2.4rem; font-weight:400; letter-spacing:.01em;
  color:var(--black); white-space:nowrap;
}
.wordmark .w1{ color:var(--black); }
.wordmark .w2{ -webkit-text-stroke:1.5px var(--black); color:transparent; }
.wordmark .tm{

  font-size:.3em; font-weight:800; vertical-align:super; margin-left:1px;
}
/* チーム名。ロゴの右どなりに置きます。
   切りかえの丸ボタン(.sub)と 名前がぶつからないよう別名にしています */

  flex:1 1 auto; min-width:0;
  font-size:.72rem; font-weight:700; color:var(--sub-ink); letter-spacing:.01em;

/* 下の帯 */

<script>
/* ============================================================
   文字の大きさ (2026.09.02)
   0.9375 = 小さめ(15px) / 1 = ふつう(iPhoneと同じ16px) / 1.125 = 大きく(18px) / 1.25 = より大きく(20px)
   15pxより下げると、選ぶ欄を触ったときにiPhoneが画面を勝手に拡大するので、下限は15pxです。
   画面が出るまえに読みこむので、字がちらつきません。
============================================================ */
function markFontScale(v){
  var list = document.querySelectorAll('#fsRow .fsBtn');
  for(var i=0;i<list.length;i++){
    list[i].setAttribute('aria-pressed', Number(list[i].dataset.fs) === Number(v) ? 'true' : 'false');
  }
}
function setFontScale(v){
  v = Number(v) || 1;
  document.documentElement.style.setProperty('--fs', v);
  try{ localStorage.setItem('cust_font_scale', String(v)); }catch(e){}
  markFontScale(v);
}
(function(){
  var v = 1;
  try{ v = Number(localStorage.getItem('cust_font_scale')) || 1; }catch(e){}
  if(v !== 1) document.documentElement.style.setProperty('--fs', v);
  document.addEventListener('DOMContentLoaded', function(){ markFontScale(v); });
})();
</script>

<script>
/* ============================================================
   設定: GASをデプロイしたら、そのURLをここに貼ります
============================================================ */
const APP_VERSION = '2026.09.05.2';  // アプリを更新するたびにこの番号を変えます
// 今回の更新内容。アプリを更新するたびに書きかえます
const APP_NEWS = '下の帯の両はしに もどる・すすむ を置きました。見ていた画面を いつでも行き来できます。';
const GAS_URL = 'https://script.google.com/macros/s/AKfycby9KoUHiueBjbyhhs6bBdS5U9eMJ--FqKKHqzGUqZuuNomdiVYaoOxLuh7dOdKy4Tav/exec';
// 記録の保存先スプレッドシート(重複チェックシートのタブを直接開く)
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1TU5jrA6TRrrZYb9tx_-BLtMTDNxl4qzCP8BUXXwRkwo/edit?gid=1610799352#gid=1610799352';

/* ============================================================
   アプリ全体で使うデータ
============================================================ */
let INIT = null;      // 名簿・大会一覧・標準記録
let DATA = null;      // 全記録 { meets, records }
let currentTab = 'input';
let currentMode = 'meet';

let STROKES = [
  { code:'Fr',  ja:'自由形',       dists:[50,100,200,400,800,1500] },
  { code:'Ba',  ja:'背泳ぎ',       dists:[50,100,200] },
  { code:'Br',  ja:'平泳ぎ',       dists:[50,100,200] },
  { code:'Fly', ja:'バタフライ',   dists:[50,100,200] },
  { code:'IM',  ja:'個人メドレー', dists:[100,200,400] }
];
const strokeJa = c => (STROKES.find(s=>s.code===c)||{ja:c}).ja;

/* いくつかの大会は、名前がちがっても同じ仲間としてまとめる。
   ここに書いた順に見ていき、最初に当てはまったものになります。
   まとめ方を変えたいときは、この表を書きかえてください。 */
const SERIES_RULES = [
  // 愛知県選手権(7月・兼 国体/国スポ予選)と 愛知県室内選手権(2月)を一つに
  // ※「国民…」より先に見ることで、県予選が国体側に行かないようにする
  { test: /愛知県選手権|愛知県室内選手権/, name: '愛知県選手権' },
  // 国民体育大会 と 国民スポーツ大会 は、名前が変わっただけの同じ大会
  { test: /国民体育大会|国民スポーツ大会|国スポ/, name: '国民体育大会・国民スポーツ大会' },
  // 中部学生の大会(短水路・選手権・春季・秋季・記録会など)は、ぜんぶ一つに
  { test: /中部学生|中部春季|中部秋季/,   name: '中部学生' },
  // 梅村杯(長水路・冬季)も一つに
  { test: /梅村杯/,                       name: '梅村杯' },
  // 日本学生選手権は「日本選手権」に吸いこまれないよう、先に見る
  { test: /日本学生選手権/,               name: '日本学生選手権' },
  // 日本選手権(長水路)と 日本選手権(25m)(短水路)を一つに
  { test: /日本選手権/,                   name: '日本選手権' },
  // JSCA新年フェスティバル(東海会場・静岡会場)を一つに
  { test: /新年フェスティバル/,           name: 'JSCA新年フェスティバル' },
  // 略した名前と正式な名前が混ざっているもの
  { test: /伊豆駿河湾/,                   name: '伊豆駿河湾選手権' },
  { test: /静岡県ジュニア/,               name: '静岡県ジュニア選手権兼県選手権' },
  { test: /代表選手選考会/,               name: '国際大会代表選手選考会' },
  // 三重とこわか((25m)・(50m)・選手権)も一つに
  { test: /三重とこわか/,                 name: '三重とこわか' },
];

/* 上の表にあてはまる大会は、その仲間の名前にそろえる。
   (courseは今は使っていませんが、水路で見わけたくなったときのために受け取っています) */
function seriesPool_(t, course){
  for(let i=0; i<SERIES_RULES.length; i++){
    if(SERIES_RULES[i].test.test(t)) return SERIES_RULES[i].name;
  }
  /* ジャパンオープンは名前に年が入っているため、そのままだと
     毎年べつの大会になってしまう。年をとりのぞいて1つにまとめる。
     「JAPANOPEN2025」のようなローマ字の書き方も同じあつかいにする。 */
  if(/ジャパンオープン|JAPANOPEN|JAPAN\s*OPEN/i.test(t)) return 'ジャパンオープン';
  return t;
}

/* ===== 大会の「系統(シリーズ)」を見分ける =====
   同じ試合の毎年の回を、ひとまとめにして探せるようにします。
   例) 第20回 梅村杯長水路水泳競技大会 → 「梅村杯」
   大会名から「第◯回」「◯◯年度」などの、回ごとに変わる部分を
   取りのぞいて、残った文字を見出しにします。 */
function meetSeries(name, course){
  let t = String(name||'').replace(/[\s\u3000]+/g, '');
  if(!t) return '';
  // 全角の数字とカッコを半角にそろえる
  t = t.replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  t = t.replace(/[（]/g,'(').replace(/[）]/g,')').replace(/[ｍＭ]/g,'m');
  // 回ごとに変わる部分をとりのぞく
  t = t.replace(/第\d+回/g, '');       // 第20回
  t = t.replace(/\d{4}年度?/g, '');    // 2025年度 / 2025年
  t = t.replace(/^\d+回/, '');         // 「第」が抜けている 101回…
  t = t.replace(/(20\d{2})(?![\d])/g, '');   // 名前にまぎれた西暦
  // 言い方のゆれをそろえる
  t = t.replace(/水泳競技大会|水泳大会|競技大会/g, '');
  t = t.replace(/[・･]/g, '・');
  /* 「◯◯チャレンジレース」「◯◯タイムトライアル」は、その大会の中で
     いっしょに行われる種目なので、本体の大会と同じ仲間にまとめる。 */
  t = t.replace(/(スプリントタイムトライアル|ｽﾌﾟﾘﾝﾄﾀｲﾑﾄﾗｲｱﾙ)\s*$/,'スプリントタイムトライアル');
  t = t.replace(/(チャレンジレース|ﾁｬﾚﾝｼﾞﾚｰｽ|タイムトライアル|ﾀｲﾑﾄﾗｲｱﾙ|タイムレース)\s*$/,'');
  t = seriesPool_(t, course);
  return t || String(name||'').trim();
}

/* 大会の一覧を、系統ごとにまとめて返す。開催回数の多い順 */
function meetSeriesGroups(meets){
  const box = {};
  (meets||[]).forEach((m,i)=>{
    const k = meetSeries(m.meet, m.course);
    if(!box[k]) box[k] = { key:k, list:[] };
    box[k].list.push({ m, i });
  });
  return Object.keys(box).map(k=>{
    const g = box[k];
    g.list.sort((a,b)=>(b.m.year*100+b.m.month)-(a.m.year*100+a.m.month));
    g.n = g.list.length;
    return g;
  }).sort((a,b)=> b.n - a.n || (a.key < b.key ? -1 : 1));
}

/* ===== 種目の並び順（アプリ全体で共通） =====
   泳法: 自由形 → 背泳ぎ → 平泳ぎ → バタフライ → 個人メドレー
   距離: 50m → 100m → 200m → 400m → 800m → 1500m
   男女: 男子 → 女子
   一覧にない泳法・距離は、いちばん後ろにまわします。 */
const STROKE_ORDER = ['Fr','Ba','Br','Fly','IM'];
const DIST_ORDER   = [50,100,200,400,800,1500];
const strokeRank = c => { const i = STROKE_ORDER.indexOf(c); return i<0 ? 99 : i; };
const distRank   = d => { const i = DIST_ORDER.indexOf(Number(d)); return i<0 ? 99 : i; };
const sexRank    = s => String(s).indexOf('男')===0 ? 0 : (String(s).indexOf('女')===0 ? 1 : 2);

/* 記録を種目ごとにまとめ、上の順番に並べて返す。
   返すのは [{key:'50m自由形・男子', dist, stroke, sex, list:[記録…]}, …] */
function eventGroups(rows){
  const box = {};
  rows.forEach(r=>{
    const key = r.dist + 'm' + strokeJa(r.stroke) + '・' + r.sex;
    if(!box[key]) box[key] = { key, dist:Number(r.dist), stroke:r.stroke, sex:r.sex, list:[] };
    box[key].list.push(r);
  });
  return Object.keys(box).map(k=>box[k]).sort((a,b)=>
      strokeRank(a.stroke) - strokeRank(b.stroke)
   || distRank(a.dist)    - distRank(b.dist)
   || a.dist              - b.dist
   || sexRank(a.sex)      - sexRank(b.sex)
   || (a.key < b.key ? -1 : 1));
}
// 種目と水路の短い表記 (携帯の画面で折り返さないため)
const STROKE_SHORT = { Fr:'FR', Ba:'BA', Br:'BR', Fly:'FLY', IM:'IM' };
const strokeShort = c => STROKE_SHORT[c] || String(c).toUpperCase();
const evShort = (dist, code) => dist + 'm' + strokeShort(code);
/* この距離では、これより速いことはありえない、という秒数(日本記録あたり)。
   取り込みのときに、種目のとりちがえを見つけるために使います */
const LIMIT_LONG = {
  '女50Fr':23.5,'女100Fr':51.0,'女200Fr':112,'女400Fr':240,'女800Fr':490,'女1500Fr':940,
  '女50Ba':26.5,'女100Ba':56.5,'女200Ba':123,
  '女50Br':29.5,'女100Br':63.5,'女200Br':136,
  '女50Fly':24.5,'女100Fly':54.5,'女200Fly':122,
  '女100IM':57.0,'女200IM':125,'女400IM':266,
  '男50Fr':20.8,'男100Fr':46.5,'男200Fr':102,'男400Fr':220,'男800Fr':455,'男1500Fr':870,
  '男50Ba':23.5,'男100Ba':51.0,'男200Ba':111,
  '男50Br':25.5,'男100Br':56.5,'男200Br':125,
  '男50Fly':22.0,'男100Fly':49.0,'男200Fly':110,
  '男100IM':51.0,'男200IM':114,'男400IM':243
};
/* 短水路は、壁を蹴る回数が多いぶん速くなります。
   長水路の目安のままだと、正しい記録まで「おかしい」と言ってしまうので、
   短水路には短水路の目安をあてます(世界記録あたり) */
const LIMIT_SHORT = {
  '女50Fr':22.5,'女100Fr':49.5,'女200Fr':108,'女400Fr':230,'女800Fr':470,'女1500Fr':900,
  '女50Ba':24.5,'女100Ba':53.5,'女200Ba':117,
  '女50Br':27.5,'女100Br':61.5,'女200Br':132,
  '女50Fly':23.5,'女100Fly':52.5,'女200Fly':117,
  '女100IM':55.5,'女200IM':120,'女400IM':255,
  '男50Fr':19.5,'男100Fr':43.5,'男200Fr':97,'男400Fr':209,'男800Fr':435,'男1500Fr':830,
  '男50Ba':21.5,'男100Ba':47.5,'男200Ba':104,
  '男50Br':24.5,'男100Br':54.5,'男200Br':120,
  '男50Fly':20.5,'男100Fly':46.5,'男200Fly':105,
  '男100IM':49.0,'男200IM':108,'男400IM':232
};
function limitOf(sex, dist, stroke, course){
  const sx = String(sex || '').charAt(0);

/* ============================================================
   タイムの読み書き (文字列 と 秒数 の変換)
============================================================ */
// "1:54.83" や "1.54.83" や "26.10" を秒数にする。読めなければ null
function toSec(str){
  if(!str) return null;
  const s = String(str).trim();
  let m = s.match(/^(\d+)[:.](\d{1,2})\.(\d{1,2})$/);   // 分:秒.コンマ
  if(m) return Number(m[1])*60 + Number(m[2]) + Number(('0.'+m[3]));
  m = s.match(/^(\d{1,2})\.(\d{1,2})$/);                 // 秒.コンマ
  if(m) return Number(m[1]) + Number('0.'+m[2]);
  return null;
}
// 記録の文字を、100分の1の位まで必ずある形に整える (46.4 → 46.40、26 → 26.00)
function fmtTime(t){
  if(t==null || t==='' ) return t;
  const s = String(t).trim();
  const sec = toSec(s);
  if(sec!=null) return toStr(sec);
  let m = s.match(/^(\d+):(\d{1,2})(?:\.(\d{1,2}))?$/);   // 2:01 や 2:01.4
  if(m) return m[1]+':'+m[2].padStart(2,'0')+'.'+(m[3]||'').padEnd(2,'0');
  m = s.match(/^(\d+)(?:\.(\d{1,2}))?$/);                  // 26 や 46.4
  if(m) return m[1]+'.'+(m[2]||'').padEnd(2,'0');
  return s;
}
// 秒数を "1:54.83" の形にもどす
function toStr(sec){
  if(sec == null) return '';
  const cs = Math.round(sec*100);
  const m = Math.floor(cs/6000);
  const s = Math.floor((cs%6000)/100);
  const c = cs%100;
  const pad = n => String(n).padStart(2,'0');
  return m>0 ? m+':'+pad(s)+'.'+pad(c) : s+'.'+pad(c);
}
// テンキーで押した数字の列 (例 "15483") を "1:54.83" にする
function digitsToTime(d){
  if(d.length===0) return '';
  const p = d.padStart(5,'0');
  const cs = p.slice(-2);
  const ss = p.slice(-4,-2);
  const mm = p.slice(0,-4).replace(/^0+/,'');
  return (mm? mm+':' : '') + ss + '.' + cs;
}
function digitsValid(d){
  if(d.length<3 || d.length>6) return false;
  const p = d.padStart(5,'0');
  return Number(p.slice(-4,-2)) < 60;   // 秒は59まで
}
const esc = t => String(t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 相対の住所を絶対にそろえ、../ をたたむ
function seikoResolve(u, baseUrl){
  if(/^https?:/i.test(u)){ /* そのまま */ }
  else if(u.startsWith('/')) u = 'https://swim.seiko.co.jp' + u;
  else u = baseUrl.replace(/[^\/]*$/, '') + u.replace(/^\.\//,'');
  // /a/b/../c を /a/c にたたむ
  const parts = [];
  u.replace('https://swim.seiko.co.jp','').split('/').forEach(p=>{
    if(p==='..') parts.pop();
    else if(p!=='' && p!=='.') parts.push(p);
  });
  return 'https://swim.seiko.co.jp/' + parts.join('/');
}
// ページの中のhtmリンクを拾う(入口と同じ大会のフォルダの中だけ)
function seikoLinks(htmlText, baseUrl, folder){
  const out = [];
  const re = /(?:href|src)\s*=\s*["']?([^"'>\s]+\.html?)/gi;
  let m;
  while((m = re.exec(htmlText))){
    const u = seikoResolve(m[1], baseUrl);
    if(u.startsWith(folder) && !out.includes(u)) out.push(u);
  }
  return out;
}
// 種目名の文字(例: 女子 100m バタフライ 決勝)から種目を読み取る予備の部品
function seikoEvent(text){
  const plain = String(text).replace(/<[^>]+>/g,' ');
  const m = plain.match(/(男子|女子)[^0-9]{0,20}(\d{2,4})\s*m?\s*(自由形|背泳ぎ|平泳ぎ|バタフライ|個人メドレー)/);
  if(!m) return null;
  const map = { '自由形':'Fr', '背泳ぎ':'Ba', '平泳ぎ':'Br', 'バタフライ':'Fly', '個人メドレー':'IM' };
  const round = (plain.match(/タイム決勝|B決勝|決勝|予選/)||[''])[0];
  return { sex:m[1], dist:Number(m[2]), stroke:map[m[3]], round };
}

// ページの中の、結果PDFへのリンクと、そのそばの種目名を拾う
function seikoPdfLinks(htmlText, baseUrl, folder){
  const out = [];
  const re = /<a[^>]+(?:href|HREF)\s*=\s*["']?([^"'>\s]+\.pdf)["']?[^>]*>([\s\S]*?)<\/a>/gi;
  let m;
  while((m = re.exec(htmlText))){
    const u = seikoResolve(m[1], baseUrl);
    if(!u.startsWith(folder)) continue;
    const label = m[2].replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    if(!out.some(x=>x.url===u)) out.push({ url:u, label: label || u.split('/').pop() });
  }
  return out;
}

/* ------------------------------------------------------------
   その大会のときの学年を出す部品

   考え方
     ・4月から翌年3月までを「その年度」とする(1月の大会は前の年の年度)
     ・生年月日があれば、4月2日〜翌4月1日生まれをひとまとまりにして
       「大学に入った年度 = 生まれた年度 + 18」として数える
     ・生年月日がないときは、名簿の今の学年から年の差を引いて逆算する
     ・今の年度の大会は、名簿の学年をそのまま使う(画面ごとのくいちがい防止)
------------------------------------------------------------ */
function fyOfDate(y, m){ return (m>=4) ? y : y-1; }
/* 学年のひとまとまり(4月2日〜翌年4月1日生まれ)。4月1日生まれは前の学年になる */
function cohortOfBirth(d){
  const y = d.getFullYear(), m = d.getMonth()+1, day = d.getDate();
  if(m > 4) return y;
  if(m === 4 && day >= 2) return y;
  return y - 1;
}
function nowFy(){ const d=new Date(); return fyOfDate(d.getFullYear(), d.getMonth()+1); }
/* 名前を照らし合わせるための下ごしらえ。
   空白を取りのぞき、見た目が同じで内部だけちがう字をそろえる */
function normName(s){
  let t = String(s == null ? '' : s);
  try{ t = t.normalize('NFKC'); }catch(e){}
  return t.replace(/[\s\u3000\u200b\ufeff]/g, '');
}
let _rosterMap = null, _rosterMapFor = null;
function rosterOf(name){
  const list = (INIT && INIT.roster) ? INIT.roster : null;
  if(!list) return null;
  if(_rosterMapFor !== list){        // 名簿が入れかわったときだけ作り直す
    _rosterMap = new Map();
    list.forEach(p=>{
      const k = normName(p.name);
      if(k && !_rosterMap.has(k)) _rosterMap.set(k, p);
    });
    _rosterMapFor = list;
  }
  return _rosterMap.get(normName(name)) || null;
}
function gradeAtMeet(name, mt, sexHint){
  const p = rosterOf(name);
  if(!p) return '';
  if(!mt || !(mt.year>0) || !(mt.month>0)) return p.grade || '';
  const fy = fyOfDate(Number(mt.year), Number(mt.month));
  if(fy === nowFy()) return p.grade || '';        // 今の年度は名簿どおり
  const female = (p.sex==='女') || (sexHint==='女');
  let n = null;                                   // 大学何年目か(1〜4が在学中)
  // まず入学年度。名簿のG列の値で、2023 でも 2023.0 でも読める
  const ey = Number(String(p.entry||'').replace(/[^\d.]/g,'').split('.')[0]);
  if(ey >= 1900 && ey <= 2100){
    n = fy - ey + 1;
  }
  if(n === null && p.birth){
    const d = new Date(String(p.birth).replace(/\//g,'-'));
    if(!isNaN(d.getTime())){
      // 生まれた年度 + 19年度 が大学1年。よって 大学何年目 = 年度 - 生まれた年度 - 18
      n = fy - cohortOfBirth(d) - 18;
    }
  }
  if(n === null){
    // 名簿の学年は「2年」「大2」どちらの書き方でも読めるようにする
    const m = String(p.grade||'').match(/^(?:大)?([1-9])年?$/);
    if(m) n = Number(m[1]) - (nowFy() - fy);
  }
  if(n === null) return p.grade || '';            // 手がかりがないときは名簿のまま
  if(n >= 1 && n <= 4) return n + '年';           // 名簿と同じ書き方にそろえる
  if(n > 4) return female ? 'OG' : 'OB';
  const hs = 3 + n;   if(hs >= 1) return '高' + hs;   // 入学より前は高校・中学・小学
  const jh = hs + 3;  if(jh >= 1) return '中' + jh;
  const el = jh + 6;  if(el >= 1) return '小' + el;
  return '';
}
function isObGrade(g){ return /^(OB|OG|ＯＢ|ＯＧ|社会人|卒業)/.test(String(g||'')); }
// 名前のうしろに小さく学年を出す
function nameWithGrade(name, grade){
  /* 名前を押すと、その選手のベスト一覧に飛びます */
  const nm = '<button type="button" class="nameLink" onclick="gotoPerson(\''
    + esc(String(name).replace(/'/g, "\\'")) + '\')" '
    + 'title="' + esc(name) + ' さんのベスト一覧を見る">' + esc(name) + '</button>';
  if(!grade) return nm;
  return nm + '<span style="font-weight:400; color:var(--gray); font-size:.85em"> '+esc(grade)+'</span>';
}
/* 現役をタイムの速い順に並べ、そのうしろに OB・OG をタイムの速い順で足す。
   OB・OGは順位に入れないので、いつも最下位のあとになる。 */
function sortActiveThenOb(list){
  const t = x => (x.r.sec==null ? 9e9 : x.r.sec);
  const withG = list.map(r=>({ r, g: gradeAtMeet(r.name, r.meet, r.sex) }));
  const act = withG.filter(x=>!isObGrade(x.g)).sort((a,b)=>t(a)-t(b));
  const ob  = withG.filter(x=> isObGrade(x.g)).sort((a,b)=>t(a)-t(b));
  return act.concat(ob);
}

/* タイムを押すとラップが開く仕組み。
   ラップのある記録は、タイムのうしろに小さな印をつけて押せるようにする。 */
let LAP_SEQ = 0;
const LAP_STORE = {};
function lapCell(r){
  const html = esc(fmtTime(r.time));
  if(!r.splits || r.splits.length < 1) return html;
  const id = 'lap' + (++LAP_SEQ);
  LAP_STORE[id] = { splits: r.splits, time: r.time, dist: r.dist, name: r.name };
  return `<span class="lapbtn" onclick="toggleLap('${id}', this)" style="cursor:pointer; border-bottom:2px dotted var(--blue)">${html}</span>` +
    `<span style="color:var(--blue); font-size:0.8em"> ▾</span>`;
}
window.toggleLap = function(id, el){
  const tr = el.closest('tr');
  const next = tr.nextElementSibling;
  if(next && next.classList.contains('laprow')){ next.remove(); return; }
  const d = LAP_STORE[id];
  if(!d) return;
  const cols = tr.children.length;
  // 通過タイムと、その差(ラップ)を並べる
  const step = d.dist && d.splits.length ? Math.round(d.dist / (d.splits.length + 1)) : 50;
  let h = '<table style="width:100%; font-size:0.9em"><tr><th>距離</th><th>通過</th><th>ラップ</th></tr>';
  const all = d.splits.concat([d.time]);
  for(let i=0; i<all.length; i++){
    const a = toSec(all[i]), b = i===0 ? 0 : toSec(all[i-1]);
    const lap = (a!=null && b!=null) ? (a-b).toFixed(2) : '';
    h += `<tr><td class="nw">${step*(i+1)}m</td><td class="num nw">${esc(fmtTime(all[i]))}</td>
      <td class="num nw" style="color:var(--blue)">${esc(lap)}</td></tr>`;
  }
  h += '</table>';
  const row = document.createElement('tr');
  row.className = 'laprow';
  row.innerHTML = `<td colspan="${cols}" style="background:var(--blue-pale); padding:8px">
    <div style="font-weight:700; margin-bottom:4px">${esc(d.name)}　${esc(fmtTime(d.time))} のラップ</div>${h}</td>`;
  tr.insertAdjacentElement('afterend', row);
};

/* ============================================================
   もどる・すすむ (2026.09.04)
   見た画面を順にひかえておき、下の帯の両はしのボタンで行き来します。
   ブラウザの戻るとは別に、このアプリの中だけで動きます。
============================================================ */
let navHist = [];        // 見てきた画面の並び
let navPos  = -1;        // いま何番目にいるか
let navMoving = false;   // もどる・すすむ で動かしている最中は、ひかえない
function navRecord(m){
  if(navMoving) return;
  if(navPos >= 0 && navHist[navPos] === m) return;   // 同じ画面の描き直しは数えない
  navHist = navHist.slice(0, navPos + 1);            // すすむ先があったら、そこから先は捨てる
  navHist.push(m);
  if(navHist.length > 50){ navHist.shift(); }        // ひかえは50個まで
  navPos = navHist.length - 1;
  navArrowUpdate();
}
function navGo(pos){
  if(pos < 0 || pos >= navHist.length) return;
  navMoving = true;
  navPos = pos;
  try{ showMode(navHist[navPos]); }
  finally{ navMoving = false; }
  navArrowUpdate();
  window.scrollTo({top:0, behavior:'smooth'});
}
function navBack(){ navGo(navPos - 1); }
function navFwd(){  navGo(navPos + 1); }
function navArrowUpdate(){
  const b = document.getElementById('navBack');
  const f = document.getElementById('navFwd');
  if(b) b.disabled = (navPos <= 0);
  if(f) f.disabled = (navPos >= navHist.length - 1);
}
function drawSubBar(m){
  const bar = document.getElementById('subBar');
  if(!bar) return;
  const subs = NAV[currentNav].subs;
  bar.innerHTML = subs.map(([k,label])=>
    `<button class="sub" role="tab" data-m="${k}" aria-selected="${k===m}" onclick="showMode('${k}')">${label}</button>`
  ).join('');
  bar.hidden = (subs.length <= 1);
}

/* ============================================================
   選手を探す共通部品
   学年・男女・五十音・文字検索(音声入力もOK)で絞り込みます
============================================================ */
function makeFinder(container, onPick, multiDone, preselected, doneLabel){
  // 学年・男女は複数選べる(空っぽのときは絞り込みなし)
  const state = { grade:new Set(), sex:new Set(), text:'' };
  // 学年は 1年 2年 3年 4年 の順にならべ、OB・OGは そのあとに置く
  const grades = [...new Set(INIT.roster.map(r=>r.grade).filter(Boolean))]
    .sort((a,b)=>{
      const num = x=>{ const m=String(x).match(/^(\d+)/); return m? Number(m[1]) : 900; };
      const rank = x=> x==='OB'? 901 : (x==='OG'? 902 : num(x));
      return rank(a)-rank(b) || String(a).localeCompare(String(b),'ja');
    });

  container.innerHTML = `
    <div class="finder">
      <div class="chips" data-k="grade" role="group" aria-label="学年で絞る"></div>
      <div class="chips" data-k="sex" role="group" aria-label="男女で絞る"></div>
      <label class="fld">名前で検索(音声入力もつかえます)
        <input type="text" data-k="text" placeholder="例: やまもと">
      </label>
      ${multiDone? `<div class="selbar">
        <span class="selcount" style="font-weight:700">選択中: 0人</span>
        <button type="button" class="btn red solid" data-k="done" disabled>${esc(doneLabel||'選んだ選手で一覧を作る')}</button>
      </div>`:''}
      <div class="athlist" role="list"></div>
    </div>`;
  const selected = new Map();
  (preselected||[]).forEach(p=>selected.set(p.name, p));
  function paintSel(){
    if(!multiDone) return;
    container.querySelector('.selcount').textContent = '選択中: '+selected.size+'人';
    container.querySelector('[data-k="done"]').disabled = selected.size===0;
  }
  if(multiDone){
    container.querySelector('[data-k="done"]').onclick = ()=>multiDone(Array.from(selected.values()));
  }

  function chips(k, items){
    const box = container.querySelector(`.chips[data-k="${k}"]`);
    box.innerHTML = '';
    const all = document.createElement('button');
    all.className = 'chip on'; all.textContent = 'すべて'; all.type='button';
    all.onclick = ()=>{ state[k].clear(); render(); };
    box.appendChild(all);
    items.forEach(v=>{
      const b = document.createElement('button');
      b.className = 'chip'; b.type='button';
      b.textContent = v.label!==undefined? v.label : v;
      const val = v.value!==undefined? v.value : v;
      // 押すたびに追加と取り消しが切り替わる
      b.onclick = ()=>{
        if(state[k].has(val)) state[k].delete(val);
        else state[k].add(val);
        render();
      };
      b.dataset.v = val;
      box.appendChild(b);
    });
  }
  chips('grade', grades);
  chips('sex', ['男','女']);
  container.querySelector('input[data-k="text"]').addEventListener('input', e=>{
    state.text = e.target.value.trim(); render();
  });
  paintSel();

  function render(){
    // チップの見た目を今の状態にそろえる(すべて=なにも選んでいないとき)
    ['grade','sex'].forEach(k=>{
      container.querySelectorAll(`.chips[data-k="${k}"] .chip`).forEach((b,i)=>{
        const on = i===0 ? state[k].size===0 : state[k].has(b.dataset.v);
        b.classList.toggle('on', on);
      });
    });
    const list = container.querySelector('.athlist');
    let people = INIT.roster.slice();
    if(state.grade.size) people = people.filter(p=>state.grade.has(p.grade));
    if(state.sex.size)   people = people.filter(p=>Array.from(state.sex).some(v=>(p.sex||'').startsWith(v)));
    if(state.text)  people = people.filter(p=>p.name.includes(state.text)||p.kana.includes(state.text));
    people.sort((a,b)=>(a.kana||a.name).localeCompare(b.kana||b.name,'ja'));
    list.innerHTML = '';
    if(people.length===0){
      list.innerHTML = '<div class="hint">この条件の選手はいません。条件を緩めてください。</div>';
      return;
    }
    // 一人だけ選ぶ画面では、名前のボタンではなくプルダウンで選ぶ
    if(!multiDone){
      const lab = document.createElement('label');
      lab.className = 'fld';
      lab.style.cssText = 'max-width:460px; grid-column:1/-1;';
      lab.textContent = '選手を選ぶ';
      const sel = document.createElement('select');
      const head = document.createElement('option');
      head.value = '';
      head.textContent = `選手を選んでください (${people.length}人)`;
      sel.appendChild(head);
      people.forEach((p,i)=>{
        const o = document.createElement('option');
        o.value = i;
        const sub = [p.kana, [p.grade, p.sex].filter(Boolean).join('・')].filter(Boolean).join(' ');
        o.textContent = p.name + (sub? '　'+sub : '');
        sel.appendChild(o);
      });
      sel.onchange = ()=>{ if(sel.value!=='') onPick(people[Number(sel.value)]); };
      lab.appendChild(sel);
      list.appendChild(lab);
      return;
    }
    people.forEach(p=>{
      const b = document.createElement('button');
      b.className='ath'; b.type='button'; b.setAttribute('role','listitem');
      const sub = [p.kana, [p.grade, p.sex].filter(Boolean).join('・')].filter(Boolean).join('　');
      b.innerHTML = `<span class="nm">${esc(p.name)}</span><span class="kn">${esc(sub)}</span>`;
      if(multiDone){
        if(selected.has(p.name)) b.classList.add('sel');
        b.setAttribute('aria-pressed', selected.has(p.name));
        b.onclick = ()=>{
          if(selected.has(p.name)){ selected.delete(p.name); b.classList.remove('sel'); }
          else { selected.set(p.name, p); b.classList.add('sel'); }
          b.setAttribute('aria-pressed', selected.has(p.name));
          paintSel();
        };
      } else {
        b.onclick = ()=>onPick(p);
      }
      list.appendChild(b);
    });
  }
  render();
}

      o.textContent = `${m.month}月 ${m.meet} ${m.course||''}${m.ref?'(参考)':''}`;
      nSel.appendChild(o);
    });
    if(hits.length===0){
      nSel.innerHTML = '<option value="">この年月の試合はありません</option>';
    }
  }
  ySel.onchange = ()=>{ fillMonths(); fillNames(); };
  mSel.onchange = fillNames;
  nSel.onchange = ()=>{
    if(nSel.value==='') return;
    const m = INIT.meets[Number(nSel.value)];
    IN.meet = m.meet;
    IN.course = m.course || '長水路';
    stepEvent();
  };
  fillYears(); fillMonths(); fillNames();
}

// その選手・種目のいちばん速い記録を探す(ベスト比較用)
function findBest(name, stroke, dist, course){
  if(!DATA) return null;
  let best = null;
  ((DATA&&DATA.records)?DATA.records:[]).map(rec).forEach(r=>{
    if(r.name!==name || r.stroke!==stroke || r.dist!==dist) return;
    if(course && r.meet.course && r.meet.course!==course) return;
    if(r.sec!=null && (best==null || r.sec<best)) best = r.sec;
  });
  return best;
}

function stepTable(){
  drawSteps(3);
  const body = document.getElementById('inBody');
  let rowsHtml = '';
  IN.list.forEach((p,i)=>{
    const best = findBest(p.name, IN.stroke, IN.dist, IN.course);
    const d = IN.times[p.name] || '';
    const isSaved = !!IN.saved[p.name];
    rowsHtml += `<tr data-i="${i}" data-name="${esc(p.name)}">
      <td style="font-weight:700; font-size:1.1rem">${esc(p.name)}</td>
      <td class="num">${best!=null? toStr(best) : '-'}</td>
      <td><input class="rowtime" inputmode="numeric" autocomplete="off"
        aria-label="${esc(p.name)}のタイム" placeholder="15483"
        value="${d? digitsToTime(d):''}" data-d="${d}" ${isSaved?'disabled':''}></td>
      <td class="stcell">${isSaved?'<span class="rowdone">保存済み</span>':''}</td>
      <td>${isSaved?'' : `<button type="button" class="btn ghost rowdel" style="min-height:44px" aria-label="${esc(p.name)}を一覧から外す">外す</button>`}</td></tr>`;
  });
  body.innerHTML = `
    <div class="card redline">
      <h2>${esc(IN.meet)}　${IN.dist}m${strokeJa(IN.stroke)} ${courseTag(IN.course)} の記録を打ち込む</h2>
      <div class="stack" style="align-items:end; margin-bottom:10px">
        <label class="fld">この種目の実施日
          <input type="date" id="btDate" value="${IN.date || new Date().toISOString().slice(0,10)}">
        </label>
      </div>
      <p class="hint">数字だけを打ちます。例: 1分54秒83 は 15483。区切りは自動で入ります。日本語入力のままの全角数字でも大丈夫です。改行キーで次の選手に移ります。空欄の選手は保存されません。</p>
      <div class="tablewrap"><table id="batchTable">
        <tr><th>選手</th><th>これまでのベスト</th><th>今回の記録</th><th></th><th></th></tr>
        ${rowsHtml}
      </table></div>
      <div class="stack" style="margin-top:16px">
        <button class="btn big red solid" onclick="saveBatchGo()">まとめて保存する</button>
        <button class="btn" onclick="captureTable(); stepAthletes()">選手を追加・削除する</button>
        <button class="btn ghost" onclick="stepEvent()">種目に戻る</button>
      </div>
      <div id="btMsg" style="margin-top:12px"></div>
    </div>`;
  // タイム欄: 数字だけを受け付けて、打つそばから 1:54.83 の形に整える
  // 日本語入力がオンで全角の１５４８３になっても、自動で半角に直します
  function formatRow(inp){
    const half = inp.value.replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
    const d = half.replace(/[^0-9]/g,'').replace(/^0+/,'').slice(0,6);
    inp.dataset.d = d;
    inp.value = d? digitsToTime(d) : '';
    inp.classList.remove('ok','bad');
    if(d) inp.classList.add(digitsValid(d)? 'ok' : 'bad');
  }
  document.querySelectorAll('#batchTable .rowtime').forEach(inp=>{
    if(inp.dataset.d) formatRow(inp);
    inp.addEventListener('input', e=>{ if(!e.isComposing) formatRow(inp); });
    inp.addEventListener('compositionend', ()=>formatRow(inp));
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter' && !e.isComposing){
        e.preventDefault();
        // その時点で入力できる欄の中から、次の欄へ移る
        const list = Array.from(document.querySelectorAll('#batchTable .rowtime:not(:disabled)'));
        const next = list[list.indexOf(inp)+1];
        if(next) next.focus();
      }
    });
  });
  // 外すボタン: タイムを保ったまま、その選手だけ一覧から外す
  document.querySelectorAll('#batchTable .rowdel').forEach(btn=>{
    btn.onclick = ()=>{
      const tr = btn.closest('tr');
      const name = tr.dataset.name;
      captureTable();
      IN.list = IN.list.filter(p=>p.name!==name);
      delete IN.times[name];
      stepTable();
    };
  });
  document.getElementById('btDate').onchange = e=>{ IN.date = e.target.value; };
  const first = document.querySelector('#batchTable .rowtime:not(:disabled)');
  if(first) first.focus();
}

// 表に打ち込んだタイムを覚えておく(選手の追加・削除で表を作り直すときに使う)
function captureTable(){
  document.querySelectorAll('#batchTable tr[data-name]').forEach(tr=>{
    const name = tr.dataset.name;
    const d = tr.querySelector('.rowtime').dataset.d || '';
    if(d) IN.times[name] = d; else delete IN.times[name];
  });
}

async function saveBatchGo(){
  const msg = document.getElementById('btMsg');
  const rows = Array.from(document.querySelectorAll('#batchTable tr[data-i]'));
  const entries = [];
  const badNames = [];
  rows.forEach(tr=>{
    const p = IN.list[Number(tr.dataset.i)];
    const inp = tr.querySelector('.rowtime');
    const d = inp.dataset.d || '';
    if(tr.querySelector('.stcell').textContent.indexOf('保存済み')>=0) return; // 二重保存を防ぐ
    if(!d) return;
    if(!digitsValid(d)){ badNames.push(p.name); return; }
    entries.push({ p, tr, time: digitsToTime(d) });
  });
  if(badNames.length>0){
    msg.innerHTML = `<div class="errmsg">タイムの形がおかしい選手がいます: ${esc(badNames.join('、'))}。秒は59までです。</div>`;
    return;
  }
  if(entries.length===0){
    msg.innerHTML = '<div class="errmsg">保存する記録がありません。タイムを入れてください。</div>';
    return;
  }
  if(!confirm(entries.length+'人の記録を '+IN.meet+' の '+IN.dist+'m'+strokeJa(IN.stroke)+' として保存します。よろしいですか。')) return;
  msg.innerHTML = '<div class="loading">'+entries.length+'件を保存しています…</div>';
  try{
    IN.date = document.getElementById('btDate').value;
    await apiSave({
      action:'saveBatch', meet: IN.meet, course: IN.course, date: IN.date,
      records: entries.map(e=>({ name:e.p.name, event: IN.dist+IN.stroke, time:e.time }))
    });
    localStorage.removeItem('cust_rec_cache');
    entries.forEach(e=>{
      const best = findBest(e.p.name, IN.stroke, IN.dist, IN.course);
      const sec = toSec(e.time);
      const pb = (best!=null && sec!=null && sec<best);
      IN.saved[e.p.name] = true;
      IN.times[e.p.name] = e.tr.querySelector('.rowtime').dataset.d || '';
      e.tr.querySelector('.stcell').innerHTML =
        '<span class="rowdone">保存済み</span>' + (pb? ' ' + BEST_MARK : '');
      e.tr.querySelector('.rowtime').disabled = true;
      const del = e.tr.querySelector('.rowdel');
      if(del) del.remove();
    });
    msg.innerHTML = `<div class="okmsg">${entries.length}件を保存しました。</div>
      <div class="stack" style="margin-top:12px; justify-content:center">
        <button class="btn big solid" onclick="IN.stroke=null; IN.dist=null; stepEvent()">同じ大会の別の種目へ</button>
        <button class="btn big" onclick="captureTable(); stepAthletes()">同じ種目で選手を追加</button>
        <button class="btn big ghost" onclick="stepMeet()">最初に戻る</button>
      </div>`;
  }catch(err){
    msg.innerHTML = '<div class="errmsg">保存できませんでした: '+esc(err.message)+'</div>';
  }
}

/* ============================================================
   年度で探す
   4月〜翌年3月をひとつの年度として、その年度の試合をまとめて選べる。
   1〜3月の大会は前の年度あつかい(例: 2026年3月 → 2025年度)。
============================================================ */
function viewFyTab(){
  const body = document.getElementById('viewBody');
  const fyOf = m => (m.month>=4 ? m.year : m.year-1);
  const fys = [...new Set(DATA.meets.filter(m=>m.year>0 && m.month>0).map(fyOf))].sort((a,b)=>b-a);
  body.innerHTML = `
    <div class="card">
      <h2>年度で探す</h2>
      <p class="hint">年度を選ぶと、その年度(4月〜翌年3月)の試合が新しい順に並びます。</p>
      <div class="pick2">
        <label class="fld">年度<select id="vfFy"></select></label>
        <label class="fld wide">試合名<select id="vfName"></select></label>
      </div>
      <div id="vfOut" style="margin-top:16px"></div>
    </div>`;
  const fySel = document.getElementById('vfFy');
  const nSel = document.getElementById('vfName');
  if(fys.length===0){
    fySel.innerHTML = '<option value="">まだ試合がありません</option>';
    return;
  }
  fySel.innerHTML = '';
  fys.forEach(fy=>{
    const o = document.createElement('option');
    o.value = fy; o.textContent = fy + '年度';
    fySel.appendChild(o);
  });
  function fillNames(){
    const fy = Number(fySel.value);
    const hits = DATA.meets
      .map((m,i)=>({m,i}))
      .filter(x=>x.m.year>0 && x.m.month>0 && fyOf(x.m)===fy)
      .sort((a,b)=>(b.m.year*100+b.m.month)-(a.m.year*100+a.m.month));
    nSel.innerHTML = '';
    hits.forEach(x=>{
      const o = document.createElement('option');
      o.value = x.i;
      o.textContent = `${x.m.year}年${x.m.month}月 ${x.m.meet} ${x.m.course||''}${x.m.ref?'(参考)':''}`;
      nSel.appendChild(o);
    });
    if(hits.length===0){
      nSel.innerHTML = '<option value="">この年度の試合はありません</option>';
      document.getElementById('vfOut').innerHTML = '';
      return;
    }
    draw();
  }
  function draw(){
    if(nSel.value==='') return;
    const idx = Number(nSel.value);
    const out = document.getElementById('vfOut');
    if(!DATA || !DATA.records){
      out.innerHTML = '<p class="hint">記録を読み込んでいます…</p>';
      loadRecords().then(()=>{ if(DATA && DATA.records) draw(); })
        .catch(()=>{ out.innerHTML = '<p class="hint">記録を読み込めませんでした。ページを再読み込みしてください。</p>'; });
      return;
    }
    const rows = ((DATA&&DATA.records)?DATA.records:[]).map(rec).filter(r=>DATA.meets.indexOf(r.meet)===idx);
    if(rows.length===0){ out.innerHTML = '<p class="hint">この大会の記録はありません。</p>'; return; }
    const groups = eventGroups(rows);   // 決まった順番(自由形→背泳ぎ→…／50m→100m→…)に並べる
    let html = `<p class="hint">${rows.length}件の記録。記録を押すと、そのレースの画面がひらきます。ベスト更新は記録のうしろに赤い丸のベの印がつきます。各種目は5人まで表示、残りは表の中を下にすべらせて見られます。名前のうしろは、その大会のときの学年です。OB・OGは順位に入れず、その種目のいちばん下にまとめています。</p>`;
    groups.forEach(gr=>{
      const g = sortActiveThenOb(gr.list);   // 現役→OB・OGの順
      html += `<h3 style="margin:16px 0 6px; font-size:1.1rem; color:var(--blue); text-align:center">${esc(gr.key)}</h3>
        <div class="tablewrap" style="max-height:300px"><table><tr><th>名前</th><th>記録</th><th>大会前ベスト</th></tr>`;
      g.forEach(x=>{
        const r = x.r;
        html += `<tr><td class="nw">${nameWithGrade(r.name, x.g)}</td>
          <td class="num nw">${r.pb? BEST_MARK :''}${raceLink(r, esc(fmtTime(r.time)))}${recordBadges(r.sec, r.stroke, r.dist, r.sex, r.meet.course, {name:r.name, meet:r.meet, sex:r.sex})}</td>
          <td class="num nw">${esc(fmtTime(r.best))}</td></tr>`;
      });
      html += '</table></div>';
    });
    out.innerHTML = html;
  }
  fySel.onchange = fillNames;
  nSel.onchange = draw;
  fillNames();   // いちばん新しい年度を自動で表示する
}

/* ============================================================
   リレーの記録の読み出しと表示
============================================================ */
let RELAYS = null;
async function loadRelays(force){
  if(RELAYS && !force) return RELAYS;
  try{
    const c = JSON.parse(localStorage.getItem('cust_relay_cache')||'null');
    if(!force && c && Date.now()-c.t < 10*60*1000){ RELAYS = c.relays; return RELAYS; }
  }catch(e){}
  try{
    const j = await apiGet('relays');
    RELAYS = (j && j.relays) ? j.relays : [];
    localStorage.setItem('cust_relay_cache', JSON.stringify({ t: Date.now(), relays: RELAYS }));
  }catch(e){ RELAYS = RELAYS || []; }   // GAS側が未対応でも個人記録の表示は普通に動く
  return RELAYS;
}
// 試合の結果のいちばん下に、その大会のリレーを付け足す
async function appendRelays(mt, outId, stamp){
  await loadRelays();
  const out = document.getElementById(outId);
  if(!out || out.dataset.stamp !== stamp) return;   // 表示中の大会が切りかわっていたらやめる
  const list = (RELAYS||[]).filter(r=>
    String(r.meet)===mt.meet && Number(r.year)===mt.year && Number(r.month)===mt.month &&
    String(r.course||'')===String(mt.course||''));
  if(list.length===0) return;
  // 種目・ラウンドごとにまとめる
  const groups = {};
  list.forEach(r=>{
    const k = (r.sex||'') + ' ' + (r.event||'') + (r.round ? '・'+r.round : '');
    (groups[k] = groups[k]||[]).push(r);
  });
  let html = '<h3 style="margin:22px 0 6px; font-size:1.15rem; color:var(--red); text-align:center">リレー</h3>';
  /* リレーも決まった順に並べる: 男子→女子、そのあと距離の短い順 */
  const relayKeys = Object.keys(groups).sort((a,b)=>{
    const num = t => { const m = String(t).match(/(\d+)\s*m/); return m ? Number(m[1]) : 9999; };
    return sexRank(a) - sexRank(b) || num(a) - num(b) || (a < b ? -1 : 1);
  });
  relayKeys.forEach(k=>{
    const g = groups[k].sort((a,b)=>(toSec(a.time)??9e9)-(toSec(b.time)??9e9));
    html += `<h3 style="margin:14px 0 6px; font-size:1.05rem; color:var(--blue); text-align:center">${esc(k)}</h3>`;
    g.forEach(r=>{
      /* 通過タイムの列を作る。splits(通過タイムの全部)がある記録は
         50m・100m…と並べ、ラップも出す。まだ通過タイムが入っていない
         古い記録は、これまでどおり「50m通過」と「タイム」だけを出す。 */
      const legDist = Number(r.legDist) || 0;
      const nSplit = Math.max.apply(null, (r.legs||[]).map(l=>(l.splits||[]).length).concat([0]));
      const hasSplits = nSplit >= 2;
      const heads = [];
      if(hasSplits){
        for(let i=1; i<=nSplit; i++) heads.push((legDist ? Math.round((legDist/nSplit)*i) : 50*i) + 'm');
      }
      html += `<div style="margin:8px 0 14px">
        <div style="font-weight:700; font-size:1.05rem">${r.rank ? esc(r.rank)+'位 ' : ''}${esc(r.team)}　<span class="num">${esc(r.time)}</span></div>
        <div class="tablewrap"><table><tr><th>泳順</th><th>名前</th><th>学年</th>` +
        (hasSplits
          ? heads.map(h=>`<th class="nw">${esc(h)}</th>`).join('') + '<th class="nw">ラップ</th>'
          : '<th class="nw">50m通過</th><th class="nw">タイム</th>') + `</tr>`;
      (r.legs||[]).forEach((l,i)=>{
        html += `<tr><td class="nw">${i+1}泳${i===0?'(正式記録)':''}</td>
          <td class="nw" style="font-weight:700">${esc(l.name||'')}</td>
          <td class="nw">${esc(l.grade||'')}</td>`;
        if(hasSplits){
          const sp = l.splits || [];
          const laps = [];
          for(let j=0; j<sp.length; j++){
            const a = toSec(sp[j]), b = j===0 ? 0 : toSec(sp[j-1]);
            laps.push((a!=null && b!=null) ? (a-b).toFixed(2) : '');
          }
          for(let j=0; j<nSplit; j++) html += `<td class="num nw">${esc(sp[j]||'-')}</td>`;
          html += `<td class="num nw" style="color:var(--blue)">${esc(laps.filter(v=>v).join(' / '))}</td>`;
        } else {
          html += `<td class="num nw">${esc(l.pass||'-')}</td><td class="num nw">${esc(l.leg||'')}</td>`;
        }
        html += '</tr>';
      });
      html += '</table></div></div>';
    });
  });
  out.insertAdjacentHTML('beforeend', html);
}

/* ============================================================
   全国大会の印
   どの大会が全国大会かは、設定画面の「全国大会の登録」でチェックを付ける。
   サーバー(GAS)に保存できればみんなに共有され、

============================================================ */
let WORLDS = null;      // 国際大会にした大会名の一覧
async function loadWorlds(){
  if(WORLDS) return WORLDS;
  try{
    const res = await fetch(GAS_URL + '?action=world&_=' + Date.now(), { cache:'no-store' });
    const json = await res.json();
    if(json && json.meets){
      WORLDS = json.meets.map(s=>String(s).trim());
      localStorage.setItem('cust_worlds', JSON.stringify(WORLDS));
      return WORLDS;
    }
  }catch(e){}
  try{ WORLDS = JSON.parse(localStorage.getItem('cust_worlds')||'[]'); }
  catch(e){ WORLDS = []; }
  return WORLDS;
}

/* ============================================================
   国スポ・国体の 予選会 と 本大会 を見分ける
     予選会 … 大会名に「予選」または「選考」が入っているもの。
              県予選会、地区予選、代表選手選考会 など。
     本大会 … 国民スポーツ大会・国民体育大会・国体・国スポ が入っていて、
              予選や選考が入っていないもの。
     それ以外は 空文字を返します(ふつうの大会)。
============================================================ */
function meetKind(name){
  const s = String(name||'');
  if(/予選|選考/.test(s)) return '予選';
  if(/国民スポーツ大会|国民体育大会|国体|国スポ/.test(s)) return '本大会';
  return '';
}
/* 一覧やプルダウンで、大会名の前に出す文字。
   国スポ系だけ ［予選］［本大会］ を付けます。ふつうの大会には何も付きません。 */
function meetKindTag(name){
  const k = meetKind(name);
  return k ? '［' + k + '］' : '';
}

let NATIONALS = null;   // 全国大会にした大会名の一覧
async function loadNationals(){
  if(NATIONALS) return NATIONALS;
  try{
    const json = await apiGet('nationals');            // まずサーバーから
    if(json && Array.isArray(json.meets)){
      NATIONALS = json.meets.map(s=>String(s).trim());
      localStorage.setItem('cust_nationals', JSON.stringify(NATIONALS));
      return NATIONALS;
    }
  }catch(e){ /* サーバー側が未対応でもこの端末の覚え書きで動く */ }
  try{ NATIONALS = JSON.parse(localStorage.getItem('cust_nationals')||'[]'); }
  catch(e){ NATIONALS = []; }
  return NATIONALS;
}

/* 国際大会かどうかを見分ける。
   まず「大会カテゴリー」シートの設定を使い、無ければ言葉で見分けます */
const WORLD_WORDS = ['パンパシフィック', 'パンパシ', '世界選手権', 'オリンピック',
  'ユニバーシアード', 'アジア大会', 'アジア選手権', 'ワールドカップ', 'ワールドユニバーシティ',
  'World', 'Pan Pacific', 'PanPacs', 'PanPac', 'Olympic', 'Universiade', 'WUG',
  'Singapore', 'Aquatics', '日中対抗', '国際大会'];
/* この言葉が入っていたら、国際大会とはみなしません。
   「◯◯県選手権兼 国民スポーツ大会代表選手選考会」のような
   長い名前の県大会を、まちがって国際大会にしないためです */
const NOT_WORLD_WORDS = ['県選手権', '都選手権', '府選手権', '道選手権',
  '国民スポーツ大会', '国民体育大会', '国スポ', '県予選', '小学生選手権',
  '中部学生', '日本選手権'];
function isWorldMeet(name){
  const t = String(name || '').replace(/[\s\u3000]/g, '');
  // 国内大会の言葉が入っていたら、国際大会にはしません
  if(NOT_WORLD_WORDS.some(w => t.indexOf(w) >= 0)) return false;
  if(WORLD_WORDS.some(w => t.indexOf(w.replace(/[\s\u3000]/g, '')) >= 0)) return true;
  const wc = (MEET_CATS || []).find(c => String(c.name).indexOf('国際') >= 0);
  if(wc) return (wc.words || []).some(w => w && t.indexOf(String(w).replace(/[\s\u3000]/g, '')) >= 0);
  return false;
}
