      items.forEach(it=>{
        const y = it.transform[5];
        let row = rows.find(r=>Math.abs(r.y - y) < 3);
        if(!row){ row = { y, items: [] }; rows.push(row); }
        row.items.push(it);
      });
      rows.sort((a,b)=>b.y - a.y);
      rows.forEach(r=>{
        r.items.sort((a,b)=>a.transform[4] - b.transform[4]);
        let line = ''; let prevEnd = null;
        const cells = [];
        r.items.forEach(it=>{
          const x = it.transform[4];
          const gap = (prevEnd!==null) ? x - prevEnd : null;
          if(gap!==null && gap > 1) line += ' ';
          line += it.str;
          /* ★となり合っていて、すき間のない文字は1つのマスにまとめる。
             PDFによっては記録の欄が 1 : 5 2 . 7 5 のように
             1文字ずつバラバラに置かれていることがあり、
             そのままだと「1:52.75 という形のマス」を見つけられないため。 */
          if(gap!==null && gap <= 1 && cells.length){
            cells[cells.length-1].str += it.str;
          } else {
            cells.push({ x, str: it.str });
          }
          prevEnd = x + (it.width || 0);
        });
        cells.forEach(c=>{ c.str = c.str.trim(); });
        allRows.push({ text: line, cells, page: p });
      });
    }
    return allRows;
  }
  // これまで通り「行の文字だけ」が欲しいとき用(東洋電子のPDF読み取りで使う)
  async function pdfToLines(buf){
    const rows = await pdfToRows(buf);
    return rows.map(r=>r.text);
  }
  /* ============================================================
     速報(レーンごとの一覧)PDFの読み取り
     わかやまオープンなど、関西方面の大会でよく使われる形です。

     見た目:
       No. 1 女子 200m 個人メドレー 予選
       １組 着順 時間            ６組 着順 時間
       0. 山田 花子 (○○SS ) 中2 3 2:52.20   0. 鈴木 太郎 (△△SC ) 高1 5 2:29.06

     やっかいな点:
       ・1ページが左右2段に分かれていて、左と右は「別の種目・別の組」
       ・種目の見出しは、その段に1回しか出てこない
         (次のページまで見出しなしで続くことがある)
     そこで、レーン番号(0. 1. 2. …)の横位置から段の境目を見つけて
     左右に切り分け、左の段 → 右の段 の順に種目を引きついで読みます。
     この形には通過タイムがないので、ラップは空になります。
  ============================================================ */
  function parseSokuho(rows){
    const evRe   = /No\.\s*(\d+)\s+(男子|女子)\s+(\d{2,4})\s*m\s*(自由形|背泳ぎ|平泳ぎ|バタフライ|個人メドレー)\s*(予選|タイム決勝|準決勝|Ｂ決勝|B決勝|決勝)/;
    const heatRe = /^[０-９0-9]+\s*組/;
    const ageRe  = /^(無差別|\d+歳以下|\d+歳[-－―]\d+歳|\d+歳以上)$/;
    const resRe  = /^(\d+)\.\s*(.*?)\s*[(（]\s*(.*?)\s*[)）]\s*(.*)$/;
    const timeRe = /^(?:\d+:)?\d{1,2}\.\d{2}$/;
    const gradeRe = /^(小|中|高|大)\d$/;
    /* レーン番号。「0.」は名前とくっついて「0. 村上」になることがある。
       59.24 のようなタイムと区別するため、ドットの後ろが数字でないものだけにする。 */
    const laneRe = /^\d{1,2}\.(?!\d)/;
    const SJ = { '自由形':'Fr', '背泳ぎ':'Ba', '平泳ぎ':'Br', 'バタフライ':'Fly', '個人メドレー':'IM' };

    // ページごとにまとめる(ページの情報がないときは、ぜんぶ1ページ扱い)
    const pages = {};
    const order = [];
    rows.forEach(r=>{
      const p = r.page || 1;
      if(!pages[p]){ pages[p] = []; order.push(p); }
      pages[p].push(r);
    });

    const hits = [];
    let ev = null;
    order.sort((a,b)=>a-b).forEach(p=>{
      const pr = pages[p];
      /* レーン番号(0. 1. 2. …)は、その段のいちばん左に必ず並ぶ。
         その横位置を集めて近いものをまとめると、段の左端が分かる。
         2つのかたまりがあれば2段組み、その2つ目の左端が右の段のはじまり。 */
      const lanes = [];
      pr.forEach(r=>r.cells.forEach(c=>{ if(laneRe.test(c.str)) lanes.push(c.x); }));
      lanes.sort((a,b)=>a-b);
      const groups = [];
      lanes.forEach(x=>{
        const g = groups.find(g=>Math.abs(g[0] - x) < 25);
        if(g) g.push(x); else groups.push([x]);
      });
      let mid = Infinity;
      if(groups.length >= 2){
        const starts = groups.map(g=>g[0]).sort((a,b)=>a-b);
        if(starts[1] - starts[0] >= 80) mid = starts[1] - 8;   // 右の段のすこし手前で切る
      }

      for(let side=0; side<2; side++){
        if(side===1 && mid===Infinity) break;
        pr.forEach(r=>{
          const cells = r.cells.filter(c=> (c.x < mid) === (side===0));
          if(!cells.length) return;
          const line = cells.map(c=>c.str).join(' ').replace(/\s+/g,' ').trim();
          const m = evRe.exec(line);
          if(m){
            ev = { sex:m[2], dist:Number(m[3]), stroke:SJ[m[4]], round:m[5] };
            return;
          }
          if(heatRe.test(line) || ageRe.test(line) || !ev) return;
          const g = resRe.exec(line);
          if(!g) return;
          const name = g[2].replace(/[\s\u3000]/g, '');
          const team = g[3].replace(/[\s\u3000]/g, '');
          if(!name || !team) return;
          let time = '';
          g[4].split(/\s+/).forEach(tok=>{
            if(gradeRe.test(tok)) return;                 // 学年
            if(/^(棄権|失格|欠場)$/.test(tok)) time = tok;
            else if(timeRe.test(tok)) time = tok;
          });
          if(!time) return;
          hits.push({ name, team, sex: ev.sex, dist: ev.dist, stroke: ev.stroke,
                      round: ev.round, time, splits: [] });
        });
      }
    });
    return hits;
  }

  /* 速報PDFの見出しから、大会名・会場・実施日を読み取る。
     1ページ目のあたまが
       第9回わかやまオープン水泳競技大会
       秋葉山公園県民水泳場
       競泳競技
       2024年2月3日
     のように並んでいます。水路は書かれていないので空にします。 */
  function sokuhoMeta(rows){
    let meet = '', place = '', year = 0, month = 0, date = '';
    const lines = rows.slice(0, 12).map(r=>String(r.text||'').trim()).filter(t=>t);
    lines.forEach((t, i)=>{
      const dm = t.match(/(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})日/);
      if(dm && !date){
        year = Number(dm[1]); month = Number(dm[2]);
        date = dm[1] + '-' + String(dm[2]).padStart(2,'0') + '-' + String(dm[3]).padStart(2,'0');
      }
      if(!meet && /大会|選手権|カップ|フェスティバル|記録会|competition/i.test(t) &&
         !/競泳競技|プールコンディション|備\s*考/.test(t)){
        meet = t.replace(/\s+/g,' ').trim();
        // 大会名のつぎの行が会場のことが多い
        const nx = (lines[i+1] || '').replace(/\s+/g,' ').trim();
        if(nx && nx.length >= 3 && !/競泳競技|\d{4}年/.test(nx)) place = nx;
      }
    });
    return (meet || date) ? { meet, place, year, month, date, course:'' } : null;
  }

  /* ============================================================
     セイコーの「種目別競技結果」PDFの読み取り
     行の作りは 1人あたり2行以上:
       1行目: 順位 組/水路 加盟 氏名 所属 生年 学年 … ポイント
       2行目: フリガナ           正式記録 (リアクション)
       3行目から: 通過タイム(あれば)
     氏名と所属の区切りは、見出し行(氏名・所属…)の横位置で見分ける。
  ============================================================ */
  /* セイコーの種目別競技結果PDFの読み取り。
     新形式(2024年ごろ〜): 1行目=順位〜ポイント、2行目=フリガナ+記録、3行目以降=通過タイム
     旧形式(2021年ごろ):   1行目に記録も書いてあり、2行目=通過タイム+反応タイム
     どちらの形式も読めるように、見出しの横位置と
     「記録の行はタイムが1個だけ・通過の行はタイムが並ぶ」という性質で見分ける。 */
  function parseSeiko(rows){
    /* 準決勝がぬけていたため、準決勝の記録が
       ひとつ前の種目のものとして登録されていました(2026-08-19 修正) */
    const evRe = /競技No\.?\s*[:：]?\s*\d+\s+(男子|女子|混合)\s+(\d{2,4})\s*m?\s+(\S+?)\s+(予選|Ｂ決勝|B決勝|準決勝|決勝|タイム決勝|スイムオフ)/;
    const timeRe = /^(\d+:)?\d{1,2}\.\d{2}$/;
    let event = null;      // いま読んでいる種目
    let col = null;        // 見出しの横位置 { name, team, birth, rec }
    let pending = null;    // 1行目を読んで、記録の確定を待っている選手
    let wait = 0;
    const hits = [];
    const put = (p, time, splits) => {
      if(p && p.name) hits.push({ name: p.name, team: p.team,
        sex: p.ev.sex, dist: p.ev.dist, stroke: p.ev.stroke, round: p.ev.round, time,
        splits: (splits && splits.length) ? splits : [] });
    };
    const flush = () => {   // 旧形式: 1行目に書いてあった記録で確定させる
      if(pending && pending.l1time){
        put(pending, pending.l1time, /^\d/.test(pending.l1time) ? pending.l1splits : []);
      }
      pending = null;
    };
    /* 記録の行のあとに続く「タイムだけの行」を通過タイムとして集める。
       セイコーは 26.34 55.34 1:24.89 … のように並ぶ。
       800m・1500mは複数行に分かれるので、続きの行もつなげる。 */
    const splitsAfter = (rws, idx, dist) => {
      const TT = /^(?:\d+:)?\d{1,2}\.\d{2}$/;
      const want = Math.max(0, Math.round(dist / 50) - 1);
      if(want < 1) return [];          // 50mは通過なし
      const out = [];
      let started = false;
      for(let j = idx + 1; j <= idx + 10 && j < rws.length; j++){
        const toks = String(rws[j].text).trim().split(/\s+/).filter(s=>s);
        if(toks.length >= 1 && toks.every(s=>TT.test(s))){
          out.push.apply(out, toks); started = true;
          if(out.length >= want) break;
        } else if(started) break;
      }
      return out.slice(0, want);
    };
    // 通過タイムが記録より遅い(または同じ)ものは、読み違いなので捨てる
    const cleanSplits = (sp, time) => {
      const fin = toSec(time);
      if(!sp || !sp.length || fin == null) return sp || [];
      const ok = sp.filter(v=>{ const s = toSec(v); return s != null && s < fin; });
      return ok.length === sp.length ? sp : [];
    };
    for(let ri = 0; ri < rows.length; ri++){
      const row = rows[ri];
      const text = row.text;
      const plain = text.replace(/[\s\u3000]/g,'');
      // 種目の見出し
      const m = text.match(evRe);
      if(m){
        flush();
        if(/[×xX]|リレー/.test(text)){ event = null; }
        else{
          const ev = parseEventText(m[2]+'m'+m[3]);
          event = ev ? { sex: m[1]==='女子' ? '女' : '男', dist: ev.dist, stroke: ev.stroke,
            round: m[4].replace('Ｂ','B') } : null;
        }
        continue;
      }
      // 列の見出し(旧形式は「氏  名」「所属名」のように空白入りで書かれる)
      if(plain.includes('氏名') && plain.includes('所属')){
        flush();
        const find = pref => {
          const c = row.cells.find(c=>c.str.replace(/[\s\u3000]/g,'').indexOf(pref)===0);
          return c ? c.x : null;
        };
        const name = find('氏'), team = find('所属'), birth = find('生年');
        const recCell = row.cells.find(c=>c.str.replace(/[\s\u3000]/g,'').includes('記録'));
        if(name!=null && team!=null){
          col = { name, team, birth: birth!=null ? birth : team+90,
                  rec: recCell ? recCell.x : null };
        }
        continue;
      }
      /* 通過タイムの列の見出し行(「50m」や「50m 100m 150m」)の横位置をおぼえる。
         この位置が分かると、通過タイムを記録とまちがえなくなる。 */
      if(col && row.cells.length && row.cells.every(c=>/^\d{2,4}\s*m$/.test(c.str.trim()))){
        col.splits = row.cells.map(c=>c.x);
        continue;
      }
      if(!event || !col) continue;
      const thr = (col.rec!=null) ? col.rec - 30 : col.team + 40;  // 記録欄のはじまり
      /* そのマスが「記録」の列のものか、「通過タイム」の列のものかを見わける。
         記録の見出しと通過の見出しの、どちらに近いかで決める。
         100mのPDFでは通過(50m)の列が記録の列のすぐ左にあり、
         「記録欄のはじまり」だけでは見わけられないため。 */
      const nearRec = x => {
        if(col.rec == null || !col.splits || !col.splits.length) return x >= thr;
        const dRec = Math.abs(x - col.rec);
        const dSpl = Math.min.apply(null, col.splits.map(sx=>Math.abs(x - sx)));
        return dRec < dSpl;
      };
      // 1行目かどうか: 氏名の欄より左に「組/水路」(例 4/6 や 1/ 4)があるか
      const leftJoin = row.cells.filter(c=>c.x < col.name - 6).map(c=>c.str).join('');
      if(/\d+\/\s*\d+/.test(leftJoin)){
        flush();
        const pick = (x0, x1) => row.cells.filter(c=>c.x >= x0 && c.x < x1).map(c=>c.str).join('');
        // 旧形式にそなえて、1行目の記録欄にあるタイムや棄権も拾っておく
        const tc = row.cells.filter(c=>nearRec(c.x) && timeRe.test(c.str.trim()));
        let l1 = tc.length ? fmtTime(tc[tc.length-1].str.trim()) : null;
        if(/棄権|欠場|失格/.test(plain)){
          l1 = /失格/.test(plain) ? '失格' : /欠場/.test(plain) ? '欠場' : '棄権';
        }
        pending = {
          l1splits: splitsAfter(rows, ri, event.dist),
          name: pick(col.name - 6, col.team - 6).replace(/[\s\u3000]+/g,''),
          // 所属の欄では、生年の2桁数字(例: 04)がまぎれこんでも拾わない。
          // 文字とくっついている場合(例: 高校04)は、末尾の2桁だけを取り除く
          team: row.cells.filter(c=>c.x >= col.team - 6 && c.x < col.birth - 6 && !/^\d{2}$/.test(c.str.trim()))
                  .map(c=>c.str).join('').replace(/[\s\u3000]+/g,'')
                  .replace(/([^0-9])\d{2}$/, '$1'),
          ev: event, l1time: l1
        };
        wait = 3;
        continue;
      }
      // 記録の確定: 新形式なら2行目(フリガナ+記録)、旧形式なら1行目の値を使う
      if(pending && wait > 0){
        wait--;
        if(plain.includes('記録')){ if(wait===0) flush(); continue; }  // 世界記録などの参考行はとばす
        let time = null;
        if(/棄権|欠場|失格/.test(text)){
          time = /失格/.test(text) ? '失格' : /欠場/.test(text) ? '欠場' : '棄権';
        } else {
          // 記録の行はタイムが1個だけ。通過タイムの行(タイムが並ぶ)は読まない
          const tcells = row.cells.filter(c=>timeRe.test(c.str.trim()));
          if(tcells.length===1 && nearRec(tcells[0].x)) time = fmtTime(tcells[0].str.trim());
        }
        if(time!=null){
          // 棄権・失格には通過タイムを付けない(次の選手の値を拾わないため)
          put(pending, time, /^\d/.test(time)
            ? cleanSplits(splitsAfter(rows, ri, pending.ev.dist), time) : []);
          pending = null;
        } else if(wait===0){ flush(); }
      }
    }
    flush();   // 最後の選手ぶん
    return hits;
  }
  /* 東洋電子のリレー種目PDFの読み取り。1チームぶんは次の4行:
       1 中京大 Ａ  2/ 3  3:45.74          … 順位・チーム・組/水路・総合記録
       27.81 57.30 1:24.33 …               … 通しの通過タイム(使わない)
       神田 美夢 大3 ・ 宮脇 礼依 大2・ …   … 泳者の名前と学年(・区切り)
       27.81 57.30 ( ) 27.03 56.21 (-----) … 泳者ごとの50m通過とタイム */
  /* 東洋電子のリレー種目PDFの読み取り。1チームぶんの行の並び:
       1 中京大 Ａ 2/ 3 7:14.22   … 順位・チーム・組/水路・総合記録
       (通しの通過タイムの行。使わない)
       笠島 大雅 大4・ 宮本 敦矢 大4・ … … 泳者の名前と学年(・区切り)
       25.71 53.69 ( ) 24.62 51.94 (-----) … … 泳者ごとのタイム(カッコで区切られる)
     4×200mだけは、上の行が印字の重なりで読みにくく、
     つぎの行に「泳者ごとの後半2つ」がきれいに並ぶので、そちらを使う。 */
  /* 東洋電子のリレー種目PDFの読み取り。
     4×200mは2行が重なって印字されるため、文字の横位置(x)を使って
     泳者ごとの列に振り分ける。rowsは pdfToRows の結果(textとcellsを持つ)。 */
  function parseRelay(rows){
    const lines = rows.map(r=>r.text);
    const evRe = /No\.\s*\d+\s+(男子|女子|混合)\s+(\d+)\s*[×xX]\s*(\d+)\s*m\s+(\S*リレー)\s*(\S*)/;
    const teamRe = /^\s*(\d+)?\s+(\S+)\s*([Ａ-ＺA-Z])?\s+\d+\/\s*\d+\s+((?:\d+:)?\d+\.\d{2}|棄権|失格|欠場|DSQ|DNS|DNF)/;
    const T = /^(?:\d+:)?\d+\.\d{2}$/;
    const secOf = v => { const m = String(v).match(/^(?:(\d+):)?(\d+)\.(\d+)$/);
      return m ? Number(m[1]||0)*60 + Number(m[2]) + Number('0.'+m[3]) : null; };
    let ev = null;
    const out = [];
    for(let i=0; i<lines.length; i++){
      const m = lines[i].match(evRe);
      if(m){
        ev = {
          sex: m[1]==='女子' ? '女' : (m[1]==='混合' ? '混合' : '男'),
          count: Number(m[2]), legDist: Number(m[3]), type: m[4],
          event: m[2]+'×'+m[3]+'m'+m[4],
          round: (m[5]||'').replace('タイムレース決勝','タイム決勝').replace('Ｂ','B')
        };
        continue;
      }
      if(!ev) continue;
      const t = lines[i].match(teamRe);
      if(!t) continue;
      // 名前の行と、そのあとのタイムの行(1〜2行)を集める
      let nameRow = null; const timeRows = [];
      for(let j=i+1; j<=i+7 && j<lines.length; j++){
        if(!nameRow && lines[j].includes('・')){ nameRow = rows[j]; continue; }
        if(nameRow){
          const hasTime = (rows[j].cells||[]).some(c=>T.test(c.str.trim()));
          if(hasTime) timeRows.push(rows[j]);
          else if(timeRows.length) break;
          if(timeRows.length >= 2) break;
        }
      }
      const team = t[2] + (t[3] ? t[3].normalize('NFKC') : '');
      // 名前は「・」で区切って読む
      const names = nameRow ? nameRow.text.split('・').map(s=>{
        const g = s.match(/(大|高|中)\d|一般/);
        return { name: s.replace(/(大|高|中)\d|一般/g,'').replace(/[\s\u3000]+/g,''), grade: g ? g[0] : '' };
      }) : [];
      // 名前の行のx位置から、泳者ごとの列の境目を決める
      let bounds = null;
      if(nameRow && nameRow.cells && nameRow.cells.length){
        const marks = [];
        nameRow.cells.forEach(c=>{ if(c.str.includes('・')) marks.push(c.x); });
        if(marks.length >= ev.count - 1){
          bounds = [];
          for(let k=0; k<ev.count; k++){
            bounds.push({ lo: k===0 ? -1e9 : marks[k-1], hi: k===ev.count-1 ? 1e9 : marks[k] });
          }
        }
      }
      const per = Math.max(1, Math.round(ev.legDist / 50));
      const legs = [];
      /* 通過タイムの取り出し方
         4×50m・4×100m: 1行目のカッコ区切りで泳者ごとに分かれている
         4×200m: 1行目は前半(50m・100m)、2行目に後半(150m・200m)が
                 泳者ごとにきれいに並ぶので、2行目を軸にして組み立てる */
      const row1 = timeRows[0], row2 = timeRows[1];
      const timesOf = r => (r && r.cells ? r.cells.filter(c=>T.test(c.str.trim())).map(c=>({x:c.x, v:c.str.trim()})) : []);
      const t1 = timesOf(row1), t2 = timesOf(row2);
      const useTwoRows = (per > 2) && (t2.length === ev.count * (per - 2) + (per - 2 > 0 ? 0 : 0)) ;
      if(per > 2 && t2.length >= ev.count * 2 && t2.length % ev.count === 0){
        /* 4×200m: 2行目に各泳者の後半(150m・200m)が順に並ぶ。
           1行目には各泳者の前半(50m・100m)が、後半の値と混ざって印字される。
           2行目の値と同じものを1行目から取り除くと、残りが前半にあたる。 */
        const back = t2.length / ev.count;
        const front = per - back;
        const backAll = t2.map(o=>o.v);
        // 1行目から、2行目にある値(=後半)を取り除いたものを、x順に並べる
        const frontAll = t1.filter(o=>backAll.indexOf(o.v) === -1).sort((a,b)=>a.x-b.x).map(o=>o.v);
        for(let k=0; k<ev.count; k++){
          const b = t2.slice(k*back, (k+1)*back).map(o=>o.v);
          const f = frontAll.slice(k*front, (k+1)*front);
          legs.push(f.concat(b));
        }
      } else {
        const chunks = (row1 ? row1.text : '').split(/\([^)]*\)/);
        for(let k=0; k<ev.count; k++){
          const raw = (chunks[k] || '').match(/(?:\d+:)?\d+\.\d{2}/g) || [];
          legs.push(raw.slice(0, per));
        }
      }
      const swimmers = [];
      for(let k=0; k<ev.count; k++){
        const sp = legs[k].map(v=>fmtTime(v));
        swimmers.push({
          name: names[k] ? names[k].name : '',
          grade: names[k] ? names[k].grade : '',
          pass: sp.length >= 2 ? sp[0] : '',
          leg: sp.length ? sp[sp.length-1] : '',
          splits: sp
        });
      }
      out.push({ sex: ev.sex, event: ev.event, relayType: ev.type, legDist: ev.legDist,
        round: ev.round, rank: t[1] ? Number(t[1]) : '', team,
        time: /\d/.test(t[4]) ? fmtTime(t[4]) : t[4], legs: swimmers });
    }
    return out;
  }
  // 東洋電子PDFの見出しから、大会名・実施日・水路を読み取る
  // 1行目=大会名、「期日:2026年7月4日…」、「会場:…(50m)」の形を利用する
  /* AQUA CREW(アクアクルー)の種目別競技結果PDFを読む。
     見出し: 競技番号:1 女子 400ｍ 個人メドレー 予選
     選手行: 1 1/ 3 梶本 幸花 関西支部 /同志社大学 07 大１ 0.62 4:49.94 Q +2.63
     つぎの行から: 50ｍ: 30.82 100ｍ: 1:05.44 (34.62) [1:05.44] 150ｍ: … と通過タイムが並ぶ */
  function parseAqua(lines){
    const evRe = /競技番号\s*[:：]\s*\d+\s+(男子|女子|混合)\s+(\d+)\s*[ｍm]\s+(\S+?)\s+(予選|Ｂ決勝|B決勝|決勝|タイム決勝|準決勝|スイムオフ)/;
    // 順位 組/水路 氏名 加盟団体 /所属 生年 学年 リアクション 記録
    const rowRe = /^\s*(\d+)?\s*(\d+\/\s*\d+)\s+(.+?)\s+(\d{2})\s+(大|高|中|小)?[０-９0-9一二三四五六七八九]?\s+(?:(\d\.\d{2})\s+)?((?:\d+:)?\d{1,2}\.\d{2}|棄権|失格|欠場|DNS|DSQ|DNF)/;
    const splitRe = /(\d+)\s*[ｍm]\s*[:：]\s*((?:\d+:)?\d{1,2}\.\d{2})/g;
    let ev = null;
    const hits = [];
    for(let i=0; i<lines.length; i++){
      const line = lines[i];
      const m = line.match(evRe);
      if(m){
        if(/[×xX]|リレー/.test(line)){ ev = null; }
        else{
          const e = parseEventText(m[2]+'m'+m[3]);
          ev = e ? { sex: m[1]==='女子' ? '女' : (m[1]==='混合' ? '混合' : '男'),
                     dist: e.dist, stroke: e.stroke,
                     round: m[4].replace('Ｂ','B') } : null;
        }
        continue;
      }
      if(!ev) continue;
      // 記録の行を読む(世界記録などの参考行は「記録」の文字があるので飛ばす)
      if(/世界記録|日本記録|学生記録|大会記録|ＷＪ記録|関西記録|中部記録/.test(line)) continue;
      const r = line.match(rowRe);
      if(!r) continue;
      // 氏名と所属を分ける(所属は「/」で始まる)
      let namePart = r[3];
      let name = namePart, team = '';
      const slash = namePart.indexOf('/');
      if(slash >= 0){
        team = namePart.slice(slash+1).trim();
        name = namePart.slice(0, slash).replace(/(関西支部|中部支部|近畿支部|東海支部)\s*$/, '').trim();
      }
      name = name.replace(/[\s\u3000]+/g, '');
      let time = r[7];
      if(/棄権|欠場|DNS/.test(time)) time = /欠場/.test(time) ? '欠場' : '棄権';
      else if(/失格|DSQ/.test(time)) time = '失格';
      else if(/DNF/.test(time)) time = '途中棄権';
      else time = fmtTime(time);
      // つぎの行から通過タイムを集める(50ｍ: 30.82 100ｍ: 1:05.44 … の形)
      const splits = [];
      if(/^\d/.test(time)){
        for(let j=i+1; j<=i+4 && j<lines.length; j++){
          if(rowRe.test(lines[j]) || evRe.test(lines[j])) break;
          let mm; const re = new RegExp(splitRe.source, 'g');
          let found = false;
          while((mm = re.exec(lines[j]))){
            splits.push({ d: Number(mm[1]), t: mm[2] });
            found = true;
          }
          if(!found && splits.length) break;
        }
      }
      // 距離の順に並べ、最後(=記録そのもの)を除いた通過タイムにする
      splits.sort((a,b)=>a.d-b.d);
      const sp = splits.filter(s=>s.d < ev.dist).map(s=>fmtTime(s.t));
      hits.push({ name, team, sex: ev.sex, dist: ev.dist, stroke: ev.stroke,
        round: ev.round, time, splits: sp });
    }
    return hits;
  }

  /* AQUA CREWのPDFから大会名・会場・実施日を読み取る。
     1行目は同じ文字が2回くり返されることがあるので、半分に切り詰める。 */
  function aquaMeta(lines){
    const dedupe = s => {
      const t = String(s).trim();
      const h = Math.floor(t.length/2);
      // 「ABCABC」のように前半と後半が同じなら、前半だけにする
      if(t.length >= 6 && t.slice(0,h) === t.slice(h)) return t.slice(0,h).trim();
      return t;
    };
    let meet = '', place = '', year = 0, month = 0, date = '', course = '';
    for(const line of lines.slice(0, 10)){
      const t = String(line||'').trim();
      if(!t) continue;
      // 日付「2026/04/18～2026/04/19」と会場が同じ行にある
      const dm = t.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
      if(dm && !date){
        year = Number(dm[1]); month = Number(dm[2]);
        date = dm[1] + '-' + String(dm[2]).padStart(2,'0') + '-' + String(dm[3]).padStart(2,'0');
        // 日付より前の部分が会場名
        const p = dedupe(t.slice(0, t.indexOf(dm[0])).trim());
        if(p && p.length >= 3) place = p;
      }
      if(!meet && /大会|選手権|カップ|フェスティバル|記録会|競技会/.test(t) && !/種目別|競技番号/.test(t)){
        // 英語の副題(Dual Meet of など)を取りのぞいてから、くり返しをまとめる
        let c = t.replace(/Dual Meet of/gi, ' ').replace(/[A-Za-z]+\s+vs\s+[A-Za-z]+/gi, ' ')
                 .replace(/\s+/g, ' ').trim();
        c = dedupe(c);
        // それでも同じ大会名が2回つながっているときは、1回ぶんにする
        const m2 = c.match(/^(.+?)\1$/);
        if(m2) c = m2[1].trim();
        if(c.length >= 4) meet = c;
      }
    }
    return (meet || date) ? { meet, place, year, month, date, course } : null;
  }

  /* 東洋電子PDFの見出しから、大会名・会場・実施日・水路を読み取る。
     ふつうは1行目が大会名、つぎに「会場:…(50m)」「期日:2026年5月16日」と並ぶ。
     水路は、会場の(50m)→長水路 / (25m)→短水路 で判断する。
     それが無いときは、大会名の中の「長水路」「短水路」からも探す。 */
  function tdsMeta(rows){
    let meet = '', place = '', year = 0, month = 0, date = '', course = '';
    for(const r of rows.slice(0, 15)){
      const t = String(r.text || '').trim();
      if(!t) continue;
      // 「会場:」「期日:」の見出し行は除く。大会名の中の「東海会場」などは残す
      if(!meet && t.length >= 6 && !/No\.\s*\d|会場\s*[:：]|期日\s*[:：]|順位|氏\s*名|組\/水|≪|出力日時/.test(t)){
        // 末尾のページ番号(1 / 1)を取りのぞく
        const cand = t.replace(/\s*\d+\s*\/\s*\d+\s*$/, '').trim();
        // 選手の記録行(タイムや「◯級」をふくむ行)は大会名ではない
        const looksRecord = /(?:\d+:)?\d{1,2}\.\d{2}/.test(cand) || /\d+級/.test(cand);
        if(cand.length >= 6 && !looksRecord) meet = cand;
      }
      const dm = t.match(/期日.*?(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})日/);
      if(dm){
        year = Number(dm[1]); month = Number(dm[2]);
        date = dm[1] + '-' + String(dm[2]).padStart(2,'0') + '-' + String(dm[3]).padStart(2,'0');
      }
      if(/会場/.test(t)){
        // 「会場:中京大学スポーツ科学部 梅村プール(50m)」から会場名だけを取り出す
        place = t.replace(/^.*会場\s*[:：]\s*/, '').replace(/\s*[\(（]\s*\d+\s*[mｍ]\s*[\)）]\s*$/, '').trim();
        if(/[\(（]\s*50\s*[mｍ]/.test(t)) course = '長水路';
        else if(/[\(（]\s*25\s*[mｍ]/.test(t)) course = '短水路';
      }
    }
    // 会場から分からなければ、大会名の中の言葉で判断する
    if(!course && meet){
      if(/長水路|50\s*[mｍ]/.test(meet)) course = '長水路';
      else if(/短水路|25\s*[mｍ]/.test(meet)) course = '短水路';
    }
    return (meet || date) ? { meet, place, year, month, date, course } : null;
  }

  /* 記録から水路を推し量る(会場にも大会名にも書いていないとき用)。
     短水路は長水路より速いので、長水路の日本記録より明らかに速い記録が
     あれば短水路とみなす。逆に、極端に遅い記録ばかりなら判断しない。 */
  function guessCourse(hits){
    // 長水路の日本記録に近い目安(秒)。これより速ければ短水路の可能性が高い
    const LCM_LIMIT = {
      '男50Fr':21.0,'男100Fr':47.0,'男200Fr':1*60+43.0,'男400Fr':3*60+40.0,
      '男100Ba':51.5,'男200Ba':1*60+52.0,'男100Br':58.0,'男200Br':2*60+6.0,
      '男100Fly':50.0,'男200Fly':1*60+52.0,'男200IM':1*60+55.0,'男400IM':4*60+6.0,
      '女50Fr':24.0,'女100Fr':52.5,'女200Fr':1*60+54.0,'女400Fr':4*60+2.0,
      '女100Ba':58.0,'女200Ba':2*60+5.0,'女100Br':1*60+5.0,'女200Br':2*60+19.0,
      '女100Fly':56.0,'女200Fly':2*60+4.0,'女200IM':2*60+7.0,'女400IM':4*60+31.0
    };
    let fast = 0, checked = 0;
    (hits||[]).forEach(h=>{
      const key = (h.sex==='女' ? '女' : '男') + h.dist + h.stroke;
      const lim = LCM_LIMIT[key];
      const sec = toSec(h.time);
      if(lim == null || sec == null) return;
      checked++;
      if(sec < lim) fast++;
    });
    if(checked >= 5 && fast >= 2) return '短水路';   // 日本記録級が複数あれば短水路
    return '';
  }

  /* ZIPの中の1ファイルに「実行できる」印(755)をつけて包みます。
     こうしておくと、解凍したあとそのままダブルクリックで動きます。
     ふつうにダウンロードしたファイルは動かせない決まりなので、
     この包み方にすることでターミナルを使わずにすみます */
  function grabCrc32(buf){
    if(!grabCrc32.t){
      const t = new Uint32Array(256);
      for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; }
      grabCrc32.t = t;
    }
    const t = grabCrc32.t;
    let crc = 0xFFFFFFFF;
    for(let i=0;i<buf.length;i++) crc = t[(crc ^ buf[i]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function grabMakeZip(name, bytes){
    const nm  = new TextEncoder().encode(name);
    const crc = grabCrc32(bytes);
    const sz  = bytes.length;
    const d   = new Date();
    const dt  = (((d.getFullYear()-1980)&0x7f)<<9) | ((d.getMonth()+1)<<5) | d.getDate();
    const tm  = (d.getHours()<<11) | (d.getMinutes()<<5) | (d.getSeconds()>>1);

    const lh = new Uint8Array(30 + nm.length), lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true);     lv.setUint16(8, 0, true);
    lv.setUint16(10, tm, true);        lv.setUint16(12, dt, true);
    lv.setUint32(14, crc, true);       lv.setUint32(18, sz, true);
    lv.setUint32(22, sz, true);        lv.setUint16(26, nm.length, true);
    lv.setUint16(28, 0, true);         lh.set(nm, 30);

    const cd = new Uint8Array(46 + nm.length), cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 0x031E, true);
    cv.setUint16(6, 20, true);         cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);         cv.setUint16(12, tm, true);
    cv.setUint16(14, dt, true);        cv.setUint32(16, crc, true);
    cv.setUint32(20, sz, true);        cv.setUint32(24, sz, true);
    cv.setUint16(28, nm.length, true); cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);         cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0x81ED0000, true);   // 0100755 = 実行できるファイル
    cv.setUint32(42, 0, true);         cd.set(nm, 46);

    const eo = new Uint8Array(22), ev = new DataView(eo.buffer);
    ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, 1, true);
    ev.setUint16(10, 1, true);         ev.setUint32(12, cd.length, true);
    ev.setUint32(16, lh.length + sz, true);

    const out = new Uint8Array(lh.length + sz + cd.length + eo.length);
    let p = 0;
    out.set(lh, p); p += lh.length;
    out.set(bytes, p); p += sz;
    out.set(cd, p); p += cd.length;
    out.set(eo, p);
    return out;
  }

  function saveGrabber(){
    try{
      const bin = atob(GRABBER_B64);
      const bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
      const zip = grabMakeZip(GRABBER_NAME, bytes);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([zip], { type: 'application/zip' }));
      a.download = '大会PDFを取る.zip';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(a.href), 20000);
      grabMsg('ダウンロードフォルダに「大会PDFを取る.zip」が入りました。<br><br>'
        + '<b>1</b> それをダブルクリックすると、中から「大会PDFを取る」が出てきます。<br>'
        + '<b>2</b> 出てきた「大会PDFを取る」を、<b>キーボードのコントロールキーを押しながらクリック</b>して、'
        + 'メニューの「開く」を選びます。確認の画面が出たら、もう一度「開く」を押してください。'
        + 'はじめの1回だけ必要な手順です。<br>'
        + '<b>3</b> 黒い画面が開いて、アドレスを聞かれます。大会の結果ページのアドレスを貼り付けて'
        + 'エンターを押すと、PDFを集めてデスクトップにフォルダを作って入れます。<br><br>'
        + '次からは、ふつうにダブルクリックするだけで使えます。'
        + 'デスクトップなど使いやすい場所に移しておいてもかまいません。');
    }catch(e){
      grabMsg('保存できませんでした。' + e, false);
    }
  }

  function parseMicroplus(lines){
    const STROKE = { 'Freestyle':'Fr', 'Backstroke':'Ba', 'Breaststroke':'Br',
                     'Butterfly':'Fly', 'Individual Medley':'IM', 'Medley':'IM' };
    const MON = { JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12 };
    const EV    = /^(Women's|Men's|Mixed)\s+(\d+)\s*m\s+(Freestyle|Backstroke|Breaststroke|Butterfly|Individual Medley)\s*$/;
    const RELAY = /^(Women's|Men's|Mixed)\s+\d+\s*x\s*\d+\s*m\s+/i;
    const DATE  = /^(?:(?:MON|TUE|WED|THU|FRI|SAT|SUN)\s+)?(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})\s*(?:-\s*\d{1,2}:\d{2})?\s*$/i;
    const RND   = /^(Heats?|Preliminar\w*|Semi-?finals?|Final\s*A|Final\s*B|Timed\s+Finals?|Finals?|Swim-?off.*)\s*$/i;
    const SKIPON  = /^(Entry List|Start List|Medallist|Medalist|Participation|Statistic|Records? by|Team Officials)/i;
    const SKIPOFF = /^\s*Results(\s+Summary)?\s*$/i;
    const NAT   = /\b([A-Z]{3})\s+(?=\d\.\d{2}\b|\d{1,2}\s+[A-Za-z]{3}\s+\d{4}\b|\d{4}\s+\d\.\d{2}\b|DNS\b|DSQ\b|DNF\b|WDR\b|DNC\b|DNQ\b)/g;
    const DOB   = /^\s*(?:\d{1,2}\s+[A-Za-z]{3}\s+\d{4}|\d{4})\s*/;
    const RT    = /^\s*\d\.\d{2}\s*/;
    const TIME  = /(?:\d+:)?\d{1,2}\.\d{2}/g;
    const DQ    = /\b(DNS|DSQ|DNF|WDR|DNC|DNQ)\b/;
    const LAPLBL = /\d+\s*m\b/i;
    const POS    = /\(\s*\d+\s*\)/;
    const sc = t=>{ const m=/^(?:(\d+):)?(\d+)\.(\d+)$/.exec(t);
      return m ? Number(m[1]||0)*60 + Number(m[2]) + Number('0.'+m[3]) : 0; };

    const hits = [];
    let cur = null, ymd = null, last = null, skip = false;

    for(const raw of lines){
      const t = String(raw).trim();
      if(!t) continue;

      if(SKIPON.test(t)){ skip = true; cur = null; last = null; continue; }
      if(SKIPOFF.test(t)){ skip = false; continue; }

      if(RELAY.test(t)){ cur = null; last = null; continue; }

      const dm = DATE.exec(t);
      if(dm){
        const mo = MON[dm[2].toUpperCase()] || 0;
        if(mo) ymd = { year:Number(dm[3]), month:mo,
          date: dm[3]+'-'+String(mo).padStart(2,'0')+'-'+String(Number(dm[1])).padStart(2,'0') };
        continue;
      }

      const ev = EV.exec(t);
      if(ev){
        cur = { sex: (ev[1]==="Women's" ? '女子' : '男子'),
                dist: Number(ev[2]), stroke: STROKE[ev[3]], round: '' };
        last = null;
        continue;
      }

      const rd = RND.exec(t);
      if(rd && cur && !cur.round){
        const w = rd[1].replace(/\s+/g,'').toLowerCase();
        cur.round = /^swim/.test(w) ? 'スイムオフ'
                  : /^semi/.test(w) ? '準決勝'
                  : /^finalb$/.test(w) ? 'B決勝'
                  : /^final/.test(w) || /^timedfinal/.test(w) ? '決勝' : '予選';
        continue;
      }

      if(skip || !cur) continue;
      if(/^(WR|FR|UR|CR|NR|OR|ER|AS|PR|WJ|CH|GR)\b/.test(t)) continue;
      if(/^(Rank|Code|Record|Legend|Heats\s+Event|Final\s+Event|C\/R|Name|Swimming|RANK|Issued|Report)\b/i.test(t)) continue;
      if(/^SWM[MWX]/.test(t)) continue;
      if(/Reaction\s*time|Classified|Qualified for|Page\s*\d+\/\d+|Number of entries/i.test(t)) continue;

      NAT.lastIndex = 0;
      let mm, pick = null;
      while((mm = NAT.exec(t)) !== null){
        // 「17 APR 2000」の APR のように、数字のすぐうしろにある3文字は
        // 月の名前であって国コードではないので、選ばない
        if(/\d\s*$/.test(t.slice(0, mm.index))) continue;
        pick = mm;
      }

      if(!pick){
        // 通過タイムの行かどうか。「50m」の見出しか、順位の丸かっこが目印
        if(last && (LAPLBL.test(t) || POS.test(t))){
          const ts = t.replace(/\(\s*\d+\s*\)/g,' ').match(TIME) || [];
          const good = ts.filter(x=>sc(x) > 0 && sc(x) < sc(last.time));
          if(good.length && good.length === ts.length) last.splits = last.splits.concat(good);
        }
        continue;
      }

      let name = t.slice(0, pick.index).replace(/^[\s=\d]+/,'').trim();
      if(!/[A-Za-z]/.test(name)) continue;
      const nat = pick[1];
      let rest = t.slice(pick.index + pick[0].length).replace(DOB,'').replace(RT,'').trim();

      let time = '', splits = [];
      const only = /^(DNS|DSQ|DNF|WDR|DNC|DNQ)\s*$/.exec(rest);
      if(only){
        time = (only[1]==='DSQ') ? '失格' : '棄権';
      }else{
        const r2 = rest.replace(/\(\s*\d+\s*\)/g,' ')
                       .replace(/(?:\s+(?:Q|R|q|CR|WR|FR|UR|NR|AS|PR|ER|OR|WJ))+\s*$/,' ');
        const times = r2.match(TIME) || [];
        const dq = DQ.exec(rest);
        if(times.length){
          let slow = times[0];
          times.forEach(x=>{ if(sc(x) > sc(slow)) slow = x; });
          time = slow;
          splits = times.slice(0, times.indexOf(slow));
        }else if(dq){
          time = (dq[1]==='DSQ') ? '失格' : '棄権';
        }else continue;
      }

      const rec = { name, team:nat, sex:cur.sex, dist:cur.dist, stroke:cur.stroke,
        round: cur.round || '予選', time, splits,
        date: ymd?ymd.date:'', year: ymd?ymd.year:0, month: ymd?ymd.month:0 };
      hits.push(rec);
      last = rec;
    }

    /* まとめた1冊の結果集は、同じレースを種目別・組別・順位別と
       何度も載せているため、同じ記録が何回も出てきます。
       選手・種目・ラウンド・記録・日付が同じものは1つにまとめ、
       通過タイムがそろっているほうを残します */
    const seen = {};
    const uniq = [];
    for(const r of hits){
      const key = [r.name, r.sex, r.dist, r.stroke, r.round, r.time, r.date].join('|');
      if(!(key in seen)){ seen[key] = uniq.length; uniq.push(r); continue; }
      const old = uniq[seen[key]];
      if(r.splits.length > old.splits.length) uniq[seen[key]] = r;
    }
    return uniq;
  }

  /* 会場と実施日と水路を読み取る。
     大会名はPDFに文字として入っていない(絵の中にある)ので、
     わざと空のままにして、画面で入れてもらいます */
  function microplusMeta(lines){
    const meta = {};
    const MON = { JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12 };
    const EV   = /^(Women's|Men's|Mixed)\s+[\dx\s]+m\s+/i;
    const DATE = /^(?:(?:MON|TUE|WED|THU|FRI|SAT|SUN)\s+)?(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})\s*(?:-\s*\d{1,2}:\d{2})?\s*$/i;
    const head = lines.slice(0, 14).map(l=>String(l).trim()).filter(l=>l);
    for(const l of head){
      if(meta.place) break;
      if(/^Swimming$/i.test(l)) continue;
      if(/^Results(\s+Summary)?$/i.test(l)) continue;
      if(/^(Entry|Start)\s+List/i.test(l)) continue;
      if(EV.test(l)) continue;
      if(DATE.test(l)) continue;
      if(/^\d{1,2}:\d{2}$/.test(l)) continue;
      if(/^(MON|TUE|WED|THU|FRI|SAT|SUN)$/i.test(l)) continue;
      if(/^(Heats?|Semi-?finals?|Finals?|Final\s*[AB]|Swim-?off)$/i.test(l)) continue;
      if(!/[A-Za-z]/.test(l)) continue;                  // 中国語だけの行はとばす
      if(l.length < 70) meta.place = l.replace(/\s+Swimming$/i,'').trim();
    }
    for(const raw of lines){
      const m = DATE.exec(String(raw).trim());
      if(m){
        const mo = MON[m[2].toUpperCase()] || 0;
        if(!mo) continue;
        meta.year = Number(m[3]); meta.month = mo;
        meta.date = m[3] + '-' + String(mo).padStart(2,'0') + '-' + String(Number(m[1])).padStart(2,'0');
        break;
      }
    }
    meta.course = '長水路';   // 国際大会はほぼ長水路。ちがえば画面で直せます
    return meta;
  }

  /* マイクロプラス社の結果かどうかを見分ける。
     どの書き方でも、ページの下に SWMM… のような書式コードが入っています */
  function isMicroplus(lines){
    for(const raw of lines){
      const t = String(raw);
      if(/^\s*SWM[MWX][A-Z0-9]/.test(t)) return true;
      if(/microplustiming|Timing by Microplus/i.test(t)) return true;
    }
    return false;
  }

  function parseOmega(lines){
    const STROKE = { 'Freestyle':'Fr', 'Backstroke':'Ba', 'Breaststroke':'Br',
                     'Butterfly':'Fly', 'Individual Medley':'IM' };
    const MON = { JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12 };
    /* 見出しには2つの書き方があります
       ・日付が同じ行にある形 (パンパシフィック選手権)
           Event 1  12 AUG 2026 - 10:00  Women's 50m Butterfly  Heats
       ・日付が次の行にある形 (世界選手権)
           Event 1 Women's 200m Individual Medley Heats
           27 JUL 2025 - 10:02                                          */
    const HDR = /^Event\s+(\d+)\s+(\d{1,2})\s+(\w{3})\s+(\d{4})\s*-\s*\d{2}:\d{2}\s+(Women's|Men's|Mixed)\s+(\d+)m\s+(Freestyle|Backstroke|Breaststroke|Butterfly|Individual Medley)\s*(.*)$/;
    const HDR2 = /^Event\s+(\d+)\s+(Women's|Men's|Mixed)\s+(\d+)m\s+(Freestyle|Backstroke|Breaststroke|Butterfly|Individual Medley)\s*(.*)$/;
    const DATE2 = /^(\d{1,2})\s+(\w{3})\s+(\d{4})\s*-\s*\d{2}:\d{2}\s*$/;
    const SUB = /^\s*Final\s+(A|B)\s*$/;
    /* 予選 : 順位 組 レーン 氏名… 国コード 生年 反応 …
       決勝 : 順位 レーン 氏名… 国コード 反応 …
       氏名にも空白が入るので、国コード(大文字3字)を目印にして切り分けます */
    /* 記録の行。大会によって並びが少しちがいます。
         パンパシ予選 : 順位 組 レーン 氏名 国 生年(4けた) 反応 通過… 記録
         世界選手権   : 順位 組 レーン 氏名 国 生年月日(19 MAY 2003) 反応 通過… 記録
         決勝         : 順位 レーン 氏名 国 …(組がない大会もあります)
       そこで、国コード(大文字3字)を目印にして前と後ろに分け、
       後ろから生年と反応タイムを取りのぞく、というやり方にします */
    /* 国コードは「そのうしろに生年か生年月日が続く大文字3字」で見分けます。
       名前の一部に大文字3字が入ることがあるので、いちばん後ろのものを選びます
       (例: AL-KHALIDI MBH IRQ 19 SEP 2009 …) */
    const ROW = /^\s*=?\s*(\d+)?\s*(\d+)\s+(\d+\s+)?([A-Za-z].*)$/;
    const NATDOB = /\b([A-Z]{3})\s+((?:\d{1,2}\s+[A-Za-z]{3}\s+\d{4}|\d{4})\s+)?/g;
    const RT  = /^\s*\d\.\d{2}\s*/;                                  // 反応タイム
    const TIME = /(?:\d+:)?\d{1,2}\.\d{2}/g;
    const DNS = /\b(DNS|DSQ|DNF|WDR)\b/;
    const LAP = /(\d+)m\s+((?:\d+:)?\d{1,2}\.\d{2})/g;
    const sc = t=>{ const m=/^(?:(\d+):)?(\d+)\.(\d+)$/.exec(t);
      return m ? Number(m[1]||0)*60 + Number(m[2]) + Number('0.'+m[3]) : 0; };

    const hits = [];
    let cur = null, sub = '', last = null, waitDate = false;
    for(const raw of lines){
      const line = String(raw);
      /* 末尾の言葉から、予選か準決勝か決勝かを決める */
      const phaseOf = (tail, no)=>{
        const t = String(tail||'');
        if(/Swim-?off/i.test(t)) return 'Swim';
        if(/Semi-?finals?/i.test(t)) return 'Semi';
        if(/Heats?/i.test(t)) return 'Heats';
        if(/Final/i.test(t)) return 'Final';
        return (Number(no) >= 100) ? 'Final' : 'Heats';
      };
      /* 「Event Number 3」は種目の見出しではありません。
         これを見出しと取りちがえると、準決勝が予選にもどってしまいます */
      if(/^Event\s+Number\b/i.test(line)) continue;
      const h = HDR.exec(line);
      if(h){
        cur = { year: Number(h[4]), month: MON[h[3].toUpperCase()] || 0,
                date: h[4] + '-' + String(MON[h[3].toUpperCase()]||0).padStart(2,'0')
                      + '-' + String(Number(h[2])).padStart(2,'0'),
                sex: (h[5]==="Women's" ? '女子' : '男子'),
                dist: Number(h[6]), stroke: STROKE[h[7]],
                phase: phaseOf(h[8], h[1]) };
        sub = ''; last = null; waitDate = false;
        continue;
      }
      const h2 = HDR2.exec(line);
      if(h2){
        cur = { year: 0, month: 0, date: '',
                sex: (h2[2]==="Women's" ? '女子' : '男子'),
                dist: Number(h2[3]), stroke: STROKE[h2[4]],
                phase: phaseOf(h2[5], h2[1]) };
        sub = ''; last = null; waitDate = true;   // 日付は次の行にあります
        continue;
      }
      if(cur && waitDate){
        const dm = DATE2.exec(line.trim());
        if(dm){
          cur.year = Number(dm[3]);
          cur.month = MON[dm[2].toUpperCase()] || 0;
          cur.date = dm[3] + '-' + String(cur.month).padStart(2,'0')
                   + '-' + String(Number(dm[1])).padStart(2,'0');
          waitDate = false;
          continue;
        }
      }
      if(!cur) continue;
      const sm = SUB.exec(line);
      if(sm){ sub = sm[1]; continue; }
      // 記録の一覧(WR/WJ/CRなど)や見出しは読まない
      if(/^\s*(WR|WJ|CR|NR|AS|OR|PR|ER|Rank|Record|Legend|Official|Report|Results|Event Number|NAT|Code)\b/.test(line)) continue;
      if(/Qualified for final|Did Not Start|Disqualified|Reaction Time|Timekeeping/i.test(line)) continue;
      /* 大会の終わりにある「メダル獲得者の一覧」は記録ではありません。
         GOLD / SILVER / BRONZE や、種目名が行の中に入っている行は読みません */
      if(/\b(GOLD|SILVER|BRONZE)\b/.test(line)) continue;
      if(/(Women's|Men's|Mixed)\s+[\dx]+m\s/.test(line)) continue;

      // 「50m 29.07  100m 1:01.79 …」の形の通過タイムは、直前の記録に足す
      const laps = [...line.matchAll(LAP)];
      if(laps.length >= 3 && last){
        laps.forEach(x=>{ const d = Number(x[1]); if(d < last.dist) last.lapmap[d] = x[2]; });
        continue;
      }

      const m = ROW.exec(line);
      if(!m) continue;
      const after = String(m[4] || '');
      // 国コードのあとに生年が続くところを探す(いちばん後ろのもの)
      NATDOB.lastIndex = 0;
      let mm, pick = null;
      while((mm = NATDOB.exec(after)) !== null){
        /* 生年が続いているものだけを国コードとみなします。
           名前の一部が大文字3字のことがあるためです
           (例: van HEERDEN Michael RSA 2007 …) */
        if(mm[2]) pick = mm;
      }
      if(!pick){                        // 生年がない大会のために、念のため
        NATDOB.lastIndex = 0;
        while((mm = NATDOB.exec(after)) !== null) pick = mm;
      }
      if(!pick) continue;
      let name = after.slice(0, pick.index).trim();
      const nat = pick[1];
      let rest = after.slice(pick.index + pick[0].length).replace(RT, '');
      const dqOnly = /^\s*(DNS|DSQ|DNF|WDR)\s*$/.test(rest) ? rest.trim() : '';
      if(!/[A-Za-z]/.test(name)) continue;
      if(/^(Heat|Lane|Rank|Name|Time|Behind|Birth)$/i.test(name)) continue;

      let time = '', splits = [];
      if(dqOnly){
        time = (dqOnly==='DSQ') ? '失格' : '棄権';
      }else{
        let r2 = rest.replace(/\(\d+\)/g,' ')
                     .replace(/(?:\s+(?:A|B|R|Q|CR|WR|WJ|NR|AS|PR|ER|OR))+\s*$/,' ');
        let times = r2.match(TIME) || [];
        if(/\s\+\d{1,2}\.\d{2}\s*$/.test(r2)) times = times.slice(0,-1);
        else if(times.length >= 2 && sc(times[times.length-1]) < sc(times[times.length-2])) times = times.slice(0,-1);
        const dq = DNS.exec(rest);
        if(times.length){
          let slow = times[0];
          times.forEach(t=>{ if(sc(t) > sc(slow)) slow = t; });
          time = slow;
          splits = times.slice(0, times.indexOf(slow));
        }else if(dq){
          time = (dq[1]==='DSQ') ? '失格' : '棄権';
        }else continue;
      }

      const rec = { name: name, team: nat, sex: cur.sex, dist: cur.dist, stroke: cur.stroke,
        round: (cur.phase==='Final') ? (sub==='B' ? 'B決勝' : '決勝')
             : (cur.phase==='Semi') ? '準決勝'
             : (cur.phase==='Swim') ? 'スイムオフ' : '予選',
        time: time, splits: splits, date: cur.date, year: cur.year, month: cur.month,
        lapmap: {} };
      hits.push(rec);
      last = rec;
    }
    hits.forEach(r=>{
      const ks = Object.keys(r.lapmap).map(Number).sort((a,b)=>a-b);
      if(ks.length) r.splits = ks.map(k=>r.lapmap[k]);
      delete r.lapmap;
    });
    return hits;
  }

  /* 国際大会の結果集から、大会名・会場・実施日・水路を読み取る */
  function omegaMeta(lines){
    const meta = {};
    for(const raw of lines.slice(0, 40)){
      const l = String(raw).trim();
      if(!meta.meet && /Championships|Trials|Games|Cup|Meet|Open/i.test(l) && l.length < 80
         && !/^Event\b/.test(l)) meta.meet = l;
      if(!meta.place && /,\s*[A-Z]{2}\s*$/.test(l) && l.length < 60) meta.place = l;
    }
    for(const raw of lines){
      const m = /^Event\s+\d+\s+(\d{1,2})\s+(\w{3})\s+(\d{4})/.exec(String(raw).trim());
      if(m){
        const MON = { JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12 };
        const mo = MON[m[2].toUpperCase()] || 0;
        meta.year = Number(m[3]); meta.month = mo;
        meta.date = m[3] + '-' + String(mo).padStart(2,'0') + '-' + String(Number(m[1])).padStart(2,'0');
        break;
      }
    }
    meta.course = '長水路';   // 国際大会はほぼ長水路。ちがえば画面で直せます
    return meta;
  }

  /* ローマ字の名前を、名簿の日本語の名前に置きかえる。
     FAMILY Given の形なので、姓のローマ字を手がかりにします。
     一人に決められないときは、ローマ字のままにします。 */
  /* ローマ字をくらべる用にそろえる。GAS側の作りと同じにしてあります */
  function romajiKey(v){
    return String(v == null ? '' : v).toUpperCase()
      .replace(/[\s\u3000.,'\-‐‑’]/g, '');
  }
  function omegaToRoster(hits){
    const roster = (INIT && INIT.roster) ? INIT.roster : [];
    if(!roster.length) return { hits: hits, matched: 0 };
    /* フリガナをローマ字にする(ヘボン式のおおまかな対応)。
       姓と名の両方が合ったときだけ、日本語の名前に置きかえます。
       姓だけしか合わないときは、同じ姓の別人とまちがえるので置きかえません。 */
    const T = [['キャ','KYA'],['キュ','KYU'],['キョ','KYO'],['シャ','SHA'],['シュ','SHU'],['ショ','SHO'],
      ['チャ','CHA'],['チュ','CHU'],['チョ','CHO'],['ニャ','NYA'],['ニュ','NYU'],['ニョ','NYO'],
      ['ヒャ','HYA'],['ヒュ','HYU'],['ヒョ','HYO'],['ミャ','MYA'],['ミュ','MYU'],['ミョ','MYO'],
      ['リャ','RYA'],['リュ','RYU'],['リョ','RYO'],['ギャ','GYA'],['ギュ','GYU'],['ギョ','GYO'],
      ['ジャ','JA'],['ジュ','JU'],['ジョ','JO'],['ビャ','BYA'],['ビュ','BYU'],['ビョ','BYO'],
      ['ピャ','PYA'],['ピュ','PYU'],['ピョ','PYO'],
      ['ア','A'],['イ','I'],['ウ','U'],['エ','E'],['オ','O'],
      ['カ','KA'],['キ','KI'],['ク','KU'],['ケ','KE'],['コ','KO'],
      ['サ','SA'],['シ','SHI'],['ス','SU'],['セ','SE'],['ソ','SO'],
      ['タ','TA'],['チ','CHI'],['ツ','TSU'],['テ','TE'],['ト','TO'],
      ['ナ','NA'],['ニ','NI'],['ヌ','NU'],['ネ','NE'],['ノ','NO'],
      ['ハ','HA'],['ヒ','HI'],['フ','FU'],['ヘ','HE'],['ホ','HO'],
      ['マ','MA'],['ミ','MI'],['ム','MU'],['メ','ME'],['モ','MO'],
      ['ヤ','YA'],['ユ','YU'],['ヨ','YO'],
      ['ラ','RA'],['リ','RI'],['ル','RU'],['レ','RE'],['ロ','RO'],
      ['ワ','WA'],['ヲ','O'],['ン','N'],
      ['ガ','GA'],['ギ','GI'],['グ','GU'],['ゲ','GE'],['ゴ','GO'],
      ['ザ','ZA'],['ジ','JI'],['ズ','ZU'],['ゼ','ZE'],['ゾ','ZO'],
      ['ダ','DA'],['ヂ','JI'],['ヅ','ZU'],['デ','DE'],['ド','DO'],
      ['バ','BA'],['ビ','BI'],['ブ','BU'],['ベ','BE'],['ボ','BO'],
      ['パ','PA'],['ピ','PI'],['プ','PU'],['ペ','PE'],['ポ','PO'],
      ['ー',''],['ッ','']];
    function romaji(k){
      let t = String(k||'').replace(/[\s\u3000]/g,''), out = '';
      while(t.length){
        let hit = null;
        for(const [a,b] of T){ if(t.startsWith(a)){ hit=[a,b]; break; } }
        if(hit){ out += hit[1]; t = t.slice(hit[0].length); }
        else { t = t.slice(1); }
      }
      return out;
    }
    /* 長音の書き方は人によってちがう(シュウヤ→SHUYA / SHUUYA、
       コウタ→KOTA / KOUTA など)。同じ母音の連なりを1つにそろえて比べます */
    const flat = r => String(r||'').replace(/([AIUEO])\1+/g, '$1')
                                   .replace(/OU/g,'O').replace(/UU/g,'U');
    // 名簿を「姓のローマ字_名のローマ字」で引けるようにする
    const byFull = {}, famCount = {};
    roster.forEach(p=>{
      const parts = String(p.kana||'').trim().split(/[\s\u3000]+/).filter(x=>x);
      if(parts.length < 2) return;             // フリガナが姓名に分かれていないと使えない
      const fam = flat(romaji(parts[0])), giv = flat(romaji(parts.slice(1).join('')));
      if(!fam || !giv) return;
      famCount[fam] = (famCount[fam]||0) + 1;
      (byFull[fam + '_' + giv] = byFull[fam + '_' + giv] || []).push(p);
    });
    // 覚えてある「ローマ字対応表」を先に使う
    const table = ROMAJI_MAP || {};
    let matched = 0, byTable = 0;
    hits.forEach(h=>{
      if(h.team !== 'JPN') return;
      const tk = romajiKey(h.name);
      if(table[tk]){ h.jpName = table[tk]; matched++; byTable++; return; }
      const up = String(h.name).toUpperCase();
      const sp = up.split(/\s+/).filter(x=>x);
      if(sp.length < 2) return;
      const fam = flat(sp[0].replace(/[^A-Z]/g,''));
      const giv = flat(sp.slice(1).join('').replace(/[^A-Z]/g,''));
      const cand = byFull[fam + '_' + giv];
      if(cand && cand.length === 1){ h.jpName = cand[0].name; matched++; }
    });
    return { hits: hits, matched: matched, byTable: byTable };
  }

  function parseTdsystem(lines){
    const evRe = /No\.\s*(\d+)\s+(男子|女子|混合)\s+(\S*m)\s+(\S+)/;
    const ageRe = /≪\s*(.+?)\s*≫/;
    const ltRe = /(\d+\/\s*\d+)\s+((?:\d+:)?\d+\.\d+|途中棄権|棄権|欠場|失格\S*|DNS|DSQ|DNF)/;
    const gakuRe = /^(小|中|高|大)\d$|^一般$/;
    let event = null, agegrp = '';
    const hits = [];
    for(let i=0; i<lines.length; i++){
      const line = lines[i];
      let m = line.match(evRe);
      if(m){
        const full = m[2]+m[3]+m[4];
        if(/[×xX]|リレー/.test(full)){ event = null; }  // リレーは個人の記録ではないので飛ばす
        else{
          const ev = parseEventText(m[3]+m[4]);
          event = ev ? { sex: m[2]==='女子' ? '女' : '男', dist: ev.dist, stroke: ev.stroke } : null;
        }
        agegrp = '';
        continue;
      }
      m = line.match(ageRe);
      if(m){ agegrp = m[1]; continue; }
      if(!event) continue;
      m = line.match(ltRe);
      if(!m) continue;
      // 棄権・失格などの言葉を、そろえた形に直す(例: 失格5.2 → 失格)
      let time = m[2];
      const isDQ = /棄権|欠場|失格|DNS|DSQ|DNF/i.test(time);
      if(isDQ){
        if(/失格/.test(time) || /DSQ/i.test(time)) time = '失格';
        else if(/途中棄権|DNF/i.test(time)) time = '途中棄権';
        else if(/欠場|DNS/i.test(time)) time = /欠場/.test(time) ? '欠場' : '棄権';
        else time = '棄権';
      }
      // 選手の行とみなす条件: 順位の数字か OPN(オープン参加)で始まる行。
      // 棄権・失格の行は順位が空のこともあるので、そのまま通す。
      if(!/^\s*(\d+|OPN)\s+\S/i.test(line) && !isDQ) continue;
      const left = line.slice(0, m.index).trim();
      const tokens = left.split(/\s+/);
      // 先頭が順位の数字か OPN なら取りのぞく(棄権の行は順位なしで名前から始まることがある)
      let rest = (/^\d+$/.test(tokens[0]) || /^OPN$/i.test(tokens[0])) ? tokens.slice(1) : tokens.slice();
      let gaku = '';
      if(rest.length && gakuRe.test(rest[rest.length-1])) gaku = rest.pop();
      if(rest.length===0) continue;
      let name, team;
      if(rest.length===1){ name = rest[0]; team = ''; }
      else if(rest.length===2){ name = rest[0]; team = rest[1]; }
      else if(rest.length===3){ name = rest[0]+rest[1]; team = rest[2]; }
      else { name = rest[0]+rest[1]; team = rest.slice(2).join(''); }
      hits.push({
        name: String(name).replace(/[\s\u3000]+/g,''),
        team: String(team),
        sex: event.sex, dist: event.dist, stroke: event.stroke,
        round: agegrp || '', time: fmtTime(time),
        // 選手の行のつぎに並ぶ通過タイムも拾う(棄権・失格には付けない)
        splits: isDQ ? [] : tdsCleanSplits(
          (function(){
            const s1 = tdsSplitsAt(lines, i, event.dist);
            return s1.length ? s1 : tdsSplitNear(lines, i, event.dist, fmtTime(time));
          })(), fmtTime(time))
      });
    }
    return hits;
  }
  /* 東洋電子の「2行タイプ」の結果を読む(例: 愛知県選手権)
     1行目: 順位 氏名 所属 学年 タイム (PBなどの印)
     2行目: 組/水路 (リアクション) 資格級 ポイント ← ここは読み飛ばす
     棄権の行は順位なしで、タイムの場所に棄権・失格と書かれる */
  /* 東洋電子PDFの通過タイムを拾う共通部品。
     選手の行のあと数行のうち、タイムだけが3つ以上並ぶ行が通過タイム。
     例) 30.23 1:02.72 1:36.28 2:09.52 2:42.73 3:15.59 3:48.60 */
  /* 100mなどで「50m」の列に通過タイムだけが別行で印字される形に対応する。
     選手の行のすぐ上か下に、タイムが1つだけの行があればそれを通過タイムとみなす。 */
  function tdsSplitNear(lines, idx, dist, timeStr){
    const T = /^(?:\d+:)?\d{1,2}\.\d{2}$/;
    const want = Math.max(0, Math.round(dist / 50) - 1);
    if(want !== 1) return [];        // この形は100m(通過1個)のときだけ
    const fin = toSec(timeStr);
    // (1) 選手の行の中に「記録 つづけて通過」と並んでいる形
    //     例: 1 松本 周也 中京大 大4 5/ 3 51.89 24.22 11級 ( )
    const own = String(lines[idx]).match(/(?:\d+:)?\d{1,2}\.\d{2}/g) || [];
    if(fin != null){
      const after = [];
      let seen = false;
      for(const v of own){
        if(!seen && toSec(v) === fin){ seen = true; continue; }   // 記録そのものを通りすぎたら
        if(seen) after.push(v);
      }
      // 記録より速い値が1つだけ続いていれば、それが通過タイム
      const cand = after.filter(v=>{ const s = toSec(v); return s != null && s < fin; });
      if(cand.length >= 1) return [cand[0]];
    }
    // (2) 選手の行の上か下に、通過タイムだけの行がある形
    for(const j of [idx-1, idx+1]){
      if(j < 0 || j >= lines.length) continue;
      const toks = String(lines[j]).trim().split(/\s+/).filter(s=>s);
      if(toks.length === 1 && T.test(toks[0])) return [toks[0]];
    }
    return [];
  }

  function tdsSplitsAt(lines, idx, dist){
    const T = /^(?:\d+:)?\d{1,2}\.\d{2}$/;
    const want = Math.max(0, Math.round(dist / 50) - 1);   // 通過の個数(最後の1つは記録)
    if(want < 1) return [];        // 50mは通過を持たせない
    const out = [];
    let started = false;
    // 800m・1500mは通過タイムが2行以上に分かれるので、続きの行もつなげる
    for(let j = idx + 1; j <= idx + 8 && j < lines.length; j++){
      const toks = String(lines[j]).trim().split(/\s+/).filter(s=>s);
      const allTimes = toks.length >= 1 && toks.every(s=>T.test(s));
      if(allTimes){
        out.push.apply(out, toks);
        started = true;
        if(out.length >= want) break;
      } else if(started){
        break;     // 通過タイムの行が途切れたら終わり
      }
    }
    return out.slice(0, want);
  }
  // 通過タイムが記録より遅い(または同じ)ものは、読み違いなので捨てる
  function tdsCleanSplits(sp, time){
    const fin = toSec(time);
    if(!sp || !sp.length || fin == null) return sp || [];
    const ok = sp.filter(v=>{ const s = toSec(v); return s != null && s < fin; });
    return ok.length === sp.length ? sp : [];
  }

  function parseTdsystem2(lines){
    const evRe = /No\.\s*(\d+)\s+(男子|女子|混合)\s+(\S*m)\s+(\S+)/;
    const roundRe = /(タイムレース決勝|タイム決勝|Ｂ決勝|B決勝|準決勝|決勝|予選|スイムオフ)/;
    const timeRe = /^(\d+:)?\d{1,2}\.\d{1,2}$/;
    const dqRe = /^(棄権|欠場|途中棄権)$|^失格/;
    const gakuRe = /^(小|中|高|大)\d$|^一般$/;
    let event = null;
    const hits = [];
    for(let li = 0; li < lines.length; li++){
      const line = lines[li];
      const m = line.match(evRe);
      if(m){
        const full = m[2]+m[3]+m[4];
        if(/[×xX]|リレー/.test(full)){ event = null; continue; }
        const ev = parseEventText(m[3]+m[4]);
        const round = (line.match(roundRe)||['',''])[0]
          .replace('タイムレース決勝','タイム決勝').replace('Ｂ','B');
        event = ev ? { sex: m[2]==='女子' ? '女' : '男', dist: ev.dist, stroke: ev.stroke, round } : null;
        continue;
      }
      if(!event) continue;
      let toks = line.trim().split(/\s+/);
      if(toks.length < 3) continue;
      // 順位(数字かOPN=オープン参加)は付いていることも、棄権で付いていないこともある
      let rank = null;
      if(/^(\d+|OPN)$/i.test(toks[0])){ rank = toks[0]; toks = toks.slice(1); }
      if(toks.length < 2) continue;
      // 名前は日本語で始まるはず(通過タイムだけの行などを除くため)
      if(!/^[^\x00-\x7F]/.test(toks[0])) continue;
      // 後ろから、タイムか棄権・失格の言葉を探す
      let ti = -1, isDQ = false;
      for(let i=toks.length-1; i>=1; i--){
        if(timeRe.test(toks[i])){ ti = i; break; }
        if(dqRe.test(toks[i])){ ti = i; isDQ = true; break; }
      }
      if(ti < 1) continue;
      if(rank===null && !isDQ) continue;   // 順位もタイムもない行は選手の行ではない
      let time;
      if(isDQ){
        const w = toks[ti];
        time = /失格/.test(w) ? '失格' : /途中棄権/.test(w) ? '途中棄権' : /欠場/.test(w) ? '欠場' : '棄権';
      } else {
        time = fmtTime(toks[ti]);
      }
      let rest = toks.slice(0, ti);
      let gaku = '';
      if(rest.length && gakuRe.test(rest[rest.length-1])) gaku = rest.pop();
      if(rest.length===0) continue;
      let name, team;
      if(rest.length===1){ name = rest[0]; team = ''; }
      else if(rest.length===2){ name = rest[0]; team = rest[1]; }
      else if(rest.length===3){ name = rest[0]+rest[1]; team = rest[2]; }
      else { name = rest[0]+rest[1]; team = rest.slice(2).join(''); }
      hits.push({
        name: String(name).replace(/[\s\u3000]+/g,''),
        team: String(team),
        sex: event.sex, dist: event.dist, stroke: event.stroke,
        round: event.round, time,
        splits: isDQ ? [] : tdsCleanSplits(
          (function(){
            const s1 = tdsSplitsAt(lines, li, event.dist);
            return s1.length ? s1 : tdsSplitNear(lines, li, event.dist, time);
          })(), time)
      });
    }
    return hits;
  }

  // 写真を送る前に小さく縮めて、通信を軽くする(縮められないときは元のまま送る)
  async function shrinkImage(file){
    const dataUrl = await new Promise((ok, ng)=>{
      const r = new FileReader();
      r.onload = ()=>ok(String(r.result));
      r.onerror = ()=>ng(new Error('画像が読めませんでした'));
      r.readAsDataURL(file);
    });
    try{
      const img = await new Promise((ok, ng)=>{
        const im = new Image();
        im.onload = ()=>ok(im);
        im.onerror = ()=>ng(new Error('画像が開けませんでした'));
        im.src = dataUrl;
      });
      const MAX = 1600;
      let w = img.width, h = img.height;
      if(Math.max(w, h) > MAX){
        const s = MAX / Math.max(w, h);
        w = Math.round(w * s); h = Math.round(h * s);
      }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      const out = cv.toDataURL('image/jpeg', 0.85);
      return { b64: out.split(',')[1], mime: 'image/jpeg' };
    }catch(e){
      return { b64: dataUrl.split(',')[1], mime: file.type || 'image/png' };
    }
  }

  // CSVの文字列を表(2次元の配列)にする。"で囲まれた値やカンマ入りの値にも対応
  function parseCSV(text){
    const rows = []; let row = []; let cur = ''; let inQ = false;
    for(let i=0; i<text.length; i++){
      const ch = text[i];
      if(inQ){
        if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inQ = false; }
        else cur += ch;
      } else {
        if(ch==='"') inQ = true;
        else if(ch===','){ row.push(cur); cur=''; }
        else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
        else if(ch!=='\r') cur += ch;
      }
    }
    if(cur!=='' || row.length){ row.push(cur); rows.push(row); }
    return rows;
  }
  // 種目の文字(例: 400m 自由形 / 男子100m平泳ぎ / 200IM)を 距離+泳法コード に直す
  function parseEventText(txt){
    if(!txt) return null;
    const s = String(txt).replace(/[\s\u3000]/g,'');
    const dm = s.match(/(\d{2,4})m?/);
    if(!dm) return null;
    const dist = Number(dm[1]);
    let stroke = '';
    for(const st of STROKES){
      if(st.ja && s.includes(st.ja)){ stroke = st.code; break; }
    }
    if(!stroke){
      if(/自由|ﾌﾘｰ|フリー|FR/i.test(s)) stroke = 'Fr';
      else if(/背|ﾊﾞｯｸ|バック|BA/i.test(s)) stroke = 'Ba';
      else if(/平|ﾌﾞﾚ|ブレ|BR/i.test(s)) stroke = 'Br';
      else if(/バタ|ﾊﾞﾀ|FLY|FL/i.test(s)) stroke = 'Fly';
      else if(/メドレー|ﾒﾄﾞﾚｰ|個メ|IM/i.test(s)) stroke = 'IM';
    }
    if(!stroke) return null;
    let sex = '';
    if(/女/.test(String(txt))) sex = '女'; else if(/男/.test(String(txt))) sex = '男';
    return { dist, stroke, sex };
  }
  // 見出しの行から、目当ての列が何番目かを探す(まず完全一致、なければ部分一致)
  function findCol(header, exacts, parts){
    let idx = header.findIndex(h=>exacts.includes(h));
    if(idx<0 && parts) idx = header.findIndex(h=>parts.some(p=>h.includes(p)));
    return idx;
  }
  // 1枚のシート(表)から記録の行を拾い出す
  function harvestGrid(grid, sheetName, kws, exs){
    for(let hi=0; hi<Math.min(grid.length,10); hi++){
      const header = (grid[hi]||[]).map(c=>String(c==null?'':c).trim());
      const cName = findCol(header, ['氏名','名前','選手名','name','Name'], ['氏名','名前']);
      const cTime = findCol(header, ['記録','タイム','time','Time'], ['記録','タイム']);
      if(cName<0 || cTime<0) continue;
      const cEvent = findCol(header, ['種目','event','Event'], ['種目']);
      const cSex   = findCol(header, ['性別','男女','sex','Sex'], ['性別']);
      const cRound = findCol(header, ['ラウンド','round','Round'], ['ラウンド']);
      const cTeam  = findCol(header, ['所属','チーム','team','Team'], ['所属']);
      const hits = []; let skipped = 0; let filtered = 0;   // filtered = 探す/省くで外した数
      for(let r=hi+1; r<grid.length; r++){
        const row = grid[r]||[];
        const name = String(row[cName]==null?'':row[cName]).replace(/[\s\u3000]+/g,'');
        if(!name || name===header[cName]) continue;
        const rawTime = String(row[cTime]==null?'':row[cTime]).trim();
        let time = fmtTime(rawTime);
        if(toSec(time)==null){
          // タイムがない行でも、棄権・失格・欠場はその言葉のまま取り込む
          const st = rawTime.match(/棄権|失格|欠場|DNS|DSQ|DNF/i);
          if(st){ time = ({'DNS':'棄権','DSQ':'失格','DNF':'途中棄権'})[st[0].toUpperCase()] || st[0]; }
          else { if(rawTime) skipped++; continue; }   // タイムも棄権もない行は飛ばす
        }
        let ev = cEvent>=0 ? parseEventText(row[cEvent]) : null;
        if(!ev) ev = parseEventText(sheetName);
        if(!ev){ skipped++; continue; }
        let sex = cSex>=0 ? String(row[cSex]||'') : '';
        sex = /女/.test(sex) ? '女' : /男/.test(sex) ? '男' : (ev.sex||'');
        const team = cTeam>=0 ? String(row[cTeam]||'') : '';
        if(!termKeep(name + team, kws, exs || [])){ filtered++; continue; }
        hits.push({ name, team, sex, dist:ev.dist, stroke:ev.stroke,
          round: cRound>=0 ? String(row[cRound]||'') : '', time });
      }
      return { hits, skipped, filtered, hasTeam: cTeam >= 0 };
    }
    return null;
  }

      msg.innerHTML = '<div class="errmsg">読めませんでした: '+esc(err.message)+'</div>'; return;

    // PDFの見出しから大会名・実施日・水路を自動入力(大会名の欄が空のときだけ)
    let metaNote = '';
    if(meta){   // PDFから読めた情報は、前の入力を上書きして入れ直す
      if(meta.meet) document.getElementById('xlMeet').value = meta.meet;
      if(meta.place) document.getElementById('xlPlace').value = meta.place;
      if(meta.year) document.getElementById('xlYear').value = meta.year;
      if(meta.month) document.getElementById('xlMonth').value = meta.month;
      if(meta.date) document.getElementById('xlDate').value = meta.date;   // PDFの日付を優先(初期値の今日を上書き)
      const got = [];
      if(meta.meet) got.push('大会名');
      if(meta.place) got.push('会場');
      if(meta.date) got.push('実施日');
      if(meta.course){
        document.getElementById('xlCourse').value = meta.course;
        got.push('水路');
        metaNote = '(PDFから' + got.join('・') + 'を自動入力しました。まちがっていたら直してください)';
      } else {
        // 会場にも大会名にも水路の手がかりがないときは、記録から推し量る
        const guess = guessCourse(XL_HITS);
        if(guess){
          document.getElementById('xlCourse').value = guess;
          metaNote = '(PDFから' + got.join('・') + 'を自動入力しました。<b style="color:var(--red)">水路はPDFに書かれていないため、記録の速さから「' +
            guess + '」と判断しました。ちがっていたら直してください</b>)';
        } else {
          metaNote = '(PDFから' + got.join('・') + 'を自動入力しました。<b style="color:var(--red)">水路はPDFから判断できませんでした。長水路か短水路かを選んでください</b>)';
        }
      }
    }
    /* ★大会名をPDFから読み取れなかったときは、大会名の欄に「前に取り込んだときの名前」が
       そのまま残ります。気づかずに登録すると、別の大会が同じ名前で混ざってしまうので、
       はっきり赤字で知らせます。 */
    if(isPdfKind && (!meta || !meta.meet)){
      const cur = (document.getElementById('xlMeet').value || '').trim();
      metaNote = '<b style="color:var(--red)">大会名をPDFから読み取れませんでした。</b>' +
        (cur ? '大会名の欄は<b>「' + esc(cur) + '」</b>のままです。前に取り込んだ大会の名前が残っているかもしれません。' +
               '<b style="color:var(--red)">登録する前に必ず確かめてください。</b>'
             : '大会名を手で入れてください。') +
        (metaNote ? '<br>' + metaNote : '');
    }
    const isPdf = isPdfKind;
    let skipped = 0; let readSheets = 0;
    let xlFiltered = 0;      // 探す/省くで外した行の数
    let xlHasTeam = false;   // 表に「所属」の列があったか

    if(!isPdf){
      grids.forEach(g=>{
        const res = harvestGrid(g.grid, g.name, kws, exs);
        if(!res) return;
        readSheets++;
        XL_HITS = XL_HITS.concat(res.hits);
        skipped += res.skipped;
        xlFiltered += res.filtered || 0;
        if(res.hasTeam) xlHasTeam = true;
      });
      if(readSheets===0){
        msg.innerHTML = '<div class="errmsg">表の見出しが見つかりませんでした。1行目に「氏名」と「記録」(またはタイム)の列名があるか確認してください。</div>'; return;
      }
    }
    // 同じ名前・種目・タイム・ラウンドの重複は1つにまとめる(二重読みを防ぐ。
    // 予選と決勝が同タイムでも、ラウンドが違えば両方残る)
    const uniq = {};
    XL_HITS = XL_HITS.filter(h=>{
      const k = h.name+'_'+h.dist+h.stroke+'_'+h.time+'_'+(h.round||'');
      if(uniq[k]) return false; uniq[k] = 1; return true;
    });
    if(XL_HITS.length===0){
      let why = '取り込める記録が見つかりませんでした。';
      if(!isPdf && xlFiltered > 0 && kws.length){
        /* ★よくある行きちがい: 中京大の部内シートには「所属」の列がないため、
           「探す言葉」に中京大と入れているとすべて外れてしまう。 */
        why = `${xlFiltered}行を読み取りましたが、<b>探す言葉「${esc(kws.join('・'))}」に当てはまらない</b>ので全部外しました。`;
        if(!xlHasTeam){
          why += '<br>この表には<b>「所属」の列がありません</b>。所属が無い表では<b>名前だけ</b>で探します。' +
                 '<br>→ <b>探す欄を空にする</b>か、表に「所属」の列を足してください。';
        } else {
          why += '<br>→ 探す言葉を、表の所属の書き方に合わせてください。';
        }
      } else if(!isPdf && kws.length){
        why += '探す名前や所属の書き方を、ファイルの書き方に合わせてみてください。';
      } else {
        why += '探す名前や所属の書き方を、ファイルの書き方に合わせてみてください。';
      }
      msg.innerHTML = '<div class="errmsg">' + why + '</div>'; return;
    }
    const dqCount = XL_HITS.filter(h=>toSec(h.time)==null).length;
    let note = '';
    if(dqCount) note += `(棄権・失格 ${dqCount}件をふくみます)`;
    if(skipped) note += `(タイムも棄権もない${skipped}行は飛ばしました)`;
    if(kokutaiNote) note += kokutaiNote;
    let fileNote = '';
    if(perFile.length > 1 || perFile.some(p=>p.err)){
      fileNote = '<div class="hint" style="max-height:150px; overflow:auto; margin-top:6px; padding:8px; background:var(--blue-pale); border-radius:8px">ファイルごとの内訳:<br>' +
        perFile.map(p=>esc(p.name)+': '+(p.err ? '⚠ '+esc(p.err) : (p.count==null ? '読み取り' : p.count+'件'))).join('<br>') + '</div>';
    }
    XL_NOTE = { note: note, metaNote: metaNote, fileNote: fileNote };
    adminXlsxRender(note, metaNote, fileNote);
  };

  /* 読み取った記録が、おかしくないかを調べる。
     おかしなものの一覧を返します(何も直しません) */
  function checkHits(list){
    const bad = [];
    list.forEach((h, i)=>{
      const sec = toSec(h.time);
      if(sec == null) return;                 // 棄権や失格は調べません
      const cs = h.course || (IN && IN.course) || '';
      const lim = limitOf(h.sex, h.dist, h.stroke, cs);

      if(lim && sec < lim){
        // 半分の距離ならちょうどよい速さか(通過タイムのとりちがえ)
        const halfLim = limitOf(h.sex, h.dist / 2, h.stroke, cs);
        const why = (halfLim && sec >= halfLim)
          ? `${h.dist/50 >= 2 ? (h.dist/2) : ''}mの通過タイムが記録として入っている疑い`
          : 'この距離ではありえない速さ(日本記録より速い)';
        bad.push({ i, h, why });
        return;
      }
      // 通過タイムより最終記録が速い(順番が逆)
      const sp = String(h.splits || '').split(/[\/／,、]/).map(t=>toSec(t.trim())).filter(t=>t!=null);
      if(sp.length){
        const last = sp[sp.length - 1];
        if(last != null && sec <= last){
          bad.push({ i, h, why: '最後の通過タイムより、記録のほうが速い' });
          return;
        }
        const want = Math.max(0, Math.round(h.dist / 50) - 1);
        if(want && sp.length !== want){
          bad.push({ i, h, why: `${h.dist}mなのに通過タイムが${sp.length}個(ふつうは${want}個)` });
        }
      }
    });
    return bad;
  }

  /* おかしな記録があれば、一覧の上に知らせを出す */
  function badBox(list){
    const bad = checkHits(list);
    if(!bad.length) return '';
    let b = '<div class="card redline" style="margin:10px 0">'
      + '<h2>おかしな記録が見つかりました</h2>'
      + '<p class="hint">' + bad.length + '件あります。'
      + '種目のとりちがえや、通過タイムを記録として読んでしまった疑いがあります。'
      + '登録する前に、下の一覧でその行のチェックを外すか、もとのPDFと見くらべてください。'
      + '(下の「おかしな記録だけ外す」を押すと、その行のチェックだけを外せます)</p>'
      + '<div class="tablewrap"><table><tr><th>名前</th><th>種目</th><th>タイム</th><th>なぜ</th></tr>';
    bad.slice(0, 30).forEach(x=>{
      b += '<tr><td class="nw">' + esc(x.h.name) + '</td>'
        + '<td class="nw">' + esc(String(x.h.sex||'')) + ' ' + x.h.dist + esc(x.h.stroke) + '</td>'
        + '<td class="num nw">' + esc(x.h.time) + '</td>'
        + '<td>' + esc(x.why) + '</td></tr>';
    });
    if(bad.length > 30) b += '<tr><td colspan="4">…ほか' + (bad.length - 30) + '件</td></tr>';
    return b + '</table></div>'
      + '<div class="stack" style="margin-top:10px">'
      + '<button class="btn red solid" onclick="uncheckBad()">おかしな記録だけ外す</button></div></div>';
  }

  /* 一覧の上に出す「全部選ぶ」「全部外す」のボタン。
     cls はチェックボックスの目印(xlchk など) */

      + '<button type="button" class="btn ghost" onclick="chkAll(\'' + cls + '\', false)">全部外す</button>'
      + '<span class="hint" id="cnt_' + cls + '" style="align-self:center"></span></div>';
  }

  /* 読み取った一覧を画面に描く。名前をそろえたあとにも呼び直します */

    XL_HITS.forEach((r,i)=>{
      h += `<tr><td><input type="checkbox" class="xlchk" data-i="${i}" checked style="width:26px;height:26px"></td>
        <td><input type="text" class="xlname" data-i="${i}" value="${esc(r.name)}" style="min-width:120px"></td>

  window.adminRomajiSave = async function(){
    const msg = document.getElementById('rjMsg');
    const pairs = [];
    document.querySelectorAll('.rjname').forEach(el=>{
      const nm = String(el.value || '').trim();
      if(!nm) return;
      pairs.push({ romaji: XL_ROMAJI[Number(el.dataset.i)], name: nm });
    });
    if(!pairs.length){
      msg.innerHTML = '<div class="errmsg">名簿の名前がひとつも入っていません。</div>'; return;
    }
    msg.innerHTML = '<div class="loading">覚えています…</div>';
    try{
      const res = await apiSave({ action:'saveRomaji', password:ADMIN_PW, pairs });
      // 覚えた内容を、いま画面に出ている一覧にもすぐ反映する
      const map = {};
      pairs.forEach(p=>{ map[romajiKey(p.romaji)] = p.name; });
      ROMAJI_MAP = Object.assign({}, ROMAJI_MAP || {}, map);
      XL_HITS.forEach(h=>{
        const key = romajiKey(h.romaji || h.name);
        if(map[key]){ if(!h.romaji) h.romaji = h.name; h.name = map[key]; }
      });
      XL_ROMAJI = XL_ROMAJI.filter(r=>!map[romajiKey(r)]);
      localStorage.removeItem('cust_init_cache');
      adminXlsxRender(XL_NOTE.note, XL_NOTE.metaNote, XL_NOTE.fileNote);
      const m2 = document.getElementById('xlMsg');
      if(m2) m2.innerHTML = '<div class="okmsg">' + pairs.length + '人の読み方を覚えました'
        + ((res && res.added !== undefined) ? '(新しく' + res.added + '組、直したのが' + res.updated + '組)' : '')
        + '。次から自動で日本語の名前になります。</div>';
    }catch(err){
      msg.innerHTML = '<div class="errmsg">覚えられませんでした: ' + esc(err.message)
        + '。GAS側に saveRomaji の窓口(パッチv41)が入っているか、デプロイを新バージョンにしたかを確かめてください。</div>';
    }
  };
  let RELAY_HITS = [];
  // リレーの登録: リレーシートへの保存と、1泳の個人記録の登録をまとめて行う
  window.adminRelaySave = async function(){
    const msg = document.getElementById('xlMsg');
    const meet = document.getElementById('xlMeet').value.trim();
    const date = document.getElementById('xlDate').value;
    const year = Number(document.getElementById('xlYear').value);
    const month = Number(document.getElementById('xlMonth').value);
    const course = document.getElementById('xlCourse').value;
    if(!meet){ msg.innerHTML = '<div class="errmsg">大会名を入れてください。</div>'; return; }
    const rows = [];
    document.querySelectorAll('.rlchk').forEach(c=>{
      if(c.checked) rows.push(RELAY_HITS[Number(c.dataset.i)]);
    });
    if(rows.length===0){ msg.innerHTML = '<div class="errmsg">登録するチームがありません。</div>'; return; }
    // 1泳の個人記録(混合リレーは男女が分からないため個人登録はしない)
    const firstLegs = [];
    rows.forEach(r=>{
      const l1 = r.legs[0];
      if(r.sex==='混合' || !l1 || !l1.name || toSec(l1.leg)==null) return;
      const stroke = r.relayType.includes('メドレー') ? 'Ba' : 'Fr';
      firstLegs.push({ name: l1.name, event: r.legDist + stroke, time: l1.leg, round: r.round||'', sex: r.sex });
    });
    if(!confirm(rows.length+'チームのリレーを '+meet+' ('+course+') として登録します。あわせて1泳の個人記録を'+firstLegs.length+'件登録します。よろしいですか。')) return;
    try{
      msg.innerHTML = '<div class="loading">登録しています…</div>';
      const exists = (INIT && INIT.meets||[]).some(m=>m.meet===meet && m.year===year && m.month===month && (m.course||'')===course);
      if(!exists) await apiSave({ action:'addMeet', password:ADMIN_PW, meet, year, month, course });
      const res = await apiSave({ action:'saveRelays', password:ADMIN_PW, meet, year, month, course, date,
        relays: rows.map(r=>({ sex:r.sex, event:r.event, round:r.round||'', rank:r.rank||'', team:r.team, time:r.time, legDist:r.legDist||0, legs:r.legs })) });
      if(firstLegs.length) await apiSave({ action:'saveBatch', meet, course, date,
        records: firstLegs.map(f=>({ name:f.name, event:f.event, time:f.time, round:f.round })) });
      localStorage.removeItem('cust_rec_cache');
      localStorage.removeItem('cust_relay_cache');
      RELAYS = null; DATA = null; INIT = null;
      msg.innerHTML = '<div class="loading">登録が終わりました。画面に反映しています…</div>';
      try{ await Promise.all([loadInit(), loadRecords(true)]); }catch(e){}
      msg.innerHTML = `<div class="okmsg">リレー${rows.length}チームと、1泳の個人記録${firstLegs.length}件を登録しました。リレーは閲覧画面の「試合」で大会を開くと、いちばん下に表示されます。</div>`;
      document.getElementById('xlOut').innerHTML = '';
      document.getElementById('xlFile').value = '';
    }catch(err){
      msg.innerHTML = '<div class="errmsg">登録できませんでした: '+esc(err.message)+
        '。GAS側に saveRelays の窓口(パッチv12)が入っているか確認してください。</div>';
    }
  };
  window.adminXlsxSave = async function(){

      try{ await Promise.all([loadInit(), loadRecords(true)]); }catch(e){}
      msg.innerHTML = `<div class="okmsg">${rows.length}件を登録しました。閲覧画面の試合で探すから確認できます。</div>`;
      document.getElementById('xlOut').innerHTML = '';
      document.getElementById('xlFile').value = '';
    }catch(err){
      msg.innerHTML = '<div class="errmsg">登録できませんでした: '+esc(err.message)+'</div>';
    }
  };
  document.getElementById('apSearch').addEventListener('input', adminSearchAthlete);

// ----- 試合名の登録 -----
// ----- 重複の点検と大会の統合 -----
// 大会を選ぶ二つのプルダウンを、いま読み込めている大会一覧で作り直す
function adminDrawCmpSelects(){
  const selA = document.getElementById('cmpA');
  const selB = document.getElementById('cmpB');
  if(!selA || !selB) return;
  const meets = (DATA && DATA.meets) ? DATA.meets : [];
  const keepA = selA.value, keepB = selB.value;
  // アプリの大会登録に入っている試合かどうかを調べる(登録済みなら先頭に★をつける)
  const regd = (INIT && INIT.meets) ? INIT.meets : [];
  const isReg = m => regd.some(x=>String(x.meet).trim()===String(m.meet).trim()
    && Number(x.year)===Number(m.year) && Number(x.month)===Number(m.month)
    && (x.course||'')===(m.course||''));
  let opts = '<option value="">選んでください</option>';
  meets.forEach((m, i)=>{
    const label = (isReg(m)?'★':'') + meetLabel(m);
    opts += `<option value="${i}">${esc(label)}</option>`;
  });
  selA.innerHTML = opts; selB.innerHTML = opts;
  selA.value = keepA; selB.value = keepB;
  if(meets.length===0){
    const msg = document.getElementById('cmpMsg');
    if(msg) msg.innerHTML = '<p class="hint">大会一覧を読み込み中です。少し待つと選べるようになります。</p>';

// 二つの大会を、種目ごとに比べて表にする
function adminCompareMeets(){
  const msg = document.getElementById('cmpMsg');
  const out = document.getElementById('cmpOut');
  out.innerHTML = '';
  if(!DATA || !DATA.records){ msg.innerHTML = '<div class="errmsg">記録の読み込みがまだ終わっていません。少し待ってからもう一度押してください。</div>'; return; }
  const a = document.getElementById('cmpA').value;
  const b = document.getElementById('cmpB').value;
  if(a==='' || b===''){ msg.innerHTML = '<div class="errmsg">大会1と大会2を選んでください。</div>'; return; }
  if(a===b){ msg.innerHTML = '<div class="errmsg">同じ大会どうしは比べられません。</div>'; return; }
  const ia = Number(a), ib = Number(b);
  const evs = {};
  const put = (r, side)=>{
    const k = r[2] + '_' + r[4] + r[3];
    evs[k] = evs[k] || { sex:r[2], dist:r[4], stroke:r[3], A:{}, B:{} };
    // 名前と、秒に直したタイムで同じ記録を見分ける
    // (0:29.34 と 29.34、53.9 と 53.90 のような書き方の違いを同じとみなす)
    const sec = toSec(r[5]);
    const tkey = (sec==null) ? String(r[5]) : sec.toFixed(2);
    evs[k][side][r[1] + '_' + tkey] = r[1];
  };
  DATA.records.forEach(r=>{
    if(r[0]===ia) put(r, 'A');
    else if(r[0]===ib) put(r, 'B');
  });
  const keys = Object.keys(evs);
  if(keys.length===0){ msg.innerHTML = '<div class="errmsg">どちらの大会にも記録が見つかりませんでした。</div>'; return; }
  let same = 0, onlyA = 0, onlyB = 0;
  let h = '<div class="tablewrap"><table><tr><th>種目</th><th>大会1</th><th>大会2</th><th>同じ記録</th><th>大会2にだけある選手</th></tr>';
  keys.sort().forEach(k=>{
    const e = evs[k];
    const aKeys = Object.keys(e.A), bKeys = Object.keys(e.B);
    const dup = bKeys.filter(x=>e.A[x]);
    const bOnly = bKeys.filter(x=>!e.A[x]);
    same += dup.length;
    onlyA += aKeys.filter(x=>!e.B[x]).length;
    onlyB += bOnly.length;
    const names = bOnly.map(x=>e.B[x]);
    const shown = names.slice(0,8).join('、') + (names.length>8 ? ' ほか'+(names.length-8)+'名' : '');
    h += `<tr><td class="nw">${esc(e.sex)} ${evShort(e.dist, e.stroke)}</td>
      <td class="num nw">${aKeys.length}件</td><td class="num nw">${bKeys.length}件</td>
      <td class="num nw">${dup.length}件</td><td>${esc(shown||'-')}</td></tr>`;
  });
  out.innerHTML = h + '</table></div>';
  msg.innerHTML = `<div class="okmsg">比べました。まったく同じ記録が ${same} 件、大会1にだけある記録が ${onlyA} 件、大会2にだけある記録が ${onlyB} 件です。統合すると、同じ ${same} 件は削除され、大会2にだけある ${onlyB} 件が大会1へ移ります。(アプリ版 v6)</div>`;
}

/* 一覧を大会名でしぼりこむ。
   行を消さずに 隠すだけなので、チェックの付け外しは そのまま残ります。
   隠れている行のチェックも 保存のときには ちゃんと数えられます。 */
window.listFilter = function(listId, inputId, countId){
  const box = document.getElementById(listId);
  const inp = document.getElementById(inputId);
  if(!box || !inp) return;
  const q = String(inp.value||'').trim().toLowerCase();
  const rows = [...box.querySelectorAll('table tr')].filter(tr=>!tr.querySelector('th'));
  let shown = 0;
  rows.forEach(tr=>{
    const name = String(tr.dataset.name || tr.textContent || '').toLowerCase();
    const hit = !q || name.indexOf(q) >= 0;
    tr.style.display = hit ? '' : 'none';
    if(hit) shown++;
  });
  const c = document.getElementById(countId);
  if(c){
    if(!rows.length) c.textContent = '';
    else if(!q) c.textContent = '全' + rows.length + '件を表示しています。';
    else if(shown === 0) c.textContent = '「' + inp.value.trim() + '」に当てはまる大会はありません。全' + rows.length + '件。';
    else c.textContent = '全' + rows.length + '件のうち ' + shown + '件を表示しています。';
  }
};

  const bad = [];
  try{
  DATA.records.forEach((r, i)=>{
    const m = DATA.meets[r[0]];
    if(!m) return;
    const sec = toSec(r[5]);
    if(sec == null) return;                    // 棄権や失格は調べません
    const dist = Number(r[4]), stroke = r[3], sex = r[2], course = m.course;
    let why = '';

    const lim = limitOf(sex, dist, stroke, course);
    if(lim && sec < lim){
      const halfLim = limitOf(sex, dist / 2, stroke, course);
      why = (halfLim && sec >= halfLim)
        ? `${dist / 2}mの通過タイムが記録として入っている疑い`
        : 'この距離ではありえない速さ';
    }
    if(!why){
      const sp = String(r[9] || '').split(/[\/／,、]/).map(t=>toSec(String(t).trim())).filter(t=>t != null);
      if(sp.length){
        const last = sp[sp.length - 1];
        if(last != null && sec <= last) why = '最後の通過タイムより、記録のほうが速い';
        else {
          const want = Math.max(0, Math.round(dist / 50) - 1);
          if(want && sp.length !== want) why = `${dist}mなのに通過タイムが${sp.length}個(ふつうは${want}個)`;
        }
      }
    }
    if(why) bad.push({ r, i, why });
  });
  }catch(e){
    msg.innerHTML = '<div class="errmsg">調べているとちゅうで止まりました: ' + esc(e.message)
      + '<br>アプリを読み込み直してから、もう一度お試しください。</div>';
    return;
  }

  if(bad.length === 0){
    list.innerHTML = '';
    msg.innerHTML = '<div class="okmsg">おかしなタイムは見つかりませんでした。'
      + '全レース ' + DATA.records.length + '件を調べました。</div>';
    return;
  }
  // 新しい大会から順に並べる
  bad.sort((a, b)=>{
    const ma = DATA.meets[a.r[0]], mb = DATA.meets[b.r[0]];
    return (mb.year*100+mb.month)-(ma.year*100+ma.month);
  });
  RF_HITS = bad.slice(0, 200);

  // 大会ごとの数も知らせる(まとめて入れ直す目安になります)
  const byMeet = new Map();
  bad.forEach(x=>{
    const m = DATA.meets[x.r[0]];
    const k = m.meet + '（' + (m.year||'?') + '年' + (m.month||'?') + '月）';
    byMeet.set(k, (byMeet.get(k) || 0) + 1);
  });
  let note = '';
  [...byMeet.entries()].sort((a,b)=>b[1]-a[1]).slice(0, 8).forEach(([k, n])=>{
    note += '<br>　' + esc(k) + ' … ' + n + '件';
  });

  msg.innerHTML = '<div class="errmsg">おかしなタイムが ' + bad.length + '件見つかりました。'
    + (bad.length > 200 ? '(多いので、新しい大会から200件だけ出しています)' : '')
    + '<br>直したい行の「直す」を押すと、その場で修正・削除できます。'
    + '<br>同じ大会にたくさんある場合は、種目のとりちがえの疑いが強いので、'
    + '「試合名の登録」で大会ごと消して、PDFから取り込み直すほうが確実です。'
    + '<br><br><b>大会ごとの数</b>' + note + '</div>';

  let h = '<div class="tablewrap" style="max-height:400px"><table><tr><th>名前</th><th>大会</th><th>種目</th><th>ラウンド</th><th>タイム</th><th>なぜ</th><th></th></tr>';
  RF_HITS.forEach((x, k)=>{
    const m = DATA.meets[x.r[0]];
    h += `<tr id="rfrow${k}"><td class="nw" style="font-weight:700">${esc(x.r[1])}</td>
      <td>${m.year||'?'}年${m.month||'?'}月 ${esc(m.meet)} ${courseTag(m.course)}</td>
      <td class="nw">${x.r[4]}${esc(x.r[3])}</td>
      <td class="nw">${esc(x.r[8]||'-')}</td>
      <td class="num nw">${esc(x.r[5])}</td>
      <td>${esc(x.why)}</td>
      <td><button class="btn" style="min-height:44px; padding:6px 14px" onclick="adminFixOpen(${k})">直す</button></td></tr>
      <tr id="rfedit${k}" hidden><td colspan="7"></td></tr>`;
  });
  list.innerHTML = h + '</table></div>';
};
